<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>التحقق من الإيصال — مُرابحة</title>
<meta name="description" content="صفحة عامة للتحقق من صحة إيصال استثمار صادر من منصة مُرابحة." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { font-family:Tajawal,system-ui,sans-serif; background:#fbf6ea; color:#0d1612; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; margin:0; }
  .card { max-width:480px; width:100%; background:#fff; border-radius:18px; padding:32px; box-shadow:0 4px 24px rgba(13,22,18,0.05); border:1px solid rgba(13,22,18,0.08); }
  .badge { display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px; font:800 14px Cairo,sans-serif; margin-bottom:22px; }
  .badge.ok { background:rgba(15,159,94,0.10); color:#0f9f5e; border:1px solid rgba(15,159,94,0.25); }
  .badge.err { background:rgba(197,74,58,0.10); color:#c54a3a; border:1px solid rgba(197,74,58,0.25); }
  .badge .dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .badge.ok .dot { background:#0f9f5e; }
  .badge.err .dot { background:#c54a3a; }
  h1 { font:900 22px Cairo,sans-serif; color:#062b1e; margin-bottom:8px; }
  p { color:#6b7268; font-size:14px; line-height:1.8; margin-bottom:8px; }
  .kv { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid rgba(13,22,18,0.06); font-size:14px; }
  .kv:last-child { border-bottom:0; }
  .kv .k { color:#6b7268; font-weight:600; }
  .kv .v { color:#062b1e; font-weight:800; }
  .links { margin-top:22px; text-align:center; }
  .links a { color:#062b1e; font-weight:800; text-decoration:none; font-family:Cairo,sans-serif; font-size:13px; }
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<div class="card" id="card">
  <div id="status">جارٍ التحقق…</div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const inv = qs.get('inv') || '';
const sig = qs.get('sig') || '';

async function verify() {
  const card = document.getElementById('card');
  card.textContent = '';
  if (!inv || !sig) {
    card.appendChild(makeBadge('err', '✗ رابط غير صالح'));
    const p = document.createElement('p');
    p.textContent = 'الرابط ناقص. تأكد من نسخه كاملاً.';
    card.appendChild(p);
    return;
  }
  try {
    const r = await fetch('/app/public/receipt/verify/' + encodeURIComponent(inv) + '/' + encodeURIComponent(sig));
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      card.appendChild(makeBadge('err', '✗ لم يتم التحقق'));
      const p = document.createElement('p');
      p.textContent = e.error === 'invalid_token' ? 'التوقيع لا يطابق هذا الإيصال — قد يكون مزوّراً.' : 'تعذّر التحقق من الإيصال.';
      card.appendChild(p);
      return;
    }
    const d = await r.json();
    card.appendChild(makeBadge('ok', '✓ إيصال موثّق'));
    const h = document.createElement('h1');
    h.textContent = 'صادر من منصة مُرابحة';
    card.appendChild(h);
    const intro = document.createElement('p');
    intro.textContent = 'هذا الإيصال صادر إلكترونياً من منصة مُرابحة، وتوقيعه الرقمي يطابق سجلّاتنا.';
    card.appendChild(intro);
    const table = document.createElement('div');
    table.style.marginTop = '14px';
    const addRow = (k, v) => {
      const row = document.createElement('div');
      row.className = 'kv';
      const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
      const b = document.createElement('span'); b.className = 'v'; b.textContent = v;
      row.append(a, b);
      table.appendChild(row);
    };
    addRow('رقم الإيصال', 'MRB-' + d.investment.id.slice(-8).toUpperCase());
    addRow('المشروع', d.project.name || '—');
    addRow('المبلغ', (d.investment.amountSar || 0).toLocaleString('ar-SA') + ' ر.س');
    addRow('التاريخ', new Date(d.investment.createdAt).toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }));
    addRow('الحالة', d.investment.status || '—');
    card.appendChild(table);
    const links = document.createElement('div'); links.className = 'links';
    const a = document.createElement('a'); a.href = '/'; a.textContent = 'العودة إلى مُرابحة ←';
    links.appendChild(a);
    card.appendChild(links);
  } catch (e) {
    card.appendChild(makeBadge('err', '✗ تعذّر الاتصال'));
  }
}
function makeBadge(kind, text) {
  const b = document.createElement('div'); b.className = 'badge ' + kind;
  const dot = document.createElement('span'); dot.className = 'dot';
  const s = document.createElement('span'); s.textContent = text;
  b.append(dot, s);
  return b;
}
verify();
</script>
</body>
</html>
