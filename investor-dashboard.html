<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Investor Dashboard — Murbha">لوحة المستثمر — مُرابحة</title>
<meta name="description" content="لوحة تحكم شاملة تعرض أداءك الاستثماري وصفقاتك الحالية وأهدافك المالية دفعة واحدة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:940px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:36px 22px;margin-bottom:22px;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .hero-greeting{font:900 22px Cairo,sans-serif;}
  .hero-date{font:500 12px Tajawal,sans-serif;opacity:.8;margin-top:4px;}
  .hero-net{text-align:left;}
  .hero-net-lbl{font:500 11px Tajawal,sans-serif;opacity:.8;}
  .hero-net-val{font:900 28px Cairo,sans-serif;color:var(--gold-light);}
  /* KPI grid */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-val.up{color:#2e7d32;}
  .kpi-val.gold{color:var(--gold);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  /* Two-column layout */
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media(max-width:680px){.dash-cols{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}
  .card-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .card-link{font:700 10px Cairo,sans-serif;color:var(--green);text-decoration:none;}
  /* Activity feed */
  .act-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .act-item:last-child{border-bottom:none;}
  .act-icon{font:900 18px Cairo,sans-serif;flex-shrink:0;margin-top:1px;}
  .act-body{flex:1;}
  .act-title{font:700 11px Cairo,sans-serif;color:var(--ink);}
  .act-time{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .act-amount{font:900 11px Cairo,sans-serif;color:var(--green-dark);flex-shrink:0;}
  /* Goal progress */
  .goal-item{margin-bottom:14px;}
  .goal-item:last-child{margin-bottom:0;}
  .goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .goal-name{font:700 11px Cairo,sans-serif;color:var(--ink);}
  .goal-pct{font:900 11px Cairo,sans-serif;color:var(--green-dark);}
  .goal-bar-bg{height:8px;background:#f0ece0;border-radius:4px;overflow:hidden;}
  .goal-bar{height:100%;border-radius:4px;background:var(--green);transition:width .4s;}
  .goal-sub{display:flex;justify-content:space-between;font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  /* Active deals mini */
  .mini-deal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .mini-deal:last-child{border-bottom:none;}
  .md-name{font:900 11px Cairo,sans-serif;color:var(--green-dark);}
  .md-sector{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .md-yield{font:900 12px Cairo,sans-serif;color:#2e7d32;}
  /* Alerts */
  .alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;margin-bottom:8px;}
  .alert-item:last-child{margin-bottom:0;}
  .alert-warn{background:#fff8e1;border:1px solid #ffe082;}
  .alert-info{background:#e3f2fd;border:1px solid #90caf9;}
  .alert-icon{font:900 16px Cairo,sans-serif;flex-shrink:0;}
  .alert-text{font:500 10px Tajawal,sans-serif;color:var(--ink);line-height:1.6;}
  .placeholder-msg{font:500 12px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:24px 0;}
  .full-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-greeting" id="heroGreeting">مرحباً…</div>
        <div class="hero-date" id="heroDate"></div>
      </div>
      <div class="hero-net">
        <div class="hero-net-lbl" data-en="Net Portfolio Value">صافي قيمة المحفظة</div>
        <div class="hero-net-val" id="heroNetVal">—</div>
      </div>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="dash-cols">
    <div class="card">
      <div class="card-title">
        <span data-en="Active Deals">الصفقات النشطة</span>
        <a class="card-link" href="/portfolio-snapshot.html" data-en="View all">عرض الكل</a>
      </div>
      <div id="miniDeals"></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span data-en="Financial Goals">الأهداف المالية</span>
        <a class="card-link" href="/investment-plan.html" data-en="My plan">خطتي</a>
      </div>
      <div id="goalsList"></div>
    </div>
  </div>

  <div class="dash-cols">
    <div class="card">
      <div class="card-title">
        <span data-en="Recent Activity">آخر النشاطات</span>
        <a class="card-link" href="/account-statement.html" data-en="Full history">السجل الكامل</a>
      </div>
      <div id="actFeed"></div>
    </div>
    <div class="card">
      <div class="card-title" data-en="Alerts &amp; Reminders">تنبيهات وتذكيرات</div>
      <div id="alertsList"></div>
    </div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function fmtPct(n){ return Number(n||0).toFixed(2)+'٪'; }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  const now=new Date();
  const hour=now.getHours();
  const greeting=hour<12?'صباح الخير':'hour<18?'مساء الخير':'مساء النور';
  document.getElementById('heroDate').textContent=now.toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const actIcons={invest:'💰',return:'✅',deposit:'⬆️',withdraw:'⬇️',fee:'📋',other:'📌'};

  (async function load(){
    try{
      const r=await fetch('/app/me/investor-dashboard');
      if(!r.ok){ placeholder(document.getElementById('miniDeals'),'تعذّر التحميل.'); return; }
      const d=await r.json();

      document.getElementById('heroGreeting').textContent=(d.greeting||'مرحباً')+(!d.name?'':'، '+d.name);
      document.getElementById('heroNetVal').textContent=fmt(d.netValue||0)+' ر.س';

      const kpiGrid=document.getElementById('kpiGrid');
      const kpis=[
        {lbl:'إجمالي المستثمَر',val:fmt(d.totalInvested||0)+' ر.س',cls:''},
        {lbl:'العائد المتراكم',val:fmt(d.totalReturns||0)+' ر.س',cls:'up'},
        {lbl:'عائد هذا الشهر',val:fmt(d.monthReturns||0)+' ر.س',cls:'gold'},
        {lbl:'الصفقات النشطة',val:String(d.activeDeals||0),cls:''},
        {lbl:'تقويم الاستحقاق',val:String(d.upcomingMaturities||0)+' قادم',cls:''},
        {lbl:'درجة المخاطرة',val:d.riskLabel||'—',cls:''}
      ];
      kpis.forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'+(k.cls?' '+k.cls:''); v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiGrid.appendChild(kpi);
      });

      const miniDeals=document.getElementById('miniDeals');
      const deals=d.activeDeals_list||[];
      if(!deals.length){ placeholder(miniDeals,'لا توجد صفقات نشطة.'); }
      else{
        deals.slice(0,5).forEach(deal=>{
          const item=document.createElement('div'); item.className='mini-deal';
          const left=document.createElement('div');
          const name=document.createElement('div'); name.className='md-name'; name.textContent=deal.name||'—';
          const sector=document.createElement('div'); sector.className='md-sector'; sector.textContent=deal.sector||'—';
          left.appendChild(name); left.appendChild(sector);
          const yield_=document.createElement('div'); yield_.className='md-yield'; yield_.textContent=fmtPct(deal.expectedYield||0);
          item.appendChild(left); item.appendChild(yield_);
          miniDeals.appendChild(item);
        });
      }

      const goalsList=document.getElementById('goalsList');
      const goals=d.goals||[];
      if(!goals.length){ placeholder(goalsList,'لا توجد أهداف محددة.'); }
      else{
        goals.slice(0,4).forEach(g=>{
          const item=document.createElement('div'); item.className='goal-item';
          const hdr=document.createElement('div'); hdr.className='goal-header';
          const name=document.createElement('div'); name.className='goal-name'; name.textContent=g.name||'هدف';
          const pct=document.createElement('div'); pct.className='goal-pct'; pct.textContent=fmtPct(g.pct||0);
          hdr.appendChild(name); hdr.appendChild(pct);
          const bg=document.createElement('div'); bg.className='goal-bar-bg';
          const bar=document.createElement('div'); bar.className='goal-bar'; bar.style.width=Math.min(100,g.pct||0)+'%';
          bg.appendChild(bar);
          const sub=document.createElement('div'); sub.className='goal-sub';
          const s1=document.createElement('span'); s1.textContent=fmt(g.current||0)+' ر.س';
          const s2=document.createElement('span'); s2.textContent=fmt(g.target||0)+' ر.س';
          sub.appendChild(s1); sub.appendChild(s2);
          item.appendChild(hdr); item.appendChild(bg); item.appendChild(sub);
          goalsList.appendChild(item);
        });
      }

      const actFeed=document.getElementById('actFeed');
      const activity=d.recentActivity||[];
      if(!activity.length){ placeholder(actFeed,'لا توجد نشاطات حديثة.'); }
      else{
        activity.slice(0,6).forEach(act=>{
          const item=document.createElement('div'); item.className='act-item';
          const icon=document.createElement('div'); icon.className='act-icon'; icon.textContent=actIcons[act.type]||'📌';
          const body=document.createElement('div'); body.className='act-body';
          const title=document.createElement('div'); title.className='act-title'; title.textContent=act.description||'—';
          const time=document.createElement('div'); time.className='act-time'; time.textContent=(act.date||'').slice(0,10);
          body.appendChild(title); body.appendChild(time);
          const amt=document.createElement('div'); amt.className='act-amount'; amt.textContent=act.amount?(fmt(act.amount)+' ر.س'):'';
          item.appendChild(icon); item.appendChild(body); item.appendChild(amt);
          actFeed.appendChild(item);
        });
      }

      const alertsList=document.getElementById('alertsList');
      const alerts=d.alerts||[];
      if(!alerts.length){ placeholder(alertsList,'لا توجد تنبيهات حالياً.'); }
      else{
        alerts.forEach(al=>{
          const item=document.createElement('div'); item.className='alert-item '+(al.type==='warn'?'alert-warn':'alert-info');
          const icon=document.createElement('div'); icon.className='alert-icon'; icon.textContent=al.type==='warn'?'⚠️':'ℹ️';
          const text=document.createElement('div'); text.className='alert-text'; text.textContent=al.message||'—';
          item.appendChild(icon); item.appendChild(text);
          alertsList.appendChild(item);
        });
      }
    }catch(e){ placeholder(document.getElementById('miniDeals'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
