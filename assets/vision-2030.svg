<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 26" role="img" aria-label="Vision 2030 — رؤية ٢٠٣٠">
  <title>Saudi Vision 2030 — رؤية ٢٠٣٠</title>
  <!-- Saudi green wordmark, stacked Latin + Arabic. Stand-in mark; swap this
       file for the official artwork once a licensed copy is available. -->
  <defs>
    <style>
      .v-green { fill: #006C35; }
      .v-gold  { fill: #C9A14A; }
      .v-num {
        font: 800 14px "Helvetica Neue", system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      .v-lat {
        font: 700 6px "Helvetica Neue", system-ui, sans-serif;
        letter-spacing: 0.24em;
      }
      .v-ar  {
        font: 700 7px "Amiri", "Noto Naskh Arabic", serif;
      }
    </style>
  </defs>

  <!-- Subtle stem mark (a stylised palm/horizon glyph that nods to the
       official identity without copying it). -->
  <g class="v-green">
    <path d="M5 21 L5 12 Q5 6 11 6 Q9 8 9 12 L9 21 Z" />
    <circle cx="11" cy="4.5" r="1.6" class="v-gold" />
  </g>

  <!-- Wordmark: "VISION" small caps over a bold "2030" -->
  <text x="20" y="11"  class="v-lat v-green">VISION</text>
  <text x="20" y="23"  class="v-num v-green">2030</text>

  <!-- Arabic line on the right -->
  <text x="78" y="11"  class="v-lat v-green" letter-spacing="0.12em">KSA</text>
  <text x="78" y="23"  class="v-ar  v-green" direction="rtl">رؤية ٢٠٣٠</text>
</svg>
