<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Platform Settings — Murbha Admin">إعدادات المنصة — إدارة مُرابحة</title>
<meta name="description" content="ضبط الإعدادات العامة للمنصة من وضع الصيانة إلى حدود الاستثمار وإشعارات النظام." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
  .section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  /* Setting rows */
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;padding-bottom:0;}
  .setting-info{flex:1;}
  .setting-name{font:900 12px Cairo,sans-serif;color:var(--green-dark);}
  .setting-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;line-height:1.5;}
  /* Toggle switch */
  .toggle-wrap{flex-shrink:0;}
  .toggle{position:relative;display:inline-block;width:44px;height:24px;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s;}
  .toggle-slider:before{position:absolute;content:'';height:18px;width:18px;right:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
  input:checked + .toggle-slider{background:var(--green);}
  input:checked + .toggle-slider:before{transform:translateX(-20px);}
  /* Number inputs */
  .num-inp{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font:700 12px Cairo,sans-serif;color:var(--ink);width:120px;text-align:center;}
  .num-inp:focus{outline:none;border-color:var(--green);}
  /* Text input */
  .text-inp{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font:500 12px Tajawal,sans-serif;color:var(--ink);width:220px;}
  .text-inp:focus{outline:none;border-color:var(--green);}
  /* Save button */
  .btn-save{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:10px 24px;font:900 12px Cairo,sans-serif;cursor:pointer;margin-top:14px;}
  .btn-save:hover{background:var(--green);}
  .btn-save:disabled{background:#ccc;cursor:default;}
  /* Maintenance banner */
  .maint-banner{background:#fdecea;border:1px solid #f8d7da;border-radius:10px;padding:12px 16px;margin-bottom:18px;font:700 12px Cairo,sans-serif;color:#c54a3a;display:none;}
  .maint-banner.show{display:block;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Platform Settings">إعدادات المنصة</h1>
    <p data-en="Configure global platform settings: maintenance mode, investment limits, and system notifications.">ضبط الإعدادات العامة: وضع الصيانة وحدود الاستثمار وإشعارات النظام.</p>
    <div class="admin-badge">لوحة الإدارة — سري</div>
  </div>

  <div class="maint-banner" id="maintBanner">⚠️ المنصة حالياً في وضع الصيانة — المستخدمون لا يستطيعون تنفيذ معاملات.</div>

  <div id="settingsContainer"></div>

  <button class="btn-save" id="btnSave" data-en="Save All Settings">حفظ جميع الإعدادات</button>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  let currentSettings={};
  const controls={};

  function buildSection(title, rows){
    const sec=document.createElement('div'); sec.className='section';
    const st=document.createElement('div'); st.className='section-title'; st.textContent=title;
    sec.appendChild(st);
    rows.forEach(row=>{
      const r=document.createElement('div'); r.className='setting-row';
      const info=document.createElement('div'); info.className='setting-info';
      const name=document.createElement('div'); name.className='setting-name'; name.textContent=row.name;
      const desc=document.createElement('div'); desc.className='setting-desc'; desc.textContent=row.desc;
      info.appendChild(name); info.appendChild(desc);
      r.appendChild(info);
      if(row.type==='toggle'){
        const wrap=document.createElement('div'); wrap.className='toggle-wrap';
        const label=document.createElement('label'); label.className='toggle';
        const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=!!currentSettings[row.key];
        controls[row.key]=inp;
        inp.addEventListener('change',()=>{
          if(row.key==='maintenanceMode'){ document.getElementById('maintBanner').classList.toggle('show', inp.checked); }
        });
        const slider=document.createElement('span'); slider.className='toggle-slider';
        label.appendChild(inp); label.appendChild(slider);
        wrap.appendChild(label); r.appendChild(wrap);
      } else if(row.type==='number'){
        const inp=document.createElement('input'); inp.type='number'; inp.className='num-inp'; inp.value=currentSettings[row.key]||row.default||0; inp.min=row.min||0;
        controls[row.key]=inp;
        r.appendChild(inp);
      } else if(row.type==='text'){
        const inp=document.createElement('input'); inp.type='text'; inp.className='text-inp'; inp.value=currentSettings[row.key]||'';
        controls[row.key]=inp;
        r.appendChild(inp);
      }
      sec.appendChild(r);
    });
    return sec;
  }

  (async function load(){
    const container=document.getElementById('settingsContainer');
    placeholder(container,'جارٍ التحميل…');
    try{
      const r=await fetch('/app/admin/settings');
      if(!r.ok){ placeholder(container,r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      currentSettings=await r.json();
      container.textContent='';

      if(currentSettings.maintenanceMode) document.getElementById('maintBanner').classList.add('show');

      const sections=[
        {title:'الوضع العام',rows:[
          {key:'maintenanceMode',name:'وضع الصيانة',desc:'إيقاف المعاملات مؤقتاً للصيانة.',type:'toggle'},
          {key:'registrationOpen',name:'تسجيل مفتوح',desc:'السماح للمستخدمين الجدد بإنشاء حسابات.',type:'toggle'},
          {key:'kycRequired',name:'KYC إلزامي',desc:'يجب إكمال التحقق قبل الاستثمار.',type:'toggle'}
        ]},
        {title:'حدود الاستثمار',rows:[
          {key:'minInvestment',name:'الحد الأدنى للاستثمار (ر.س)',desc:'أقل مبلغ يمكن استثماره في صفقة واحدة.',type:'number',default:1000},
          {key:'maxInvestment',name:'الحد الأقصى للاستثمار (ر.س)',desc:'أعلى مبلغ يمكن استثماره في صفقة واحدة.',type:'number',default:500000},
          {key:'maxDealsPerUser',name:'أقصى صفقات نشطة للمستثمر',desc:'عدد الصفقات المتزامنة المسموح بها.',type:'number',default:20}
        ]},
        {title:'العوائد والرسوم',rows:[
          {key:'platformFeePct',name:'رسوم المنصة ٪',desc:'النسبة المئوية المقتطعة من كل عائد.',type:'number',default:2},
          {key:'earlyExitFeePct',name:'رسوم الخروج المبكر ٪',desc:'رسوم الخروج قبل تاريخ الاستحقاق.',type:'number',default:2}
        ]},
        {title:'الاتصالات',rows:[
          {key:'supportEmail',name:'بريد الدعم',desc:'العنوان الذي ترد منه رسائل الدعم الفني.',type:'text'},
          {key:'smsEnabled',name:'إشعارات SMS',desc:'إرسال رسائل نصية للعمليات الحساسة.',type:'toggle'},
          {key:'emailEnabled',name:'إشعارات البريد الإلكتروني',desc:'إرسال تأكيدات وتنبيهات بالبريد.',type:'toggle'}
        ]}
      ];

      sections.forEach(s=>container.appendChild(buildSection(s.title, s.rows)));
    }catch{ placeholder(document.getElementById('settingsContainer'),'خطأ في الاتصال.'); }
  }());

  document.getElementById('btnSave').addEventListener('click', async()=>{
    document.getElementById('btnSave').disabled=true;
    const payload={};
    Object.entries(controls).forEach(([k,inp])=>{
      if(inp.type==='checkbox') payload[k]=inp.checked;
      else if(inp.type==='number') payload[k]=Number(inp.value)||0;
      else payload[k]=inp.value.trim();
    });
    try{
      const r=await fetch('/app/admin/settings',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
      document.getElementById('btnSave').disabled=false;
      if(!r.ok){ showToast('تعذّر الحفظ.'); return; }
      showToast('تم حفظ الإعدادات بنجاح.');
    }catch{ document.getElementById('btnSave').disabled=false; showToast('خطأ في الاتصال.'); }
  });
}());
</script>
</body>
</html>
