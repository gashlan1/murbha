<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>اختر كلمة مرور جديدة — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="app.js"></script>
<style>
:root {
  --ink: #0d1612; --paper: #fbf6ea; --paper-2: #efe8d6;
  --green: #0a4d36; --green-dark: #062b1e;
  --gold: #b08840; --muted: #6b7268;
  --line: rgba(13,22,18,0.10); --line-strong: rgba(13,22,18,0.20);
  --red: #b54935;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body {
  font-family: 'Tajawal', 'Geeza Pro', system-ui, sans-serif;
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  min-height: 100vh; color: var(--ink); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 18px;
}
.card {
  width: 100%; max-width: 420px; background: #fff;
  border-radius: 20px; border: 1.5px solid var(--line);
  padding: 28px 24px; box-shadow: 0 12px 36px rgba(13,22,18,0.06);
}
.logo {
  width: 64px; height: 64px; border-radius: 16px; background: var(--green-dark);
  color: #d4ac6e; display: flex; align-items: center; justify-content: center;
  font: 900 32px 'Cairo', sans-serif; margin: 0 auto 16px;
}
h1 { font: 800 22px 'Cairo', sans-serif; color: var(--green-dark); text-align: center; margin-bottom: 6px; }
.lede { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 22px; }
label { display: block; font: 700 13px 'Cairo', sans-serif; color: var(--ink); margin-bottom: 6px; margin-top: 14px; }
input[type=password] {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line-strong);
  border-radius: 12px; font: 500 15px 'Tajawal', sans-serif; background: var(--paper);
  direction: ltr; text-align: start;
}
input[type=password]:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(10,77,54,0.1); }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.btn {
  width: 100%; padding: 14px 22px; margin-top: 20px;
  background: var(--green); color: var(--paper); border: 0; border-radius: 12px;
  font: 800 15px 'Cairo', sans-serif; cursor: pointer; min-height: 48px;
  box-shadow: 0 4px 14px rgba(10,77,54,0.25);
  transition: transform .1s, background .2s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.success {
  margin-top: 18px; padding: 14px 16px; border-radius: 12px;
  background: rgba(15,110,58,0.08); border: 1px solid rgba(15,110,58,0.20);
  color: #0f6e3a; font-size: 14px; line-height: 1.7; text-align: center;
}
.error { margin-top: 12px; color: var(--red); font: 700 13px 'Tajawal', sans-serif; text-align: center; }
.back { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 600; }
.invalid-card .lede { color: var(--red); }
</style>
</head>
<body>
<main class="card" id="main">
  <div class="logo">م</div>
  <h1>اختر كلمة مرور جديدة</h1>
  <p class="lede" id="lede">أدخل كلمة المرور الجديدة لحسابك. يجب أن تكون 8 أحرف على الأقل.</p>

  <form id="resetForm" autocomplete="off">
    <label for="newPwd">كلمة المرور الجديدة</label>
    <input type="password" id="newPwd" minlength="8" required autocomplete="new-password" />
    <label for="confirmPwd">تأكيد كلمة المرور</label>
    <input type="password" id="confirmPwd" minlength="8" required autocomplete="new-password" />
    <div class="hint">استخدم كلمة قوية فيها أرقام ورموز.</div>
    <div class="error" id="errorMsg" style="display:none;"></div>
    <button type="submit" class="btn" id="submitBtn">حفظ كلمة المرور الجديدة</button>
  </form>

  <div class="success" id="successMsg" style="display:none;">
    تم تغيير كلمة المرور بنجاح. تحويلك إلى صفحة تسجيل الدخول…
  </div>

  <a href="login.html" class="back">العودة إلى تسجيل الدخول</a>
</main>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  if (!token) {
    const lede = document.getElementById('lede');
    lede.textContent = 'رابط غير صالح أو مفقود. يُرجى طلب رابط جديد.';
    lede.style.color = 'var(--red)';
    document.getElementById('resetForm').style.display = 'none';
    return;
  }
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const a = document.getElementById('newPwd').value;
    const b = document.getElementById('confirmPwd').value;
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    if (a !== b) { err.textContent = 'كلمتا المرور غير متطابقتين.'; err.style.display = 'block'; return; }
    if (a.length < 8) { err.textContent = 'يجب أن تكون كلمة المرور 8 أحرف على الأقل.'; err.style.display = 'block'; return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ…';
    try {
      await App.api('POST', '/app/auth/reset-password', { token, newPassword: a });
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
      setTimeout(() => { location.href = 'login.html'; }, 2200);
    } catch (e2) {
      err.textContent = (e2.code === 'invalid_token') ? 'الرابط منتهي الصلاحية أو غير صالح. اطلب رابطاً جديداً.' : (e2.message || 'تعذّر الحفظ.');
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'حفظ كلمة المرور الجديدة';
    }
  });
})();
</script>
</body>
</html>
