<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<meta name="color-scheme" content="light only" />
<title>استعادة كلمة المرور — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#0d1612;--paper:#fbf6ea;--paper-2:#efe8d6;--green:#0a4d36;--green-dark:#062b1e;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);--line-strong:rgba(13,22,18,0.20);--red:#b54935;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#fbf6ea;-webkit-text-size-adjust:100%}
body{font-family:'Tajawal','Geeza Pro',system-ui,sans-serif;background:linear-gradient(180deg,#fbf6ea 0%,#efe8d6 100%)!important;color:#0d1612;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
button,a{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
*:focus:not(:focus-visible){outline:none}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;padding:14px 18px 24px;max-width:480px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:8px}
.back-btn{width:40px;height:40px;border-radius:50%;background:rgba(13,22,18,0.05);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;text-decoration:none}
.back-btn:active{transform:scale(0.92)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo-mark{width:64px;height:64px;margin:0 auto 12px;background:var(--green);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-family:'Cairo',sans-serif;font-weight:900;font-size:32px;box-shadow:0 8px 24px rgba(10,77,54,0.25);position:relative}
.auth-logo-mark::after{content:'';position:absolute;inset:6px;border:1.5px solid var(--gold-light);border-radius:9px;opacity:0.4}
.auth-logo h1{font-family:'Cairo',sans-serif;font-size:22px;font-weight:900;color:var(--green-dark);letter-spacing:-0.02em}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:4px}
.mode-tabs{background:rgba(13,22,18,0.06);padding:5px;border-radius:12px;display:flex;gap:4px;margin:0 0 22px}
.mode-tab{flex:1;background:transparent;border:none;padding:10px;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .2s}
.mode-tab.active{background:#fff;color:var(--green-dark);box-shadow:0 1px 3px rgba(13,22,18,0.08)}
.auth-form{display:flex;flex-direction:column}
.auth-form label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
.auth-form input{width:100%;padding:14px 16px;border:1.5px solid var(--line-strong);border-radius:12px;font-family:inherit;font-size:17px;background:var(--paper);transition:border-color .2s;-webkit-appearance:none;margin-bottom:14px}
.auth-form input:focus{outline:none;border-color:var(--green);background:#fff}
.form-error{margin-bottom:8px;color:var(--red);font-size:12px;min-height:16px}
.form-info{margin-bottom:8px;color:var(--green);font-size:12px;min-height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;font-size:15px;font-weight:700;border-radius:12px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:48px;width:100%;transition:transform .1s,background .2s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--green);color:var(--paper);box-shadow:0 4px 14px rgba(10,77,54,0.25)}
.btn-ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--green-dark)}
.helper-row{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.helper-row a{color:var(--green-dark);font-weight:800;text-decoration:none}
.section{margin-top:6px}
.hide{display:none}
.lang-toggle{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:rgba(13,22,18,0.04);color:var(--green-dark);font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:background .15s;flex-shrink:0}
.lang-toggle:hover{background:rgba(13,22,18,0.08)}
.lang-toggle:active{transform:scale(0.96)}
.lang-toggle .lang-sep{opacity:.4}
html[lang="ar"] .lang-toggle .lang-ar{color:var(--gold)}
html[lang="ar"] .lang-toggle .lang-en{opacity:.45}
html[lang="en"] .lang-toggle .lang-en{color:var(--gold)}
html[lang="en"] .lang-toggle .lang-ar{opacity:.45}
html[lang="en"] body{font-family:'Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif}
@media(min-width:768px){body{font-size:16px}.auth-wrap{padding:40px 28px}}
</style>
<script src="i18n.js" defer></script>
</head>
<body>
<div class="auth-wrap">

<div class="top-bar">
  <a href="auth.html" class="back-btn" aria-label="رجوع" data-i18n-attr="aria-label:auth_back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6" transform="scale(-1,1) translate(-24,0)"/></svg>
  </a>
  <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch language">
    <span class="lang-en">EN</span><span class="lang-sep">/</span><span class="lang-ar">ع</span>
  </button>
</div>

<div class="auth-logo">
  <div class="auth-logo-mark">م</div>
  <h1 data-i18n="reset_h">استعادة كلمة المرور</h1>
  <p data-i18n="reset_sub">اختر طريقة الاستعادة المناسبة لك</p>
</div>

<div class="mode-tabs" id="channelTabs">
  <button class="mode-tab active" data-channel="email" data-i18n="reset_tab_email">عبر البريد</button>
  <button class="mode-tab" data-channel="sms" data-i18n="reset_tab_sms">عبر الجوال</button>
</div>

<!-- ── EMAIL REQUEST ── -->
<div id="emailMode">
  <form id="emailRequestForm" class="auth-form" autocomplete="on">
    <label for="resetEmail" data-i18n="reset_email_label">البريد الإلكتروني</label>
    <input id="resetEmail" name="email" type="email" inputmode="email" required style="direction:ltr"
           placeholder="you@example.com" data-i18n-attr="placeholder:reset_email_ph" />
    <p class="form-error" id="emailError"></p>
    <p class="form-info" id="emailInfo"></p>
    <button type="submit" class="btn btn-primary" data-i18n="reset_send_link">إرسال رابط الاستعادة</button>
  </form>
</div>

<!-- ── SMS REQUEST + CONFIRM ── -->
<div id="smsMode" class="hide">
  <form id="smsRequestForm" class="auth-form" autocomplete="on">
    <label for="resetMobile" data-i18n="reset_mobile_label">رقم الجوال</label>
    <input id="resetMobile" name="mobile" type="tel" inputmode="tel" required style="direction:ltr"
           placeholder="05XXXXXXXX" data-i18n-attr="placeholder:reset_mobile_ph" />
    <p class="form-error" id="smsError"></p>
    <p class="form-info" id="smsInfo"></p>
    <button type="submit" class="btn btn-primary" data-i18n="reset_send_code">إرسال رمز التحقق</button>
  </form>

  <form id="smsConfirmForm" class="auth-form section hide" autocomplete="off">
    <label for="resetCode" data-i18n="reset_code_label">رمز التحقق (٤ أرقام)</label>
    <input id="resetCode" name="code" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" required
           style="direction:ltr;letter-spacing:8px;text-align:center" />
    <label for="newPassword1" data-i18n="reset_newpass_label">كلمة المرور الجديدة</label>
    <input id="newPassword1" name="new_password" type="password" autocomplete="new-password" required
           style="direction:ltr" placeholder="٨ أحرف على الأقل" data-i18n-attr="placeholder:auth_pass_ph" />
    <p class="form-error" id="confirmError"></p>
    <button type="submit" class="btn btn-primary" data-i18n="reset_confirm_sms">حفظ كلمة المرور الجديدة</button>
  </form>
</div>

<!-- ── EMAIL TOKEN → SET NEW PASSWORD ── -->
<div id="tokenMode" class="hide">
  <form id="tokenConfirmForm" class="auth-form" autocomplete="off">
    <label for="newPassword2" data-i18n="reset_newpass_label">كلمة المرور الجديدة</label>
    <input id="newPassword2" name="new_password" type="password" autocomplete="new-password" required
           style="direction:ltr" placeholder="٨ أحرف على الأقل" data-i18n-attr="placeholder:auth_pass_ph" />
    <p class="form-error" id="tokenError"></p>
    <button type="submit" class="btn btn-primary" data-i18n="reset_confirm_email">حفظ كلمة المرور الجديدة</button>
  </form>
</div>

<div class="helper-row">
  <span data-i18n="reset_back_login">تذكّرت كلمة المرور؟</span>
  <a href="auth.html" data-i18n="auth_tab_login">تسجيل الدخول</a>
</div>

</div>

<script>
async function postJSON(url, data) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(data),
  });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

const $ = (id) => document.getElementById(id);
const isEn = () => document.documentElement.lang === 'en';
const t = (en, ar) => isEn() ? en : ar;

// Mode tab toggle (email vs sms request)
document.querySelectorAll('#channelTabs .mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#channelTabs .mode-tab').forEach(b => b.classList.remove('active'));
    tab.classList.add('active');
    const ch = tab.dataset.channel;
    $('emailMode').classList.toggle('hide', ch !== 'email');
    $('smsMode').classList.toggle('hide', ch !== 'sms');
    $('tokenMode').classList.add('hide');
  });
});

// If a reset token is present in the URL, show the email-token confirm form.
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) {
  $('channelTabs').classList.add('hide');
  $('emailMode').classList.add('hide');
  $('smsMode').classList.add('hide');
  $('tokenMode').classList.remove('hide');
}

// Email request
$('emailRequestForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('resetEmail').value.trim();
  $('emailError').textContent = '';
  $('emailInfo').textContent = '';
  const { ok, body } = await postJSON('/api/auth/password-reset/request',
    { channel: 'email', identifier: email });
  if (ok) {
    $('emailInfo').textContent = t(
      "If that email exists, we've sent a reset link. Check your inbox.",
      'إذا كان البريد مسجّلاً لدينا، فقد أرسلنا رابط الاستعادة. تحقّق من صندوق الوارد.'
    );
  } else {
    $('emailError').textContent = body.error || t('Request failed', 'تعذّر الطلب');
  }
});

// SMS request
$('smsRequestForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mobile = $('resetMobile').value.trim();
  $('smsError').textContent = '';
  $('smsInfo').textContent = '';
  const { ok, body } = await postJSON('/api/auth/password-reset/request',
    { channel: 'sms', identifier: mobile });
  if (ok) {
    $('smsInfo').textContent = t(
      "If that number is registered, we've sent a verification code.",
      'إذا كان الرقم مسجّلاً، فقد أرسلنا رمز التحقق برسالة نصية.'
    );
    $('smsConfirmForm').classList.remove('hide');
  } else {
    $('smsError').textContent = body.error || t('Request failed', 'تعذّر الطلب');
  }
});

// SMS confirm (OTP + new password)
$('smsConfirmForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  $('confirmError').textContent = '';
  const mobile = $('resetMobile').value.trim();
  const code = $('resetCode').value.trim();
  const new_password = $('newPassword1').value;
  const { ok, body } = await postJSON('/api/auth/password-reset/confirm',
    { channel: 'sms', mobile, code, new_password });
  if (ok) {
    location.href = 'auth.html';
  } else {
    $('confirmError').textContent = body.error || t('Reset failed', 'تعذّر تحديث كلمة المرور');
  }
});

// Email-token confirm
$('tokenConfirmForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  $('tokenError').textContent = '';
  const new_password = $('newPassword2').value;
  const { ok, body } = await postJSON('/api/auth/password-reset/confirm',
    { channel: 'email', token: urlToken, new_password });
  if (ok) {
    location.href = 'auth.html';
  } else {
    $('tokenError').textContent = body.error || t('Reset failed', 'تعذّر تحديث كلمة المرور');
  }
});
</script>
</body>
</html>
