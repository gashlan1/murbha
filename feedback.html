<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>أرسل لنا ملاحظاتك — مُرابحة</title>
<meta name="description" content="شاركنا رأيك في منصة مُرابحة لتساعدنا على التحسين." />
<meta property="og:title" content="ملاحظاتك — مُرابحة" />
<meta property="og:description" content="شاركنا رأيك" />
<meta property="og:image" content="https://murabaha.example.sa/og-image.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root { --ink:#0d1612; --paper:#fbf6ea; --green-dark:#062b1e; --green:#0a4d36; --gold:#b08840; --muted:#6b7268; --line:rgba(13,22,18,0.10); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Tajawal,system-ui,sans-serif; background:var(--paper); color:var(--ink); padding:30px 18px 80px; max-width:580px; margin:0 auto; }
  .crumbs { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .crumbs a { color:var(--green-dark); text-decoration:none; font-weight:700; }
  h1 { font:900 26px Cairo,sans-serif; color:var(--green-dark); margin-bottom:6px; }
  .lede { color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; }
  .label { display:block; font:800 13px Cairo,sans-serif; color:var(--green-dark); margin-bottom:12px; }
  .nps-row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
  .nps-row button { min-width:38px; height:42px; padding:0 6px; background:#fff; border:1.5px solid var(--line); border-radius:8px; font:800 13px Cairo,sans-serif; color:var(--green-dark); cursor:pointer; transition:transform .1s; }
  .nps-row button.sel { background:var(--green-dark); color:#fff; border-color:var(--green-dark); transform:scale(1.08); }
  .nps-row button:hover:not(.sel) { background:#fbf8ee; }
  .nps-key { display:flex; justify-content:space-between; font:600 11px Tajawal,sans-serif; color:var(--muted); margin-bottom:18px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field input, .field textarea, .field select {
    padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font:600 14px Tajawal,sans-serif; color:var(--ink); background:#fff; resize:vertical;
  }
  .field input:focus, .field textarea:focus { outline:0; border-color:var(--gold); }
  .submit { width:100%; padding:13px; background:var(--green-dark); color:#fff; border:0; border-radius:999px; font:800 14px Cairo,sans-serif; cursor:pointer; }
  .submit:hover { background:var(--green); }
  .submit:disabled { opacity:0.6; cursor:default; }
  #msg { margin-top:14px; font-size:13px; min-height:20px; text-align:center; }
  #msg.ok { color:#0f6e3a; }
  #msg.err { color:#c54a3a; }
  .note { font-size:11px; color:var(--muted); margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
<div class="crumbs"><a href="/">الرئيسية</a> / ملاحظاتك</div>
<h1>شاركنا رأيك</h1>
<p class="lede">رأيك يساعدنا على تحسين التجربة. أقل من دقيقة لإكمال النموذج.</p>

<div class="card">
  <form id="fbForm">
    <label class="label">ما مدى احتمال أن تنصح صديقاً بمنصة مُرابحة؟</label>
    <div class="nps-row" id="npsRow"></div>
    <div class="nps-key">
      <span>غير محتمل</span>
      <span>محتمل جداً</span>
    </div>

    <div class="field">
      <label>التصنيف</label>
      <select id="fbCategory">
        <option value="general">عام</option>
        <option value="onboarding">التسجيل والتحقق</option>
        <option value="projects">الفرص الاستثمارية</option>
        <option value="payments">المدفوعات</option>
        <option value="performance">الأداء التقني</option>
        <option value="content">المحتوى والترجمة</option>
      </select>
    </div>

    <div class="field">
      <label>تفاصيل (اختياري)</label>
      <textarea id="fbComment" rows="5" maxlength="2000" placeholder="ما الذي يعجبك، وما الذي تود أن نحسّنه؟"></textarea>
    </div>

    <div class="field" id="emailField" style="display:none;">
      <label>بريدك (اختياري — للرد عليك)</label>
      <input id="fbEmail" type="email" maxlength="254" placeholder="your@email.com" />
    </div>

    <button class="submit" type="submit" id="submitBtn">إرسال</button>
  </form>
  <div id="msg"></div>
</div>
<p class="note">نقرأ كل ملاحظة بأنفسنا. لا نشارك بياناتك مع أطراف خارجية.</p>

<script src="/app.js"></script>
<script>
(async () => {
  const row = document.getElementById('npsRow');
  let score = null;
  for (let i = 0; i <= 10; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = i;
    b.onclick = () => {
      score = i;
      row.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    row.appendChild(b);
  }

  let user = null;
  try { user = await App.me(); } catch (e) {}
  if (!user) document.getElementById('emailField').style.display = 'flex';

  document.getElementById('fbForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = ''; msg.className = '';
    if (score === null) { msg.textContent = 'الرجاء اختيار درجة من 0 إلى 10.'; msg.className='err'; return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    const payload = {
      score,
      category: document.getElementById('fbCategory').value,
      comment: document.getElementById('fbComment').value.trim(),
    };
    if (!user) payload.email = document.getElementById('fbEmail').value.trim();
    try {
      const r = await fetch('/app/feedback', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload),
      });
      if (r.ok) {
        msg.textContent = '✓ شكراً لرأيك. تمّ الاستلام.';
        msg.className = 'ok';
        document.getElementById('fbForm').reset();
        row.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
        score = null;
      } else {
        const d = await r.json().catch(() => ({}));
        msg.textContent = d.error === 'invalid_input' ? 'البيانات غير مكتملة' : 'تعذّر الإرسال';
        msg.className = 'err';
      }
    } catch (err) { msg.textContent = 'تعذّر الاتصال'; msg.className = 'err'; }
    finally { btn.disabled = false; btn.textContent = 'إرسال'; }
  });
})();
</script>
</body>
</html>
