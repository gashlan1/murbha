<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تاريخ المحفظة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.hist-hero{background:linear-gradient(135deg,#062b1e 0%,#0a4d36 100%);border-radius:14px;padding:1.75rem 2rem;color:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-bottom:2rem;}
.hh-val{font-size:1.8rem;font-weight:700;color:#6de0a8;}
.hh-lbl{font-size:0.78rem;color:rgba(255,255,255,0.7);margin-top:0.2rem;}
.hh-sub{font-size:0.7rem;color:rgba(255,255,255,0.5);margin-top:0.1rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.growth-chart{padding:1.25rem;}
.gc-row{display:flex;align-items:center;gap:1rem;margin-bottom:0.6rem;}
.gc-row:last-child{margin-bottom:0;}
.gc-period{width:70px;font-size:0.75rem;color:var(--muted);flex-shrink:0;}
.gc-track{flex:1;background:#f0ebe0;border-radius:6px;height:10px;overflow:hidden;}
.gc-fill{height:100%;background:var(--green);border-radius:6px;}
.gc-val{width:90px;font-size:0.78rem;font-weight:700;color:var(--green);text-align:left;}
.history-table-wrap{padding:1.25rem;overflow-x:auto;}
.htable{width:100%;border-collapse:collapse;}
.htable th{background:#f5f0e8;font-size:0.75rem;padding:0.5rem 0.75rem;text-align:right;border-bottom:2px solid var(--line);}
.htable td{font-size:0.78rem;padding:0.5rem 0.75rem;border-bottom:1px solid var(--line);}
.htable tr:last-child td{border-bottom:none;}
.htable tr:hover td{background:#fdfaf4;}
.val-col{font-weight:700;color:var(--green);}
.return-col{font-weight:700;}
.return-col.pos{color:#27ae60;}
.return-col.neg{color:#e74c3c;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:700px){.hist-hero{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — تاريخ المحفظة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>تاريخ أداء المحفظة</h2>
      <p>تطور قيمة محفظتك الاستثمارية وعوائدها عبر الزمن</p>
    </div>
    <button class="btn btn-primary btn-sm" onclick="exportHistory()">تصدير التاريخ</button>
  </div>

  <div class="hist-hero">
    <div>
      <div class="hh-val">٣٢٠,٠٠٠ ر.س</div>
      <div class="hh-lbl">القيمة الحالية</div>
      <div class="hh-sub">يونيو ٢٠٢٦</div>
    </div>
    <div>
      <div class="hh-val">+٦٨,٤٠٠ ر.س</div>
      <div class="hh-lbl">إجمالي العوائد المحققة</div>
      <div class="hh-sub">منذ الاستثمار الأول</div>
    </div>
    <div>
      <div class="hh-val">٢٧.١٪</div>
      <div class="hh-lbl">العائد الإجمالي التراكمي</div>
      <div class="hh-sub">منذ يناير ٢٠٢٤</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>نمو المحفظة الربع سنوي</h3></div>
    <div class="growth-chart" id="growthChart"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>السجل التاريخي للمحفظة</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportHistory()">تصدير</button>
    </div>
    <div class="history-table-wrap">
      <table class="htable" id="historyTable"></table>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary btn-sm" onclick="exportHistory()">تصدير</button>
    </div>
  </div>
</div>

<script>
const GROWTH = [
  { period: 'Q1 2024', pct: 30, val: '٧٥,٠٠٠ ر.س' },
  { period: 'Q2 2024', pct: 42, val: '١٠٥,٠٠٠ ر.س' },
  { period: 'Q3 2024', pct: 54, val: '١٣٥,٠٠٠ ر.س' },
  { period: 'Q4 2024', pct: 65, val: '١٦٢,٠٠٠ ر.س' },
  { period: 'Q1 2025', pct: 74, val: '١٨٥,٠٠٠ ر.س' },
  { period: 'Q2 2025', pct: 82, val: '٢٠٥,٠٠٠ ر.س' },
  { period: 'Q3 2025', pct: 88, val: '٢٢٠,٠٠٠ ر.س' },
  { period: 'Q4 2025', pct: 93, val: '٢٣٢,٠٠٠ ر.س' },
  { period: 'Q1 2026', pct: 97, val: '٢٤٢,٠٠٠ ر.س' },
  { period: 'Q2 2026', pct: 100, val: '٣٢٠,٠٠٠ ر.س' }
];

const HISTORY = [
  { period: 'Q2 2026', value: '٣٢٠,٠٠٠ ر.س', deposits: '٦٠,٠٠٠ ر.س', returns: '١٨,٠٠٠ ر.س', ret_pct: '+٧.٥٪', cls: 'pos' },
  { period: 'Q1 2026', value: '٢٤٢,٠٠٠ ر.س', deposits: '٤٠,٠٠٠ ر.س', returns: '١٢,٠٠٠ ر.س', ret_pct: '+٥.٢٪', cls: 'pos' },
  { period: 'Q4 2025', value: '١٩٠,٠٠٠ ر.س', deposits: '٣٠,٠٠٠ ر.س', returns: '٩,٦٠٠ ر.س', ret_pct: '+٥.٣٪', cls: 'pos' },
  { period: 'Q3 2025', value: '١٥٠,٠٠٠ ر.س', deposits: '٢٠,٠٠٠ ر.س', returns: '٧,٢٠٠ ر.س', ret_pct: '+٥.٠٪', cls: 'pos' },
  { period: 'Q2 2025', value: '١٢٢,٠٠٠ ر.س', deposits: '٢٠,٠٠٠ ر.س', returns: '٦,٠٠٠ ر.س', ret_pct: '+٥.١٪', cls: 'pos' },
  { period: 'Q1 2025', value: '٩٦,٠٠٠ ر.س', deposits: '١٥,٠٠٠ ر.س', returns: '٤,٨٠٠ ر.س', ret_pct: '+٥.٢٪', cls: 'pos' }
];

function buildGrowth() {
  const wrap = document.getElementById('growthChart');
  GROWTH.forEach(g => {
    const row = document.createElement('div'); row.className = 'gc-row';
    const period = document.createElement('div'); period.className = 'gc-period'; period.textContent = g.period;
    const track = document.createElement('div'); track.className = 'gc-track';
    const fill = document.createElement('div'); fill.className = 'gc-fill'; fill.style.width = g.pct + '%';
    track.appendChild(fill);
    const val = document.createElement('div'); val.className = 'gc-val'; val.textContent = g.val;
    row.appendChild(period); row.appendChild(track); row.appendChild(val);
    wrap.appendChild(row);
  });
}

function buildHistory() {
  const table = document.getElementById('historyTable');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  ['الربع','قيمة المحفظة','الإيداعات','العوائد المحققة','نسبة العائد'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  HISTORY.forEach(h => {
    const tr = document.createElement('tr');
    const tdP = document.createElement('td'); tdP.textContent = h.period;
    const tdV = document.createElement('td'); tdV.className = 'val-col'; tdV.textContent = h.value;
    const tdD = document.createElement('td'); tdD.textContent = h.deposits;
    const tdR = document.createElement('td'); tdR.textContent = h.returns;
    const tdPct = document.createElement('td'); tdPct.className = 'return-col ' + h.cls; tdPct.textContent = h.ret_pct;
    tr.appendChild(tdP); tr.appendChild(tdV); tr.appendChild(tdD); tr.appendChild(tdR); tr.appendChild(tdPct);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function exportHistory() {
  fetch('/app/me/portfolio-history/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير تاريخ المحفظة...');
}

buildGrowth(); buildHistory();
</script>
</body>
</html>
