<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحليلات الإحالات - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.hero-card{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:14px;padding:2rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;}
.hc-code{}
.hc-lbl{font-size:0.75rem;color:rgba(255,255,255,0.7);margin-bottom:0.3rem;}
.hc-code-box{background:rgba(255,255,255,0.15);border-radius:8px;padding:0.5rem 1rem;font-size:1.1rem;font-weight:700;letter-spacing:0.1em;}
.hc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;text-align:center;}
.hs-val{font-size:1.4rem;font-weight:700;color:#b8e6cf;}
.hs-lbl{font-size:0.7rem;color:rgba(255,255,255,0.7);margin-top:0.15rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.referral-table{padding:1.25rem;overflow-x:auto;}
.rt-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0.5rem;padding:0.6rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;align-items:center;}
.rt-row:last-child{border-bottom:none;}
.rt-header{font-weight:700;font-size:0.75rem;color:var(--muted);}
.ref-pill{display:inline-block;padding:0.1rem 0.5rem;border-radius:8px;font-size:0.68rem;font-weight:700;}
.pill-active{background:#e8f5ed;color:#1e8449;}
.pill-pending{background:#fef3cd;color:#92400e;}
.pill-paid{background:#e8f0fe;color:#1a56c4;}
.earnings-list{padding:1.25rem;}
.earn-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.earn-row:last-child{border-bottom:none;}
.earn-desc{font-weight:700;}
.earn-date{color:var(--muted);font-size:0.72rem;}
.earn-amount{color:var(--green);font-weight:700;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.hc-stats{grid-template-columns:1fr 1fr;}.rt-row{grid-template-columns:2fr 1fr 1fr;}.rt-row>:nth-child(4){display:none;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — تحليلات الإحالات</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>تحليلات برنامج الإحالة</h2>
      <p>تابع إحالاتك وأرباحك من برنامج "أحل واربح" في مُرابحة</p>
    </div>
    <button class="btn btn-primary" onclick="shareCode()">مشاركة الرمز</button>
  </div>

  <div class="hero-card">
    <div class="hc-code">
      <div class="hc-lbl">رمز الإحالة الخاص بك</div>
      <div class="hc-code-box">MURA-F4Y8K</div>
    </div>
    <div class="hc-stats">
      <div>
        <div class="hs-val">١٢</div>
        <div class="hs-lbl">إجمالي الإحالات</div>
      </div>
      <div>
        <div class="hs-val">٨</div>
        <div class="hs-lbl">مستثمرون نشطون</div>
      </div>
      <div>
        <div class="hs-val">١,٨٠٠ ر.س</div>
        <div class="hs-lbl">إجمالي الأرباح</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>قائمة الإحالات</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportReferrals()">تصدير</button>
    </div>
    <div class="referral-table" id="referralTable"></div>
  </div>

  <div class="card">
    <div class="card-head"><h3>سجل الأرباح</h3></div>
    <div class="earnings-list" id="earningsList"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="withdrawEarnings()">سحب الأرباح</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="exportReferrals()">تصدير</button>
    </div>
  </div>
</div>

<script>
const REFERRALS = [
  { name: 'خالد المنصور', date: '١ مارس ٢٠٢٦', invested: '٥٠,٠٠٠ ر.س', pill: 'pill-active', label: 'نشط' },
  { name: 'نورة الشهري', date: '١٥ فبراير ٢٠٢٦', invested: '٣٠,٠٠٠ ر.س', pill: 'pill-active', label: 'نشط' },
  { name: 'سعود العمر', date: '٢٨ يناير ٢٠٢٦', invested: '—', pill: 'pill-pending', label: 'معلّق' },
  { name: 'لينا القريني', date: '١٠ يناير ٢٠٢٦', invested: '٨٠,٠٠٠ ر.س', pill: 'pill-active', label: 'نشط' }
];

const EARNINGS = [
  { desc: 'مكافأة إحالة — خالد المنصور', date: '١٥ مارس ٢٠٢٦', amount: '+٥٠٠ ر.س' },
  { desc: 'مكافأة إحالة — نورة الشهري', date: '١ مارس ٢٠٢٦', amount: '+٣٠٠ ر.س' },
  { desc: 'مكافأة إحالة — لينا القريني', date: '٢٥ يناير ٢٠٢٦', amount: '+٨٠٠ ر.س' },
  { desc: 'مكافأة بونص — ١٠ إحالات', date: '١٠ فبراير ٢٠٢٦', amount: '+٢٠٠ ر.س' }
];

function buildTable() {
  const wrap = document.getElementById('referralTable');
  const header = document.createElement('div'); header.className = 'rt-row rt-header';
  ['الاسم', 'تاريخ الانضمام', 'المبلغ المستثمر', 'الحالة'].forEach(h => {
    const cell = document.createElement('div'); cell.textContent = h; header.appendChild(cell);
  });
  wrap.appendChild(header);
  REFERRALS.forEach(r => {
    const row = document.createElement('div'); row.className = 'rt-row';
    const name = document.createElement('div'); name.style.fontWeight = '700'; name.textContent = r.name;
    const date = document.createElement('div'); date.style.color = 'var(--muted)'; date.textContent = r.date;
    const inv = document.createElement('div'); inv.textContent = r.invested;
    const pill = document.createElement('span'); pill.className = 'ref-pill ' + r.pill; pill.textContent = r.label;
    row.appendChild(name); row.appendChild(date); row.appendChild(inv); row.appendChild(pill);
    wrap.appendChild(row);
  });
}

function buildEarnings() {
  const wrap = document.getElementById('earningsList');
  EARNINGS.forEach(e => {
    const row = document.createElement('div'); row.className = 'earn-row';
    const left = document.createElement('div');
    const desc = document.createElement('div'); desc.className = 'earn-desc'; desc.textContent = e.desc;
    const date = document.createElement('div'); date.className = 'earn-date'; date.textContent = e.date;
    left.appendChild(desc); left.appendChild(date);
    const amount = document.createElement('div'); amount.className = 'earn-amount'; amount.textContent = e.amount;
    row.appendChild(left); row.appendChild(amount);
    wrap.appendChild(row);
  });
}

function shareCode() {
  fetch('/app/me/referral-analytics/share', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'share' }) }).catch(() => {});
  alert('تم نسخ رمز الإحالة. شاركه مع أصدقائك!');
}

function withdrawEarnings() {
  fetch('/app/me/referral-analytics/withdraw', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'withdraw' }) }).catch(() => {});
  alert('جاري سحب أرباح الإحالة إلى محفظتك...');
}

function exportReferrals() {
  fetch('/app/me/referral-analytics/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير تقرير الإحالات...');
}

buildTable(); buildEarnings();
</script>
</body>
</html>
