<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>كشف شهري — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d1612; --paper: #fbf6ea; --green-dark: #062b1e; --green: #0a4d36;
    --gold: #b08840; --muted: #6b7268; --line: rgba(13,22,18,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal',system-ui,sans-serif; background: var(--paper); color: var(--ink); padding: 22px; }
  .actions { max-width: 880px; margin: 0 auto 14px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .actions a { font: 800 12px Cairo,sans-serif; color: var(--green-dark); text-decoration: none; }
  .actions .right { display: flex; gap: 8px; align-items: center; }
  .actions input { padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; font: 700 14px Cairo,sans-serif; color: var(--green-dark); background: #fff; }
  .actions button { background: var(--green-dark); color: #d4ac6e; border: 0; border-radius: 10px; padding: 10px 18px; font: 800 13px Cairo,sans-serif; cursor: pointer; }
  .page { max-width: 880px; margin: 0 auto; background: #fff; padding: 38px 42px; border-radius: 14px; box-shadow: 0 4px 14px rgba(13,22,18,0.06); }
  .hdr { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; border-bottom: 2px solid var(--green-dark); margin-bottom: 22px; }
  .hdr .brand { font: 900 22px Cairo,sans-serif; color: var(--green-dark); }
  .hdr .brand small { display: block; font: 600 11px Tajawal,sans-serif; color: var(--muted); margin-top: 2px; }
  .hdr .meta { text-align: end; font: 600 11px Tajawal,sans-serif; color: var(--muted); line-height: 1.7; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi { padding: 14px; border-radius: 12px; text-align: center; }
  .kpi.dep { background: linear-gradient(135deg,#0a4d36,#062b1e); color: #d4ac6e; }
  .kpi.inv { background: linear-gradient(135deg,#b08840,#8a6a30); color: #fff; }
  .kpi.prf { background: linear-gradient(135deg,#0f6e3a,#0a4d36); color: #fff; }
  .kpi.wdr { background: #fff; border: 1px solid var(--line); color: var(--green-dark); }
  .kpi .v { font: 900 18px Cairo,sans-serif; }
  .kpi .l { font: 600 10px Tajawal,sans-serif; margin-top: 4px; opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 14px; }
  th, td { padding: 9px 8px; text-align: start; border-bottom: 1px solid var(--line); }
  th { background: rgba(10,77,54,0.06); font: 800 12px Cairo,sans-serif; color: var(--green-dark); }
  td.num { font-variant-numeric: tabular-nums; }
  td.kind { font: 700 11px Cairo,sans-serif; }
  td.kind.deposit { color: #0f6e3a; }
  td.kind.withdraw { color: var(--gold); }
  td.kind.profit { color: var(--green-dark); }
  .empty { padding: 30px; text-align: center; color: var(--muted); font: 500 13px Tajawal,sans-serif; }
  @media print {
    body { background: #fff; padding: 0; }
    .actions { display: none; }
    .page { box-shadow: none; border-radius: 0; padding: 22px 28px; }
  }
</style>
</head>
<body>
<div class="actions">
  <a href="/profile.html">← العودة</a>
  <div class="right">
    <input id="monthPicker" type="month" />
    <button type="button" id="printBtn">🖨 طباعة / PDF</button>
  </div>
</div>

<div class="page">
  <div class="hdr">
    <div class="brand">مُرابحة<small>كشف الحساب الشهري</small></div>
    <div class="meta">
      <div id="periodLbl">—</div>
      <div id="userLbl">—</div>
      <div id="genLbl"></div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi dep"><div class="v" id="kDep">٠</div><div class="l">إيداعات</div></div>
    <div class="kpi inv"><div class="v" id="kInv">٠</div><div class="l">استثمارات</div></div>
    <div class="kpi prf"><div class="v" id="kPrf">٠</div><div class="l">أرباح موزّعة</div></div>
    <div class="kpi wdr"><div class="v" id="kWdr">٠</div><div class="l">سحوبات</div></div>
  </div>

  <h2 style="font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:6px;">المعاملات</h2>
  <table>
    <thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ (ر.س)</th><th>الحالة</th><th>الوصف</th></tr></thead>
    <tbody id="txnBody"><tr><td colspan="5" class="empty">جاري التحميل…</td></tr></tbody>
  </table>
</div>
<script src="/app.js" defer></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString('ar-SA');
  const KIND_AR = { deposit: 'إيداع', withdraw: 'سحب', profit: 'ربح', payout: 'توزيع', invest: 'استثمار', refund: 'استرداد' };
  const today = new Date().toISOString().slice(0, 7);
  const picker = $('monthPicker');
  picker.value = today;
  picker.max = today;

  $('printBtn').addEventListener('click', () => window.print());

  const load = async (month) => {
    try {
      const me = await App.me();
      if (!me) { location.href = '/login.html?next=/monthly-statement.html'; return; }
      $('userLbl').textContent = me.name + ' · ' + me.email;
      $('genLbl').textContent = 'صدر في ' + new Date().toLocaleString('ar-SA');
      const r = await App.api('GET', '/app/me/monthly-statement?month=' + encodeURIComponent(month));
      $('periodLbl').textContent = 'الفترة: ' + r.month;
      $('kDep').textContent = fmt(r.deposits.total);
      $('kInv').textContent = fmt(r.investments.total);
      $('kPrf').textContent = fmt(r.profits.total);
      $('kWdr').textContent = fmt(r.withdrawals.total);
      const body = $('txnBody');
      body.replaceChildren();
      if (!r.transactions.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td'); td.colSpan = 5; td.className = 'empty';
        td.textContent = 'لا توجد معاملات في هذا الشهر.';
        tr.appendChild(td); body.appendChild(tr); return;
      }
      r.transactions.forEach(t => {
        const tr = document.createElement('tr');
        const cells = [
          new Date(t.createdAt).toLocaleDateString('ar-SA'),
          KIND_AR[t.kind] || (t.kind || '—'),
          fmt(Math.abs(t.amount || 0)),
          t.status || '—',
          (t.description || t.methodLabel || '').slice(0, 80),
        ];
        cells.forEach((c, i) => {
          const td = document.createElement('td');
          if (i === 2) td.className = 'num';
          if (i === 1) td.className = 'kind ' + (t.kind || '');
          td.textContent = c;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    } catch (e) {
      $('txnBody').replaceChildren();
      const tr = document.createElement('tr');
      const td = document.createElement('td'); td.colSpan = 5; td.className = 'empty'; td.textContent = 'تعذّر التحميل';
      tr.appendChild(td); $('txnBody').appendChild(tr);
    }
  };
  picker.addEventListener('change', () => load(picker.value));
  load(today);
})();
</script>
</body>
</html>
