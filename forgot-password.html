<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>استعادة كلمة المرور — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="app.js"></script>
<style>
:root {
  --ink: #0d1612; --paper: #fbf6ea; --paper-2: #efe8d6;
  --green: #0a4d36; --green-dark: #062b1e;
  --gold: #b08840; --muted: #6b7268;
  --line: rgba(13,22,18,0.10); --line-strong: rgba(13,22,18,0.20);
  --red: #b54935;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body {
  font-family: 'Tajawal', 'Geeza Pro', system-ui, sans-serif;
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  min-height: 100vh; color: var(--ink); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 18px;
}
.card {
  width: 100%; max-width: 420px; background: #fff;
  border-radius: 20px; border: 1.5px solid var(--line);
  padding: 28px 24px; box-shadow: 0 12px 36px rgba(13,22,18,0.06);
}
.logo {
  width: 64px; height: 64px; border-radius: 16px; background: var(--green-dark);
  color: #d4ac6e; display: flex; align-items: center; justify-content: center;
  font: 900 32px 'Cairo', sans-serif; margin: 0 auto 16px;
}
h1 { font: 800 22px 'Cairo', sans-serif; color: var(--green-dark); text-align: center; margin-bottom: 6px; }
.lede { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 22px; }
label { display: block; font: 700 13px 'Cairo', sans-serif; color: var(--ink); margin-bottom: 6px; }
input[type=email] {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line-strong);
  border-radius: 12px; font: 500 15px 'Tajawal', sans-serif; background: var(--paper);
  direction: ltr; text-align: start;
}
input[type=email]:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(10,77,54,0.1); }
.btn {
  width: 100%; padding: 14px 22px; margin-top: 16px;
  background: var(--green); color: var(--paper); border: 0; border-radius: 12px;
  font: 800 15px 'Cairo', sans-serif; cursor: pointer; min-height: 48px;
  box-shadow: 0 4px 14px rgba(10,77,54,0.25);
  transition: transform .1s, background .2s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.success {
  margin-top: 18px; padding: 14px 16px; border-radius: 12px;
  background: rgba(15,110,58,0.08); border: 1px solid rgba(15,110,58,0.20);
  color: #0f6e3a; font-size: 14px; line-height: 1.7;
}
.error { margin-top: 10px; color: var(--red); font: 700 13px 'Tajawal', sans-serif; text-align: center; }
.back {
  display: block; text-align: center; margin-top: 18px;
  color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 600;
}
</style>
</head>
<body>
<main class="card" id="main">
  <div class="logo">م</div>
  <h1>استعادة كلمة المرور</h1>
  <p class="lede">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>

  <form id="forgotForm" autocomplete="on">
    <label for="emailInput">البريد الإلكتروني</label>
    <input type="email" id="emailInput" name="email" autocomplete="email" required placeholder="you@example.com" />
    <div class="error" id="errorMsg" style="display:none;"></div>
    <button type="submit" class="btn" id="submitBtn">إرسال رابط الاستعادة</button>
  </form>

  <div class="success" id="successMsg" style="display:none;">
    تم إرسال البريد الإلكتروني. تحقق من صندوق الوارد وانقر على الرابط لاختيار كلمة مرور جديدة. الرابط صالح لمدة ساعة.
  </div>

  <a href="login.html" class="back">← العودة إلى تسجيل الدخول</a>
</main>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال…';
  try {
    await App.api('POST', '/app/auth/forgot-password', { email });
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (e2) {
    err.textContent = e2.message || 'تعذّر الإرسال. حاول لاحقاً.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'إرسال رابط الاستعادة';
  }
});
</script>
</body>
</html>
