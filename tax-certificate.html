<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>شهادة الزكاة والضريبة — مُرابحة</title>
<meta name="description" content="احصل على شهادة الزكاة والضريبة السنوية لاستثماراتك في مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .year-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .year-btn{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 18px;font:700 11px Cairo,sans-serif;color:var(--muted);cursor:pointer;}
  .year-btn.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;}
  .kpi-val{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .cert-card{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:28px;margin-bottom:18px;}
  .cert-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
  .cert-logo{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .cert-title-block{text-align:center;flex:1;}
  .cert-title{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .cert-sub{font:500 12px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .cert-year-badge{background:var(--gold);color:#fff;border-radius:8px;padding:4px 12px;font:900 13px Cairo,sans-serif;}
  .cert-divider{border:none;border-top:1px dashed var(--gold);margin:16px 0;}
  .cert-rows{display:grid;gap:0;}
  .cert-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .cert-row:last-child{border-bottom:none;}
  .cert-row-label{font:700 12px Cairo,sans-serif;color:var(--muted);}
  .cert-row-value{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .cert-footer{margin-top:20px;text-align:center;}
  .cert-stamp{background:var(--paper);border:2px solid var(--green);border-radius:12px;display:inline-block;padding:8px 24px;}
  .cert-stamp-txt{font:900 13px Cairo,sans-serif;color:var(--green);}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .btn-dl{background:var(--green);color:#fbf6ea;border:none;border-radius:10px;padding:11px 24px;font:700 13px Cairo,sans-serif;cursor:pointer;}
  .btn-print{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 24px;font:700 13px Cairo,sans-serif;cursor:pointer;color:var(--green-dark);}
  .disclaimer{background:var(--paper);border-radius:10px;padding:14px;font:500 11px Tajawal,sans-serif;color:var(--muted);line-height:1.8;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  @media print{
    .hero,.year-row,.actions,.disclaimer{display:none!important;}
    .cert-card{border:2px solid #b08840;box-shadow:none;}
    main{padding:0;}
  }
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1>📄 شهادة الزكاة والضريبة</h1>
    <p>وثيقة رسمية تُلخّص دخل استثماراتك السنوي. صالحة للاستخدام مع هيئة الزكاة والضريبة والجمارك.</p>
  </div>

  <div class="year-row" id="yearRow"></div>

  <div class="summary-grid" id="summaryGrid"><p class="placeholder-msg">جارٍ التحميل…</p></div>

  <div class="actions">
    <button class="btn-dl" id="btnPdf">⬇ تحميل PDF</button>
    <button class="btn-print" id="btnPrint">🖨 طباعة</button>
  </div>

  <div id="certArea"><p class="placeholder-msg">جارٍ التحميل…</p></div>

  <div class="disclaimer">
    <strong>تنبيه:</strong> هذه الوثيقة للأغراض الإعلامية فقط. يُنصح بمراجعة مستشار ضريبي معتمد لتأكيد الالتزامات الزكوية والضريبية.
  </div>
</main>
<script>
(function(){
  let activeYear = new Date().getFullYear()-1;

  function fmt(n){ return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function renderSummary(d){
    const grid=document.getElementById('summaryGrid'); grid.textContent='';
    [
      {val:fmt(d.totalInvested)+' ر.س',lbl:'إجمالي المستثمر'},
      {val:fmt(d.totalReturn)+' ر.س',lbl:'إجمالي العائد'},
      {val:fmt(d.zakatBase)+' ر.س',lbl:'وعاء الزكاة التقديري'},
      {val:fmt(d.zakatDue)+' ر.س',lbl:'الزكاة المستحقة (2.5٪)'},
    ].forEach(it=>{
      const k=document.createElement('div'); k.className='kpi';
      const v=document.createElement('div'); v.className='kpi-val'; v.textContent=it.val;
      const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=it.lbl;
      k.appendChild(v); k.appendChild(l); grid.appendChild(k);
    });
  }

  function renderCert(d){
    const area=document.getElementById('certArea'); area.textContent='';
    const card=document.createElement('div'); card.className='cert-card';

    const hdr=document.createElement('div'); hdr.className='cert-header';
    const logo=document.createElement('div'); logo.className='cert-logo'; logo.textContent='مُرابحة';
    const tb=document.createElement('div'); tb.className='cert-title-block';
    const title=document.createElement('div'); title.className='cert-title'; title.textContent='شهادة الدخل الاستثماري السنوي';
    const sub=document.createElement('div'); sub.className='cert-sub'; sub.textContent='للسنة الميلادية '+activeYear+' م';
    tb.appendChild(title); tb.appendChild(sub);
    const yb=document.createElement('div'); yb.className='cert-year-badge'; yb.textContent=activeYear;
    hdr.appendChild(logo); hdr.appendChild(tb); hdr.appendChild(yb);
    card.appendChild(hdr);

    const divider=document.createElement('hr'); divider.className='cert-divider'; card.appendChild(divider);

    const rows=document.createElement('div'); rows.className='cert-rows';
    const rowData=[
      ['اسم المستثمر', d.investorName||'—'],
      ['رقم الهوية / الإقامة', d.nationalId||'—'],
      ['تاريخ الإصدار', new Date().toLocaleDateString('ar-SA')],
      ['الفترة المالية', '1 يناير '+activeYear+' – 31 ديسمبر '+activeYear],
      ['إجمالي المبالغ المستثمرة', fmt(d.totalInvested)+' ر.س'],
      ['إجمالي العائد المحقّق', fmt(d.totalReturn)+' ر.س'],
      ['عدد الصفقات المشارك فيها', (d.dealCount||0)+' صفقة'],
      ['وعاء الزكاة التقديري', fmt(d.zakatBase)+' ر.س'],
      ['الزكاة المستحقة (2.575٪)', fmt(d.zakatDue)+' ر.س'],
    ];
    rowData.forEach(([label,val])=>{
      const row=document.createElement('div'); row.className='cert-row';
      const lbl=document.createElement('div'); lbl.className='cert-row-label'; lbl.textContent=label;
      const v=document.createElement('div'); v.className='cert-row-value'; v.textContent=val;
      row.appendChild(lbl); row.appendChild(v); rows.appendChild(row);
    });
    card.appendChild(rows);

    const footer=document.createElement('div'); footer.className='cert-footer';
    const stamp=document.createElement('div'); stamp.className='cert-stamp';
    const stampTxt=document.createElement('div'); stampTxt.className='cert-stamp-txt'; stampTxt.textContent='✓ صادرة إلكترونياً من مُرابحة';
    stamp.appendChild(stampTxt); footer.appendChild(stamp); card.appendChild(footer);
    area.appendChild(card);
  }

  async function load(){
    const area=document.getElementById('certArea'); area.textContent='';
    const loading=document.createElement('p'); loading.className='placeholder-msg'; loading.textContent='جارٍ التحميل…';
    area.appendChild(loading);
    try{
      const r=await fetch('/app/me/tax-certificate?year='+activeYear);
      if(!r.ok){ area.textContent=''; const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent=r.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.'; area.appendChild(m); return; }
      const d=await r.json();
      renderSummary(d); renderCert(d);
    }catch{ area.textContent=''; const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='تعذّر التحميل. حاول لاحقاً.'; area.appendChild(m); }
  }

  function buildYearRow(){
    const row=document.getElementById('yearRow');
    const cy=new Date().getFullYear();
    for(let y=cy-1;y>=cy-4;y--){
      const btn=document.createElement('button'); btn.className='year-btn'+(y===activeYear?' active':'');
      btn.textContent=y+' م';
      btn.addEventListener('click',()=>{
        activeYear=y;
        row.querySelectorAll('.year-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        load();
      });
      row.appendChild(btn);
    }
  }

  document.getElementById('btnPdf').addEventListener('click',()=>{ window.open('/app/me/tax-certificate/'+activeYear+'/pdf','_blank'); });
  document.getElementById('btnPrint').addEventListener('click',()=>window.print());

  buildYearRow(); load();
}());
</script>
</body>
</html>
