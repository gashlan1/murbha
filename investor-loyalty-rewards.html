<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكافآت الولاء - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.tier-card{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:16px;padding:2rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.tier-info h3{font-size:1.1rem;font-weight:700;margin-bottom:0.3rem;}
.tier-info p{font-size:0.82rem;color:rgba(255,255,255,0.75);}
.tier-badge{background:var(--gold);color:#fff;border-radius:10px;padding:0.4rem 1rem;font-weight:700;font-size:0.9rem;}
.points-display{text-align:center;}
.points-val{font-size:2.5rem;font-weight:700;color:#b8e6cf;}
.points-lbl{font-size:0.75rem;color:rgba(255,255,255,0.7);}
.progress-wrap{margin-top:1rem;}
.progress-lbl{display:flex;justify-content:space-between;font-size:0.72rem;color:rgba(255,255,255,0.7);margin-bottom:0.4rem;}
.progress-bar{height:8px;border-radius:4px;background:rgba(255,255,255,0.2);}
.progress-fill{height:100%;border-radius:4px;background:var(--gold);}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;padding:1.25rem;}
.reward-item{border:1px solid var(--line);border-radius:10px;padding:1rem;text-align:center;}
.rw-icon{font-size:1.8rem;margin-bottom:0.4rem;}
.rw-title{font-size:0.82rem;font-weight:700;}
.rw-points{font-size:0.72rem;color:var(--gold);font-weight:700;margin-top:0.2rem;}
.rw-btn{margin-top:0.6rem;width:100%;padding:0.3rem;border-radius:6px;border:1px solid var(--gold);background:#fff;color:var(--gold);font-family:'Cairo',sans-serif;font-size:0.75rem;font-weight:600;cursor:pointer;}
.rw-btn:hover{background:var(--gold);color:#fff;}
.activity-list{padding:1.25rem;}
.act-row{display:flex;justify-content:space-between;align-items:center;padding:0.55rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.act-row:last-child{border-bottom:none;}
.act-desc{color:var(--muted);}
.act-pts{font-weight:700;color:var(--green);}
.act-pts.neg{color:#c0392b;}
@media(max-width:800px){.layout-2{grid-template-columns:1fr;}.reward-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — مكافآت الولاء</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>برنامج مكافآت الولاء</h2>
      <p>اكسب نقاط على كل استثمار واستبدلها بمزايا حصرية ومكافآت مالية</p>
    </div>
  </div>

  <div class="tier-card" id="tierCard"></div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>المكافآت المتاحة</h3></div>
      <div class="reward-grid" id="rewardGrid"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>سجل النقاط</h3></div>
      <div class="activity-list" id="activityList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>مستويات البرنامج</h3></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1.25rem;" id="tiersGrid"></div>
  </div>
</div>

<script>
const USER = { name: 'أحمد العمري', tier: 'ذهبي', points: 4820, nextTier: 'بلاتيني', needed: 5000 };

const REWARDS = [
  { icon: '💰', title: 'خصم ٠.١٪ على الرسوم', points: '٥٠٠ نقطة' },
  { icon: '📊', title: 'تقرير تحليلي مخصص', points: '٣٠٠ نقطة' },
  { icon: '🎯', title: 'أولوية في الصفقات القادمة', points: '١,٠٠٠ نقطة' },
  { icon: '🌟', title: 'ترقية مؤقتة لباقة احترافية', points: '٢,٠٠٠ نقطة' }
];

const ACTIVITY = [
  { desc: 'استثمار في مرابحة عقارية #4920', pts: '+٢٤٠', neg: false },
  { desc: 'تجديد الاشتراك السنوي', pts: '+٥٠٠', neg: false },
  { desc: 'استكمال التوثيق KYC', pts: '+٢٠٠', neg: false },
  { desc: 'استبدال مكافأة: تقرير تحليلي', pts: '-٣٠٠', neg: true },
  { desc: 'استثمار في مرابحة تجارية #4921', pts: '+١٨٠', neg: false }
];

const TIERS = [
  { name: 'فضي', min: '٠', max: '٢,٠٠٠', color: '#aaa' },
  { name: 'ذهبي', min: '٢,٠٠١', max: '٥,٠٠٠', color: '#b08840' },
  { name: 'بلاتيني', min: '٥,٠٠١', max: '١٠,٠٠٠', color: '#5aab7a' },
  { name: 'ماسي', min: '١٠,٠٠١', max: '∞', color: '#062b1e' }
];

function buildTierCard() {
  const wrap = document.getElementById('tierCard');
  const info = document.createElement('div'); info.className = 'tier-info';
  const h3 = document.createElement('h3'); h3.textContent = 'مرحباً، ' + USER.name;
  const badge = document.createElement('span'); badge.className = 'tier-badge'; badge.textContent = 'مستوى ' + USER.tier;
  const p = document.createElement('p'); p.textContent = 'تحتاج ' + (USER.needed - USER.points).toLocaleString() + ' نقطة للوصول إلى مستوى ' + USER.nextTier;
  h3.appendChild(document.createTextNode(' ')); h3.appendChild(badge);
  info.appendChild(h3); info.appendChild(p);
  const ptsWrap = document.createElement('div'); ptsWrap.className = 'points-display';
  const ptsVal = document.createElement('div'); ptsVal.className = 'points-val'; ptsVal.textContent = USER.points.toLocaleString('ar-SA');
  const ptsLbl = document.createElement('div'); ptsLbl.className = 'points-lbl'; ptsLbl.textContent = 'نقطة مُتراكمة';
  const progWrap = document.createElement('div'); progWrap.className = 'progress-wrap';
  const progLbl = document.createElement('div'); progLbl.className = 'progress-lbl';
  const l1 = document.createElement('span'); l1.textContent = 'ذهبي';
  const l2 = document.createElement('span'); l2.textContent = 'بلاتيني';
  progLbl.appendChild(l1); progLbl.appendChild(l2);
  const bar = document.createElement('div'); bar.className = 'progress-bar';
  const fill = document.createElement('div'); fill.className = 'progress-fill'; fill.style.width = Math.round(USER.points / USER.needed * 100) + '%';
  bar.appendChild(fill);
  progWrap.appendChild(progLbl); progWrap.appendChild(bar);
  ptsWrap.appendChild(ptsVal); ptsWrap.appendChild(ptsLbl); ptsWrap.appendChild(progWrap);
  wrap.appendChild(info); wrap.appendChild(ptsWrap);
}

function buildRewards() {
  const wrap = document.getElementById('rewardGrid');
  REWARDS.forEach((r, i) => {
    const item = document.createElement('div'); item.className = 'reward-item';
    const icon = document.createElement('div'); icon.className = 'rw-icon'; icon.textContent = r.icon;
    const title = document.createElement('div'); title.className = 'rw-title'; title.textContent = r.title;
    const pts = document.createElement('div'); pts.className = 'rw-points'; pts.textContent = r.points;
    const btn = document.createElement('button'); btn.className = 'rw-btn'; btn.textContent = 'استبدال';
    btn.onclick = () => redeemReward(i);
    item.appendChild(icon); item.appendChild(title); item.appendChild(pts); item.appendChild(btn);
    wrap.appendChild(item);
  });
}

function buildActivity() {
  const wrap = document.getElementById('activityList');
  ACTIVITY.forEach(a => {
    const row = document.createElement('div'); row.className = 'act-row';
    const desc = document.createElement('div'); desc.className = 'act-desc'; desc.textContent = a.desc;
    const pts = document.createElement('div'); pts.className = 'act-pts' + (a.neg ? ' neg' : ''); pts.textContent = a.pts;
    row.appendChild(desc); row.appendChild(pts);
    wrap.appendChild(row);
  });
}

function buildTiers() {
  const wrap = document.getElementById('tiersGrid');
  TIERS.forEach(t => {
    const card = document.createElement('div'); card.style.cssText = 'background:#fff;border-radius:10px;border:2px solid ' + t.color + ';padding:1rem;text-align:center;';
    const name = document.createElement('div'); name.style.cssText = 'font-weight:700;color:' + t.color + ';margin-bottom:0.4rem;'; name.textContent = t.name;
    const range = document.createElement('div'); range.style.cssText = 'font-size:0.72rem;color:var(--muted);'; range.textContent = t.min + ' – ' + t.max + ' نقطة';
    card.appendChild(name); card.appendChild(range);
    wrap.appendChild(card);
  });
}

function redeemReward(idx) {
  fetch('/app/me/loyalty-rewards/redeem', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ rewardIdx: idx }) }).catch(() => {});
  alert('تم طلب استبدال: ' + REWARDS[idx].title);
}

buildTierCard(); buildRewards(); buildActivity(); buildTiers();
</script>
</body>
</html>
