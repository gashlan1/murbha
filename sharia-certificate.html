<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>شهادة الشريعة — مُرابحة</title>
<meta name="description" content="شهادة الامتثال الشرعي لصفقاتك: مراجعة هيئة الرقابة، حالة الاعتماد، واسم المرجع الفقهي." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .deal-select-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .deal-select-lbl{font:700 12px Cairo,sans-serif;color:var(--green-dark);white-space:nowrap;}
  .deal-select{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:500 12px Tajawal,sans-serif;background:#fff;}
  .btn-print{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:9px 20px;font:700 12px Cairo,sans-serif;cursor:pointer;}
  .btn-print:hover{background:var(--green);}
  /* Certificate card */
  .cert-card{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:36px;position:relative;margin-bottom:20px;}
  .cert-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.04;font:900 96px Cairo,sans-serif;color:var(--green-dark);transform:rotate(-25deg);user-select:none;}
  .cert-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .cert-logo{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .cert-logo span{color:var(--gold);}
  .cert-no{font:500 11px Tajawal,sans-serif;color:var(--muted);text-align:end;}
  .cert-title{text-align:center;margin-bottom:24px;}
  .cert-title h2{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .cert-title p{font:500 12px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .cert-stamp{display:inline-block;background:#e8f5e9;border:2px solid #66bb6a;border-radius:50%;width:72px;height:72px;line-height:72px;text-align:center;font-size:32px;margin-bottom:14px;}
  .cert-body{display:grid;gap:14px;margin-bottom:24px;}
  .cert-row{display:flex;gap:14px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px;}
  .cert-row:last-child{border-bottom:none;padding-bottom:0;}
  .cert-key{font:700 11px Cairo,sans-serif;color:var(--muted);flex-shrink:0;min-width:160px;}
  .cert-val{font:500 13px Tajawal,sans-serif;color:var(--ink);}
  .cert-val.gold{color:var(--gold);font-weight:700;}
  .cert-val.green{color:var(--green-dark);font-weight:700;}
  .cert-footer{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
  .cert-sig{text-align:center;}
  .cert-sig-line{width:120px;border-bottom:1px solid var(--ink);margin:0 auto 4px;}
  .cert-sig-name{font:700 11px Cairo,sans-serif;color:var(--green-dark);}
  .cert-sig-role{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .cert-qr-placeholder{width:60px;height:60px;background:var(--paper);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;}
  /* Conditions */
  .conditions-section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
  .conditions-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .condition-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .condition-row:last-child{border-bottom:none;padding-bottom:0;}
  .cond-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
  .cond-body{flex:1;}
  .cond-title{font:700 12px Cairo,sans-serif;color:var(--ink);}
  .cond-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:2px;line-height:1.6;}
  /* Placeholder / loading */
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
  @media print{
    .hero,.deal-select-row,.btn-print,.toast{display:none!important;}
    body{background:#fff;}
    main{padding:0;max-width:100%;}
    .cert-card{border:2px solid #b08840;box-shadow:none;}
    .conditions-section{box-shadow:none;}
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>📜 شهادة الامتثال الشرعي</h1>
    <p>شهادة معتمدة من هيئة الرقابة الشرعية تُثبت أن صفقتك متوافقة مع أحكام الشريعة الإسلامية.</p>
  </div>

  <div class="deal-select-row">
    <span class="deal-select-lbl">اختر الصفقة:</span>
    <select class="deal-select" id="dealSelect"><option value="">— اختر صفقة —</option></select>
    <button class="btn-print" id="printBtn" style="display:none" onclick="window.print()">🖨️ طباعة الشهادة</button>
  </div>

  <div id="certArea"><p class="placeholder-msg">اختر صفقة لعرض الشهادة.</p></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

  function renderCert(c){
    const area=document.getElementById('certArea'); area.textContent='';
    document.getElementById('printBtn').style.display='';

    /* ── Certificate card ── */
    const card=document.createElement('div'); card.className='cert-card';

    const wm=document.createElement('div'); wm.className='cert-watermark'; wm.textContent='مُرابحة'; card.appendChild(wm);

    const hdr=document.createElement('div'); hdr.className='cert-header';
    const logo=document.createElement('div'); logo.className='cert-logo';
    const logoSpan=document.createElement('span'); logoSpan.textContent='مُ'; logo.appendChild(logoSpan);
    logo.appendChild(document.createTextNode('رابحة'));
    const certNo=document.createElement('div'); certNo.className='cert-no';
    certNo.appendChild(document.createTextNode('رقم الشهادة: ')); certNo.appendChild(document.createTextNode(c.certificateNo||'—'));
    certNo.appendChild(document.createElement('br'));
    certNo.appendChild(document.createTextNode('تاريخ الإصدار: ')); certNo.appendChild(document.createTextNode(c.issuedAt||'—'));
    hdr.appendChild(logo); hdr.appendChild(certNo); card.appendChild(hdr);

    const titleBlock=document.createElement('div'); titleBlock.className='cert-title';
    const stamp=document.createElement('div'); stamp.className='cert-stamp'; stamp.textContent='✅';
    titleBlock.appendChild(stamp);
    const h2=document.createElement('h2'); h2.textContent='شهادة امتثال شرعي';
    const subp=document.createElement('p'); subp.textContent='صادرة عن هيئة الرقابة الشرعية — منصة مُرابحة';
    titleBlock.appendChild(h2); titleBlock.appendChild(subp); card.appendChild(titleBlock);

    const body=document.createElement('div'); body.className='cert-body';
    const fields=[
      {key:'اسم الصفقة',val:c.dealTitle||'—'},
      {key:'نوع المنتج',val:c.productType||'مرابحة'},
      {key:'القطاع',val:c.sector||'—'},
      {key:'قيمة الصفقة (ر.س)',val:Number(c.dealAmount||0).toLocaleString('ar-SA')},
      {key:'نسبة الربح',val:(c.yieldRate||'—')+'٪'},
      {key:'مدة الصفقة',val:c.tenor||'—'},
      {key:'المرجع الفقهي',val:c.scholarName||'—',cls:'green'},
      {key:'رقم القرار الشرعي',val:c.fatwaNo||'—'},
      {key:'تاريخ اعتماد الصفقة',val:c.approvedAt||'—'},
      {key:'حالة الامتثال',val:'متوافق شرعياً ✅',cls:'gold'},
    ];
    fields.forEach(f=>{
      const row=document.createElement('div'); row.className='cert-row';
      const k=document.createElement('div'); k.className='cert-key'; k.textContent=f.key;
      const v=document.createElement('div'); v.className='cert-val'+(f.cls?' '+f.cls:''); v.textContent=f.val;
      row.appendChild(k); row.appendChild(v); body.appendChild(row);
    });
    card.appendChild(body);

    const foot=document.createElement('div'); foot.className='cert-footer';
    const sigs=[{name:c.chairmanName||'رئيس الهيئة الشرعية',role:'رئيس هيئة الرقابة الشرعية'},{name:c.secretaryName||'أمين السر',role:'أمين سر الهيئة'}];
    sigs.forEach(s=>{
      const sig=document.createElement('div'); sig.className='cert-sig';
      const line=document.createElement('div'); line.className='cert-sig-line';
      const nm=document.createElement('div'); nm.className='cert-sig-name'; nm.textContent=s.name;
      const rl=document.createElement('div'); rl.className='cert-sig-role'; rl.textContent=s.role;
      sig.appendChild(line); sig.appendChild(nm); sig.appendChild(rl); foot.appendChild(sig);
    });
    const qr=document.createElement('div'); qr.className='cert-qr-placeholder'; qr.textContent='⬛'; foot.appendChild(qr);
    card.appendChild(foot);
    area.appendChild(card);

    /* ── Sharia conditions ── */
    if((c.conditions||[]).length){
      const sec=document.createElement('div'); sec.className='conditions-section';
      const ct=document.createElement('div'); ct.className='conditions-title'; ct.textContent='الشروط الشرعية المستوفاة';
      sec.appendChild(ct);
      c.conditions.forEach(cond=>{
        const row=document.createElement('div'); row.className='condition-row';
        const icon=document.createElement('div'); icon.className='cond-icon'; icon.textContent=cond.met?'✅':'⏳';
        const b=document.createElement('div'); b.className='cond-body';
        const t=document.createElement('div'); t.className='cond-title'; t.textContent=cond.title||'—';
        const d=document.createElement('div'); d.className='cond-desc'; d.textContent=cond.description||'';
        b.appendChild(t); b.appendChild(d); row.appendChild(icon); row.appendChild(b); sec.appendChild(row);
      });
      area.appendChild(sec);
    }
  }

  document.getElementById('dealSelect').addEventListener('change', async function(){
    const id=this.value;
    const area=document.getElementById('certArea'); area.textContent='';
    document.getElementById('printBtn').style.display='none';
    if(!id){ const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='اختر صفقة لعرض الشهادة.'; area.appendChild(m); return; }
    const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='جارٍ التحميل…'; area.appendChild(m);
    try{
      const r=await fetch('/app/me/sharia-certificate/'+encodeURIComponent(id));
      area.textContent='';
      if(!r.ok){ const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=r.status===404?'لا توجد شهادة لهذه الصفقة.':'تعذّر التحميل.'; area.appendChild(p); return; }
      const d=await r.json(); renderCert(d);
    }catch{ area.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent='تعذّر التحميل. حاول لاحقاً.'; area.appendChild(p); }
  });

  (async function loadDeals(){
    try{
      const r=await fetch('/app/me/investments?status=active');
      if(!r.ok) return;
      const d=await r.json();
      const sel=document.getElementById('dealSelect');
      (d.investments||[]).forEach(inv=>{
        const opt=document.createElement('option'); opt.value=inv.dealId||inv.id; opt.textContent=inv.dealTitle||inv.id;
        sel.appendChild(opt);
      });
    }catch{}
  }());
}());
</script>
</body>
</html>
