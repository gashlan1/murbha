<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="My Investment Plan — Murbha">خطتي الاستثمارية — مُرابحة</title>
<meta name="description" content="خطة استثمارية مخصصة بناءً على أهدافك المالية ومستوى تحملك للمخاطر." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:800px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:16px;}
  /* Risk profile banner */
  .risk-banner{border-radius:14px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .risk-conservative{background:#e8f5e9;border:1px solid #a5d6a7;}
  .risk-moderate{background:#fff8e1;border:1px solid #ffe082;}
  .risk-aggressive{background:#fdecea;border:1px solid #f8d7da;}
  .risk-icon{font:900 28px Cairo,sans-serif;}
  .risk-info{flex:1;}
  .risk-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .risk-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:3px;line-height:1.6;}
  /* Allocation chart */
  .alloc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .alloc-label{font:700 11px Cairo,sans-serif;color:var(--ink);width:110px;flex-shrink:0;text-align:right;}
  .alloc-bar-bg{flex:1;height:12px;background:#f0ece0;border-radius:6px;overflow:hidden;}
  .alloc-bar{height:100%;border-radius:6px;}
  .bar-sukuk{background:#2e7d32;}
  .bar-murabaha{background:#0a4d36;}
  .bar-equity{background:#b08840;}
  .bar-cash{background:#90a4ae;}
  .alloc-pct{font:900 11px Cairo,sans-serif;color:var(--green-dark);width:40px;text-align:left;flex-shrink:0;}
  /* Milestone list */
  .milestone{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
  .milestone:last-child{border-bottom:none;}
  .ms-num{background:var(--green-dark);color:#fbf6ea;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:900 12px Cairo,sans-serif;flex-shrink:0;margin-top:2px;}
  .ms-info{flex:1;}
  .ms-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);}
  .ms-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;line-height:1.6;}
  .ms-target{font:900 13px Cairo,sans-serif;color:var(--gold);text-align:left;white-space:nowrap;flex-shrink:0;}
  /* Recommended deals */
  .rec-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;}
  .rec-item:last-child{margin-bottom:0;}
  .rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .rec-name{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .rec-sector{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .rec-badge{background:#e8f5e9;color:#2e7d32;border-radius:5px;padding:3px 10px;font:700 9px Cairo,sans-serif;}
  .rec-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .rm{background:#f9f7f2;border-radius:8px;padding:8px;}
  .rm-key{font:700 9px Cairo,sans-serif;color:var(--muted);}
  .rm-val{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-top:2px;}
  .btn-invest{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:9px 18px;font:700 11px Cairo,sans-serif;cursor:pointer;width:100%;margin-top:10px;}
  .btn-invest:hover{background:var(--green);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .no-plan-cta{text-align:center;padding:30px 0;}
  .btn-assess{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:12px 28px;font:700 13px Cairo,sans-serif;cursor:pointer;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="My Investment Plan">خطتي الاستثمارية</h1>
    <p data-en="A personalized plan built on your financial goals and risk profile.">خطة مخصصة بناءً على أهدافك المالية ومستوى تحملك للمخاطر.</p>
  </div>

  <div class="kpi-row" id="kpiRow"></div>
  <div id="riskBanner"></div>

  <div class="card">
    <div class="card-title" data-en="Recommended Allocation">التوزيع المقترح</div>
    <div id="allocChart"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="Financial Milestones">المراحل المالية</div>
    <div id="milestoneList"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="Recommended Deals">الصفقات المقترحة لك</div>
    <div id="recDeals"></div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function fmtPct(n){ return Number(n||0).toFixed(1)+'٪'; }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  const riskClasses={conservative:'risk-conservative',moderate:'risk-moderate',aggressive:'risk-aggressive'};
  const riskIcons={conservative:'🛡️',moderate:'⚖️',aggressive:'🚀'};
  const riskLabels={conservative:'متحفظ',moderate:'معتدل',aggressive:'جريء'};
  const barClasses={sukuk:'bar-sukuk',murabaha:'bar-murabaha',equity:'bar-equity',cash:'bar-cash'};
  const allocLabels={sukuk:'صكوك',murabaha:'مرابحة',equity:'أسهم',cash:'سيولة'};

  (async function load(){
    try{
      const r=await fetch('/app/me/investment-plan');
      if(!r.ok){
        if(r.status===404){
          document.getElementById('kpiRow').remove();
          document.getElementById('riskBanner').remove();
          const noPlan=document.createElement('div'); noPlan.className='no-plan-cta';
          const msg=document.createElement('p'); msg.className='placeholder-msg'; msg.textContent='لم تُكمل تقييم المخاطرة بعد. أكمله لتحصل على خطتك الاستثمارية المخصصة.';
          const btn=document.createElement('button'); btn.className='btn-assess'; btn.textContent='ابدأ تقييم المخاطرة';
          btn.addEventListener('click',()=>{ window.location.href='/risk-assessment.html'; });
          noPlan.appendChild(msg); noPlan.appendChild(btn);
          document.querySelector('main').insertBefore(noPlan, document.querySelector('.card'));
          return;
        }
        placeholder(document.getElementById('recDeals'),'تعذّر التحميل.'); return;
      }
      const d=await r.json();

      const kpiRow=document.getElementById('kpiRow');
      const kpis=[
        ['الهدف السنوي',fmt(d.annualTarget||0)+' ر.س'],
        ['المستثمر حتى الآن',fmt(d.invested||0)+' ر.س'],
        ['نسبة الإنجاز',fmtPct(d.progressPct||0)],
        ['العائد المستهدف',fmtPct(d.targetYield||0)]
      ];
      kpis.forEach(([lbl,val])=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });

      const profile=d.riskProfile||'moderate';
      const banner=document.getElementById('riskBanner');
      const rb=document.createElement('div'); rb.className='risk-banner '+(riskClasses[profile]||'risk-moderate');
      const icon=document.createElement('div'); icon.className='risk-icon'; icon.textContent=riskIcons[profile]||'⚖️';
      const info=document.createElement('div'); info.className='risk-info';
      const rt=document.createElement('div'); rt.className='risk-title'; rt.textContent='مستوى المخاطرة: '+(riskLabels[profile]||profile);
      const rd=document.createElement('div'); rd.className='risk-desc'; rd.textContent=d.riskDescription||'';
      info.appendChild(rt); info.appendChild(rd);
      rb.appendChild(icon); rb.appendChild(info); banner.appendChild(rb);

      const allocChart=document.getElementById('allocChart');
      const alloc=d.allocation||[];
      if(!alloc.length){ placeholder(allocChart,'لا توجد بيانات توزيع.'); }
      else{
        alloc.forEach(a=>{
          const row=document.createElement('div'); row.className='alloc-row';
          const lbl=document.createElement('div'); lbl.className='alloc-label'; lbl.textContent=allocLabels[a.type]||a.type||'—';
          const bg=document.createElement('div'); bg.className='alloc-bar-bg';
          const bar=document.createElement('div'); bar.className='alloc-bar '+(barClasses[a.type]||'bar-cash'); bar.style.width=(a.pct||0)+'%';
          bg.appendChild(bar);
          const pct=document.createElement('div'); pct.className='alloc-pct'; pct.textContent=fmtPct(a.pct||0);
          row.appendChild(lbl); row.appendChild(bg); row.appendChild(pct);
          allocChart.appendChild(row);
        });
      }

      const milList=document.getElementById('milestoneList');
      const milestones=d.milestones||[];
      if(!milestones.length){ placeholder(milList,'لم تُحدَّد أهداف بعد.'); }
      else{
        milestones.forEach((ms,i)=>{
          const item=document.createElement('div'); item.className='milestone';
          const num=document.createElement('div'); num.className='ms-num'; num.textContent=String(i+1);
          const info2=document.createElement('div'); info2.className='ms-info';
          const title=document.createElement('div'); title.className='ms-title'; title.textContent=ms.title||'—';
          const desc=document.createElement('div'); desc.className='ms-desc'; desc.textContent=ms.description||'';
          info2.appendChild(title); info2.appendChild(desc);
          const target=document.createElement('div'); target.className='ms-target'; target.textContent=fmt(ms.targetAmount||0)+' ر.س';
          item.appendChild(num); item.appendChild(info2); item.appendChild(target);
          milList.appendChild(item);
        });
      }

      const recDeals=document.getElementById('recDeals');
      const deals=d.recommendedDeals||[];
      if(!deals.length){ placeholder(recDeals,'لا توجد صفقات مقترحة حالياً.'); return; }
      deals.forEach(deal=>{
        const item=document.createElement('div'); item.className='rec-item';
        const top=document.createElement('div'); top.className='rec-top';
        const info3=document.createElement('div');
        const name=document.createElement('div'); name.className='rec-name'; name.textContent=deal.name||'—';
        const sector=document.createElement('div'); sector.className='rec-sector'; sector.textContent=deal.sector||'—';
        info3.appendChild(name); info3.appendChild(sector);
        const badge=document.createElement('div'); badge.className='rec-badge'; badge.textContent='مقترح';
        top.appendChild(info3); top.appendChild(badge);
        const metrics=document.createElement('div'); metrics.className='rec-metrics';
        [['العائد المتوقع',fmtPct(deal.yield||0)],['الحد الأدنى',fmt(deal.minInvestment||0)+' ر.س'],['المدة',String(deal.duration||0)+' شهر']].forEach(([k,v])=>{
          const m=document.createElement('div'); m.className='rm';
          const mk=document.createElement('div'); mk.className='rm-key'; mk.textContent=k;
          const mv=document.createElement('div'); mv.className='rm-val'; mv.textContent=v;
          m.appendChild(mk); m.appendChild(mv); metrics.appendChild(m);
        });
        const btn=document.createElement('button'); btn.className='btn-invest'; btn.textContent='استثمر الآن';
        btn.addEventListener('click',()=>{ window.location.href='/deal/'+encodeURIComponent(deal.id||''); });
        item.appendChild(top); item.appendChild(metrics); item.appendChild(btn);
        recDeals.appendChild(item);
      });
    }catch{ placeholder(document.getElementById('recDeals'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
