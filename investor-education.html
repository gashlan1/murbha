<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Investor Education — Murbha">تعليم المستثمرين — مُرابحة</title>
<meta name="description" content="تعلّم أسس الاستثمار الإسلامي والمرابحة والصكوك من خلال مقاطع تعليمية ومقالات متخصصة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  /* Progress bar */
  .progress-bar{background:rgba(255,255,255,0.18);border-radius:20px;height:8px;margin-top:16px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:20px;background:var(--gold-light);}
  .progress-lbl{font:500 11px Tajawal,sans-serif;opacity:.85;margin-top:6px;}
  /* Category chips */
  .cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .cat-chip{border:1.5px solid var(--line);border-radius:20px;padding:6px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .cat-chip.active{border-color:var(--green);background:var(--green);color:#fff;}
  /* Module cards */
  .modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:22px;}
  .module-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .module-card:hover{box-shadow:0 4px 16px rgba(10,77,54,0.10);transform:translateY(-2px);}
  .module-card.completed{border-color:#2e7d32;}
  .mc-thumb{height:90px;background:linear-gradient(135deg,#062b1e,#0a4d36);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;}
  .mc-done-badge{position:absolute;top:8px;left:8px;background:#2e7d32;color:#fff;border-radius:20px;padding:2px 8px;font:700 9px Cairo,sans-serif;}
  .mc-body{padding:14px;}
  .mc-cat{font:700 9px Cairo,sans-serif;color:var(--gold);margin-bottom:4px;}
  .mc-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-bottom:4px;line-height:1.5;}
  .mc-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);line-height:1.7;}
  .mc-meta{display:flex;justify-content:space-between;margin-top:10px;font:700 9px Cairo,sans-serif;color:var(--muted);}
  .mc-level{border-radius:4px;padding:2px 6px;}
  .level-beginner{background:#e8f5e9;color:#2e7d32;}
  .level-intermediate{background:#fff8e1;color:#a07020;}
  .level-advanced{background:#fdecea;color:#c54a3a;}
  /* Article modal overlay */
  .overlay{display:none;position:fixed;inset:0;background:rgba(6,43,30,0.65);z-index:100;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:18px;max-width:680px;width:100%;padding:28px;position:relative;}
  .modal-close{position:absolute;top:16px;left:16px;background:var(--green-dark);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font:900 14px Cairo,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-cat{font:700 10px Cairo,sans-serif;color:var(--gold);margin-bottom:6px;}
  .modal-title{font:900 20px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;line-height:1.5;}
  .modal-body{font:500 13px Tajawal,sans-serif;color:var(--ink);line-height:2;white-space:pre-wrap;}
  .btn-complete{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:11px 24px;font:900 12px Cairo,sans-serif;cursor:pointer;margin-top:18px;width:100%;}
  .btn-complete:hover{background:var(--green);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Investor Education">تعليم المستثمرين</h1>
    <p data-en="Learn the fundamentals of Islamic investing, murabaha, and sukuk.">تعلّم أسس الاستثمار الإسلامي والمرابحة والصكوك.</p>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-lbl" id="progLbl">جارٍ التحميل…</div>
  </div>

  <div class="cat-bar" id="catBar">
    <div class="cat-chip active" data-cat="">الكل</div>
    <div class="cat-chip" data-cat="basics">الأساسيات</div>
    <div class="cat-chip" data-cat="murabaha">المرابحة</div>
    <div class="cat-chip" data-cat="sukuk">الصكوك</div>
    <div class="cat-chip" data-cat="risk">المخاطر</div>
    <div class="cat-chip" data-cat="shariah">الشريعة</div>
  </div>

  <div class="modules-grid" id="modulesGrid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <button class="btn-complete" id="btnComplete" data-en="Mark as Complete">وضع علامة مكتمل ✓</button>
  </div>
</div>

<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  const catLabel={basics:'الأساسيات',murabaha:'المرابحة',sukuk:'الصكوك',risk:'المخاطر',shariah:'الشريعة'};
  const levelLabel={beginner:'مبتدئ',intermediate:'متوسط',advanced:'متقدم'};
  const moduleIcons={basics:'📚',murabaha:'💰',sukuk:'📜',risk:'⚖️',shariah:'🕌'};

  let allModules=[], activeCat='', currentModuleId=null;

  function filtered(){ return allModules.filter(m=>!activeCat||m.category===activeCat); }

  function render(){
    const grid=document.getElementById('modulesGrid'); grid.textContent='';
    const items=filtered();
    if(!items.length){ placeholder(grid,'لا توجد وحدات تعليمية.'); return; }
    items.forEach(mod=>{
      const card=document.createElement('div'); card.className='module-card'+(mod.completed?' completed':'');
      const thumb=document.createElement('div'); thumb.className='mc-thumb';
      const icon=document.createTextNode(moduleIcons[mod.category]||'📖'); thumb.appendChild(icon);
      if(mod.completed){ const badge=document.createElement('div'); badge.className='mc-done-badge'; badge.textContent='✓ مكتمل'; thumb.appendChild(badge); }
      const body=document.createElement('div'); body.className='mc-body';
      const cat=document.createElement('div'); cat.className='mc-cat'; cat.textContent=catLabel[mod.category]||mod.category||'—';
      const title=document.createElement('div'); title.className='mc-title'; title.textContent=mod.title||'—';
      const desc=document.createElement('div'); desc.className='mc-desc'; desc.textContent=mod.excerpt||'';
      const meta=document.createElement('div'); meta.className='mc-meta';
      const dur=document.createElement('span'); dur.textContent=(mod.duration||5)+' دقائق';
      const lvl=document.createElement('span'); lvl.className='mc-level level-'+(mod.level||'beginner'); lvl.textContent=levelLabel[mod.level||'beginner'];
      meta.appendChild(dur); meta.appendChild(lvl);
      body.appendChild(cat); body.appendChild(title); body.appendChild(desc); body.appendChild(meta);
      card.appendChild(thumb); card.appendChild(body);
      card.addEventListener('click',()=>openModule(mod));
      grid.appendChild(card);
    });
  }

  function openModule(mod){
    currentModuleId=mod.id;
    document.getElementById('modalCat').textContent=catLabel[mod.category]||mod.category||'';
    document.getElementById('modalTitle').textContent=mod.title||'—';
    document.getElementById('modalBody').textContent=mod.body||mod.excerpt||'لا يوجد محتوى.';
    document.getElementById('btnComplete').style.display=mod.completed?'none':'block';
    document.getElementById('overlay').classList.add('open');
  }

  document.getElementById('modalClose').addEventListener('click',()=>{ document.getElementById('overlay').classList.remove('open'); currentModuleId=null; });
  document.getElementById('overlay').addEventListener('click',e=>{ if(e.target===document.getElementById('overlay')){ document.getElementById('overlay').classList.remove('open'); currentModuleId=null; } });

  document.getElementById('btnComplete').addEventListener('click',async()=>{
    if(!currentModuleId) return;
    document.getElementById('btnComplete').disabled=true;
    try{
      const r=await fetch('/app/me/education/'+encodeURIComponent(currentModuleId)+'/complete',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({})});
      document.getElementById('btnComplete').disabled=false;
      if(!r.ok) return;
      const mod=allModules.find(m=>m.id===currentModuleId);
      if(mod){ mod.completed=true; }
      document.getElementById('btnComplete').style.display='none';
      document.getElementById('overlay').classList.remove('open');
      loadProgress(); render();
    }catch{ document.getElementById('btnComplete').disabled=false; }
  });

  document.getElementById('catBar').querySelectorAll('.cat-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active'); activeCat=chip.dataset.cat; render();
    });
  });

  async function loadProgress(){
    try{
      const r=await fetch('/app/me/education/progress');
      if(r.ok){ const d=await r.json(); const pct=d.total?Math.round((d.completed/d.total)*100):0; document.getElementById('progFill').style.width=pct+'%'; document.getElementById('progLbl').textContent='أكملت '+d.completed+' من '+d.total+' وحدة ('+pct+'٪)'; }
    }catch{}
  }

  (async function load(){
    try{
      const r=await fetch('/app/education/modules');
      if(!r.ok){ placeholder(document.getElementById('modulesGrid'),'تعذّر التحميل.'); return; }
      const d=await r.json(); allModules=d.modules||[]; render(); loadProgress();
    }catch{ placeholder(document.getElementById('modulesGrid'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
