<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Payout Management — Murbha Admin">إدارة المدفوعات — إدارة مُرابحة</title>
<meta name="description" content="مراجعة وإرسال دفعات العوائد للمستثمرين في المنصة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:960px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{border-radius:14px;padding:18px;border:1px solid var(--line);}
  .kpi-yellow{background:#fff8e1;border-color:#ffe082;}
  .kpi-green{background:#e8f5e9;border-color:#a5d6a7;}
  .kpi-blue{background:#e3f2fd;border-color:#90caf9;}
  .kpi-red{background:#fdecea;border-color:#f8d7da;}
  .kpi-val{font:900 24px Cairo,sans-serif;}
  .kpi-yellow .kpi-val{color:#a07020;}
  .kpi-green .kpi-val{color:#2e7d32;}
  .kpi-blue .kpi-val{color:#1565c0;}
  .kpi-red .kpi-val{color:#c54a3a;}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;overflow-x:auto;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  /* Payout batches */
  .batch-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .batch-item:last-child{margin-bottom:0;}
  .batch-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .batch-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .batch-meta{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .batch-badge{border-radius:5px;padding:3px 10px;font:700 9px Cairo,sans-serif;}
  .badge-pending{background:#fff8e1;color:#a07020;}
  .badge-processing{background:#e3f2fd;color:#1565c0;}
  .badge-completed{background:#e8f5e9;color:#2e7d32;}
  .badge-failed{background:#fdecea;color:#c54a3a;}
  .batch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .bs{background:#f9f7f2;border-radius:8px;padding:8px;}
  .bs-key{font:700 9px Cairo,sans-serif;color:var(--muted);}
  .bs-val{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-top:2px;}
  .batch-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-process{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;color:#2e7d32;}
  .btn-process:hover{background:#c8e6c9;}
  .btn-process:disabled{opacity:.5;cursor:default;}
  .btn-detail{background:#f0ece0;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;color:var(--ink);}
  .btn-detail:hover{background:#e8e2d0;}
  /* Recipients table */
  .rec-table{width:100%;border-collapse:collapse;min-width:600px;}
  .rec-table th{font:700 10px Cairo,sans-serif;color:var(--muted);text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);background:#f9f7f2;}
  .rec-table td{font:500 11px Tajawal,sans-serif;color:var(--ink);padding:10px 12px;border-bottom:1px solid var(--line);}
  .rec-table tr:last-child td{border-bottom:none;}
  .td-amt{font:900 12px Cairo,sans-serif;color:#2e7d32;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Payout Management">إدارة المدفوعات</h1>
    <p data-en="Review and process investor return payouts across all active and completed deals.">مراجعة ومعالجة دفعات عوائد المستثمرين عبر جميع الصفقات النشطة والمكتملة.</p>
    <div class="admin-badge">لوحة الإدارة — سري</div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="card">
    <div class="card-title" data-en="Payout Batches">دفعات الصرف</div>
    <div id="batchList"></div>
  </div>

  <div class="card" id="recipientsCard" style="display:none;">
    <div class="card-title" id="recipientsTitle">مستفيدو الدفعة</div>
    <table class="rec-table">
      <thead><tr>
        <th data-en="Investor">المستثمر</th>
        <th data-en="Deal">الصفقة</th>
        <th data-en="Invested">المستثمَر</th>
        <th data-en="Payout">المبلغ المستحق</th>
        <th data-en="Status">الحالة</th>
      </tr></thead>
      <tbody id="recBody"></tbody>
    </table>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  const statusLabels={pending:'معلّقة',processing:'جارية',completed:'مكتملة',failed:'فاشلة'};
  const statusBadge={pending:'badge-pending',processing:'badge-processing',completed:'badge-completed',failed:'badge-failed'};
  const recStatusLabels={pending:'معلّق',sent:'مُرسَل',failed:'فاشل'};

  function showRecipients(batch){
    const card=document.getElementById('recipientsCard'); card.style.display='block';
    document.getElementById('recipientsTitle').textContent='مستفيدو دفعة: '+(batch.dealName||'—');
    const body=document.getElementById('recBody'); body.textContent='';
    const recs=batch.recipients||[];
    if(!recs.length){ placeholder(body,'لا توجد بيانات.'); return; }
    recs.forEach(r=>{
      const tr=document.createElement('tr');
      const tdName=document.createElement('td'); tdName.textContent=r.investorName||'—';
      const tdDeal=document.createElement('td'); tdDeal.textContent=batch.dealName||'—';
      const tdInv=document.createElement('td'); tdInv.textContent=fmt(r.invested||0)+' ر.س';
      const tdPay=document.createElement('td'); tdPay.className='td-amt'; tdPay.textContent=fmt(r.payout||0)+' ر.س';
      const tdStat=document.createElement('td'); tdStat.textContent=recStatusLabels[r.status]||r.status||'—';
      tr.appendChild(tdName); tr.appendChild(tdDeal); tr.appendChild(tdInv); tr.appendChild(tdPay); tr.appendChild(tdStat);
      body.appendChild(tr);
    });
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  (async function load(){
    const list=document.getElementById('batchList');
    placeholder(list,'جارٍ التحميل…');
    try{
      const r=await fetch('/app/admin/payouts');
      if(!r.ok){ placeholder(list,r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      const d=await r.json();

      const kpiRow=document.getElementById('kpiRow');
      const kpis=d.kpis||{};
      [{lbl:'معلّقة',val:String(kpis.pending||0),cls:'kpi-yellow'},{lbl:'إجمالي مستحق',val:fmt(kpis.totalPending||0)+' ر.س',cls:'kpi-blue'},{lbl:'صُرف هذا الشهر',val:fmt(kpis.paidThisMonth||0)+' ر.س',cls:'kpi-green'},{lbl:'فاشلة',val:String(kpis.failed||0),cls:'kpi-red'}].forEach(k=>{
        const div=document.createElement('div'); div.className='kpi '+k.cls;
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        div.appendChild(v); div.appendChild(l); kpiRow.appendChild(div);
      });

      list.textContent='';
      const batches=d.batches||[];
      if(!batches.length){ placeholder(list,'لا توجد دفعات.'); return; }
      batches.forEach(batch=>{
        const item=document.createElement('div'); item.className='batch-item';
        const hdr=document.createElement('div'); hdr.className='batch-header';
        const left=document.createElement('div');
        const title=document.createElement('div'); title.className='batch-title'; title.textContent=(batch.dealName||'صفقة')+' · دفعة #'+(batch.id||'—');
        const meta=document.createElement('div'); meta.className='batch-meta'; meta.textContent=(batch.dueDate||'').slice(0,10)+' · '+String(batch.recipientCount||0)+' مستفيد';
        left.appendChild(title); left.appendChild(meta);
        const badge=document.createElement('div'); badge.className='batch-badge '+(statusBadge[batch.status]||'badge-pending'); badge.textContent=statusLabels[batch.status]||batch.status||'—';
        hdr.appendChild(left); hdr.appendChild(badge);

        const stats=document.createElement('div'); stats.className='batch-stats';
        [['إجمالي الدفعة',fmt(batch.totalAmount||0)+' ر.س'],['المستثمَر الإجمالي',fmt(batch.totalInvested||0)+' ر.س'],['نسبة العائد',(batch.yieldPct||0).toFixed(2)+'٪']].forEach(([k,v])=>{
          const bs=document.createElement('div'); bs.className='bs';
          const bsk=document.createElement('div'); bsk.className='bs-key'; bsk.textContent=k;
          const bsv=document.createElement('div'); bsv.className='bs-val'; bsv.textContent=v;
          bs.appendChild(bsk); bs.appendChild(bsv); stats.appendChild(bs);
        });

        const actions=document.createElement('div'); actions.className='batch-actions';
        const btnDetail=document.createElement('button'); btnDetail.className='btn-detail'; btnDetail.textContent='عرض المستفيدين';
        btnDetail.addEventListener('click',()=>showRecipients(batch));

        if(batch.status==='pending'){
          const btnProc=document.createElement('button'); btnProc.className='btn-process'; btnProc.textContent='معالجة الدفعة';
          const bId=batch.id;
          btnProc.addEventListener('click', async()=>{
            btnProc.disabled=true;
            try{
              const pr=await fetch('/app/admin/payouts/'+encodeURIComponent(bId)+'/process',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({})});
              if(!pr.ok){ btnProc.disabled=false; showToast('تعذّرت المعالجة.'); return; }
              showToast('جارٍ معالجة الدفعة…');
              badge.textContent='جارية'; badge.className='batch-badge badge-processing';
            }catch{ btnProc.disabled=false; showToast('خطأ.'); }
          });
          actions.appendChild(btnProc);
        }
        actions.appendChild(btnDetail);
        item.appendChild(hdr); item.appendChild(stats); item.appendChild(actions);
        list.appendChild(item);
      });
    }catch{ placeholder(document.getElementById('batchList'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
