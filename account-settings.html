<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Account Settings — Murbha">إعدادات الحساب — مُرابحة</title>
<meta name="description" content="إدارة إعدادات حسابك الشخصي وبياناتك ومعلومات التواصل في منصة مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:720px;margin:0 auto;padding:28px 18px 60px;}
  /* Profile hero */
  .profile-hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:32px 22px;margin-bottom:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font:900 28px Cairo,sans-serif;color:#fff;flex-shrink:0;}
  .profile-info h1{font:900 20px Cairo,sans-serif;margin-bottom:4px;}
  .profile-info p{font:500 12px Tajawal,sans-serif;opacity:.85;}
  .verified-badge{display:inline-block;background:rgba(255,255,255,0.15);border-radius:20px;padding:3px 10px;font:700 9px Cairo,sans-serif;margin-top:6px;}
  /* Nav tabs */
  .tab-bar{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px;}
  .tab-btn{border:1.5px solid var(--line);border-radius:10px;padding:8px 16px;font:700 11px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);white-space:nowrap;flex-shrink:0;}
  .tab-btn.active{border-color:var(--green);background:var(--green);color:#fff;}
  /* Sections */
  .section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:16px;}
  .field-row{margin-bottom:14px;}
  .field-row:last-child{margin-bottom:0;}
  label{font:700 10px Cairo,sans-serif;color:var(--muted);display:block;margin-bottom:5px;}
  input[type=text],input[type=email],input[type=tel],input[type=password],select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:500 13px Tajawal,sans-serif;color:var(--ink);outline:none;background:#fff;}
  input:focus,select:focus{border-color:var(--green);}
  input[readonly]{background:#f9f9f9;color:var(--muted);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:500px){.two-col{grid-template-columns:1fr;}}
  /* Password strength */
  .pwd-strength{height:4px;border-radius:4px;margin-top:6px;transition:width .2s,background .2s;background:#e0e0e0;}
  .pwd-strength-bar{height:100%;border-radius:4px;transition:width .3s,background .3s;}
  .pwd-hint{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  /* Action buttons */
  .section-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .btn-save{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:10px 22px;font:900 12px Cairo,sans-serif;cursor:pointer;}
  .btn-save:hover{background:var(--green);}
  .btn-danger{background:#fff;color:#c54a3a;border:1.5px solid #c54a3a;border-radius:10px;padding:10px 18px;font:700 11px Cairo,sans-serif;cursor:pointer;}
  /* 2FA */
  .twofa-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
  .twofa-row:last-child{border-bottom:none;}
  .twofa-info{flex:1;}
  .twofa-name{font:700 12px Cairo,sans-serif;color:var(--ink);}
  .twofa-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .toggle-switch{position:relative;width:40px;height:22px;cursor:pointer;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:22px;transition:.2s;}
  .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle-switch input:checked + .toggle-slider{background:var(--green);}
  .toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px);}
  /* Danger zone */
  .danger-zone{background:#fff5f5;border:1.5px solid #ffcdd2;border-radius:14px;padding:20px;margin-bottom:16px;}
  .danger-title{font:900 13px Cairo,sans-serif;color:#c54a3a;margin-bottom:10px;}
  .danger-desc{font:500 12px Tajawal,sans-serif;color:var(--muted);margin-bottom:14px;line-height:1.7;}
  /* Toast */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;border-radius:10px;padding:12px 24px;font:700 12px Cairo,sans-serif;z-index:999;display:none;}
  /* Tab panels */
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<div class="toast" id="toast"></div>
<main>
  <div class="profile-hero">
    <div class="avatar" id="avatarEl">—</div>
    <div class="profile-info">
      <h1 id="heroName">جارٍ التحميل…</h1>
      <p id="heroEmail"></p>
      <div class="verified-badge" id="verifiedBadge"></div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="personal" data-en="Personal Info">المعلومات الشخصية</button>
    <button class="tab-btn" data-tab="security" data-en="Security">الأمان</button>
    <button class="tab-btn" data-tab="preferences" data-en="Preferences">التفضيلات</button>
    <button class="tab-btn" data-tab="danger" data-en="Account">الحساب</button>
  </div>

  <!-- Personal info -->
  <div class="tab-panel active" id="tab-personal">
    <div class="section">
      <div class="section-title" data-en="Personal Information">المعلومات الشخصية</div>
      <div class="two-col">
        <div class="field-row">
          <label data-en="First Name">الاسم الأول</label>
          <input type="text" id="firstName" maxlength="60" />
        </div>
        <div class="field-row">
          <label data-en="Last Name">اسم العائلة</label>
          <input type="text" id="lastName" maxlength="60" />
        </div>
      </div>
      <div class="field-row">
        <label data-en="Email Address">البريد الإلكتروني</label>
        <input type="email" id="email" maxlength="120" />
      </div>
      <div class="field-row">
        <label data-en="Phone Number">رقم الجوال</label>
        <input type="tel" id="phone" maxlength="20" placeholder="+966 5X XXX XXXX" />
      </div>
      <div class="two-col">
        <div class="field-row">
          <label data-en="National ID">رقم الهوية الوطنية</label>
          <input type="text" id="nationalId" readonly />
        </div>
        <div class="field-row">
          <label data-en="Date of Birth">تاريخ الميلاد</label>
          <input type="text" id="dob" readonly />
        </div>
      </div>
      <div class="field-row">
        <label data-en="Preferred Language">اللغة المفضلة</label>
        <select id="lang">
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="section-actions">
        <button class="btn-save" id="btnSavePersonal" data-en="Save Changes">حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <!-- Security -->
  <div class="tab-panel" id="tab-security">
    <div class="section">
      <div class="section-title" data-en="Change Password">تغيير كلمة المرور</div>
      <div class="field-row">
        <label data-en="Current Password">كلمة المرور الحالية</label>
        <input type="password" id="currentPwd" maxlength="100" />
      </div>
      <div class="field-row">
        <label data-en="New Password">كلمة المرور الجديدة</label>
        <input type="password" id="newPwd" maxlength="100" id="newPwd" />
        <div class="pwd-strength"><div class="pwd-strength-bar" id="pwdBar" style="width:0;background:#e0e0e0;"></div></div>
        <div class="pwd-hint" id="pwdHint"></div>
      </div>
      <div class="field-row">
        <label data-en="Confirm New Password">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPwd" maxlength="100" />
      </div>
      <div class="section-actions">
        <button class="btn-save" id="btnChangePwd" data-en="Update Password">تحديث كلمة المرور</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title" data-en="Two-Factor Authentication">التحقق الثنائي</div>
      <div class="twofa-row">
        <div class="twofa-info">
          <div class="twofa-name" data-en="SMS Verification">التحقق عبر الرسائل النصية</div>
          <div class="twofa-desc" data-en="Receive a code via SMS on each login.">استلام رمز عبر الرسائل النصية عند كل تسجيل دخول.</div>
        </div>
        <label class="toggle-switch"><input type="checkbox" id="twoFaSms" /><span class="toggle-slider"></span></label>
      </div>
      <div class="twofa-row">
        <div class="twofa-info">
          <div class="twofa-name" data-en="Authenticator App">تطبيق المصادقة</div>
          <div class="twofa-desc" data-en="Use Google Authenticator or similar apps.">استخدام تطبيق Google Authenticator أو مشابهاته.</div>
        </div>
        <label class="toggle-switch"><input type="checkbox" id="twoFaApp" /><span class="toggle-slider"></span></label>
      </div>
      <div class="section-actions">
        <button class="btn-save" id="btnSaveSecurity" data-en="Save Security Settings">حفظ إعدادات الأمان</button>
      </div>
    </div>
  </div>

  <!-- Preferences -->
  <div class="tab-panel" id="tab-preferences">
    <div class="section">
      <div class="section-title" data-en="Display Preferences">تفضيلات العرض</div>
      <div class="field-row">
        <label data-en="Currency Display">عملة العرض</label>
        <select id="currencyPref">
          <option value="SAR">ريال سعودي (SAR)</option>
          <option value="USD">دولار أمريكي (USD)</option>
        </select>
      </div>
      <div class="field-row">
        <label data-en="Date Format">صيغة التاريخ</label>
        <select id="datePref">
          <option value="ar-SA">هجري (الافتراضي)</option>
          <option value="en-GB">ميلادي (DD/MM/YYYY)</option>
        </select>
      </div>
      <div class="field-row">
        <label data-en="Risk Appetite">مستوى تحمّل المخاطر</label>
        <select id="riskPref">
          <option value="conservative">محافظ</option>
          <option value="moderate" selected>متوازن</option>
          <option value="aggressive">مرتفع</option>
        </select>
      </div>
      <div class="section-actions">
        <button class="btn-save" id="btnSavePrefs" data-en="Save Preferences">حفظ التفضيلات</button>
      </div>
    </div>
  </div>

  <!-- Danger zone -->
  <div class="tab-panel" id="tab-danger">
    <div class="danger-zone">
      <div class="danger-title" data-en="Danger Zone">منطقة الخطر</div>
      <div class="danger-desc" data-en="These actions are irreversible. Please proceed with caution.">هذه الإجراءات لا يمكن التراجع عنها. يرجى التصرف بحذر.</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn-danger" id="btnDeactivate" data-en="Deactivate Account">تعليق الحساب مؤقتاً</button>
        <button class="btn-danger" id="btnDelete" data-en="Delete Account">حذف الحساب نهائياً</button>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#c54a3a':'#2e7d32';t.style.display='block';setTimeout(()=>{t.style.display='none';},3500);}

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  // Password strength
  document.getElementById('newPwd').addEventListener('input',e=>{
    const v=e.target.value;
    let score=0;
    if(v.length>=8)score++;
    if(/[A-Z]/.test(v))score++;
    if(/[0-9]/.test(v))score++;
    if(/[^A-Za-z0-9]/.test(v))score++;
    const bar=document.getElementById('pwdBar');
    const hint=document.getElementById('pwdHint');
    const colors=['#e0e0e0','#e57373','#ffb74d','#81c784','#2e7d32'];
    const labels=['','ضعيفة جداً','ضعيفة','جيدة','قوية'];
    bar.style.width=(score*25)+'%';
    bar.style.background=colors[score]||'#e0e0e0';
    hint.textContent=labels[score]||'';
  });

  async function load(){
    try{
      const r=await fetch('/app/me/profile');
      if(!r.ok) return;
      const d=await r.json();
      const name=(d.name||d.firstName||'م').charAt(0).toUpperCase();
      document.getElementById('avatarEl').textContent=name;
      document.getElementById('heroName').textContent=d.name||d.firstName||'مستثمر';
      document.getElementById('heroEmail').textContent=d.email||'';
      document.getElementById('verifiedBadge').textContent=d.kycStatus==='approved'?'✓ موثّق':'غير موثّق';
      document.getElementById('firstName').value=d.firstName||d.name?.split(' ')[0]||'';
      document.getElementById('lastName').value=d.lastName||d.name?.split(' ').slice(1).join(' ')||'';
      document.getElementById('email').value=d.email||'';
      document.getElementById('phone').value=d.phone||'';
      document.getElementById('nationalId').value=d.nationalId||'—';
      document.getElementById('dob').value=d.dob||'—';
      document.getElementById('lang').value=d.preferredLang||'ar';
      document.getElementById('riskPref').value=d.riskAppetite||'moderate';
    }catch{}
  }

  document.getElementById('btnSavePersonal').addEventListener('click',async()=>{
    const btn=document.getElementById('btnSavePersonal');btn.disabled=true;
    const payload={firstName:document.getElementById('firstName').value.trim(),lastName:document.getElementById('lastName').value.trim(),phone:document.getElementById('phone').value.trim(),preferredLang:document.getElementById('lang').value};
    try{
      const r=await fetch('/app/me/profile',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
      btn.disabled=false;
      if(!r.ok){toast('فشل الحفظ.',true);return;}
      toast('تم حفظ المعلومات الشخصية!');
    }catch{btn.disabled=false;}
  });

  document.getElementById('btnChangePwd').addEventListener('click',async()=>{
    const current=document.getElementById('currentPwd').value;
    const next=document.getElementById('newPwd').value;
    const confirm=document.getElementById('confirmPwd').value;
    if(!current||!next){toast('أدخل كلمة المرور الحالية والجديدة.',true);return;}
    if(next!==confirm){toast('كلمة المرور الجديدة غير متطابقة.',true);return;}
    if(next.length<8){toast('كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل.',true);return;}
    const btn=document.getElementById('btnChangePwd');btn.disabled=true;
    try{
      const r=await fetch('/app/me/password',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({currentPassword:current,newPassword:next})});
      btn.disabled=false;
      if(!r.ok){toast('كلمة المرور الحالية غير صحيحة.',true);return;}
      toast('تم تغيير كلمة المرور!');
      document.getElementById('currentPwd').value='';document.getElementById('newPwd').value='';document.getElementById('confirmPwd').value='';
    }catch{btn.disabled=false;}
  });

  document.getElementById('btnSaveSecurity').addEventListener('click',async()=>{
    const btn=document.getElementById('btnSaveSecurity');btn.disabled=true;
    const payload={twoFaSms:document.getElementById('twoFaSms').checked,twoFaApp:document.getElementById('twoFaApp').checked};
    try{
      const r=await fetch('/app/me/security',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
      btn.disabled=false;
      if(!r.ok){toast('فشل الحفظ.',true);return;}
      toast('تم حفظ إعدادات الأمان!');
    }catch{btn.disabled=false;}
  });

  document.getElementById('btnSavePrefs').addEventListener('click',async()=>{
    const btn=document.getElementById('btnSavePrefs');btn.disabled=true;
    const payload={currency:document.getElementById('currencyPref').value,dateFormat:document.getElementById('datePref').value,riskAppetite:document.getElementById('riskPref').value};
    try{
      const r=await fetch('/app/me/preferences',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
      btn.disabled=false;
      if(!r.ok){toast('فشل الحفظ.',true);return;}
      toast('تم حفظ التفضيلات!');
    }catch{btn.disabled=false;}
  });

  document.getElementById('btnDeactivate').addEventListener('click',async()=>{
    if(!confirm('هل تريد تعليق حسابك مؤقتاً؟ لن تتمكن من تسجيل الدخول حتى تتواصل مع الدعم.')) return;
    try{
      await fetch('/app/me/deactivate',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({})});
      toast('تم تعليق الحساب. سيتم تسجيل خروجك.');
    }catch{}
  });

  document.getElementById('btnDelete').addEventListener('click',()=>{
    const code=prompt('لحذف حسابك نهائياً، اكتب "احذف حسابي":');
    if(code!=='احذف حسابي'){return;}
    toast('تم استلام طلب الحذف. سيتواصل معك فريق الدعم.',false);
  });

  load();
}());
</script>
</body>
</html>
