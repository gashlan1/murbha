<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>توقعات الثروة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.layout-2{display:grid;grid-template-columns:340px 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;}
.card-head h3{font-size:1rem;font-weight:700;}
.input-section{padding:1.25rem;}
.input-group{margin-bottom:1rem;}
.input-group label{display:block;font-size:0.82rem;font-weight:600;margin-bottom:0.4rem;}
.input-group input,.input-group select{width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--line);border-radius:7px;font-family:'Cairo',sans-serif;font-size:0.88rem;background:#fff;}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--green);}
.slider-val{font-size:0.85rem;font-weight:700;color:var(--green);margin-top:0.2rem;}
.result-banner{background:linear-gradient(135deg,#062b1e 0%,#0a4d36 100%);border-radius:14px;padding:1.75rem 2rem;color:#fff;margin-bottom:1.5rem;}
.result-banner h3{font-size:1rem;font-weight:700;margin-bottom:1rem;color:rgba(255,255,255,0.8);}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.result-item{}
.result-val{font-size:1.6rem;font-weight:700;color:#6de0a8;}
.result-lbl{font-size:0.72rem;color:rgba(255,255,255,0.7);margin-top:0.2rem;}
.chart-area{padding:1.25rem;}
.chart-title{font-size:0.85rem;font-weight:700;margin-bottom:1rem;}
.chart-bars{display:flex;align-items:flex-end;gap:0.5rem;height:160px;}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.3rem;}
.bar-stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px 4px 0 0;overflow:hidden;}
.bar-principal{background:var(--green);}
.bar-profit{background:var(--gold);}
.bar-lbl{font-size:0.65rem;color:var(--muted);}
.legend{display:flex;gap:1.25rem;margin-top:0.75rem;}
.legend-item{display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot-principal{background:var(--green);}
.dot-profit{background:var(--gold);}
.milestones{padding:1.25rem;}
.milestone-row{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--line);}
.milestone-row:last-child{border-bottom:none;}
.milestone-year{font-size:0.82rem;font-weight:700;color:var(--green);}
.milestone-val{font-size:0.88rem;font-weight:700;}
.milestone-growth{font-size:0.72rem;color:#27ae60;}
@media(max-width:700px){.layout-2{grid-template-columns:1fr;}.result-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — توقعات الثروة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>مخطط توقعات الثروة</h2>
    <p>احسب نمو ثروتك على المدى البعيد عبر المرابحة الإسلامية</p>
  </div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>معطيات الحساب</h3></div>
      <div class="input-section">
        <div class="input-group">
          <label>رأس المال الأولي (ر.س)</label>
          <input type="number" id="capital" value="50000" min="1000" oninput="calc()">
        </div>
        <div class="input-group">
          <label>الإضافة الشهرية (ر.س)</label>
          <input type="number" id="monthly" value="2000" min="0" oninput="calc()">
        </div>
        <div class="input-group">
          <label>متوسط العائد السنوي: <span class="slider-val" id="rateVal">١٢٪</span></label>
          <input type="range" id="rate" min="6" max="20" value="12" oninput="calc()">
        </div>
        <div class="input-group">
          <label>مدة التوقع: <span class="slider-val" id="yearsVal">١٠ سنوات</span></label>
          <input type="range" id="years" min="1" max="30" value="10" oninput="calc()">
        </div>
        <div class="input-group">
          <label>سيناريو النمو</label>
          <select id="scenario" onchange="calc()">
            <option value="1">متحفظ (عائد ثابت)</option>
            <option value="1.1" selected>متوازن (نمو تدريجي)</option>
            <option value="1.2">متفائل (نمو مضاعف)</option>
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:0.5rem;" onclick="saveProjection()">حفظ التوقع</button>
      </div>
    </div>

    <div>
      <div class="result-banner" id="resultBanner">
        <h3>نتائج التوقع</h3>
        <div class="result-grid" id="resultGrid"></div>
      </div>
      <div class="card" style="margin-bottom:1rem;">
        <div class="card-head"><h3>مسار نمو الثروة</h3></div>
        <div class="chart-area">
          <div class="chart-title">توزيع رأس المال والأرباح سنوياً</div>
          <div class="chart-bars" id="chartBars"></div>
          <div class="legend">
            <div class="legend-item"><div class="dot dot-principal"></div><span>رأس المال</span></div>
            <div class="legend-item"><div class="dot dot-profit"></div><span>الأرباح</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>معالم الثروة</h3></div>
    <div class="milestones" id="milestones"></div>
  </div>
</div>

<script>
function toAr(n) {
  return n.toLocaleString('ar-SA');
}

function calc() {
  const capital = parseFloat(document.getElementById('capital').value) || 50000;
  const monthly = parseFloat(document.getElementById('monthly').value) || 0;
  const rate = parseFloat(document.getElementById('rate').value) / 100;
  const years = parseInt(document.getElementById('years').value) || 10;
  const scenario = parseFloat(document.getElementById('scenario').value);

  document.getElementById('rateVal').textContent = document.getElementById('rate').value + '٪';
  document.getElementById('yearsVal').textContent = document.getElementById('years').value + ' سنوات';

  let wealth = capital;
  const monthlyRate = rate / 12 * scenario;
  for (let m = 0; m < years * 12; m++) {
    wealth = wealth * (1 + monthlyRate) + monthly;
  }

  const totalPrincipal = capital + monthly * years * 12;
  const totalProfit = wealth - totalPrincipal;
  const multiplier = (wealth / capital).toFixed(1);

  const grid = document.getElementById('resultGrid');
  grid.textContent = '';
  const results = [
    { val: toAr(Math.round(wealth)) + ' ر.س', lbl: 'إجمالي الثروة المتوقعة' },
    { val: toAr(Math.round(totalProfit)) + ' ر.س', lbl: 'إجمالي الأرباح المتراكمة' },
    { val: multiplier + 'x', lbl: 'مضاعف رأس المال' }
  ];
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const val = document.createElement('div');
    val.className = 'result-val';
    val.textContent = r.val;
    const lbl = document.createElement('div');
    lbl.className = 'result-lbl';
    lbl.textContent = r.lbl;
    div.appendChild(val); div.appendChild(lbl);
    grid.appendChild(div);
  });

  buildChart(capital, monthly, rate, years, scenario);
  buildMilestones(capital, monthly, rate, years, scenario);
}

function buildChart(capital, monthly, rate, years, scenario) {
  const bars = document.getElementById('chartBars');
  bars.textContent = '';
  const monthlyRate = rate / 12 * scenario;
  const steps = Math.min(years, 10);
  const step = Math.max(1, Math.floor(years / steps));
  let maxWealth = 0;
  const points = [];
  let w = capital;
  for (let y = 1; y <= years; y++) {
    for (let m = 0; m < 12; m++) w = w * (1 + monthlyRate) + monthly;
    if (y % step === 0 || y === years) {
      const principal = capital + monthly * y * 12;
      points.push({ year: y, wealth: w, principal: Math.min(principal, w) });
      if (w > maxWealth) maxWealth = w;
    }
  }
  points.forEach(p => {
    const group = document.createElement('div');
    group.className = 'bar-group';
    const stack = document.createElement('div');
    stack.className = 'bar-stack';
    const totalH = Math.round((p.wealth / maxWealth) * 140);
    const principalH = Math.round((p.principal / maxWealth) * 140);
    const profitH = totalH - principalH;
    const profitBar = document.createElement('div');
    profitBar.className = 'bar-profit';
    profitBar.style.height = profitH + 'px';
    const principalBar = document.createElement('div');
    principalBar.className = 'bar-principal';
    principalBar.style.height = principalH + 'px';
    stack.appendChild(profitBar); stack.appendChild(principalBar);
    const lbl = document.createElement('div');
    lbl.className = 'bar-lbl';
    lbl.textContent = 'س' + p.year;
    group.appendChild(stack); group.appendChild(lbl);
    bars.appendChild(group);
  });
}

function buildMilestones(capital, monthly, rate, years, scenario) {
  const wrap = document.getElementById('milestones');
  wrap.textContent = '';
  const monthlyRate = rate / 12 * scenario;
  const checkpoints = [1, 3, 5, 10, 15, 20].filter(y => y <= years);
  let w = capital;
  let prevW = capital;
  let prevY = 0;
  checkpoints.forEach(y => {
    for (let m = (prevY * 12); m < y * 12; m++) w = w * (1 + monthlyRate) + monthly;
    const growth = prevW > 0 ? (((w - prevW) / prevW) * 100).toFixed(0) : 0;
    const row = document.createElement('div');
    row.className = 'milestone-row';
    const yr = document.createElement('div');
    yr.className = 'milestone-year';
    yr.textContent = 'سنة ' + y;
    const val = document.createElement('div');
    val.className = 'milestone-val';
    val.textContent = toAr(Math.round(w)) + ' ر.س';
    const grw = document.createElement('div');
    grw.className = 'milestone-growth';
    grw.textContent = '+' + growth + '٪ عن السابق';
    row.appendChild(yr); row.appendChild(val); row.appendChild(grw);
    wrap.appendChild(row);
    prevW = w; prevY = y;
  });
}

function saveProjection() {
  fetch('/app/me/wealth-projection', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' },
    body: JSON.stringify({
      capital: document.getElementById('capital').value,
      monthly: document.getElementById('monthly').value,
      rate: document.getElementById('rate').value,
      years: document.getElementById('years').value,
      scenario: document.getElementById('scenario').value
    })
  }).catch(() => {});
  alert('تم حفظ التوقع بنجاح');
}

calc();
</script>
</body>
</html>
