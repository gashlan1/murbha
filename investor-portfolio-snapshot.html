<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لقطة المحفظة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.date-tag{font-size:0.8rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:0.3rem 0.7rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-secondary:hover{background:var(--green);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.hero-card{background:linear-gradient(135deg,#062b1e,#0a4d36);border-radius:14px;padding:2rem;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1.5rem;}
.hero-left{display:flex;flex-direction:column;gap:0.4rem;}
.hero-label{font-size:0.82rem;color:rgba(255,255,255,0.7);}
.hero-value{font-size:2.4rem;font-weight:700;}
.hero-change{font-size:0.88rem;color:#6de0a8;}
.hero-stats{display:flex;gap:2rem;}
.hero-stat{display:flex;flex-direction:column;gap:0.25rem;align-items:center;}
.hero-stat-val{font-size:1.2rem;font-weight:700;}
.hero-stat-lbl{font-size:0.72rem;color:rgba(255,255,255,0.65);}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;}
.metric-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;}
.metric-label{font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem;}
.metric-value{font-size:1.3rem;font-weight:700;color:var(--green-dark);}
.metric-sub{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}
.metric-positive{color:#27ae60;}
.metric-negative{color:#c0392b;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
.card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;}
.card-head h3{font-size:1rem;font-weight:700;}
.card-body{padding:1.25rem;}
.deal-row{display:flex;align-items:center;gap:1rem;padding:0.7rem 0;border-bottom:1px solid var(--line);}
.deal-row:last-child{border-bottom:none;}
.deal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.deal-info{flex:1;}
.deal-name{font-size:0.88rem;font-weight:600;}
.deal-sector{font-size:0.74rem;color:var(--muted);}
.deal-alloc{text-align:left;}
.deal-alloc-pct{font-size:0.88rem;font-weight:700;color:var(--green-dark);}
.deal-alloc-amt{font-size:0.72rem;color:var(--muted);}
.timeline-item{display:flex;gap:0.75rem;padding:0.65rem 0;border-bottom:1px solid var(--line);}
.timeline-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:0.35rem;flex-shrink:0;}
.tl-text{flex:1;}
.tl-title{font-size:0.85rem;font-weight:600;}
.tl-meta{font-size:0.74rem;color:var(--muted);margin-top:0.1rem;}
.print-row{display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1rem;}
@media(max-width:768px){.metrics-grid{grid-template-columns:1fr 1fr;}.two-col{grid-template-columns:1fr;}.hero-stats{flex-wrap:wrap;gap:1rem;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — لقطة المحفظة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>لقطة المحفظة الاستثمارية</h2>
    <div style="display:flex;gap:0.75rem;align-items:center;">
      <span class="date-tag" id="snapshotDate">١٥ يونيو ٢٠٢٥</span>
      <button class="btn btn-secondary btn-sm" onclick="exportSnapshot()">تصدير PDF</button>
      <button class="btn btn-primary btn-sm" onclick="refreshSnapshot()">تحديث</button>
    </div>
  </div>

  <div class="hero-card">
    <div class="hero-left">
      <div class="hero-label">إجمالي قيمة المحفظة</div>
      <div class="hero-value">٣٠٢,٨٠٠ ر.س</div>
      <div class="hero-change">▲ ١٢.٤٪ منذ بداية العام</div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <span class="hero-stat-val">١٨</span>
        <span class="hero-stat-lbl">صفقة نشطة</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val">١١.٢٪</span>
        <span class="hero-stat-lbl">متوسط العائد</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val">٦٨,٤٠٠</span>
        <span class="hero-stat-lbl">توزيعات مستلمة</span>
      </div>
    </div>
  </div>

  <div class="metrics-grid" id="metricsGrid"></div>

  <div class="two-col">
    <div class="card">
      <div class="card-head"><h3>توزيع الصفقات</h3></div>
      <div class="card-body" id="dealRows"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>آخر الأحداث</h3></div>
      <div class="card-body" id="timeline"></div>
    </div>
  </div>

  <div class="print-row">
    <button class="btn btn-secondary btn-sm" onclick="scheduleReport()">جدولة تقرير دوري</button>
    <button class="btn btn-primary" onclick="exportSnapshot()">طباعة / تصدير</button>
  </div>
</div>

<script>
const metrics = [
  {label:'العائد السنوي (IRR)',value:'١١.٢٪',sub:'منذ البداية',cls:'metric-positive'},
  {label:'أرباح محققة',value:'٦٨,٤٠٠',sub:'ر.س إجمالي',cls:''},
  {label:'أرباح غير محققة',value:'٢٣,٢٠٠',sub:'ر.س قيمة سوقية',cls:'metric-positive'},
  {label:'أعلى عائد قطاعي',value:'طاقة ١٤٪',sub:'محطة طاقة شمسية',cls:''},
  {label:'أدنى عائد قطاعي',value:'تجزئة ٩٪',sub:'سلسلة مطاعم',cls:''},
  {label:'نسبة التنويع',value:'٥ قطاعات',sub:'عقارات / تقنية / صحة / طاقة / تجزئة',cls:''},
];

const deals = [
  {name:'مجمع الروضة السكني',sector:'عقارات',pct:'٣٢٪',amt:'٩٦,٨٩٦',color:'#0a4d36'},
  {name:'منصة FinTech B2B',sector:'تقنية',pct:'١٨٪',amt:'٥٤,٥٠٤',color:'#b08840'},
  {name:'عيادات الصحة',sector:'صحة',pct:'٢٠٪',amt:'٦٠,٥٦٠',color:'#2d6b50'},
  {name:'محطة طاقة شمسية',sector:'طاقة',pct:'١٦٪',amt:'٤٨,٤٤٨',color:'#6b7268'},
  {name:'سلسلة مطاعم',sector:'تجزئة',pct:'١٤٪',amt:'٤٢,٣٩٢',color:'#c0392b'},
];

const events = [
  {title:'توزيع أرباح - مجمع الروضة',meta:'٤,٢٠٠ ر.س · ١ يونيو ٢٠٢٥'},
  {title:'دفعة جديدة - FinTech B2B',meta:'٣,٦٠٠ ر.س · ١٥ مايو ٢٠٢٥'},
  {title:'اكتمال الجولة الثانية - طاقة شمسية',meta:'١٠٠٪ اكتتاب · ١٠ مايو ٢٠٢٥'},
  {title:'تجديد عقد - عيادات الصحة',meta:'٣ سنوات إضافية · ٠١ مايو ٢٠٢٥'},
  {title:'مراجعة الأداء الربعية',meta:'Q1 2025 · الربع الأول ٢٠٢٥'},
];

function renderMetrics(){
  const grid = document.getElementById('metricsGrid');
  grid.textContent = '';
  metrics.forEach(m => {
    const card = document.createElement('div');
    card.className = 'metric-card';
    const lbl = document.createElement('div');
    lbl.className = 'metric-label';
    lbl.textContent = m.label;
    const val = document.createElement('div');
    val.className = 'metric-value' + (m.cls ? ' ' + m.cls : '');
    val.textContent = m.value;
    const sub = document.createElement('div');
    sub.className = 'metric-sub';
    sub.textContent = m.sub;
    card.appendChild(lbl);
    card.appendChild(val);
    card.appendChild(sub);
    grid.appendChild(card);
  });
}

function renderDeals(){
  const cont = document.getElementById('dealRows');
  cont.textContent = '';
  deals.forEach(d => {
    const row = document.createElement('div');
    row.className = 'deal-row';
    const dot = document.createElement('div');
    dot.className = 'deal-dot';
    dot.style.background = d.color;
    const info = document.createElement('div');
    info.className = 'deal-info';
    const name = document.createElement('div');
    name.className = 'deal-name';
    name.textContent = d.name;
    const sector = document.createElement('div');
    sector.className = 'deal-sector';
    sector.textContent = d.sector;
    info.appendChild(name);
    info.appendChild(sector);
    const alloc = document.createElement('div');
    alloc.className = 'deal-alloc';
    const pct = document.createElement('div');
    pct.className = 'deal-alloc-pct';
    pct.textContent = d.pct;
    const amt = document.createElement('div');
    amt.className = 'deal-alloc-amt';
    amt.textContent = d.amt + ' ر.س';
    alloc.appendChild(pct);
    alloc.appendChild(amt);
    row.appendChild(dot);
    row.appendChild(info);
    row.appendChild(alloc);
    cont.appendChild(row);
  });
}

function renderTimeline(){
  const cont = document.getElementById('timeline');
  cont.textContent = '';
  events.forEach(e => {
    const item = document.createElement('div');
    item.className = 'timeline-item';
    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    const text = document.createElement('div');
    text.className = 'tl-text';
    const title = document.createElement('div');
    title.className = 'tl-title';
    title.textContent = e.title;
    const meta = document.createElement('div');
    meta.className = 'tl-meta';
    meta.textContent = e.meta;
    text.appendChild(title);
    text.appendChild(meta);
    item.appendChild(dot);
    item.appendChild(text);
    cont.appendChild(item);
  });
}

async function exportSnapshot(){
  try {
    const res = await fetch('/app/me/portfolio/snapshot/export');
    await res.json();
  } catch(e){}
}

async function refreshSnapshot(){
  try {
    const res = await fetch('/app/me/portfolio/snapshot');
    await res.json();
  } catch(e){}
}

async function scheduleReport(){
  try {
    await fetch('/app/me/portfolio/snapshot/schedule', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({frequency:'monthly'})
    });
  } catch(e){}
}

renderMetrics();
renderDeals();
renderTimeline();
</script>
</body>
</html>
