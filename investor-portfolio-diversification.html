<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنويع المحفظة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.score-banner{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:14px;padding:1.5rem 2rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.sb-left h3{font-size:1rem;font-weight:700;margin-bottom:0.3rem;}
.sb-left p{font-size:0.8rem;color:rgba(255,255,255,0.75);}
.sb-score{text-align:center;}
.score-circle{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;}
.score-val{font-size:1.6rem;font-weight:700;color:#b8e6cf;line-height:1;}
.score-lbl{font-size:0.6rem;color:rgba(255,255,255,0.7);}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.alloc-list{padding:1.25rem;}
.alloc-item{margin-bottom:1rem;}
.alloc-item:last-child{margin-bottom:0;}
.alloc-head{display:flex;justify-content:space-between;margin-bottom:0.3rem;font-size:0.82rem;}
.alloc-name{font-weight:700;}
.alloc-pct{color:var(--gold);font-weight:700;}
.alloc-bar{height:8px;border-radius:4px;background:#e8e2d6;}
.alloc-fill{height:100%;border-radius:4px;}
.rec-list{padding:1.25rem;}
.rec-item{display:flex;gap:0.75rem;padding:0.75rem 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.rec-item:last-child{border-bottom:none;}
.rec-icon{font-size:1.2rem;flex-shrink:0;margin-top:0.1rem;}
.rec-content{}
.rec-title{font-size:0.84rem;font-weight:700;margin-bottom:0.15rem;}
.rec-desc{font-size:0.72rem;color:var(--muted);}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.layout-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — تنويع المحفظة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>تحليل تنويع المحفظة</h2>
      <p>قيّم مستوى تنويع محفظتك وتلقَّ توصيات لتحسين توزيع المخاطر</p>
    </div>
    <button class="btn btn-gold" onclick="exportAnalysis()">تصدير التحليل</button>
  </div>

  <div class="score-banner">
    <div class="sb-left">
      <h3>درجة التنويع</h3>
      <p>محفظتك متنوعة بشكل جيد — يُنصح بزيادة التعرض للقطاع التقني</p>
    </div>
    <div class="sb-score">
      <div class="score-circle">
        <div class="score-val">٧٨</div>
        <div class="score-lbl">من ١٠٠</div>
      </div>
    </div>
  </div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>التوزيع القطاعي</h3></div>
      <div class="alloc-list" id="sectorAlloc"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>التوزيع الزمني</h3></div>
      <div class="alloc-list" id="durationAlloc"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>توصيات التنويع</h3></div>
    <div class="rec-list" id="recList"></div>
    <div class="action-bar">
      <button class="btn btn-primary btn-sm" onclick="applyRecs()">تطبيق التوصيات</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="exportAnalysis()">تصدير</button>
    </div>
  </div>
</div>

<script>
const SECTORS = [
  { name: 'تجارية', pct: 45, color: '#0a4d36' },
  { name: 'لوجستية', pct: 25, color: '#b08840' },
  { name: 'تقنية', pct: 15, color: '#1a56c4' },
  { name: 'صناعية', pct: 10, color: '#6b7268' },
  { name: 'أخرى', pct: 5, color: '#c0392b' }
];

const DURATIONS = [
  { name: 'قصيرة (١-٣ أشهر)', pct: 20, color: '#b8e6cf' },
  { name: 'متوسطة (٣-٦ أشهر)', pct: 50, color: '#0a4d36' },
  { name: 'طويلة (٦-١٢ شهراً)', pct: 25, color: '#b08840' },
  { name: 'ممتدة (+١٢ شهراً)', pct: 5, color: '#6b7268' }
];

const RECS = [
  { icon: '📈', title: 'زيادة التعرض للقطاع التقني', desc: 'حصتك الحالية ١٥٪ — يُوصى بالوصول إلى ٢٥٪ لتحسين التنويع.' },
  { icon: '⚖️', title: 'تقليل التركز في القطاع التجاري', desc: 'حصة ٤٥٪ مرتفعة — تقليلها إلى ٣٥٪ يُقلل من مخاطر التركز.' },
  { icon: '🗓️', title: 'إضافة صفقات قصيرة الأجل', desc: 'رفع نسبة الصفقات قصيرة المدة إلى ٣٠٪ يُحسّن السيولة.' },
  { icon: '🌍', title: 'التنويع الجغرافي', desc: 'جميع صفقاتك في السوق المحلية — فكّر في الصفقات العابرة للحدود.' }
];

function buildAlloc(containerId, data) {
  const wrap = document.getElementById(containerId);
  data.forEach(d => {
    const item = document.createElement('div'); item.className = 'alloc-item';
    const head = document.createElement('div'); head.className = 'alloc-head';
    const name = document.createElement('span'); name.className = 'alloc-name'; name.textContent = d.name;
    const pct = document.createElement('span'); pct.className = 'alloc-pct'; pct.textContent = d.pct + '٪';
    head.appendChild(name); head.appendChild(pct);
    const bar = document.createElement('div'); bar.className = 'alloc-bar';
    const fill = document.createElement('div'); fill.className = 'alloc-fill'; fill.style.width = d.pct + '%'; fill.style.background = d.color;
    bar.appendChild(fill);
    item.appendChild(head); item.appendChild(bar);
    wrap.appendChild(item);
  });
}

function buildRecs() {
  const wrap = document.getElementById('recList');
  RECS.forEach(r => {
    const item = document.createElement('div'); item.className = 'rec-item';
    const icon = document.createElement('div'); icon.className = 'rec-icon'; icon.textContent = r.icon;
    const content = document.createElement('div'); content.className = 'rec-content';
    const title = document.createElement('div'); title.className = 'rec-title'; title.textContent = r.title;
    const desc = document.createElement('div'); desc.className = 'rec-desc'; desc.textContent = r.desc;
    content.appendChild(title); content.appendChild(desc);
    item.appendChild(icon); item.appendChild(content);
    wrap.appendChild(item);
  });
}

function applyRecs() {
  fetch('/app/me/portfolio-diversification/apply', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'apply' }) }).catch(() => {});
  alert('جاري تطبيق توصيات التنويع...');
}

function exportAnalysis() {
  fetch('/app/me/portfolio-diversification/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير تحليل التنويع...');
}

buildAlloc('sectorAlloc', SECTORS); buildAlloc('durationAlloc', DURATIONS); buildRecs();
</script>
</body>
</html>
