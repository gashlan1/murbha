<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستنداتي - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-secondary:hover{background:var(--green);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.upload-zone{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:2.5rem;text-align:center;margin-bottom:2rem;cursor:pointer;transition:border-color 0.2s;}
.upload-zone:hover{border-color:var(--green);}
.upload-icon{font-size:2.5rem;margin-bottom:0.5rem;}
.upload-title{font-size:1rem;font-weight:700;color:var(--green-dark);margin-bottom:0.25rem;}
.upload-sub{font-size:0.82rem;color:var(--muted);}
.upload-formats{font-size:0.75rem;color:var(--muted);margin-top:0.75rem;}
.two-col{display:grid;grid-template-columns:240px 1fr;gap:1.5rem;}
.sidebar{display:flex;flex-direction:column;gap:0.5rem;}
.folder{display:flex;align-items:center;gap:0.75rem;padding:0.7rem 1rem;border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;}
.folder:hover{background:#fff;}
.folder.active{background:#fff;border-color:var(--line);font-weight:700;color:var(--green);}
.folder-icon{font-size:1.1rem;}
.folder-name{font-size:0.88rem;color:var(--green-dark);}
.folder-count{margin-right:auto;font-size:0.75rem;background:#f0f0f0;padding:0.1rem 0.5rem;border-radius:10px;color:var(--muted);}
.main-area{display:flex;flex-direction:column;gap:1rem;}
.toolbar{display:flex;gap:0.75rem;align-items:center;}
.toolbar input{flex:1;padding:0.55rem 0.9rem;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.88rem;color:var(--green-dark);}
.toolbar input:focus{outline:none;border-color:var(--green);}
.view-btns{display:flex;gap:0.25rem;}
.view-btn{padding:0.4rem 0.6rem;border:1.5px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:0.9rem;transition:all 0.15s;}
.view-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.doc-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;transition:box-shadow 0.2s;cursor:pointer;}
.doc-card:hover{box-shadow:0 4px 14px rgba(6,43,30,0.1);}
.doc-file-icon{font-size:2.2rem;margin-bottom:0.6rem;}
.doc-name{font-size:0.88rem;font-weight:600;color:var(--green-dark);margin-bottom:0.25rem;word-break:break-word;}
.doc-meta{font-size:0.72rem;color:var(--muted);}
.doc-actions{display:flex;gap:0.4rem;margin-top:0.75rem;}
.doc-list-row{display:flex;align-items:center;gap:1rem;padding:0.8rem 1rem;background:#fff;border-radius:10px;border:1px solid var(--line);transition:box-shadow 0.15s;}
.doc-list-row:hover{box-shadow:0 2px 8px rgba(6,43,30,0.06);}
.doc-list-icon{font-size:1.4rem;flex-shrink:0;}
.doc-list-info{flex:1;}
.doc-list-name{font-size:0.88rem;font-weight:600;color:var(--green-dark);}
.doc-list-meta{font-size:0.75rem;color:var(--muted);margin-top:0.1rem;}
.doc-list-size{font-size:0.78rem;color:var(--muted);white-space:nowrap;}
.doc-list-acts{display:flex;gap:0.4rem;}
.badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:10px;font-size:0.7rem;font-weight:600;}
.badge-new{background:#f8f0e0;color:var(--gold);}
.empty-state{text-align:center;padding:3rem;color:var(--muted);}
@media(max-width:768px){.two-col{grid-template-columns:1fr;}.doc-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — مستنداتي</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>مستنداتي ووثائقي</h2>
  </div>

  <div class="upload-zone" onclick="triggerUpload()">
    <div class="upload-icon">📤</div>
    <div class="upload-title">رفع مستند جديد</div>
    <div class="upload-sub">اسحب وأفلت الملف هنا، أو انقر للاختيار</div>
    <div class="upload-formats">PDF · JPG · PNG · DOCX · XLSX — الحد الأقصى ١٠ ميجابايت</div>
  </div>

  <div class="two-col">
    <div class="sidebar" id="folderSidebar"></div>
    <div class="main-area">
      <div class="toolbar">
        <input type="text" id="docSearch" placeholder="بحث في المستندات..." oninput="filterDocs()">
        <div class="view-btns">
          <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')">⊞</button>
          <button class="view-btn" id="listViewBtn" onclick="setView('list')">☰</button>
        </div>
      </div>
      <div id="docsContainer"></div>
    </div>
  </div>
</div>

<script>
let currentFolder = 'الكل';
let currentView = 'grid';

const folders = [
  {name:'الكل',icon:'🗂️',count:18},
  {name:'وثائق الهوية',icon:'🪪',count:4},
  {name:'عقود الاستثمار',icon:'📝',count:6},
  {name:'كشوف الحساب',icon:'📊',count:5},
  {name:'شهادات الملكية',icon:'🏆',count:2},
  {name:'مراسلات رسمية',icon:'✉️',count:1},
];

const docs = [
  {id:1,name:'بطاقة الهوية الوطنية',folder:'وثائق الهوية',icon:'🪪',date:'٢٠٢٦/١/١٠',size:'١.٢ MB',isNew:false},
  {id:2,name:'جواز السفر',folder:'وثائق الهوية',icon:'🛂',date:'٢٠٢٥/٦/٢٢',size:'٢.٨ MB',isNew:false},
  {id:3,name:'وثيقة إثبات العنوان',folder:'وثائق الهوية',icon:'🏠',date:'٢٠٢٦/٣/١٥',size:'٨٠٠ KB',isNew:false},
  {id:4,name:'السجل التجاري',folder:'وثائق الهوية',icon:'📋',date:'٢٠٢٥/١١/٠١',size:'٥٠٠ KB',isNew:false},
  {id:5,name:'عقد صفقة مجمع الروضة',folder:'عقود الاستثمار',icon:'📝',date:'٢٠٢٦/٢/٠٥',size:'٣.٤ MB',isNew:false},
  {id:6,name:'عقد صفقة FinTech B2B',folder:'عقود الاستثمار',icon:'📝',date:'٢٠٢٦/٤/١٢',size:'٢.٩ MB',isNew:true},
  {id:7,name:'عقد صفقة الطاقة الشمسية',folder:'عقود الاستثمار',icon:'📝',date:'٢٠٢٦/٥/٢٠',size:'٢.١ MB',isNew:false},
  {id:8,name:'اتفاقية المستثمر الإطارية',folder:'عقود الاستثمار',icon:'🤝',date:'٢٠٢٤/١٢/٠١',size:'١.٥ MB',isNew:false},
  {id:9,name:'كشف حساب مايو ٢٠٢٦',folder:'كشوف الحساب',icon:'📊',date:'٢٠٢٦/٦/٠١',size:'٤٥٠ KB',isNew:true},
  {id:10,name:'كشف حساب أبريل ٢٠٢٦',folder:'كشوف الحساب',icon:'📊',date:'٢٠٢٦/٥/٠١',size:'٤٢٠ KB',isNew:false},
  {id:11,name:'شهادة ملكية وحدة A-٠٣',folder:'شهادات الملكية',icon:'🏆',date:'٢٠٢٦/٢/١٨',size:'٦٠٠ KB',isNew:false},
  {id:12,name:'خطاب رسمي - هيئة السوق',folder:'مراسلات رسمية',icon:'✉️',date:'٢٠٢٦/٤/٣٠',size:'٣٢٠ KB',isNew:false},
];

function buildFolders(){
  const cont = document.getElementById('folderSidebar');
  cont.textContent = '';
  folders.forEach(f => {
    const div = document.createElement('div');
    div.className = 'folder' + (f.name===currentFolder?' active':'');
    const icon = document.createElement('span');
    icon.className = 'folder-icon';
    icon.textContent = f.icon;
    const name = document.createElement('span');
    name.className = 'folder-name';
    name.textContent = f.name;
    const count = document.createElement('span');
    count.className = 'folder-count';
    count.textContent = f.count;
    div.appendChild(icon);
    div.appendChild(name);
    div.appendChild(count);
    div.onclick = () => { currentFolder = f.name; buildFolders(); filterDocs(); };
    cont.appendChild(div);
  });
}

function filterDocs(){
  const search = document.getElementById('docSearch').value.trim().toLowerCase();
  const filtered = docs.filter(d => {
    if(currentFolder !== 'الكل' && d.folder !== currentFolder) return false;
    if(search && !d.name.toLowerCase().includes(search)) return false;
    return true;
  });
  renderDocs(filtered);
}

function renderDocs(list){
  const cont = document.getElementById('docsContainer');
  cont.textContent = '';
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'لا توجد مستندات في هذا المجلد';
    cont.appendChild(empty);
    return;
  }
  if(currentView === 'grid'){
    const grid = document.createElement('div');
    grid.className = 'doc-grid';
    list.forEach(d => {
      const card = document.createElement('div');
      card.className = 'doc-card';
      const icon = document.createElement('div');
      icon.className = 'doc-file-icon';
      icon.textContent = d.icon;
      const name = document.createElement('div');
      name.className = 'doc-name';
      name.textContent = d.name;
      if(d.isNew){
        const badge = document.createElement('span');
        badge.className = 'badge badge-new';
        badge.textContent = 'جديد';
        name.appendChild(document.createTextNode(' '));
        name.appendChild(badge);
      }
      const meta = document.createElement('div');
      meta.className = 'doc-meta';
      meta.textContent = d.date + ' · ' + d.size;
      const acts = document.createElement('div');
      acts.className = 'doc-actions';
      const dlBtn = document.createElement('button');
      dlBtn.className = 'btn btn-sm btn-primary';
      dlBtn.textContent = 'تحميل';
      dlBtn.onclick = (e) => { e.stopPropagation(); downloadDoc(d.id); };
      const viewBtn = document.createElement('button');
      viewBtn.className = 'btn btn-sm btn-secondary';
      viewBtn.textContent = 'عرض';
      acts.appendChild(viewBtn);
      acts.appendChild(dlBtn);
      card.appendChild(icon);
      card.appendChild(name);
      card.appendChild(meta);
      card.appendChild(acts);
      grid.appendChild(card);
    });
    cont.appendChild(grid);
  } else {
    list.forEach(d => {
      const row = document.createElement('div');
      row.className = 'doc-list-row';
      const icon = document.createElement('div');
      icon.className = 'doc-list-icon';
      icon.textContent = d.icon;
      const info = document.createElement('div');
      info.className = 'doc-list-info';
      const name = document.createElement('div');
      name.className = 'doc-list-name';
      name.textContent = d.name;
      if(d.isNew){
        const badge = document.createElement('span');
        badge.className = 'badge badge-new';
        badge.textContent = 'جديد';
        name.appendChild(document.createTextNode(' '));
        name.appendChild(badge);
      }
      const meta = document.createElement('div');
      meta.className = 'doc-list-meta';
      meta.textContent = d.folder + ' · ' + d.date;
      info.appendChild(name);
      info.appendChild(meta);
      const size = document.createElement('div');
      size.className = 'doc-list-size';
      size.textContent = d.size;
      const acts = document.createElement('div');
      acts.className = 'doc-list-acts';
      const dlBtn = document.createElement('button');
      dlBtn.className = 'btn btn-sm btn-primary';
      dlBtn.textContent = 'تحميل';
      dlBtn.onclick = () => downloadDoc(d.id);
      acts.appendChild(dlBtn);
      row.appendChild(icon);
      row.appendChild(info);
      row.appendChild(size);
      row.appendChild(acts);
      cont.appendChild(row);
    });
  }
}

function setView(v){
  currentView = v;
  document.getElementById('gridViewBtn').classList.toggle('active', v==='grid');
  document.getElementById('listViewBtn').classList.toggle('active', v==='list');
  filterDocs();
}

function triggerUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png,.docx,.xlsx';
  input.onchange = async () => {
    if(!input.files[0]) return;
    try {
      const fd = new FormData();
      fd.append('file', input.files[0]);
      fd.append('folder', currentFolder === 'الكل' ? 'وثائق الهوية' : currentFolder);
      await fetch('/app/me/documents', { method:'POST', headers:{'x-csrf-token':'1'}, body: fd });
    } catch(e){}
  };
  input.click();
}

async function downloadDoc(id){
  try {
    await fetch('/app/me/documents/' + id + '/download', { headers:{'x-csrf-token':'1'} });
  } catch(e){}
}

buildFolders();
filterDocs();
</script>
</body>
</html>
