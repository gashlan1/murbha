<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل التوزيع - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.alloc-hero{background:linear-gradient(135deg,#062b1e 0%,#0a4d36 100%);border-radius:14px;padding:1.75rem 2rem;color:#fff;margin-bottom:2rem;}
.ah-title{font-size:1.1rem;font-weight:700;margin-bottom:0.5rem;}
.ah-desc{font-size:0.84rem;color:rgba(255,255,255,0.75);margin-bottom:1.25rem;}
.ah-profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.profile-btn{background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.2);border-radius:10px;padding:0.85rem;cursor:pointer;transition:all 0.2s;text-align:center;}
.profile-btn:hover,.profile-btn.active{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.6);}
.pb-icon{font-size:1.5rem;margin-bottom:0.3rem;}
.pb-label{font-size:0.8rem;font-weight:700;color:#fff;}
.pb-desc{font-size:0.68rem;color:rgba(255,255,255,0.65);margin-top:0.15rem;}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.alloc-donut-wrap{padding:1.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem;}
.donut-legend{width:100%;}
.legend-row{display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid var(--line);}
.legend-row:last-child{border-bottom:none;}
.legend-left{display:flex;align-items:center;gap:0.5rem;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-name{font-size:0.8rem;}
.legend-pct{font-size:0.82rem;font-weight:700;color:var(--green);}
.sector-recs{padding:1.25rem;}
.rec-item{background:var(--paper);border-radius:10px;padding:0.85rem;margin-bottom:0.75rem;border-right:3px solid var(--green);}
.rec-item:last-child{margin-bottom:0;}
.rec-item.caution{border-right-color:var(--gold);}
.rec-head{display:flex;justify-content:space-between;margin-bottom:0.25rem;}
.rec-title{font-size:0.85rem;font-weight:700;}
.rec-alloc{font-size:0.82rem;font-weight:700;color:var(--green);}
.rec-desc{font-size:0.74rem;color:var(--muted);}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:700px){.layout-2{grid-template-columns:1fr;}.ah-profiles{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — دليل التوزيع</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>دليل توزيع المحفظة الاستثمارية</h2>
      <p>توصيات مخصصة لتوزيع أموالك وفق ملف مخاطرك الشخصي</p>
    </div>
  </div>

  <div class="alloc-hero">
    <div class="ah-title">ما هو ملف مخاطرتك؟</div>
    <div class="ah-desc">اختر الملف الأنسب لك للحصول على توصيات توزيع مُخصصة</div>
    <div class="ah-profiles" id="profileBtns"></div>
  </div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>التوزيع الموصى به</h3></div>
      <div class="alloc-donut-wrap">
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>توصيات القطاعات</h3></div>
      <div class="sector-recs" id="sectorRecs"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>مبادئ التوزيع الشرعي</h3></div>
    <div style="padding:1.25rem;" id="principlesList"></div>
    <div class="action-bar">
      <button class="btn btn-primary btn-sm" onclick="applyAllocation()">تطبيق التوزيع</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="downloadGuide()">تحميل الدليل</button>
    </div>
  </div>
</div>

<script>
const PROFILES = [
  { icon: '🛡', label: 'محافظ', desc: 'مخاطرة منخفضة وعائد مستقر' },
  { icon: '⚖️', label: 'متوازن', desc: 'توازن بين المخاطرة والعائد', active: true },
  { icon: '🚀', label: 'نمو', desc: 'عائد مرتفع بمخاطرة أعلى' }
];

const LEGEND = [
  { color: '#0a4d36', name: 'مرابحة عقارية', pct: '٤٠٪' },
  { color: '#b08840', name: 'مرابحة تجارية', pct: '٢٥٪' },
  { color: '#2980b9', name: 'مرابحة صناعية', pct: '٢٠٪' },
  { color: '#27ae60', name: 'مرابحة لوجستية', pct: '١٠٪' },
  { color: '#8e44ad', name: 'احتياطي سيولة', pct: '٥٪' }
];

const RECS = [
  { title: 'العقارات', alloc: '٤٠٪', desc: 'الركيزة الأساسية — أصول ثابتة بعوائد مستقرة ١٢-١٤٪', caution: false },
  { title: 'التجارة والتجزئة', alloc: '٢٥٪', desc: 'دورة قصيرة ومرونة عالية تناسب الملف المتوازن', caution: false },
  { title: 'الصناعة والتصنيع', alloc: '٢٠٪', desc: 'نمو مستدام مع ضمانات أصول قوية', caution: false },
  { title: 'اللوجستيات', alloc: '١٠٪', desc: 'قطاع في نمو متسارع — يُنصح بالتدرج', caution: true },
  { title: 'احتياطي السيولة', alloc: '٥٪', desc: 'محفوظ للفرص الطارئة وإعادة التوازن', caution: false }
];

const PRINCIPLES = [
  { icon: '✅', text: 'خلو الصفقات من الفائدة والغرر والميسر وفق ضوابط الشريعة الإسلامية' },
  { icon: '✅', text: 'التنويع الشرعي: لا يُوضع أكثر من ٤٠٪ في قطاع واحد' },
  { icon: '✅', text: 'ربط التمويل بأصل حقيقي ملموس في كل صفقة' },
  { icon: '✅', text: 'مراجعة دورية للتوزيع كل ٦ أشهر لإعادة التوازن' },
  { icon: '⚠️', text: 'تجنب المضاربة على القطاعات المتقلبة بأكثر من ١٠٪ من المحفظة' }
];

function buildProfiles() {
  const wrap = document.getElementById('profileBtns');
  PROFILES.forEach(p => {
    const btn = document.createElement('div'); btn.className = 'profile-btn' + (p.active ? ' active' : '');
    const icon = document.createElement('div'); icon.className = 'pb-icon'; icon.textContent = p.icon;
    const label = document.createElement('div'); label.className = 'pb-label'; label.textContent = p.label;
    const desc = document.createElement('div'); desc.className = 'pb-desc'; desc.textContent = p.desc;
    btn.appendChild(icon); btn.appendChild(label); btn.appendChild(desc);
    btn.onclick = () => { document.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
    wrap.appendChild(btn);
  });
}

function buildLegend() {
  const wrap = document.getElementById('donutLegend');
  LEGEND.forEach(l => {
    const row = document.createElement('div'); row.className = 'legend-row';
    const left = document.createElement('div'); left.className = 'legend-left';
    const dot = document.createElement('div'); dot.className = 'legend-dot'; dot.style.background = l.color;
    const name = document.createElement('div'); name.className = 'legend-name'; name.textContent = l.name;
    left.appendChild(dot); left.appendChild(name);
    const pct = document.createElement('div'); pct.className = 'legend-pct'; pct.textContent = l.pct;
    row.appendChild(left); row.appendChild(pct);
    wrap.appendChild(row);
  });
}

function buildRecs() {
  const wrap = document.getElementById('sectorRecs');
  RECS.forEach(r => {
    const item = document.createElement('div'); item.className = 'rec-item' + (r.caution ? ' caution' : '');
    const head = document.createElement('div'); head.className = 'rec-head';
    const title = document.createElement('div'); title.className = 'rec-title'; title.textContent = r.title;
    const alloc = document.createElement('div'); alloc.className = 'rec-alloc'; alloc.textContent = r.alloc;
    head.appendChild(title); head.appendChild(alloc);
    const desc = document.createElement('div'); desc.className = 'rec-desc'; desc.textContent = r.desc;
    item.appendChild(head); item.appendChild(desc);
    wrap.appendChild(item);
  });
}

function buildPrinciples() {
  const wrap = document.getElementById('principlesList');
  PRINCIPLES.forEach(p => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;gap:0.75rem;padding:0.6rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;';
    const icon = document.createElement('span'); icon.textContent = p.icon;
    const text = document.createElement('span'); text.textContent = p.text;
    item.appendChild(icon); item.appendChild(text);
    wrap.appendChild(item);
  });
}

function applyAllocation() {
  fetch('/app/me/allocation-guide', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ profile: 'balanced' }) }).catch(() => {});
  alert('تم تطبيق توصيات التوزيع على محفظتك');
}

function downloadGuide() {
  fetch('/app/me/allocation-guide/export').then(r => r.json()).catch(() => {});
  alert('جاري تحميل دليل التوزيع...');
}

buildProfiles(); buildLegend(); buildRecs(); buildPrinciples();
</script>
</body>
</html>
