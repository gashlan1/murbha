<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Deal FAQ — Murbha">الأسئلة الشائعة للصفقات — مُرابحة</title>
<meta name="description" content="إجابات على الأسئلة الشائعة المتعلقة بصفقات الاستثمار الإسلامي في منصة مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  /* Search */
  .search-row{display:flex;gap:10px;margin-bottom:18px;}
  .search-input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font:500 13px Tajawal,sans-serif;background:#fff;color:var(--ink);outline:none;}
  .search-input:focus{border-color:var(--green);}
  /* Category chips */
  .cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-chip{border:1.5px solid var(--line);border-radius:20px;padding:6px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .cat-chip.active{border-color:var(--green);background:var(--green);color:#fff;}
  /* FAQ accordion */
  .faq-section{margin-bottom:28px;}
  .faq-section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--line);}
  .faq-item{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .faq-q{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;gap:12px;}
  .faq-q-text{font:700 13px Cairo,sans-serif;color:var(--green-dark);flex:1;line-height:1.6;}
  .faq-toggle{font:900 16px Cairo,sans-serif;color:var(--green);flex-shrink:0;transition:transform .2s;}
  .faq-item.open .faq-toggle{transform:rotate(45deg);}
  .faq-a{display:none;padding:0 16px 14px;font:500 13px Tajawal,sans-serif;color:var(--ink);line-height:2;border-top:1px solid var(--line);}
  .faq-item.open .faq-a{display:block;}
  .faq-badge{display:inline-block;border-radius:6px;padding:2px 8px;font:700 9px Cairo,sans-serif;margin-bottom:6px;}
  .badge-general{background:#e8f5e9;color:#2e7d32;}
  .badge-shariah{background:#fff8e1;color:#a07020;}
  .badge-returns{background:#e3f2fd;color:#1565c0;}
  .badge-risk{background:#fdecea;color:#c54a3a;}
  .badge-process{background:#f3e5f5;color:#7b1fa2;}
  /* Contact CTA */
  .contact-cta{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-top:28px;}
  .contact-cta p{font:500 13px Tajawal,sans-serif;color:var(--muted);margin-bottom:14px;line-height:1.8;}
  .btn-contact{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:11px 28px;font:900 12px Cairo,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-contact:hover{background:var(--green);}
  .no-results{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Deal FAQ">الأسئلة الشائعة للصفقات</h1>
    <p data-en="Find answers to the most common questions about investing on Murbha.">اعثر على إجابات لأكثر الأسئلة شيوعاً حول الاستثمار في منصة مُرابحة.</p>
  </div>

  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="ابحث في الأسئلة…" data-en-placeholder="Search questions…" />
  </div>

  <div class="cat-bar" id="catBar">
    <div class="cat-chip active" data-cat="">الكل</div>
    <div class="cat-chip" data-cat="general">عام</div>
    <div class="cat-chip" data-cat="shariah">الشريعة</div>
    <div class="cat-chip" data-cat="returns">العوائد</div>
    <div class="cat-chip" data-cat="risk">المخاطر</div>
    <div class="cat-chip" data-cat="process">العملية</div>
  </div>

  <div id="faqContainer"></div>

  <div class="contact-cta">
    <p data-en="Didn't find your answer? Our support team is here to help.">لم تجد إجابتك؟ فريق الدعم لدينا هنا للمساعدة.</p>
    <a class="btn-contact" href="mailto:support@murbha.sa" data-en="Contact Support">تواصل مع الدعم</a>
  </div>
</main>

<script>
(function(){
  const faqs = [
    {cat:'general', q:'ما هي منصة مُرابحة؟', a:'مُرابحة هي منصة استثمار إسلامية تتيح للمستثمرين المشاركة في صفقات المرابحة والصكوك الإسلامية المتوافقة مع أحكام الشريعة الإسلامية. نربط المستثمرين بفرص استثمارية مدروسة ومراجعة من هيئة شرعية معتمدة.'},
    {cat:'general', q:'كيف أبدأ الاستثمار في المنصة؟', a:'أنشئ حساباً، أكمل عملية التحقق من الهوية (KYC)، أضف رصيداً لمحفظتك، ثم تصفح الصفقات المتاحة واختر ما يناسب أهدافك الاستثمارية.'},
    {cat:'general', q:'ما الحد الأدنى للاستثمار؟', a:'يختلف الحد الأدنى من صفقة إلى أخرى، وعادةً يبدأ من 1,000 ريال سعودي. ستجد الحد الأدنى المحدد في تفاصيل كل صفقة.'},
    {cat:'general', q:'هل المنصة مرخصة؟', a:'نعم، منصة مُرابحة مرخصة ومنظمة من قبل الهيئة المعنية وتعمل وفق أطر تنظيمية واضحة لضمان حقوق المستثمرين.'},
    {cat:'shariah', q:'هل الاستثمارات متوافقة مع الشريعة الإسلامية؟', a:'نعم، جميع الصفقات المدرجة في المنصة تخضع لمراجعة هيئة شرعية مستقلة تضم علماء متخصصين. لا تُقبل أي صفقة دون الحصول على موافقة شرعية.'},
    {cat:'shariah', q:'ما هي المرابحة؟', a:'المرابحة هي عقد بيع إسلامي يقوم على شراء المنصة للأصل ثم بيعه للعميل بربح معلوم ومتفق عليه مسبقاً. يُعد هذا العقد بديلاً شرعياً للتمويل بالفائدة.'},
    {cat:'shariah', q:'ما هي الصكوك؟', a:'الصكوك هي أدوات تمويل إسلامية تمثل حصصاً في ملكية أصول حقيقية أو منافعها. تُدر عوائد مرتبطة بأداء الأصل وليس بفائدة ربوية.'},
    {cat:'shariah', q:'هل تُفرض رسوم متأخرات؟', a:'لا تُفرض فوائد تأخير ربوية. في حال التأخر، تُطبق آليات شرعية معتمدة تضمن حقوق الطرفين دون الوقوع في الربا.'},
    {cat:'returns', q:'كيف تُحسب العوائد؟', a:'تتباين آلية احتساب العوائد بحسب نوع الصفقة. في المرابحة، تكون نسبة الربح ثابتة ومعلومة عند الاستثمار. في الصكوك، قد تكون العوائد متغيرة مرتبطة بأداء الأصل.'},
    {cat:'returns', q:'متى أتسلم عوائدي؟', a:'يُحدد جدول توزيع العوائد في تفاصيل كل صفقة. عادةً تكون التوزيعات شهرية أو ربع سنوية أو عند استحقاق الصفقة.'},
    {cat:'returns', q:'كيف تُدفع العوائد؟', a:'تُضاف العوائد تلقائياً إلى رصيد محفظتك في المنصة. يمكنك بعدها سحبها إلى حسابك البنكي أو إعادة استثمارها في صفقات جديدة.'},
    {cat:'returns', q:'هل العوائد مضمونة؟', a:'لا تُضمن العوائد في الاستثمارات الإسلامية المتوافقة مع الشريعة، إذ يرتبط العائد بأداء الأصل الحقيقي. تُفصح كل صفقة بوضوح عن نسبة العائد المتوقع وعوامل الخطر.'},
    {cat:'risk', q:'ما مخاطر الاستثمار في المنصة؟', a:'كغيرها من الاستثمارات، تنطوي صفقاتنا على مخاطر منها: مخاطر السوق، ومخاطر تعثر المقترض، ومخاطر السيولة. نُقيّم كل صفقة ونُصنفها حسب مستوى الخطر لتمكينك من اتخاذ قرار مستنير.'},
    {cat:'risk', q:'كيف تُقيّمون الصفقات قبل إدراجها؟', a:'تمر كل صفقة بتدقيق مالي وشرعي وقانوني شامل قبل الإدراج. يشمل ذلك تقييم الجدارة الائتمانية للطرف الآخر، وتقييم الأصل المرتبط بالصفقة، ومراجعة وثائق العقد.'},
    {cat:'risk', q:'ماذا يحدث إذا تعثرت الصفقة؟', a:'في حال التعثر، تعمل المنصة على متابعة استرداد حقوق المستثمرين عبر آليات قانونية وشرعية معتمدة. يُفصّل البروسبكتوس الخاص بكل صفقة إجراءات التعثر المحتملة.'},
    {cat:'risk', q:'هل يمكنني بيع استثماري قبل انتهاء مدته؟', a:'تتوفر في المنصة سوق ثانوية تتيح بيع بعض الاستثمارات قبل موعد استحقاقها، وفقاً لشروط كل صفقة وتوفر المشترين في السوق.'},
    {cat:'process', q:'كم تستغرق عملية التحقق من الهوية؟', a:'تستغرق عملية KYC عادةً من 1 إلى 3 أيام عمل بعد رفع المستندات المطلوبة. ستتلقى إشعاراً بالبريد الإلكتروني عند اكتمال المراجعة.'},
    {cat:'process', q:'ما المستندات المطلوبة للتسجيل؟', a:'تحتاج إلى: هوية وطنية سارية المفعول أو إقامة نظامية، صورة شخصية واضحة، وإثبات عنوان (كاشف بنكي أو فاتورة خدمات حديثة).'},
    {cat:'process', q:'كيف أُودع الأموال في محفظتي؟', a:'يمكنك الإيداع عبر التحويل البنكي المباشر أو بطاقة مدى أو STC Pay. تُعالج معظم العمليات فورياً أو خلال يوم عمل واحد.'},
    {cat:'process', q:'كم تستغرق عملية السحب؟', a:'تُعالج طلبات السحب خلال 2 إلى 5 أيام عمل وفقاً للبنك المستهدف وطريقة الإيداع المختارة.'},
  ];

  let activeCat = '', searchText = '';

  function filtered() {
    return faqs.filter(f => {
      const matchCat = !activeCat || f.cat === activeCat;
      const q = (f.q || '').toLowerCase();
      const a = (f.a || '').toLowerCase();
      const matchSearch = !searchText || q.includes(searchText) || a.includes(searchText);
      return matchCat && matchSearch;
    });
  }

  const catNames = {general:'عام',shariah:'الشريعة',returns:'العوائد',risk:'المخاطر',process:'العملية'};
  const badgeClass = {general:'badge-general',shariah:'badge-shariah',returns:'badge-returns',risk:'badge-risk',process:'badge-process'};

  function render() {
    const container = document.getElementById('faqContainer');
    container.textContent = '';
    const items = filtered();
    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'no-results';
      p.textContent = 'لا توجد نتائج مطابقة.';
      container.appendChild(p);
      return;
    }

    const groups = {};
    items.forEach(f => {
      if (!groups[f.cat]) groups[f.cat] = [];
      groups[f.cat].push(f);
    });

    Object.keys(groups).forEach(cat => {
      const section = document.createElement('div');
      section.className = 'faq-section';

      if (activeCat === '' || Object.keys(groups).length > 1) {
        const title = document.createElement('div');
        title.className = 'faq-section-title';
        title.textContent = catNames[cat] || cat;
        section.appendChild(title);
      }

      groups[cat].forEach(f => {
        const item = document.createElement('div');
        item.className = 'faq-item';

        const badge = document.createElement('div');
        badge.className = 'faq-badge ' + (badgeClass[f.cat] || 'badge-general');
        badge.textContent = catNames[f.cat] || f.cat;

        const qRow = document.createElement('div');
        qRow.className = 'faq-q';

        const qText = document.createElement('div');
        qText.className = 'faq-q-text';
        qText.textContent = f.q;

        const toggle = document.createElement('div');
        toggle.className = 'faq-toggle';
        toggle.textContent = '+';

        qRow.appendChild(qText);
        qRow.appendChild(toggle);

        const aDiv = document.createElement('div');
        aDiv.className = 'faq-a';

        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'faq-badge ' + (badgeClass[f.cat] || 'badge-general');
        badgeSpan.textContent = catNames[f.cat] || f.cat;
        badgeSpan.style.marginBottom = '8px';
        badgeSpan.style.display = 'inline-block';

        const answerText = document.createElement('div');
        answerText.style.marginTop = '8px';
        answerText.textContent = f.a;

        aDiv.appendChild(badgeSpan);
        aDiv.appendChild(answerText);

        item.appendChild(qRow);
        item.appendChild(aDiv);

        qRow.addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item.open').forEach(el => el.classList.remove('open'));
          if (!isOpen) item.classList.add('open');
        });

        section.appendChild(item);
      });
      container.appendChild(section);
    });
  }

  document.getElementById('catBar').querySelectorAll('.cat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    searchText = e.target.value.trim().toLowerCase();
    render();
  });

  render();
}());
</script>
</body>
</html>
