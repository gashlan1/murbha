<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجمع السيولة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.layout-2{display:grid;grid-template-columns:1.3fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.pool-visual{padding:1.5rem;text-align:center;}
.pool-ring{width:140px;height:140px;border-radius:50%;border:14px solid #e8e2d6;margin:0 auto 1rem;position:relative;display:flex;align-items:center;justify-content:center;}
.pool-ring-fill{position:absolute;inset:0;border-radius:50%;border:14px solid transparent;border-top-color:var(--green);border-right-color:var(--green);transform:rotate(-30deg);}
.pool-center{}
.pool-pct{font-size:1.6rem;font-weight:700;color:var(--green);}
.pool-sublbl{font-size:0.7rem;color:var(--muted);}
.pool-legend{display:flex;gap:1.5rem;justify-content:center;margin-top:0.75rem;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:0.35rem;font-size:0.75rem;}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.flow-list{padding:1.25rem;}
.flow-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.flow-row:last-child{border-bottom:none;}
.flow-label{color:var(--muted);}
.flow-val{font-weight:700;}
.flow-val.in{color:var(--green);}
.flow-val.out{color:#c0392b;}
.tx-list{padding:1.25rem;}
.tx-row{display:flex;justify-content:space-between;padding:0.55rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.tx-row:last-child{border-bottom:none;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.layout-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — مجمع السيولة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>إدارة مجمع السيولة</h2>
      <p>رصد حركة الأموال وإدارة الاحتياطيات النقدية للمنصة</p>
    </div>
    <button class="btn btn-primary" onclick="exportPool()">تصدير التقرير</button>
  </div>

  <div class="stats" id="lpStats"></div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>حالة المجمع</h3></div>
      <div class="pool-visual" id="poolVisual"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>تدفقات اليوم</h3></div>
      <div class="flow-list" id="flowList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>آخر المعاملات</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportPool()">تصدير</button>
    </div>
    <div class="tx-list" id="txList"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="rebalance()">إعادة التوازن</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="exportPool()">تصدير</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٨.٢ م ر.س', lbl: 'إجمالي المجمع' },
  { val: '٦٨٪', lbl: 'مُستثمَر في صفقات' },
  { val: '٣٢٪', lbl: 'سيولة متاحة' },
  { val: '١.٤ م ر.س', lbl: 'تدفق شهري صافٍ' }
];

const FLOWS = [
  { label: 'إيداعات مستثمرين', val: '+٣٨٢,٠٠٠ ر.س', cls: 'in' },
  { label: 'سحوبات موافَق عليها', val: '-١٤٨,٠٠٠ ر.س', cls: 'out' },
  { label: 'عوائد واردة من صفقات', val: '+٢٢٤,٠٠٠ ر.س', cls: 'in' },
  { label: 'مدفوعات للمستثمرين', val: '-٩٦,٠٠٠ ر.س', cls: 'out' },
  { label: 'صافي التدفق اليومي', val: '+٣٦٢,٠٠٠ ر.س', cls: 'in' }
];

const TXS = [
  { desc: 'إيداع — أحمد العمري', amount: '+٥٠,٠٠٠ ر.س', time: '١٤:٣٢', cls: 'in' },
  { desc: 'سحب — سارة الغامدي', amount: '-٢٨,٠٠٠ ر.س', time: '١٣:١٥', cls: 'out' },
  { desc: 'عائد صفقة #4920', amount: '+٢٨,٨٠٠ ر.س', time: '١٢:٠٠', cls: 'in' },
  { desc: 'توزيع أرباح — ٤٥ مستثمر', amount: '-٩٦,٠٠٠ ر.س', time: '١١:٣٠', cls: 'out' },
  { desc: 'إيداع — خالد المطيري', amount: '+٢٠,٠٠٠ ر.س', time: '١٠:٤٥', cls: 'in' }
];

function buildStats() {
  const wrap = document.getElementById('lpStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildPoolVisual() {
  const wrap = document.getElementById('poolVisual');
  const ring = document.createElement('div'); ring.className = 'pool-ring';
  const fill = document.createElement('div'); fill.className = 'pool-ring-fill';
  const center = document.createElement('div'); center.className = 'pool-center';
  const pct = document.createElement('div'); pct.className = 'pool-pct'; pct.textContent = '٦٨٪';
  const sublbl = document.createElement('div'); sublbl.className = 'pool-sublbl'; sublbl.textContent = 'مُستثمَر';
  center.appendChild(pct); center.appendChild(sublbl);
  ring.appendChild(fill); ring.appendChild(center);
  const legend = document.createElement('div'); legend.className = 'pool-legend';
  [['#0a4d36', 'مُستثمَر ٦٨٪'], ['#d0cbc0', 'سيولة ٣٢٪']].forEach(([color, label]) => {
    const item = document.createElement('div'); item.className = 'legend-item';
    const dot = document.createElement('div'); dot.className = 'legend-dot'; dot.style.background = color;
    const lbl = document.createElement('span'); lbl.textContent = label;
    item.appendChild(dot); item.appendChild(lbl);
    legend.appendChild(item);
  });
  wrap.appendChild(ring); wrap.appendChild(legend);
}

function buildFlows() {
  const wrap = document.getElementById('flowList');
  FLOWS.forEach(f => {
    const row = document.createElement('div'); row.className = 'flow-row';
    const lbl = document.createElement('div'); lbl.className = 'flow-label'; lbl.textContent = f.label;
    const val = document.createElement('div'); val.className = 'flow-val ' + f.cls; val.textContent = f.val;
    row.appendChild(lbl); row.appendChild(val);
    wrap.appendChild(row);
  });
}

function buildTxs() {
  const wrap = document.getElementById('txList');
  TXS.forEach(t => {
    const row = document.createElement('div'); row.className = 'tx-row';
    const left = document.createElement('div');
    const desc = document.createElement('span'); desc.style.fontWeight = '600'; desc.textContent = t.desc;
    const time = document.createElement('span'); time.style.cssText = 'color:var(--muted);font-size:0.72rem;margin-right:0.5rem;'; time.textContent = ' · ' + t.time;
    left.appendChild(desc); left.appendChild(time);
    const amt = document.createElement('div'); amt.style.cssText = 'font-weight:700;color:' + (t.cls === 'in' ? 'var(--green)' : '#c0392b') + ';'; amt.textContent = t.amount;
    row.appendChild(left); row.appendChild(amt);
    wrap.appendChild(row);
  });
}

function rebalance() {
  fetch('/app/admin/liquidity-pool/rebalance', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'rebalance' }) }).catch(() => {});
  alert('جاري إعادة توازن مجمع السيولة...');
}

function exportPool() {
  fetch('/app/admin/liquidity-pool/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير تقرير مجمع السيولة...');
}

buildStats(); buildPoolVisual(); buildFlows(); buildTxs();
</script>
</body>
</html>
