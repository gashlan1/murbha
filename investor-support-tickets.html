<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تذاكر الدعم - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.layout-2{display:grid;grid-template-columns:1fr 1.6fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.ticket-list{padding:1rem;}
.ticket-item{border:1px solid var(--line);border-radius:10px;padding:0.9rem;margin-bottom:0.65rem;cursor:pointer;transition:box-shadow 0.15s;}
.ticket-item:hover{box-shadow:0 2px 8px rgba(6,43,30,0.08);}
.ticket-item.active{border-color:var(--green);}
.ticket-item:last-child{margin-bottom:0;}
.ti-head{display:flex;justify-content:space-between;margin-bottom:0.3rem;}
.ti-id{font-size:0.72rem;color:var(--muted);}
.ti-pill{display:inline-block;padding:0.1rem 0.5rem;border-radius:8px;font-size:0.68rem;font-weight:700;}
.pill-open{background:#fef3cd;color:#92400e;}
.pill-replied{background:#e8f5ed;color:#1e8449;}
.pill-closed{background:#f0f0f0;color:var(--muted);}
.ti-title{font-size:0.84rem;font-weight:700;margin-bottom:0.2rem;}
.ti-meta{font-size:0.7rem;color:var(--muted);}
.chat-wrap{display:flex;flex-direction:column;height:100%;}
.chat-messages{padding:1.25rem;flex:1;overflow-y:auto;max-height:320px;}
.msg{margin-bottom:0.85rem;}
.msg-user{text-align:right;}
.msg-support{text-align:right;}
.msg-bubble{display:inline-block;padding:0.6rem 0.9rem;border-radius:12px;font-size:0.82rem;max-width:80%;line-height:1.5;}
.bubble-user{background:var(--green);color:#fff;border-radius:12px 12px 0 12px;}
.bubble-support{background:#f5f0e8;color:var(--green-dark);border-radius:12px 12px 12px 0;}
.msg-time{font-size:0.65rem;color:var(--muted);margin-top:0.2rem;}
.chat-input-wrap{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
.chat-input{flex:1;padding:0.5rem 0.75rem;border:1px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.86rem;}
.new-form{padding:1.25rem;}
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:0.35rem;color:var(--muted);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:0.5rem 0.75rem;border:1px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.86rem;}
.form-group textarea{resize:vertical;min-height:80px;}
@media(max-width:800px){.layout-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — تذاكر الدعم</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>مركز الدعم الفني</h2>
      <p>تابع طلبات الدعم وتواصل مع فريق مُرابحة مباشرةً</p>
    </div>
    <button class="btn btn-primary" onclick="showNewTicket()">تذكرة جديدة</button>
  </div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>تذاكري</h3></div>
      <div class="ticket-list" id="ticketList"></div>
    </div>
    <div class="card" style="margin-bottom:0;" id="chatCard">
      <div class="card-head"><h3>محادثة — تذكرة #٢٠٢٦-١٠٤</h3></div>
      <div class="chat-wrap">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-wrap">
          <input type="text" class="chat-input" id="chatInput" placeholder="اكتب ردك هنا...">
          <button class="btn btn-primary btn-sm" onclick="sendReply()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>فتح تذكرة جديدة</h3></div>
    <div class="new-form" id="newTicketForm"></div>
    <div style="padding:0 1.25rem 1.25rem;">
      <button class="btn btn-gold btn-sm" onclick="submitTicket()">إرسال التذكرة</button>
    </div>
  </div>
</div>

<script>
const TICKETS = [
  { id: '#٢٠٢٦-١٠٤', title: 'تأخر في استلام عوائد صفقة #4920', pill: 'pill-open', label: 'مفتوحة', meta: 'منذ يومين' },
  { id: '#٢٠٢٦-٠٩٨', title: 'استفسار عن إجراءات التوثيق KYC', pill: 'pill-replied', label: 'تم الرد', meta: 'منذ ٥ أيام' },
  { id: '#٢٠٢٦-٠٨٥', title: 'مشكلة في تحميل كشف الحساب', pill: 'pill-closed', label: 'مغلقة', meta: 'منذ أسبوعين' }
];

const MESSAGES = [
  { sender: 'user', text: 'مرحباً، لم أستلم عوائد صفقة #4920 حتى الآن رغم انتهاء مدتها.', time: '١٠:٣٠' },
  { sender: 'support', text: 'مرحباً بك! نحن نراجع الطلب الآن. هل يمكنك التأكد من تحديث بيانات حسابك البنكي؟', time: '١١:٠٠' },
  { sender: 'user', text: 'نعم، البيانات محدثة. ما المتوقع لإتمام التحويل؟', time: '١١:١٥' },
  { sender: 'support', text: 'سيتم إتمام التحويل خلال ٢٤ ساعة. اعتذر عن التأخير.', time: '١١:٣٠' }
];

const NEW_FIELDS = [
  { label: 'موضوع التذكرة', type: 'input', placeholder: 'وصف موجز للمشكلة' },
  { label: 'الفئة', type: 'select', opts: ['مدفوعات وعوائد', 'صفقات وعقود', 'حساب وتوثيق', 'مشاكل تقنية', 'أخرى'] },
  { label: 'الأولوية', type: 'select', opts: ['عادية', 'عاجلة', 'حرجة'] },
  { label: 'تفاصيل المشكلة', type: 'textarea', placeholder: 'اشرح المشكلة بالتفصيل...' }
];

function buildTickets() {
  const wrap = document.getElementById('ticketList');
  TICKETS.forEach((t, i) => {
    const item = document.createElement('div'); item.className = 'ticket-item' + (i === 0 ? ' active' : '');
    item.onclick = () => { document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active')); item.classList.add('active'); };
    const head = document.createElement('div'); head.className = 'ti-head';
    const id = document.createElement('span'); id.className = 'ti-id'; id.textContent = t.id;
    const pill = document.createElement('span'); pill.className = 'ti-pill ' + t.pill; pill.textContent = t.label;
    head.appendChild(id); head.appendChild(pill);
    const title = document.createElement('div'); title.className = 'ti-title'; title.textContent = t.title;
    const meta = document.createElement('div'); meta.className = 'ti-meta'; meta.textContent = t.meta;
    item.appendChild(head); item.appendChild(title); item.appendChild(meta);
    wrap.appendChild(item);
  });
}

function buildChat() {
  const wrap = document.getElementById('chatMessages');
  MESSAGES.forEach(m => {
    const msg = document.createElement('div'); msg.className = 'msg msg-' + m.sender;
    const bubble = document.createElement('div'); bubble.className = 'msg-bubble bubble-' + m.sender; bubble.textContent = m.text;
    const time = document.createElement('div'); time.className = 'msg-time'; time.textContent = m.time;
    msg.appendChild(bubble); msg.appendChild(time);
    wrap.appendChild(msg);
  });
}

function buildNewForm() {
  const wrap = document.getElementById('newTicketForm');
  NEW_FIELDS.forEach(f => {
    const group = document.createElement('div'); group.className = 'form-group';
    const label = document.createElement('label'); label.textContent = f.label;
    let input;
    if (f.type === 'select') {
      input = document.createElement('select');
      f.opts.forEach(o => { const opt = document.createElement('option'); opt.textContent = o; input.appendChild(opt); });
    } else if (f.type === 'textarea') {
      input = document.createElement('textarea'); input.placeholder = f.placeholder || '';
    } else {
      input = document.createElement('input'); input.type = 'text'; input.placeholder = f.placeholder || '';
    }
    group.appendChild(label); group.appendChild(input);
    wrap.appendChild(group);
  });
}

function sendReply() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  fetch('/app/me/support-tickets/reply', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ ticketId: '2026-104', message: text }) }).catch(() => {});
  const wrap = document.getElementById('chatMessages');
  const msg = document.createElement('div'); msg.className = 'msg msg-user';
  const bubble = document.createElement('div'); bubble.className = 'msg-bubble bubble-user'; bubble.textContent = text;
  const time = document.createElement('div'); time.className = 'msg-time'; time.textContent = 'الآن';
  msg.appendChild(bubble); msg.appendChild(time);
  wrap.appendChild(msg);
  wrap.scrollTop = wrap.scrollHeight;
  input.value = '';
}

function submitTicket() {
  fetch('/app/me/support-tickets', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ ticket: {} }) }).catch(() => {});
  alert('تم إرسال تذكرة الدعم بنجاح. سيتواصل معك الفريق خلال ٢٤ ساعة.');
}

function showNewTicket() { document.getElementById('newTicketForm').scrollIntoView({ behavior: 'smooth' }); }

buildTickets(); buildChat(); buildNewForm();
</script>
</body>
</html>
