<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>إيصال استثمار — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/site.css" />
<script src="app.js"></script>
<style>
:root { --ink: #0d1612; --paper: #fbf6ea; --green: #0a4d36; --green-dark: #062b1e; --gold: #b08840; --muted: #6b7268; --line: rgba(13,22,18,0.10); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body { font-family: 'Tajawal','Geeza Pro',system-ui,sans-serif; color: var(--ink); line-height: 1.6; }
.toolbar { position: sticky; top: 0; background: rgba(251,246,234,0.92); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--line); padding: 12px 18px; display: flex; align-items: center; gap: 12px; z-index: 100; }
.back { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--green-dark); font: 800 18px Cairo,sans-serif; }
.title { font: 800 16px Cairo,sans-serif; color: var(--green-dark); flex: 1; }
.print-btn { background: var(--green-dark); color: #fff; border: 0; padding: 9px 18px; border-radius: 8px; font: 800 13px Cairo,sans-serif; cursor: pointer; }
main { max-width: 700px; margin: 24px auto; padding: 0 18px; }
.receipt { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 36px; box-shadow: 0 12px 30px rgba(13,22,18,0.05); }
.header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding-bottom: 22px; border-bottom: 2px solid var(--green-dark); margin-bottom: 22px; }
.brand-name { font: 900 22px Cairo,sans-serif; color: var(--green-dark); }
.brand-tag { font: 600 12px Tajawal,sans-serif; color: var(--muted); margin-top: 2px; }
.meta { text-align: end; }
.meta .lbl { font: 500 10px Tajawal,sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.meta .val { font: 800 14px Cairo,sans-serif; color: var(--ink); margin-bottom: 6px; }
.title-row { font: 900 18px Cairo,sans-serif; color: var(--green-dark); margin-bottom: 18px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.cell { background: var(--paper); padding: 12px 14px; border-radius: 10px; }
.cell .k { font: 500 11px Tajawal,sans-serif; color: var(--muted); margin-bottom: 4px; }
.cell .v { font: 800 14px Cairo,sans-serif; color: var(--ink); word-break: break-word; }
.cell .v.mono { font-family: monospace; direction: ltr; text-align: start; }
.cell.full { grid-column: 1 / -1; }
.amounts { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; padding: 22px; border-radius: 12px; margin-bottom: 18px; }
.amounts .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.amounts .row.total { border-top: 1px dashed rgba(255,255,255,0.3); padding-top: 14px; margin-top: 8px; }
.amounts .row .k { font-size: 13px; color: rgba(255,255,255,0.85); }
.amounts .row .v { font: 800 16px Cairo,sans-serif; }
.amounts .row.total .v { font-size: 22px; color: #d4ac6e; }
.footer { padding-top: 18px; border-top: 1px dashed var(--line); text-align: center; font-size: 11px; color: var(--muted); line-height: 1.7; }
.footer b { color: var(--green-dark); }
.error { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
@media print {
  @page { size: A4; margin: 14mm; }
  .toolbar, .skip-link, footer, nav, .desktop-sidebar, .tabbar, #consentBanner, #pwaInstall, #maintBanner, #tourOverlay { display: none !important; }
  html, body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 0 !important; margin: 0 !important; }
  body.has-sidebar { padding-inline-start: 0 !important; }
  .receipt { box-shadow: none; border: 0; border-radius: 0; padding: 0; max-width: 100% !important; }
  main { margin: 0; padding: 0; }
  a { color: inherit !important; text-decoration: none !important; }
  .receipt::after {
    content: 'تم إنشاء هذا الإيصال إلكترونياً من منصة مُرابحة — لا يحتاج توقيعاً.';
    display: block; margin-top: 20px; font-size: 10px; color: #6b7268; border-top: 1px solid #ccc; padding-top: 10px;
  }
}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<div class="toolbar">
  <a href="portfolio.html" class="back" aria-label="رجوع">←</a>
  <div class="title" id="toolbarTitle">إيصال استثمار</div>
  <button id="rcptLangBtn" type="button" style="background:transparent;border:1px solid rgba(13,22,18,0.15);border-radius:999px;padding:6px 12px;font:800 11px Cairo,sans-serif;color:#0d1612;cursor:pointer;margin-inline-end:8px;">EN</button>
  <button id="rcptEmailBtn" type="button" style="background:#fff;border:1px solid rgba(13,22,18,0.15);border-radius:999px;padding:6px 12px;font:800 11px Cairo,sans-serif;color:#0d1612;cursor:pointer;margin-inline-end:8px;">📧 إرسال إلى بريدي</button>
  <button class="print-btn" onclick="window.print()" id="printBtn">🖨 طباعة / حفظ PDF</button>
</div>

<main id="main">
  <div id="receiptRoot"><div class="error">جاري التحميل...</div></div>
</main>

<script>
const LANG_KEY = 'mrb_receipt_lang';
let LANG = (() => { try { return localStorage.getItem(LANG_KEY) || 'ar'; } catch { return 'ar'; } })();
const setLang = (l) => { LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch {} };
const isEN = () => LANG === 'en';

const arNum = (n) => n == null ? '—' : Number(n).toLocaleString(isEN() ? 'en-US' : 'ar-SA');
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(isEN() ? 'en-GB' : 'ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }) : '—';
const STATUS_AR = { active: 'نشط', completed: 'مكتمل', pending_signature: 'بانتظار التوقيع', cancelled: 'ملغى' };
const STATUS_EN = { active: 'Active', completed: 'Completed', pending_signature: 'Pending signature', cancelled: 'Cancelled' };
const T = {
  toolbar:   { ar: 'إيصال استثمار', en: 'Investment Receipt' },
  brandName: { ar: 'منصة مُرابحة', en: 'Murbha Platform' },
  brandTag:  { ar: 'منصة الشراكة الاستثمارية الشرعية', en: 'Sharia-compliant investment partnership' },
  receiptNo: { ar: 'رقم الإيصال', en: 'Receipt No.' },
  date:      { ar: 'التاريخ', en: 'Date' },
  title:     { ar: 'إيصال استثمار — ', en: 'Investment Receipt — ' },
  investor:  { ar: 'اسم المستثمر', en: 'Investor name' },
  accountId: { ar: 'معرّف الحساب', en: 'Account ID' },
  project:   { ar: 'اسم المشروع', en: 'Project' },
  category:  { ar: 'القطاع', en: 'Sector' },
  term:      { ar: 'المدّة', en: 'Term' },
  months:    { ar: 'شهر', en: 'months' },
  rate:      { ar: 'العائد السنوي المتوقع', en: 'Expected annual return' },
  contract:  { ar: 'رقم العقد', en: 'Contract No.' },
  status:    { ar: 'حالة الاستثمار', en: 'Status' },
  signed:    { ar: 'تاريخ التوقيع', en: 'Signed at' },
  principal: { ar: 'مبلغ الاستثمار', en: 'Principal' },
  profit:    { ar: 'الربح المتوقع', en: 'Expected profit' },
  total:     { ar: 'الإجمالي المتوقع', en: 'Expected total' },
  sar:       { ar: 'ر.س', en: 'SAR' },
  footerL1a: { ar: 'هذا الإيصال يثبت تفاصيل استثمارك على منصة ', en: 'This receipt records your investment on ' },
  footerL1b: { ar: '، يُحفظ في حسابك دائماً ويمكن طباعته أو حفظه بصيغة PDF.', en: '. Stored permanently in your account, printable as PDF.' },
  managedBy: { ar: 'مُدارة بواسطة ', en: 'Operated by ' },
  forQ:      { ar: ' · للاستفسار: ', en: ' · Support: ' },
  small:     { ar: 'صادر إلكترونياً — لا يحتاج إلى ختم أو توقيع.', en: 'Electronically issued — no stamp or signature required.' },
  print:     { ar: '🖨 طباعة / حفظ PDF', en: '🖨 Print / Save PDF' },
};
const tr = (k) => T[k]?.[LANG] ?? T[k]?.ar ?? '';

function cell(k, v, opts = {}) {
  const c = document.createElement('div'); c.className = 'cell' + (opts.full ? ' full' : '');
  const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = k;
  const vv = document.createElement('div'); vv.className = 'v' + (opts.mono ? ' mono' : '');
  vv.textContent = v == null || v === '' ? '—' : String(v);
  c.append(kk, vv);
  return c;
}

async function renderReceipt() {
  const user = await App.requireAuth('login.html?next=/receipt.html');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('inv') || '';
  const root = document.getElementById('receiptRoot');
  root.replaceChildren();
  document.documentElement.lang = LANG;
  document.documentElement.dir = isEN() ? 'ltr' : 'rtl';
  document.getElementById('toolbarTitle').textContent = tr('toolbar');
  document.getElementById('printBtn').textContent = tr('print');
  document.getElementById('rcptLangBtn').textContent = isEN() ? 'AR' : 'EN';
  if (!id) {
    const e = document.createElement('div'); e.className = 'error'; e.textContent = 'معرّف الاستثمار مفقود.';
    root.appendChild(e); return;
  }
  let inv = null, project = null;
  try {
    const { investments } = await App.api('GET', '/app/portfolio');
    const all = investments || [];
    inv = all.find(i => i.id === id || i.contractId === id);
    if (!inv) { const e = document.createElement('div'); e.className='error'; e.textContent='لم يُعثر على الاستثمار.'; root.appendChild(e); return; }
    project = inv.project || null;
  } catch (e) {
    const x = document.createElement('div'); x.className='error'; x.textContent='تعذّر تحميل البيانات.'; root.appendChild(x); return;
  }

  const expected = Number(inv.expectedReturn || 0);
  const principal = Number(inv.amount || 0);
  const profit = Math.max(0, expected - principal);

  const r = document.createElement('div'); r.className = 'receipt';

  const head = document.createElement('div'); head.className = 'header';
  const brand = document.createElement('div');
  const bn = document.createElement('div'); bn.className = 'brand-name'; bn.textContent = tr('brandName');
  const bt = document.createElement('div'); bt.className = 'brand-tag'; bt.textContent = tr('brandTag');
  brand.append(bn, bt);
  const meta = document.createElement('div'); meta.className = 'meta';
  const _l1 = document.createElement('div'); _l1.className='lbl'; _l1.textContent=tr('receiptNo');
  const _v1 = document.createElement('div'); _v1.className='val'; _v1.textContent='MRB-' + inv.id.slice(-8).toUpperCase();
  const _l2 = document.createElement('div'); _l2.className='lbl'; _l2.textContent=tr('date');
  const _v2 = document.createElement('div'); _v2.className='val'; _v2.textContent=fmtDate(inv.createdAt);
  meta.append(_l1, _v1, _l2, _v2);
  head.append(brand, meta);

  const titleRow = document.createElement('div'); titleRow.className = 'title-row';
  titleRow.textContent = tr('title') + (project?.name || (isEN() ? 'Project' : 'مشروع'));

  const statusMap = isEN() ? STATUS_EN : STATUS_AR;
  const grid = document.createElement('div'); grid.className = 'grid';
  grid.append(
    cell(tr('investor'), user.name),
    cell(tr('accountId'), user.id, { mono: true }),
    cell(tr('project'), project?.name, { full: true }),
    cell(tr('category'), project?.category),
    cell(tr('term'), arNum(project?.termMonths || 0) + ' ' + tr('months')),
    cell(tr('rate'), ((project?.profitRate || 0) * 100).toFixed(1) + (isEN() ? '%' : '٪')),
    cell(tr('contract'), inv.contractId, { mono: true }),
    cell(tr('status'), statusMap[inv.status] || inv.status),
    cell(tr('signed'), fmtDate(inv.signedAt)),
  );

  const amounts = document.createElement('div'); amounts.className = 'amounts';
  const mkRow = (k, v, total) => {
    const row = document.createElement('div'); row.className = 'row' + (total ? ' total' : '');
    const kk = document.createElement('span'); kk.className='k'; kk.textContent = k;
    const vv = document.createElement('span'); vv.className='v'; vv.textContent = arNum(v) + ' ' + tr('sar');
    row.append(kk, vv); return row;
  };
  amounts.append(
    mkRow(tr('principal'), principal),
    mkRow(tr('profit'), profit),
    mkRow(tr('total'), expected, true),
  );

  const footer = document.createElement('div'); footer.className = 'footer';
  const p1 = document.createElement('div');
  p1.append(document.createTextNode(tr('footerL1a')));
  const b1 = document.createElement('b'); b1.textContent = isEN() ? 'Murbha' : 'مُرابحة'; p1.appendChild(b1);
  p1.append(document.createTextNode(tr('footerL1b')));
  const p2 = document.createElement('div'); p2.style.marginTop='4px';
  p2.append(document.createTextNode(tr('managedBy')));
  const b2 = document.createElement('b'); b2.textContent = isEN() ? 'AGLC' : 'شركة العنقري'; p2.appendChild(b2);
  p2.append(document.createTextNode(tr('forQ')));
  const h = document.createElement('span'); h.setAttribute('data-setting', 'support.hotline'); h.textContent = '9200-12345';
  p2.appendChild(h);
  p2.append(document.createTextNode(' · '));
  const e2 = document.createElement('span'); e2.setAttribute('data-setting', 'support.email'); e2.textContent = 'support@murbha.sa';
  p2.appendChild(e2);
  const small = document.createElement('div'); small.style.fontSize='10px'; small.style.marginTop='4px';
  small.textContent = tr('small');
  footer.append(p1, p2, small);

  // Verification block (signed public URL anyone can hit to verify)
  try {
    const u = await App.api('GET', '/app/me/receipt/url/' + encodeURIComponent(inv.id));
    if (u?.url) {
      const verify = document.createElement('div');
      verify.style.cssText = 'margin-top:18px;padding:12px 14px;border:1.5px dashed #b08840;border-radius:10px;background:#fbf8ee;font-size:11px;color:#7a5a10;line-height:1.6;';
      const t1 = document.createElement('div');
      t1.style.cssText = 'font:800 11px Cairo,sans-serif;color:#7a5a10;margin-bottom:4px;';
      t1.textContent = isEN() ? '🔒 Anyone can verify this receipt at:' : '🔒 يمكن لأي شخص التحقق من هذا الإيصال عبر:';
      const link = document.createElement('a');
      link.href = u.url; link.target = '_blank'; link.rel = 'noopener';
      link.style.cssText = 'color:#062b1e;font:700 11px "SF Mono",Menlo,monospace;direction:ltr;text-decoration:underline;word-break:break-all;display:block;text-align:start;';
      link.textContent = u.url;
      verify.append(t1, link);
      footer.appendChild(verify);
    }
  } catch (e) {}

  r.append(head, titleRow, grid, amounts, footer);
  root.appendChild(r);
}

document.getElementById('rcptLangBtn').addEventListener('click', () => {
  setLang(isEN() ? 'ar' : 'en');
  renderReceipt();
});

document.getElementById('rcptEmailBtn').addEventListener('click', async () => {
  const id = new URLSearchParams(location.search).get('inv') || '';
  if (!id) return;
  const btn = document.getElementById('rcptEmailBtn');
  btn.disabled = true; const original = btn.textContent;
  btn.textContent = 'جارٍ الإرسال…';
  try {
    const r = await App.api('POST', '/app/me/receipt/email', { investmentId: id });
    btn.textContent = '✓ أُرسل إلى ' + (r.to || 'بريدك');
    setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 3500);
  } catch (e) {
    btn.disabled = false; btn.textContent = original;
    App.toast && App.toast(e.message || 'فشل الإرسال', 'error');
  }
});

renderReceipt();
</script>
</body>
</html>
