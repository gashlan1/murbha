<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل سحب الأرباح - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.4rem;font-weight:700;color:var(--green);}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.filter-bar{display:flex;gap:0.75rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.filter-btn{padding:0.3rem 0.9rem;border-radius:20px;border:1px solid var(--line);background:#fff;font-family:'Cairo',sans-serif;font-size:0.78rem;cursor:pointer;transition:all 0.15s;color:var(--green-dark);}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.wd-table{padding:1.25rem;overflow-x:auto;}
.wd-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:0.5rem;padding:0.65rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;align-items:center;}
.wd-row:last-child{border-bottom:none;}
.wd-header{font-weight:700;font-size:0.75rem;color:var(--muted);}
.wd-pill{display:inline-block;padding:0.1rem 0.5rem;border-radius:8px;font-size:0.68rem;font-weight:700;}
.pill-completed{background:#e8f5ed;color:#1e8449;}
.pill-pending{background:#fef3cd;color:#92400e;}
.pill-failed{background:#fde8e8;color:#c0392b;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.wd-row{grid-template-columns:1.5fr 1fr 1fr;}.wd-row>:nth-child(4),.wd-row>:nth-child(5){display:none;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — سجل سحب الأرباح</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>سجل سحب الأرباح</h2>
      <p>تاريخ جميع عمليات سحب الأرباح والمبالغ المحوّلة</p>
    </div>
    <button class="btn btn-primary" onclick="exportHistory()">تصدير السجل</button>
  </div>

  <div class="stats" id="wdStats"></div>

  <div class="card">
    <div class="card-head"><h3>سجل العمليات</h3></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="wd-table" id="wdTable"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="exportHistory()">تصدير</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="requestWithdrawal()">سحب جديد</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٤٨,٢٠٠ ر.س', lbl: 'إجمالي المسحوب (هذا العام)' },
  { val: '١٢', lbl: 'عملية سحب ناجحة' },
  { val: '٨,٥٠٠ ر.س', lbl: 'آخر عملية سحب' },
  { val: '٣ أيام', lbl: 'متوسط وقت التحويل' }
];

const WITHDRAWALS = [
  { date: '١٠ يونيو ٢٠٢٦', amount: '٨,٥٠٠ ر.س', deal: 'صفقة #4920', method: 'تحويل بنكي', pill: 'pill-completed', label: 'مكتمل' },
  { date: '١٥ مايو ٢٠٢٦', amount: '١٢,٠٠٠ ر.س', deal: 'صفقة #4918', method: 'تحويل بنكي', pill: 'pill-completed', label: 'مكتمل' },
  { date: '٢ مايو ٢٠٢٦', amount: '٥,٢٠٠ ر.س', deal: 'صفقة #4905', method: 'محفظة داخلية', pill: 'pill-completed', label: 'مكتمل' },
  { date: '١٨ أبريل ٢٠٢٦', amount: '٩,٠٠٠ ر.س', deal: 'صفقة #4890', method: 'تحويل بنكي', pill: 'pill-pending', label: 'معلّق' },
  { date: '١ أبريل ٢٠٢٦', amount: '٣,٥٠٠ ر.س', deal: 'صفقة #4875', method: 'تحويل بنكي', pill: 'pill-completed', label: 'مكتمل' },
  { date: '١٠ مارس ٢٠٢٦', amount: '١٠,٠٠٠ ر.س', deal: 'صفقة #4860', method: 'تحويل بنكي', pill: 'pill-failed', label: 'فشل' }
];

const FILTERS = ['الكل', 'مكتمل', 'معلّق', 'فشل'];
let activeFilter = 'الكل';

function buildStats() {
  const wrap = document.getElementById('wdStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildFilters() {
  const wrap = document.getElementById('filterBar');
  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (f === activeFilter ? ' active' : '');
    btn.textContent = f;
    btn.onclick = () => { activeFilter = f; buildFilters(); buildTable(); };
    wrap.appendChild(btn);
  });
}

function buildTable() {
  const wrap = document.getElementById('wdTable');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
  const header = document.createElement('div'); header.className = 'wd-row wd-header';
  ['التاريخ', 'المبلغ', 'الصفقة', 'طريقة التحويل', 'الحالة'].forEach(h => {
    const cell = document.createElement('div'); cell.textContent = h; header.appendChild(cell);
  });
  wrap.appendChild(header);
  const filtered = activeFilter === 'الكل' ? WITHDRAWALS : WITHDRAWALS.filter(w => w.label === activeFilter);
  filtered.forEach(w => {
    const row = document.createElement('div'); row.className = 'wd-row';
    const date = document.createElement('div'); date.style.color = 'var(--muted)'; date.textContent = w.date;
    const amount = document.createElement('div'); amount.style.fontWeight = '700'; amount.style.color = 'var(--green)'; amount.textContent = w.amount;
    const deal = document.createElement('div'); deal.textContent = w.deal;
    const method = document.createElement('div'); method.style.color = 'var(--muted)'; method.textContent = w.method;
    const pill = document.createElement('span'); pill.className = 'wd-pill ' + w.pill; pill.textContent = w.label;
    row.appendChild(date); row.appendChild(amount); row.appendChild(deal); row.appendChild(method); row.appendChild(pill);
    wrap.appendChild(row);
  });
}

function exportHistory() {
  fetch('/app/me/profit-withdrawal-history/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير سجل سحب الأرباح...');
}

function requestWithdrawal() {
  alert('جاري فتح نموذج طلب سحب الأرباح...');
}

buildStats(); buildFilters(); buildTable();
</script>
</body>
</html>
