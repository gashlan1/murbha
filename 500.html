<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>خطأ في الخادم — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { font-family: 'Tajawal',system-ui,sans-serif; background: #fbf6ea; color: #0d1612; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; margin: 0; }
  .card { max-width: 520px; text-align: center; }
  .num { font: 900 96px Cairo,sans-serif; color: #062b1e; line-height: 1; margin-bottom: 6px; letter-spacing: -3px; }
  .num span { color: #b54935; }
  h1 { font: 900 22px Cairo,sans-serif; color: #062b1e; margin-bottom: 8px; }
  p { color: #6b7268; line-height: 1.8; margin-bottom: 20px; font-size: 14px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .btn { padding: 12px 24px; border-radius: 999px; text-decoration: none; font: 800 13px Cairo,sans-serif; }
  .btn-primary { background: #062b1e; color: #fbf6ea; }
  .btn-primary:hover { background: #0a4d36; }
  .btn-outline { background: transparent; border: 1.5px solid #062b1e; color: #062b1e; }
  .btn-outline:hover { background: #062b1e; color: #fbf6ea; }
  .ref { display: inline-block; margin-top: 14px; padding: 8px 14px; background: rgba(13,22,18,0.05); border-radius: 8px; font: 600 12px 'SF Mono',Menlo,monospace; color: #6b7268; direction: ltr; }
</style>
</head>
<body>
<div class="card">
  <div class="num">٥<span>٠</span>٠</div>
  <h1>خطأ غير متوقّع</h1>
  <p>حصل خلل تقني أثناء معالجة طلبك. الفريق التقني تلقّى إشعاراً تلقائياً ويعمل على الإصلاح. حاول مرة أخرى بعد قليل.</p>
  <div class="actions">
    <a class="btn btn-primary" href="javascript:location.reload()">إعادة المحاولة</a>
    <a class="btn btn-outline" href="/">العودة إلى الرئيسية</a>
  </div>
  <div class="ref" id="errRef"></div>
</div>
<script>
  document.getElementById('errRef').textContent = 'ref: ' + Date.now().toString(36).toUpperCase();
</script>
</body>
</html>
