<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Compliance Report — Murbha Admin">تقرير الامتثال — إدارة مُرابحة</title>
<meta name="description" content="تقرير شامل لمستوى الامتثال التنظيمي والرقابي للمنصة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:960px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 24px Cairo,sans-serif;}
  .kpi-val.green{color:#2e7d32;}
  .kpi-val.gold{color:#a07020;}
  .kpi-val.red{color:#c54a3a;}
  .kpi-val.blue{color:#1565c0;}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .compliance-item{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .compliance-item:last-child{border-bottom:none;}
  .ci-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ci-icon.pass{background:#e8f5e9;}
  .ci-icon.warn{background:#fff8e1;}
  .ci-icon.fail{background:#fdecea;}
  .ci-body{flex:1;}
  .ci-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);}
  .ci-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:3px;line-height:1.7;}
  .ci-status{font:700 10px Cairo,sans-serif;border-radius:5px;padding:2px 8px;white-space:nowrap;flex-shrink:0;}
  .status-pass{background:#e8f5e9;color:#2e7d32;}
  .status-warn{background:#fff8e1;color:#a07020;}
  .status-fail{background:#fdecea;color:#c54a3a;}
  .section-label{font:700 11px Cairo,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
  .score-ring-wrap{display:flex;align-items:center;gap:20px;margin-bottom:14px;}
  .score-ring{position:relative;width:80px;height:80px;flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .score-desc{flex:1;}
  .score-label{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .score-sub{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:4px;line-height:1.7;}
  .btn-export{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:10px 22px;font:900 12px Cairo,sans-serif;cursor:pointer;}
  .btn-export:hover{background:var(--green);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Compliance Report">تقرير الامتثال</h1>
    <p data-en="Comprehensive regulatory and supervisory compliance status for the platform.">تقرير شامل لمستوى الامتثال التنظيمي والرقابي للمنصة.</p>
    <div class="admin-badge">لوحة الإدارة — سري</div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="card">
    <div class="card-title" data-en="Overall Compliance Score">مؤشر الامتثال الكلي</div>
    <div class="score-ring-wrap" id="scoreWrap"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="KYC / AML Compliance">امتثال KYC / AML</div>
    <div id="kycSection"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="Shariah Compliance">الامتثال الشرعي</div>
    <div id="shariahSection"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="Regulatory Filings">التقارير التنظيمية</div>
    <div id="regulatorySection"></div>
  </div>

  <div style="text-align:center;margin-top:8px;">
    <button class="btn-export" onclick="window.open('/app/admin/compliance-report/export?fmt=pdf')">تصدير PDF</button>
  </div>
</main>
<script>
(function(){
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  function renderItems(el, items){
    el.textContent='';
    if(!items||!items.length){ placeholder(el,'لا توجد بنود.'); return; }
    items.forEach(item=>{
      const row=document.createElement('div'); row.className='compliance-item';
      const icon=document.createElement('div'); icon.className='ci-icon '+(item.status==='pass'?'pass':item.status==='warn'?'warn':'fail');
      icon.textContent=item.status==='pass'?'✓':item.status==='warn'?'⚠':'✗';
      const body=document.createElement('div'); body.className='ci-body';
      const title=document.createElement('div'); title.className='ci-title'; title.textContent=item.title||'—';
      const desc=document.createElement('div'); desc.className='ci-desc'; desc.textContent=item.description||'';
      body.appendChild(title); body.appendChild(desc);
      const st=document.createElement('div'); st.className='ci-status status-'+(item.status||'warn');
      st.textContent=item.status==='pass'?'مستوفٍ':item.status==='warn'?'تحذير':'غير مستوفٍ';
      row.appendChild(icon); row.appendChild(body); row.appendChild(st);
      el.appendChild(row);
    });
  }

  (async function load(){
    try{
      const r=await fetch('/app/admin/compliance-report');
      if(!r.ok){ placeholder(document.getElementById('kycSection'),r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      const kpiRow=document.getElementById('kpiRow');
      const kpis=d.kpis||{};
      const kpiDefs=[
        {lbl:'إجمالي الامتثال',val:(kpis.score||0)+'%',cls:'green'},
        {lbl:'بنود حرجة',val:String(kpis.critical||0),cls:'red'},
        {lbl:'تحذيرات',val:String(kpis.warnings||0),cls:'gold'},
        {lbl:'بنود مستوفاة',val:String(kpis.passed||0),cls:'blue'}
      ];
      kpiDefs.forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val '+k.cls; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });
      // Score ring
      const score=kpis.score||0;
      const wrap=document.getElementById('scoreWrap');
      const ring=document.createElement('div'); ring.className='score-ring';
      const circ=44; const r2=2*Math.PI*circ; const dash=r2*(score/100); const gap=r2-dash;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('width','80'); svg.setAttribute('height','80'); svg.setAttribute('viewBox','0 0 100 100');
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle'); bg.setAttribute('cx','50'); bg.setAttribute('cy','50'); bg.setAttribute('r',String(circ)); bg.setAttribute('fill','none'); bg.setAttribute('stroke','#f0ece0'); bg.setAttribute('stroke-width','10');
      const fg=document.createElementNS('http://www.w3.org/2000/svg','circle'); fg.setAttribute('cx','50'); fg.setAttribute('cy','50'); fg.setAttribute('r',String(circ)); fg.setAttribute('fill','none'); fg.setAttribute('stroke',score>=80?'#2e7d32':score>=60?'#f9a825':'#c54a3a'); fg.setAttribute('stroke-width','10'); fg.setAttribute('stroke-dasharray',dash+' '+gap); fg.setAttribute('stroke-linecap','round');
      svg.appendChild(bg); svg.appendChild(fg); ring.appendChild(svg);
      const num=document.createElement('div'); num.className='score-num'; num.textContent=score+'%'; ring.appendChild(num);
      const desc=document.createElement('div'); desc.className='score-desc';
      const lbl=document.createElement('div'); lbl.className='score-label'; lbl.textContent=score>=80?'مستوى امتثال ممتاز':score>=60?'مستوى امتثال جيد':'مستوى امتثال يحتاج تحسين';
      const sub=document.createElement('div'); sub.className='score-sub'; sub.textContent=(d.lastUpdated?'آخر تحديث: '+d.lastUpdated.slice(0,10):'')+(d.nextReview?' · المراجعة القادمة: '+d.nextReview.slice(0,10):'');
      desc.appendChild(lbl); desc.appendChild(sub);
      wrap.appendChild(ring); wrap.appendChild(desc);
      renderItems(document.getElementById('kycSection'), d.kycItems);
      renderItems(document.getElementById('shariahSection'), d.shariahItems);
      renderItems(document.getElementById('regulatorySection'), d.regulatoryItems);
    }catch{ placeholder(document.getElementById('kycSection'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
