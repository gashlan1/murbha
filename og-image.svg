<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Cairo','Tajawal','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b1e"/>
      <stop offset="1" stop-color="#0a3d2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b08840" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b08840" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="160" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="220" fill="url(#glow)"/>
  <!-- Logo block -->
  <g direction="rtl">
    <rect x="80" y="80" width="120" height="120" rx="26" fill="#b08840"/>
    <text x="140" y="170" text-anchor="middle" font-weight="900" font-size="80" fill="#062b1e">م</text>
  </g>
  <!-- Title -->
  <text x="1120" y="320" text-anchor="end" font-weight="900" font-size="96" fill="#fbf6ea" direction="rtl">مُرابحة</text>
  <text x="1120" y="400" text-anchor="end" font-weight="700" font-size="42" fill="#b08840" direction="rtl">منصّة الاستثمار الإسلامي</text>
  <text x="1120" y="455" text-anchor="end" font-weight="500" font-size="32" fill="#fbf6ea" opacity="0.85" direction="rtl">متوافقة مع الشريعة • رؤية ٢٠٣٠</text>
  <!-- Bottom badges -->
  <g font-size="26" font-weight="700" fill="#fbf6ea" direction="rtl">
    <rect x="80"  y="510" width="280" height="60" rx="30" fill="rgba(176,136,64,0.18)" stroke="#b08840" stroke-width="2"/>
    <text x="220" y="550" text-anchor="middle">تحقّق نفاذ</text>
    <rect x="380" y="510" width="280" height="60" rx="30" fill="rgba(176,136,64,0.18)" stroke="#b08840" stroke-width="2"/>
    <text x="520" y="550" text-anchor="middle">عقود مرابحة شرعية</text>
    <rect x="680" y="510" width="280" height="60" rx="30" fill="rgba(176,136,64,0.18)" stroke="#b08840" stroke-width="2"/>
    <text x="820" y="550" text-anchor="middle">رقابة هيئة شرعية</text>
  </g>
</svg>
