<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>تحميل الكشوفات — مُرابحة</title>
<meta name="description" content="حمّل كشوفات حسابك الشهرية والربع سنوية والسنوية بصيغة PDF أو Excel." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .type-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .type-tab{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 18px;font:700 12px Cairo,sans-serif;color:var(--muted);cursor:pointer;}
  .type-tab.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px;}
  section h2{font:900 16px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .stmt-table{width:100%;border-collapse:collapse;font:500 12px Tajawal,sans-serif;}
  .stmt-table th{background:var(--paper);font:900 11px Cairo,sans-serif;color:var(--green-dark);padding:11px 12px;border-bottom:1px solid var(--line);text-align:start;}
  .stmt-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .stmt-table tr:last-child td{border-bottom:none;}
  .period-label{font:700 12px Cairo,sans-serif;color:var(--green-dark);}
  .period-sub{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .dl-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-pdf{background:var(--green);color:#fbf6ea;border:none;border-radius:7px;padding:7px 14px;font:700 11px Cairo,sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;}
  .btn-xlsx{background:#e3f2fd;color:#1565c0;border:1px solid #bbdefb;border-radius:7px;padding:7px 12px;font:700 11px Cairo,sans-serif;cursor:pointer;}
  .status-ready{color:var(--green);font:700 11px Cairo,sans-serif;}
  .status-generating{color:var(--gold);font:700 11px Cairo,sans-serif;}
  .summary-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .s-chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;}
  .s-chip-num{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .s-chip-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .custom-section{background:var(--paper);border-radius:12px;padding:16px;margin-bottom:14px;}
  .custom-section h3{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;}
  .custom-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .custom-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;}
  .custom-field label{font:700 10px Cairo,sans-serif;color:var(--muted);}
  .custom-field input{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:500 12px Tajawal,sans-serif;background:#fff;}
  .custom-field input:focus{outline:none;border-color:var(--green);}
  .btn-custom-dl{background:var(--green);color:#fbf6ea;border:none;border-radius:8px;padding:9px 20px;font:700 12px Cairo,sans-serif;cursor:pointer;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:28px 0;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>📥 تحميل الكشوفات</h1>
    <p>حمّل كشوفات حسابك الشهرية والربع سنوية والسنوية بصيغة PDF أو Excel في أي وقت.</p>
  </div>

  <div class="summary-chips" id="summaryChips"></div>

  <div class="type-tabs">
    <button class="type-tab active" data-period="monthly">شهري</button>
    <button class="type-tab" data-period="quarterly">ربع سنوي</button>
    <button class="type-tab" data-period="annual">سنوي</button>
  </div>

  <div class="custom-section">
    <h3>📆 كشف مخصّص</h3>
    <div class="custom-row">
      <div class="custom-field">
        <label>من تاريخ</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="custom-field">
        <label>إلى تاريخ</label>
        <input type="date" id="toDate" />
      </div>
      <button class="btn-custom-dl" id="customDlBtn">⬇️ تحميل PDF</button>
    </div>
  </div>

  <section>
    <h2 id="tableTitle">الكشوفات الشهرية</h2>
    <table class="stmt-table">
      <thead>
        <tr>
          <th>الفترة</th>
          <th>إجمالي الدخل (ر.س)</th>
          <th>إجمالي الاستثمار (ر.س)</th>
          <th>الحالة</th>
          <th>تحميل</th>
        </tr>
      </thead>
      <tbody id="stmtBody">
        <tr><td colspan="5"><p class="placeholder-msg">جارٍ التحميل…</p></td></tr>
      </tbody>
    </table>
  </section>
</main>
<script>
(function(){
  let allStatements = [];
  let activePeriod = 'monthly';

  function fmt(n){ return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  const TITLES = { monthly:'الكشوفات الشهرية', quarterly:'الكشوفات الربع سنوية', annual:'الكشوفات السنوية' };

  function renderSummary(d){
    const chips = document.getElementById('summaryChips');
    chips.textContent = '';
    [
      {num:d.totalStatements||0,lbl:'كشف متاح'},
      {num:'SAR '+fmt(d.totalIncome||0),lbl:'إجمالي الدخل الموثّق'},
      {num:d.memberSince||'—',lbl:'عضو منذ'},
    ].forEach(it=>{
      const chip=document.createElement('div'); chip.className='s-chip';
      const num=document.createElement('div'); num.className='s-chip-num'; num.textContent=it.num;
      const lbl=document.createElement('div'); lbl.className='s-chip-lbl'; lbl.textContent=it.lbl;
      chip.appendChild(num); chip.appendChild(lbl); chips.appendChild(chip);
    });
  }

  function render(){
    document.getElementById('tableTitle').textContent = TITLES[activePeriod]||'الكشوفات';
    const body = document.getElementById('stmtBody');
    body.textContent = '';
    const filtered = allStatements.filter(s=>s.period===activePeriod);
    if(!filtered.length){
      const tr=document.createElement('tr');
      const td=document.createElement('td'); td.colSpan=5;
      const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='لا توجد كشوفات لهذه الفترة.';
      td.appendChild(m); tr.appendChild(td); body.appendChild(tr); return;
    }
    filtered.forEach(stmt=>{
      const tr=document.createElement('tr');

      const tdPer=document.createElement('td');
      const lbl=document.createElement('div'); lbl.className='period-label'; lbl.textContent=stmt.label;
      const sub=document.createElement('div'); sub.className='period-sub'; sub.textContent=stmt.dateRange||'';
      tdPer.appendChild(lbl); tdPer.appendChild(sub);

      const tdInc=document.createElement('td'); tdInc.textContent='SAR '+fmt(stmt.totalIncome);
      const tdInv=document.createElement('td'); tdInv.textContent='SAR '+fmt(stmt.totalInvested);

      const tdSt=document.createElement('td');
      const stEl=document.createElement('span');
      stEl.className = stmt.ready ? 'status-ready' : 'status-generating';
      stEl.textContent = stmt.ready ? '✓ جاهز' : '⏳ قيد الإنشاء';
      tdSt.appendChild(stEl);

      const tdDl=document.createElement('td');
      const btns=document.createElement('div'); btns.className='dl-btns';
      const pdfBtn=document.createElement('button'); pdfBtn.className='btn-pdf';
      const pdfIco=document.createElement('span'); pdfIco.textContent='📄';
      const pdfLbl=document.createElement('span'); pdfLbl.textContent='PDF';
      pdfBtn.appendChild(pdfIco); pdfBtn.appendChild(pdfLbl);
      pdfBtn.disabled = !stmt.ready;
      pdfBtn.addEventListener('click',()=>{ window.open('/app/me/statements/'+encodeURIComponent(stmt.id)+'/pdf','_blank'); });
      const xlsxBtn=document.createElement('button'); xlsxBtn.className='btn-xlsx';
      xlsxBtn.textContent='Excel';
      xlsxBtn.disabled = !stmt.ready;
      xlsxBtn.addEventListener('click',()=>{ window.open('/app/me/statements/'+encodeURIComponent(stmt.id)+'/xlsx','_blank'); });
      btns.appendChild(pdfBtn); btns.appendChild(xlsxBtn);
      tdDl.appendChild(btns);

      [tdPer,tdInc,tdInv,tdSt,tdDl].forEach(td=>tr.appendChild(td));
      body.appendChild(tr);
    });
  }

  document.querySelectorAll('.type-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.type-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activePeriod=btn.dataset.period;
      render();
    });
  });

  document.getElementById('customDlBtn').addEventListener('click',()=>{
    const from=document.getElementById('fromDate').value;
    const to=document.getElementById('toDate').value;
    if(!from||!to){ return; }
    window.open('/app/me/statements/custom?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&format=pdf','_blank');
  });

  // Set default dates for custom range
  const now = new Date();
  document.getElementById('toDate').value = now.toISOString().slice(0,10);
  const from = new Date(now); from.setMonth(from.getMonth()-3);
  document.getElementById('fromDate').value = from.toISOString().slice(0,10);

  (async function load(){
    try{
      const r = await fetch('/app/me/statements');
      if(!r.ok){
        const body=document.getElementById('stmtBody'); body.textContent='';
        const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=5;
        const m=document.createElement('p'); m.className='placeholder-msg';
        m.textContent=r.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.';
        td.appendChild(m); tr.appendChild(td); body.appendChild(tr); return;
      }
      const d = await r.json();
      allStatements = d.statements || [];
      renderSummary(d);
      render();
    }catch{
      const body=document.getElementById('stmtBody'); body.textContent='';
      const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=5;
      const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='تعذّر التحميل. حاول لاحقاً.';
      td.appendChild(m); tr.appendChild(td); body.appendChild(tr);
    }
  }());
}());
</script>
</body>
</html>
