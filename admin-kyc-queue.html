<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>طابور KYC — إدارة مُرابحة</title>
<meta name="description" content="مراجعة طلبات التحقق من الهوية KYC للمستخدمين الجدد والمعلّقة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:920px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{border-radius:14px;padding:18px;border:1px solid var(--line);}
  .kpi-yellow{background:#fff8e1;border-color:#ffe082;}
  .kpi-red{background:#fdecea;border-color:#f8d7da;}
  .kpi-green{background:#e8f5e9;border-color:#a5d6a7;}
  .kpi-blue{background:#e3f2fd;border-color:#90caf9;}
  .kpi-val{font:900 26px Cairo,sans-serif;}
  .kpi-yellow .kpi-val{color:#a07020;}
  .kpi-red .kpi-val{color:#c54a3a;}
  .kpi-green .kpi-val{color:#2e7d32;}
  .kpi-blue .kpi-val{color:#1565c0;}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .filter-bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .filter-chip{border:1.5px solid var(--line);border-radius:20px;padding:6px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .filter-chip.active{border-color:var(--green);background:var(--green);color:#fff;}
  .search-inp{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);}
  .search-inp:focus{outline:none;border-color:var(--green);}
  .queue-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .kyc-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .kyc-item:last-child{margin-bottom:0;}
  .kyc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .kyc-name{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .kyc-email{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .kyc-badge{border-radius:5px;padding:3px 10px;font:700 9px Cairo,sans-serif;}
  .badge-pending{background:#fff8e1;color:#a07020;}
  .badge-in-review{background:#e3f2fd;color:#1565c0;}
  .badge-approved{background:#e8f5e9;color:#2e7d32;}
  .badge-rejected{background:#fdecea;color:#c54a3a;}
  .kyc-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .kyc-field{background:#f9f7f2;border-radius:8px;padding:8px 10px;}
  .kf-key{font:700 9px Cairo,sans-serif;color:var(--muted);}
  .kf-val{font:900 11px Cairo,sans-serif;color:var(--green-dark);margin-top:2px;}
  .docs-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .doc-chip{border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:500 10px Tajawal,sans-serif;color:var(--ink);}
  .doc-chip.verified{border-color:#a5d6a7;background:#e8f5e9;color:#2e7d32;}
  .doc-chip.missing{border-color:#f8d7da;background:#fdecea;color:#c54a3a;}
  .kyc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .note-inp{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:8px;padding:7px 12px;font:500 11px Tajawal,sans-serif;}
  .note-inp:focus{outline:none;border-color:var(--green);}
  .btn-approve{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;color:#2e7d32;}
  .btn-approve:hover{background:#c8e6c9;}
  .btn-reject{background:#fdecea;border:1px solid #f8d7da;border-radius:8px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;color:#c54a3a;}
  .btn-reject:hover{background:#ffcdd2;}
  .btn-review{background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;color:#1565c0;}
  .btn-review:hover{background:#bbdefb;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>طابور التحقق من الهوية</h1>
    <p>مراجعة واعتماد أو رفض طلبات KYC المعلّقة لتفعيل حسابات المستثمرين.</p>
    <div class="admin-badge">لوحة الإدارة — سري</div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="filter-bar">
    <div class="filter-chip active" data-status="">الكل</div>
    <div class="filter-chip" data-status="pending">معلّق</div>
    <div class="filter-chip" data-status="in_review">قيد المراجعة</div>
    <div class="filter-chip" data-status="approved">مُعتمَد</div>
    <div class="filter-chip" data-status="rejected">مرفوض</div>
    <input class="search-inp" id="searchInp" type="text" placeholder="بحث بالاسم أو البريد…" />
  </div>

  <div class="queue-card">
    <div class="card-title">طلبات KYC</div>
    <div id="queueList"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
  function placeholder(el, msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  let allItems=[], activeStatus='', activeSearch='';

  const docLabels={national_id:'الهوية الوطنية',passport:'جواز السفر',bank_statement:'كشف حساب',selfie:'صورة شخصية',address_proof:'إثبات عنوان'};
  const badgeCls={pending:'badge-pending',in_review:'badge-in-review',approved:'badge-approved',rejected:'badge-rejected'};
  const badgeLbl={pending:'معلّق',in_review:'قيد المراجعة',approved:'مُعتمَد',rejected:'مرفوض'};

  function renderItem(item){
    const el=document.createElement('div'); el.className='kyc-item'; el.id='kyc-'+item.id;
    const hdr=document.createElement('div'); hdr.className='kyc-header';
    const left=document.createElement('div');
    const name=document.createElement('div'); name.className='kyc-name'; name.textContent=(item.name||'مستخدم')+' · #'+item.id;
    const email=document.createElement('div'); email.className='kyc-email'; email.textContent=item.email||'—';
    left.appendChild(name); left.appendChild(email);
    const badge=document.createElement('div'); badge.className='kyc-badge '+(badgeCls[item.status]||'badge-pending'); badge.textContent=badgeLbl[item.status]||item.status||'—';
    hdr.appendChild(left); hdr.appendChild(badge);

    const meta=document.createElement('div'); meta.className='kyc-meta';
    const fields=[['تاريخ التقديم',item.submittedAt?item.submittedAt.slice(0,10):'—'],['الجنسية',item.nationality||'—'],['رقم الهوية',item.nationalId||'—']];
    fields.forEach(([k,v])=>{
      const f=document.createElement('div'); f.className='kyc-field';
      const fk=document.createElement('div'); fk.className='kf-key'; fk.textContent=k;
      const fv=document.createElement('div'); fv.className='kf-val'; fv.textContent=v;
      f.appendChild(fk); f.appendChild(fv); meta.appendChild(f);
    });

    const docs=document.createElement('div'); docs.className='docs-row';
    (item.documents||[]).forEach(doc=>{
      const chip=document.createElement('div');
      chip.className='doc-chip '+(doc.verified?'verified':'missing');
      chip.textContent=(docLabels[doc.type]||doc.type)+(doc.verified?' ✓':' ✗');
      docs.appendChild(chip);
    });

    el.appendChild(hdr); el.appendChild(meta); el.appendChild(docs);

    if(item.status==='pending'||item.status==='in_review'){
      const actions=document.createElement('div'); actions.className='kyc-actions';
      const noteInp=document.createElement('input'); noteInp.className='note-inp'; noteInp.type='text'; noteInp.placeholder='ملاحظة (اختياري)…';

      const mkBtn=(lbl,cls,decision)=>{
        const btn=document.createElement('button'); btn.className=cls; btn.textContent=lbl;
        btn.addEventListener('click', async()=>{
          btn.disabled=true;
          try{
            const r=await fetch('/app/admin/kyc/'+encodeURIComponent(item.id)+'/decision',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({decision,note:noteInp.value.trim()})});
            if(!r.ok){ btn.disabled=false; showToast('تعذّرت العملية.'); return; }
            showToast(decision==='approved'?'تم الاعتماد.':decision==='rejected'?'تم الرفض.':'جارٍ المراجعة.');
            const el2=document.getElementById('kyc-'+item.id);
            if(el2){ el2.querySelector('.kyc-badge').textContent=badgeLbl[decision]||decision; el2.querySelector('.kyc-badge').className='kyc-badge '+(badgeCls[decision]||''); el2.querySelector('.kyc-actions').remove(); }
          }catch{ btn.disabled=false; showToast('خطأ.'); }
        });
        return btn;
      };
      if(item.status==='pending'){ actions.appendChild(mkBtn('ابدأ المراجعة','btn-review','in_review')); }
      actions.appendChild(noteInp);
      actions.appendChild(mkBtn('اعتمد','btn-approve','approved'));
      actions.appendChild(mkBtn('ارفض','btn-reject','rejected'));
      el.appendChild(actions);
    }
    return el;
  }

  function renderFiltered(){
    const list=document.getElementById('queueList'); list.textContent='';
    const items=allItems.filter(it=>{
      if(activeStatus && it.status!==activeStatus) return false;
      if(activeSearch){
        const q=activeSearch.toLowerCase();
        if(!(it.name||'').toLowerCase().includes(q)&&!(it.email||'').toLowerCase().includes(q)) return false;
      }
      return true;
    });
    if(!items.length){ placeholder(list,'لا توجد طلبات تطابق الفلتر.'); return; }
    items.forEach(it=>list.appendChild(renderItem(it)));
  }

  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeStatus=chip.dataset.status||'';
      renderFiltered();
    });
  });
  document.getElementById('searchInp').addEventListener('input',e=>{ activeSearch=e.target.value.trim(); renderFiltered(); });

  (async function load(){
    const list=document.getElementById('queueList');
    placeholder(list,'جارٍ التحميل…');
    try{
      const r=await fetch('/app/admin/kyc-queue');
      if(!r.ok){ placeholder(list,r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      const kpis=d.kpis||{};
      const kpiRow=document.getElementById('kpiRow');
      [{lbl:'معلّقة',val:String(kpis.pending||0),cls:'kpi-yellow'},{lbl:'قيد المراجعة',val:String(kpis.inReview||0),cls:'kpi-blue'},{lbl:'مُعتمَدة اليوم',val:String(kpis.approvedToday||0),cls:'kpi-green'},{lbl:'مرفوضة',val:String(kpis.rejected||0),cls:'kpi-red'}].forEach(k=>{
        const div=document.createElement('div'); div.className='kpi '+k.cls;
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        div.appendChild(v); div.appendChild(l); kpiRow.appendChild(div);
      });
      allItems=d.items||[];
      renderFiltered();
    }catch{ placeholder(document.getElementById('queueList'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
