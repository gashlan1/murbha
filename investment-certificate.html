<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>شهادة الاستثمار — مُرابحة</title>
<meta name="description" content="احصل على شهادة استثمار رسميّة لكلّ صفقة تشارك فيها. قابلة للطباعة والمشاركة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root { --ink:#0d1612; --paper:#fbf6ea; --green-dark:#062b1e; --green:#0a4d36; --gold:#b08840; --gold-light:#d4ac6e; --muted:#6b7268; --line:rgba(13,22,18,0.10); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Tajawal',system-ui,sans-serif; background:var(--paper); color:var(--ink); }
  main { max-width:880px; margin:0 auto; padding:28px 18px 60px; }
  .hero { background:linear-gradient(135deg,#062b1e,#0a4d36); color:#fbf6ea; border-radius:22px; padding:40px 22px; margin-bottom:22px; text-align:center; }
  .hero h1 { font:900 28px Cairo,sans-serif; margin-bottom:8px; }
  .hero p { font:500 14px Tajawal,sans-serif; opacity:0.92; max-width:620px; margin:0 auto; line-height:1.85; }
  section { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:14px; }
  section h2 { font:900 18px Cairo,sans-serif; color:var(--green-dark); margin-bottom:12px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .inv-grid { display:grid; gap:8px; }
  .inv-row { display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:10px; padding:12px 14px; border:1px solid var(--line); cursor:pointer; transition:border-color .15s; }
  .inv-row:hover { border-color:var(--green); }
  .inv-row.selected { border-color:var(--gold); background:#fdf5e4; }
  .inv-icon { font-size:24px; flex-shrink:0; }
  .inv-body { flex:1; min-width:0; }
  .inv-name { font:900 13px Cairo,sans-serif; color:var(--green-dark); }
  .inv-meta { font:500 11px Tajawal,sans-serif; color:var(--muted); margin-top:2px; }
  .inv-amount { font:900 13px Cairo,sans-serif; color:var(--green); white-space:nowrap; }
  .cert-preview { border:3px double var(--gold); border-radius:16px; padding:32px 28px; text-align:center; background:linear-gradient(160deg,#fff 70%,#fdf5e4); margin-top:12px; position:relative; }
  .cert-watermark { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-20deg); font:900 72px Cairo,sans-serif; color:rgba(10,77,54,0.04); pointer-events:none; white-space:nowrap; }
  .cert-logo { font:900 18px Cairo,sans-serif; color:var(--green-dark); margin-bottom:16px; }
  .cert-title { font:900 22px Cairo,sans-serif; color:var(--gold); margin-bottom:8px; }
  .cert-sub { font:500 13px Tajawal,sans-serif; color:var(--muted); margin-bottom:20px; }
  .cert-name { font:900 26px Cairo,sans-serif; color:var(--green-dark); margin-bottom:8px; border-bottom:2px solid var(--gold); padding-bottom:8px; display:inline-block; }
  .cert-deal { font:700 15px Tajawal,sans-serif; color:var(--ink); margin:16px 0 4px; }
  .cert-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:16px 0; text-align:start; }
  .cert-field { background:var(--paper); border-radius:8px; padding:10px 12px; }
  .cert-field-lbl { font:500 10px Tajawal,sans-serif; color:var(--muted); margin-bottom:2px; }
  .cert-field-val { font:900 13px Cairo,sans-serif; color:var(--green-dark); }
  .cert-seal { margin-top:20px; font-size:36px; }
  .cert-ref { font:500 10px Tajawal,sans-serif; color:var(--muted); margin-top:8px; }
  .cert-actions { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn-print { background:var(--green); color:#fbf6ea; border:none; border-radius:8px; padding:10px 22px; font:700 13px Cairo,sans-serif; cursor:pointer; }
  .btn-share { background:var(--paper); color:var(--green); border:1px solid var(--green); border-radius:8px; padding:10px 22px; font:700 13px Cairo,sans-serif; cursor:pointer; }
  .placeholder-msg { font:500 13px Tajawal,sans-serif; color:var(--muted); text-align:center; padding:30px 0; }
  @media print {
    .hero, section:not(#certSection), .cert-actions { display:none !important; }
    body { background:#fff; }
    .cert-preview { border-color:#b08840; }
  }
  @media(max-width:540px){ .cert-fields{grid-template-columns:1fr;} }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🏅 شهادة الاستثمار</h1>
    <p>وثيقة رسميّة تُثبت مشاركتك في صفقة المرابحة. احفظها، اطبعها، أو شاركها.</p>
  </div>

  <section>
    <h2>📁 اختر استثمارك</h2>
    <div class="inv-grid" id="invGrid">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>

  <section id="certSection">
    <h2>📜 معاينة الشهادة</h2>
    <div id="certArea">
      <p class="placeholder-msg">اختر استثماراً من القائمة أعلاه لعرض الشهادة.</p>
    </div>
  </section>
</main>
<script>
(function () {
  const CATS = { real_estate:'🏗️', logistics:'🚚', agri:'🌾', tech:'💻', energy:'⚡', retail:'🛍️', other:'📦' };
  const grid = document.getElementById('invGrid');
  const certArea = document.getElementById('certArea');
  let selected = null;

  function fmt(n) { return Number(n).toLocaleString('ar-SA', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
  function fmtDate(s) { if (!s) return '—'; return new Date(s).toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' }); }

  function renderCert(inv, user) {
    certArea.textContent = '';

    const preview = document.createElement('div');
    preview.className = 'cert-preview';

    const wm = document.createElement('div');
    wm.className = 'cert-watermark';
    wm.textContent = 'مُرابحة';

    const logo = document.createElement('div');
    logo.className = 'cert-logo';
    logo.textContent = '🌿 مُرابحة للتمويل الإسلامي';

    const title = document.createElement('div');
    title.className = 'cert-title';
    title.textContent = 'شهادة مشاركة في المرابحة';

    const sub = document.createElement('div');
    sub.className = 'cert-sub';
    sub.textContent = 'تُقرّ هذه الشهادة بأنّ:';

    const name = document.createElement('div');
    name.className = 'cert-name';
    name.textContent = user.fullName || user.name || 'المستثمر';

    const deal = document.createElement('div');
    deal.className = 'cert-deal';
    deal.textContent = 'قد شارك في صفقة:';

    const dealName = document.createElement('div');
    dealName.style.cssText = 'font:900 18px Cairo,sans-serif;color:var(--green-dark);margin-bottom:16px;';
    dealName.textContent = inv.projectName || inv.projectId;

    const fields = document.createElement('div');
    fields.className = 'cert-fields';

    const fieldData = [
      { lbl: 'قيمة الاستثمار', val: fmt(inv.amount) + ' ر.س' },
      { lbl: 'العائد السنوي المتوقّع', val: (inv.yield || '—') + '٪' },
      { lbl: 'تاريخ المشاركة', val: fmtDate(inv.createdAt) },
      { lbl: 'رقم الاستثمار', val: inv.id.slice(0, 12).toUpperCase() },
    ];
    fieldData.forEach(f => {
      const field = document.createElement('div');
      field.className = 'cert-field';
      const lbl = document.createElement('div');
      lbl.className = 'cert-field-lbl';
      lbl.textContent = f.lbl;
      const val = document.createElement('div');
      val.className = 'cert-field-val';
      val.textContent = f.val;
      field.appendChild(lbl);
      field.appendChild(val);
      fields.appendChild(field);
    });

    const seal = document.createElement('div');
    seal.className = 'cert-seal';
    seal.textContent = '🕌';

    const ref = document.createElement('div');
    ref.className = 'cert-ref';
    ref.textContent = 'صادرة عن منصّة مُرابحة — هذه الوثيقة آلية وتُخضع للتحقّق عبر رمز الاستثمار.';

    preview.appendChild(wm);
    preview.appendChild(logo);
    preview.appendChild(title);
    preview.appendChild(sub);
    preview.appendChild(name);
    preview.appendChild(deal);
    preview.appendChild(dealName);
    preview.appendChild(fields);
    preview.appendChild(seal);
    preview.appendChild(ref);

    const actions = document.createElement('div');
    actions.className = 'cert-actions';

    const printBtn = document.createElement('button');
    printBtn.className = 'btn-print';
    printBtn.textContent = '🖨️ طباعة الشهادة';
    printBtn.addEventListener('click', () => window.print());

    const shareBtn = document.createElement('button');
    shareBtn.className = 'btn-share';
    shareBtn.textContent = '🔗 مشاركة';
    shareBtn.addEventListener('click', async () => {
      const shareData = { title: 'شهادة استثمار — مُرابحة', text: 'شاركت في صفقة: ' + (inv.projectName || inv.projectId) + ' بمبلغ ' + fmt(inv.amount) + ' ر.س' };
      if (navigator.share) { try { await navigator.share(shareData); } catch { /* cancelled */ } }
      else { shareBtn.textContent = '✅ انسخ الرابط يدوياً'; }
    });

    actions.appendChild(printBtn);
    actions.appendChild(shareBtn);

    certArea.appendChild(preview);
    certArea.appendChild(actions);
  }

  (async function load() {
    try {
      const [invR, meR] = await Promise.all([fetch('/app/me/investments'), fetch('/app/me')]);
      if (!invR.ok) {
        grid.textContent = '';
        const m = document.createElement('p');
        m.className = 'placeholder-msg';
        m.textContent = 'يجب تسجيل الدخول لعرض استثماراتك.';
        grid.appendChild(m);
        return;
      }
      const invData = await invR.json();
      const userData = meR.ok ? await meR.json() : {};
      const items = (invData.investments || invData.items || []).filter(i => i.status === 'active' || i.status === 'completed');

      grid.textContent = '';
      if (!items.length) {
        const m = document.createElement('p');
        m.className = 'placeholder-msg';
        m.textContent = 'لا توجد استثمارات نشطة بعد.';
        grid.appendChild(m);
        return;
      }

      items.forEach(inv => {
        const row = document.createElement('div');
        row.className = 'inv-row';
        const icon = document.createElement('div');
        icon.className = 'inv-icon';
        icon.textContent = CATS[inv.category] || '📦';
        const body = document.createElement('div');
        body.className = 'inv-body';
        const nm = document.createElement('div');
        nm.className = 'inv-name';
        nm.textContent = inv.projectName || inv.projectId;
        const meta = document.createElement('div');
        meta.className = 'inv-meta';
        meta.textContent = 'منذ ' + fmtDate(inv.createdAt);
        body.appendChild(nm);
        body.appendChild(meta);
        const amt = document.createElement('div');
        amt.className = 'inv-amount';
        amt.textContent = fmt(inv.amount) + ' ر.س';
        row.appendChild(icon);
        row.appendChild(body);
        row.appendChild(amt);
        row.addEventListener('click', () => {
          document.querySelectorAll('.inv-row').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          selected = inv;
          renderCert(inv, userData.user || userData);
        });
        grid.appendChild(row);
      });
    } catch {
      grid.textContent = '';
      const m = document.createElement('p');
      m.className = 'placeholder-msg';
      m.textContent = 'تعذّر التحميل. حاول لاحقاً.';
      grid.appendChild(m);
    }
  }());
}());
</script>
</body>
</html>
