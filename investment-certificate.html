<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>شهادة الاستثمار — مُرابحة</title>
<meta name="description" content="شهادة رسمية موثّقة تُثبت استثمارك في صفقة مُرابحة بجميع التفاصيل القانونية." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .selector-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .sel-lbl{font:700 12px Cairo,sans-serif;color:var(--muted);flex-shrink:0;}
  .inv-select{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);background:var(--paper);}
  .inv-select:focus{outline:none;border-color:var(--green);}
  .btn-print{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:9px 18px;font:700 12px Cairo,sans-serif;cursor:pointer;flex-shrink:0;}
  .btn-print:hover{background:var(--green);}
  /* Certificate */
  .cert{background:#fff;border:3px double var(--gold);border-radius:18px;padding:40px 36px;position:relative;overflow:hidden;display:none;}
  .cert.visible{display:block;}
  .cert-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font:900 80px Cairo,sans-serif;color:rgba(176,136,64,.06);pointer-events:none;white-space:nowrap;}
  .cert-header{text-align:center;margin-bottom:28px;}
  .cert-logo{font:900 20px Cairo,sans-serif;color:var(--green-dark);letter-spacing:1px;}
  .cert-sub{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .cert-divider{border:none;border-top:2px solid var(--gold-light);margin:16px 0;}
  .cert-title{font:900 22px Amiri,serif;color:var(--green-dark);text-align:center;margin-bottom:4px;}
  .cert-subtitle{font:500 12px Tajawal,sans-serif;color:var(--muted);text-align:center;margin-bottom:24px;}
  .cert-body{font:500 13px Tajawal,sans-serif;color:var(--ink);line-height:2.2;margin-bottom:20px;}
  .cert-body strong{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .cert-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  .cert-field{background:#f9f7f2;border-radius:10px;padding:12px 14px;}
  .cf-key{font:700 10px Cairo,sans-serif;color:var(--muted);}
  .cf-val{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-top:3px;}
  .cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px;padding-top:20px;border-top:1px dashed var(--gold-light);}
  .sig-block{text-align:center;}
  .sig-line{border-top:1px solid var(--ink);width:130px;margin:0 auto 6px;}
  .sig-name{font:700 10px Cairo,sans-serif;color:var(--ink);}
  .sig-title{font:500 9px Tajawal,sans-serif;color:var(--muted);}
  .cert-qr{width:60px;height:60px;background:var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 9px Cairo,sans-serif;color:var(--muted);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  @media print{
    .hero,.selector-card,.btn-print{display:none!important;}
    body{background:#fff;}
    main{padding:0;}
    .cert{border:3px double #b08840!important;display:block!important;}
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>شهادة الاستثمار</h1>
    <p>وثيقة رسمية موثّقة تُثبت استثمارك وتتضمن جميع التفاصيل المالية والقانونية.</p>
  </div>

  <div class="selector-card">
    <div class="sel-lbl">اختر الاستثمار</div>
    <select class="inv-select" id="invSelect"><option value="">جارٍ التحميل…</option></select>
    <button class="btn-print" id="printBtn">طباعة الشهادة</button>
  </div>

  <div class="cert" id="certCard">
    <div class="cert-watermark">مُرابحة</div>
    <div class="cert-header">
      <div class="cert-logo">مُرابحة للتمويل</div>
      <div class="cert-sub">منصة استثمار إسلامي مرخّصة من هيئة السوق المالية</div>
    </div>
    <hr class="cert-divider" />
    <div class="cert-title">شهادة استثمار</div>
    <div class="cert-subtitle" id="certSubtitle">—</div>
    <div class="cert-body" id="certBody"></div>
    <div class="cert-fields" id="certFields"></div>
    <div class="cert-footer">
      <div class="sig-block">
        <div class="sig-line"></div>
        <div class="sig-name">المدير التنفيذي</div>
        <div class="sig-title">شركة مُرابحة للتمويل</div>
      </div>
      <div class="cert-qr">QR<br>توثيق</div>
      <div class="sig-block">
        <div class="sig-line"></div>
        <div class="sig-name">مسؤول الامتثال</div>
        <div class="sig-title">شركة مُرابحة للتمويل</div>
      </div>
    </div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  document.getElementById('printBtn').addEventListener('click',()=>window.print());

  async function loadInvestments(){
    const sel=document.getElementById('invSelect'); sel.textContent='';
    const def=document.createElement('option'); def.value=''; def.textContent='اختر استثمارك…'; sel.appendChild(def);
    try{
      const r=await fetch('/app/me/investments?status=active');
      if(!r.ok) return;
      const d=await r.json();
      (d.investments||[]).forEach(inv=>{
        const opt=document.createElement('option'); opt.value=inv.id;
        opt.textContent=(inv.dealName||'صفقة')+' — '+fmt(inv.amount||0)+' ر.س';
        sel.appendChild(opt);
      });
    }catch{}
  }

  document.getElementById('invSelect').addEventListener('change', async()=>{
    const invId=document.getElementById('invSelect').value;
    const cert=document.getElementById('certCard'); cert.classList.remove('visible');
    if(!invId) return;
    try{
      const r=await fetch('/app/me/investment-certificate/'+encodeURIComponent(invId));
      if(!r.ok){ alert('تعذّر تحميل الشهادة.'); return; }
      const d=await r.json();

      document.getElementById('certSubtitle').textContent='رقم الشهادة: '+(d.certificateId||'—')+' — صادرة بتاريخ '+(d.issuedDate||'—');

      const body=document.getElementById('certBody'); body.textContent='';
      const para=document.createElement('p');
      para.textContent='تُشهد شركة مُرابحة للتمويل بأن المستثمر ';
      const name=document.createElement('strong'); name.textContent=(d.investorName||'—');
      const rest=document.createTextNode(' قد استثمر مبلغ ');
      const amt=document.createElement('strong'); amt.textContent=fmt(d.amount||0)+' ريال سعودي';
      const rest2=document.createTextNode(' في صفقة ');
      const deal=document.createElement('strong'); deal.textContent=(d.dealName||'—');
      const rest3=document.createTextNode(' وذلك وفق عقد '+( d.contractType||'مُرابحة')+' مُوثَّق ومعتمد شرعاً.');
      para.appendChild(name); para.appendChild(rest); para.appendChild(amt); para.appendChild(rest2); para.appendChild(deal); para.appendChild(rest3);
      body.appendChild(para);

      const fields=document.getElementById('certFields'); fields.textContent='';
      const fdata=[
        ['مبلغ الاستثمار',fmt(d.amount||0)+' ر.س'],
        ['تاريخ بدء الصفقة',d.startDate||'—'],
        ['تاريخ الاستحقاق',d.maturityDate||'—'],
        ['العائد المتوقع',(d.expectedYield||0)+'٪ سنوياً'],
        ['رقم العقد',d.contractId||'—'],
        ['القطاع',d.sector||'—']
      ];
      fdata.forEach(([k,v])=>{
        const div=document.createElement('div'); div.className='cert-field';
        const key=document.createElement('div'); key.className='cf-key'; key.textContent=k;
        const val=document.createElement('div'); val.className='cf-val'; val.textContent=v;
        div.appendChild(key); div.appendChild(val); fields.appendChild(div);
      });

      cert.classList.add('visible');
    }catch{ alert('خطأ في الاتصال.'); }
  });

  loadInvestments();
}());
</script>
</body>
</html>
