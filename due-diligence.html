<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>تقرير العناية الواجبة — مُرابحة</title>
<meta name="description" content="تقرير العناية الواجبة لكل صفقة: المؤشرات المالية، تقييم المخاطر، الملاحق القانونية." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:900px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .deal-select-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .deal-select-lbl{font:700 12px Cairo,sans-serif;color:var(--green-dark);white-space:nowrap;}
  .deal-select{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:500 12px Tajawal,sans-serif;background:#fff;}
  .section-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);}
  .metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .metric-box{background:var(--paper);border-radius:10px;padding:12px;}
  .metric-val{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .metric-val.gold{color:var(--gold);}
  .metric-val.green{color:var(--green);}
  .metric-val.warn{color:#a07020;}
  .metric-val.danger{color:#c54a3a;}
  .metric-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .risk-list{display:grid;gap:8px;}
  .risk-item{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--paper);border-radius:10px;}
  .risk-lvl{border-radius:5px;padding:2px 8px;font:700 9px Cairo,sans-serif;white-space:nowrap;flex-shrink:0;}
  .risk-low{background:#e8f5e9;color:#2e7d32;}
  .risk-med{background:#fff8e1;color:#a07020;}
  .risk-high{background:#fdecea;color:#c54a3a;}
  .risk-body{flex:1;}
  .risk-title{font:700 11px Cairo,sans-serif;color:var(--ink);}
  .risk-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;line-height:1.6;}
  .docs-list{display:grid;gap:8px;}
  .doc-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--paper);border-radius:10px;}
  .doc-icon{font-size:20px;flex-shrink:0;}
  .doc-info{flex:1;}
  .doc-name{font:700 11px Cairo,sans-serif;color:var(--ink);}
  .doc-meta{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .btn-dl{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:7px;padding:5px 12px;font:700 9px Cairo,sans-serif;cursor:pointer;}
  .rating-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .rating-score{font:900 40px Cairo,sans-serif;color:var(--green-dark);flex-shrink:0;}
  .rating-info{flex:1;}
  .rating-label{font:700 14px Cairo,sans-serif;color:var(--green);}
  .rating-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:4px;line-height:1.6;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🔍 تقرير العناية الواجبة</h1>
    <p>مراجعة معمّقة للمؤشرات المالية وتقييم المخاطر والوثائق القانونية لكل صفقة.</p>
  </div>

  <div class="deal-select-row">
    <span class="deal-select-lbl">اختر الصفقة:</span>
    <select class="deal-select" id="dealSelect"><option value="">— اختر صفقة —</option></select>
  </div>

  <div id="reportArea"><p class="placeholder-msg">اختر صفقة لعرض تقرير العناية الواجبة.</p></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  const RISK_LABELS={low:'منخفض',medium:'متوسط',high:'مرتفع'};

  function renderReport(d){
    const area=document.getElementById('reportArea'); area.textContent='';

    /* ── Overall Rating ── */
    const ratingCard=document.createElement('div'); ratingCard.className='section-card';
    const rhdr=document.createElement('div'); rhdr.className='section-hdr';
    const rtitle=document.createElement('div'); rtitle.className='section-title'; rtitle.textContent='📈 التقييم الإجمالي';
    rhdr.appendChild(rtitle); ratingCard.appendChild(rhdr);
    const rrow=document.createElement('div'); rrow.className='rating-row';
    const score=document.createElement('div'); score.className='rating-score'; score.textContent=d.overallScore||'A';
    const rinfo=document.createElement('div'); rinfo.className='rating-info';
    const rlabel=document.createElement('div'); rlabel.className='rating-label'; rlabel.textContent=d.ratingLabel||'ممتاز — مخاطر منخفضة';
    const rdesc=document.createElement('div'); rdesc.className='rating-desc'; rdesc.textContent=d.ratingDesc||'تجاوزت الصفقة جميع معايير العناية الواجبة المطلوبة.';
    rinfo.appendChild(rlabel); rinfo.appendChild(rdesc);
    rrow.appendChild(score); rrow.appendChild(rinfo); ratingCard.appendChild(rrow);
    area.appendChild(ratingCard);

    /* ── Financial Metrics ── */
    const fCard=document.createElement('div'); fCard.className='section-card';
    const fhdr=document.createElement('div'); fhdr.className='section-hdr';
    const ftitle=document.createElement('div'); ftitle.className='section-title'; ftitle.textContent='💰 المؤشرات المالية';
    fhdr.appendChild(ftitle); fCard.appendChild(fhdr);
    const mg=document.createElement('div'); mg.className='metrics-grid';
    const metrics=[
      {val:fmt(d.revenue||0)+' ر.س',lbl:'إجمالي الإيرادات',cls:'gold'},
      {val:fmt(d.ebitda||0)+' ر.س',lbl:'EBITDA',cls:'green'},
      {val:(d.debtRatio||0)+'٪',lbl:'نسبة الدين/الأصول',cls:d.debtRatio>60?'danger':d.debtRatio>40?'warn':'green'},
      {val:(d.currentRatio||0)+'x',lbl:'نسبة التداول',cls:''},
      {val:(d.yieldRate||0)+'٪',lbl:'هامش المرابحة',cls:'gold'},
      {val:fmt(d.target||0)+' ر.س',lbl:'هدف التمويل',cls:''},
    ];
    metrics.forEach(m=>{
      const box=document.createElement('div'); box.className='metric-box';
      const v=document.createElement('div'); v.className='metric-val'+(m.cls?' '+m.cls:''); v.textContent=m.val;
      const l=document.createElement('div'); l.className='metric-lbl'; l.textContent=m.lbl;
      box.appendChild(v); box.appendChild(l); mg.appendChild(box);
    });
    fCard.appendChild(mg); area.appendChild(fCard);

    /* ── Risk Assessment ── */
    if((d.risks||[]).length){
      const rCard=document.createElement('div'); rCard.className='section-card';
      const rkhdr=document.createElement('div'); rkhdr.className='section-hdr';
      const rktitle=document.createElement('div'); rktitle.className='section-title'; rktitle.textContent='⚠️ تقييم المخاطر';
      rkhdr.appendChild(rktitle); rCard.appendChild(rkhdr);
      const rl=document.createElement('div'); rl.className='risk-list';
      d.risks.forEach(risk=>{
        const item=document.createElement('div'); item.className='risk-item';
        const lvl=document.createElement('div'); lvl.className='risk-lvl risk-'+(risk.level||'low'); lvl.textContent=RISK_LABELS[risk.level]||'منخفض';
        const body=document.createElement('div'); body.className='risk-body';
        const rt=document.createElement('div'); rt.className='risk-title'; rt.textContent=risk.title||'—';
        const rd=document.createElement('div'); rd.className='risk-desc'; rd.textContent=risk.description||'';
        body.appendChild(rt); body.appendChild(rd); item.appendChild(lvl); item.appendChild(body); rl.appendChild(item);
      });
      rCard.appendChild(rl); area.appendChild(rCard);
    }

    /* ── Documents ── */
    if((d.documents||[]).length){
      const dCard=document.createElement('div'); dCard.className='section-card';
      const dkhdr=document.createElement('div'); dkhdr.className='section-hdr';
      const dktitle=document.createElement('div'); dktitle.className='section-title'; dktitle.textContent='📎 الوثائق والمستندات';
      dkhdr.appendChild(dktitle); dCard.appendChild(dkhdr);
      const dl=document.createElement('div'); dl.className='docs-list';
      d.documents.forEach(doc=>{
        const row=document.createElement('div'); row.className='doc-row';
        const icon=document.createElement('div'); icon.className='doc-icon'; icon.textContent=doc.type==='pdf'?'📄':'📋';
        const info=document.createElement('div'); info.className='doc-info';
        const nm=document.createElement('div'); nm.className='doc-name'; nm.textContent=doc.name||'—';
        const mt=document.createElement('div'); mt.className='doc-meta'; mt.textContent=(doc.pages||'—')+' صفحة · '+doc.date;
        info.appendChild(nm); info.appendChild(mt);
        const btn=document.createElement('button'); btn.className='btn-dl'; btn.textContent='تحميل';
        btn.addEventListener('click',()=>showToast('جارٍ تحميل: '+doc.name));
        row.appendChild(icon); row.appendChild(info); row.appendChild(btn); dl.appendChild(row);
      });
      dCard.appendChild(dl); area.appendChild(dCard);
    }
  }

  document.getElementById('dealSelect').addEventListener('change', async function(){
    const id=this.value;
    const area=document.getElementById('reportArea'); area.textContent='';
    if(!id){ const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='اختر صفقة لعرض تقرير العناية الواجبة.'; area.appendChild(m); return; }
    const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='جارٍ التحميل…'; area.appendChild(m);
    try{
      const r=await fetch('/app/deals/'+encodeURIComponent(id)+'/due-diligence');
      area.textContent='';
      if(!r.ok){ const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=r.status===404?'لا يوجد تقرير لهذه الصفقة.':'تعذّر التحميل.'; area.appendChild(p); return; }
      const d=await r.json(); renderReport(d);
    }catch{ area.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent='تعذّر التحميل. حاول لاحقاً.'; area.appendChild(p); }
  });

  (async function loadDeals(){
    try{
      const r=await fetch('/app/deals?status=open');
      if(!r.ok) return;
      const d=await r.json();
      const sel=document.getElementById('dealSelect');
      (d.deals||[]).forEach(deal=>{
        const opt=document.createElement('option'); opt.value=deal.id; opt.textContent=deal.title||deal.id;
        sel.appendChild(opt);
      });
    }catch{}
  }());
}());
</script>
</body>
</html>
