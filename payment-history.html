<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Payment History — Murbha">سجل المدفوعات — مُرابحة</title>
<meta name="description" content="سجل كامل لجميع مدفوعاتك وإيداعاتك وعمليات السحب في مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;overflow-x:auto;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .filter-chip{border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font:700 10px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .filter-chip.active{border-color:var(--green);background:var(--green);color:#fff;}
  .date-inp{border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;font:500 11px Tajawal,sans-serif;color:var(--ink);}
  .date-inp:focus{outline:none;border-color:var(--green);}
  .pay-table{width:100%;border-collapse:collapse;min-width:560px;}
  .pay-table th{font:700 10px Cairo,sans-serif;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:#f9f7f2;white-space:nowrap;}
  .pay-table td{font:500 11px Tajawal,sans-serif;color:var(--ink);padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .pay-table tr:last-child td{border-bottom:none;}
  .pay-table tr:hover td{background:#fafaf7;}
  .amount-credit{font:900 11px Cairo,sans-serif;color:#2e7d32;}
  .amount-debit{font:900 11px Cairo,sans-serif;color:#c54a3a;}
  .type-badge{border-radius:5px;padding:2px 8px;font:700 9px Cairo,sans-serif;white-space:nowrap;}
  .badge-deposit{background:#e8f5e9;color:#2e7d32;}
  .badge-withdrawal{background:#fdecea;color:#c54a3a;}
  .badge-investment{background:#e3f2fd;color:#1565c0;}
  .badge-return{background:#e8f5e9;color:#2e7d32;}
  .badge-fee{background:#fff8e1;color:#a07020;}
  .badge-refund{background:#f3e5f5;color:#7b1fa2;}
  .st-badge{border-radius:5px;padding:2px 8px;font:700 9px Cairo,sans-serif;}
  .st-completed{background:#e8f5e9;color:#2e7d32;}
  .st-pending{background:#fff8e1;color:#a07020;}
  .st-failed{background:#fdecea;color:#c54a3a;}
  .paging{display:flex;justify-content:center;gap:8px;margin-top:16px;}
  .page-btn{border:1.5px solid var(--line);border-radius:7px;padding:5px 12px;font:700 10px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--green-dark);}
  .page-btn.active{background:var(--green-dark);color:#fbf6ea;border-color:var(--green-dark);}
  .btn-export{float:left;background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:8px 18px;font:900 11px Cairo,sans-serif;cursor:pointer;}
  .btn-export:hover{background:var(--green);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Payment History">سجل المدفوعات</h1>
    <p data-en="Complete record of all your payments, deposits, and withdrawals on Murbha.">سجل كامل لجميع مدفوعاتك وإيداعاتك وعمليات السحب.</p>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="card">
    <div class="card-title" data-en="Transactions">
      المعاملات
      <button class="btn-export" onclick="window.open('/app/me/payment-history/export?fmt=pdf')">تصدير</button>
    </div>
    <div class="filter-bar">
      <div class="filter-chip active" data-type="">الكل</div>
      <div class="filter-chip" data-type="deposit">إيداع</div>
      <div class="filter-chip" data-type="withdrawal">سحب</div>
      <div class="filter-chip" data-type="investment">استثمار</div>
      <div class="filter-chip" data-type="return">عائد</div>
      <div class="filter-chip" data-type="fee">رسوم</div>
      <input class="date-inp" type="date" id="fromDate" />
      <input class="date-inp" type="date" id="toDate" />
    </div>
    <table class="pay-table">
      <thead><tr>
        <th data-en="Date">التاريخ</th>
        <th data-en="Type">النوع</th>
        <th data-en="Description">الوصف</th>
        <th data-en="Amount">المبلغ</th>
        <th data-en="Status">الحالة</th>
        <th data-en="Reference">المرجع</th>
      </tr></thead>
      <tbody id="payBody"></tbody>
    </table>
    <div class="paging" id="paging"></div>
  </div>
</main>
<script>
(function(){
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  const typeLabel={deposit:'إيداع',withdrawal:'سحب',investment:'استثمار',return:'عائد',fee:'رسوم',refund:'استرداد'};
  const typeBadge={deposit:'badge-deposit',withdrawal:'badge-withdrawal',investment:'badge-investment',return:'badge-return',fee:'badge-fee',refund:'badge-refund'};
  const stLabel={completed:'مكتمل',pending:'معلّق',failed:'فشل'};
  const stBadge={completed:'st-completed',pending:'st-pending',failed:'st-failed'};
  const PAGE_SIZE=20;
  let allTx=[], activeType='', activeFrom='', activeTo='', currentPage=1;

  function filtered(){
    return allTx.filter(tx=>{
      if(activeType && tx.type!==activeType) return false;
      const d=(tx.date||'').slice(0,10);
      if(activeFrom && d<activeFrom) return false;
      if(activeTo && d>activeTo) return false;
      return true;
    });
  }

  function renderPage(page){
    currentPage=page;
    const body=document.getElementById('payBody'); body.textContent='';
    const items=filtered(); const slice=items.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
    if(!slice.length){ placeholder(body,'لا توجد معاملات تطابق الفلتر.'); renderPaging(0); return; }
    slice.forEach(tx=>{
      const tr=document.createElement('tr');
      const isCredit=tx.type==='deposit'||tx.type==='return'||tx.type==='refund';
      const tdDate=document.createElement('td'); tdDate.style.color='var(--muted)'; tdDate.textContent=(tx.date||'—').slice(0,10);
      const tdType=document.createElement('td');
      const tb=document.createElement('span'); tb.className='type-badge '+(typeBadge[tx.type]||'badge-fee'); tb.textContent=typeLabel[tx.type]||tx.type||'—';
      tdType.appendChild(tb);
      const tdDesc=document.createElement('td'); tdDesc.textContent=tx.description||'—';
      const tdAmt=document.createElement('td'); tdAmt.className=isCredit?'amount-credit':'amount-debit';
      tdAmt.textContent=(isCredit?'+':'-')+fmt(Math.abs(tx.amount||0))+' ر.س';
      const tdSt=document.createElement('td');
      const sb=document.createElement('span'); sb.className='st-badge '+(stBadge[tx.status]||'st-pending'); sb.textContent=stLabel[tx.status]||tx.status||'—';
      tdSt.appendChild(sb);
      const tdRef=document.createElement('td'); tdRef.style.color='var(--muted)'; tdRef.style.fontSize='10px'; tdRef.textContent=tx.reference||'—';
      tr.appendChild(tdDate); tr.appendChild(tdType); tr.appendChild(tdDesc); tr.appendChild(tdAmt); tr.appendChild(tdSt); tr.appendChild(tdRef);
      body.appendChild(tr);
    });
    renderPaging(Math.ceil(items.length/PAGE_SIZE));
  }

  function renderPaging(total){
    const pg=document.getElementById('paging'); pg.textContent='';
    const start=Math.max(1,currentPage-2); const end=Math.min(total,currentPage+2);
    for(let i=start;i<=end;i++){
      const btn=document.createElement('button'); btn.className='page-btn'+(i===currentPage?' active':''); btn.textContent=String(i);
      const p=i; btn.addEventListener('click',()=>renderPage(p));
      pg.appendChild(btn);
    }
  }

  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active'); activeType=chip.dataset.type||''; renderPage(1);
    });
  });
  document.getElementById('fromDate').addEventListener('change',e=>{ activeFrom=e.target.value; renderPage(1); });
  document.getElementById('toDate').addEventListener('change',e=>{ activeTo=e.target.value; renderPage(1); });

  (async function load(){
    placeholder(document.getElementById('payBody'),'جارٍ التحميل…');
    try{
      const r=await fetch('/app/me/payment-history');
      if(!r.ok){ placeholder(document.getElementById('payBody'),r.status===401?'يرجى تسجيل الدخول.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      const kpiRow=document.getElementById('kpiRow');
      const kpis=d.kpis||{};
      [{lbl:'إجمالي الإيداعات',val:fmt(kpis.totalDeposits||0)+' ر.س'},{lbl:'إجمالي السحوبات',val:fmt(kpis.totalWithdrawals||0)+' ر.س'},{lbl:'إجمالي الاستثمارات',val:fmt(kpis.totalInvestments||0)+' ر.س'},{lbl:'عدد المعاملات',val:String(kpis.count||0)}].forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });
      allTx=d.transactions||[];
      renderPage(1);
    }catch{ placeholder(document.getElementById('payBody'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
