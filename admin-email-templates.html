<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Email Templates — Admin — Murbha">قوالب البريد — الإدارة — مُرابحة</title>
<meta name="description" content="إدارة قوالب رسائل البريد الإلكتروني الرسمية المُرسَلة للمستثمرين." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:1040px;margin:0 auto;padding:28px 18px 60px;}
  .page-title{font:900 22px Cairo,sans-serif;color:var(--green-dark);margin-bottom:20px;}
  /* Two-column layout */
  .layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:flex-start;}
  @media(max-width:700px){.layout{grid-template-columns:1fr;}}
  /* Sidebar */
  .sidebar{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .sidebar-header{padding:14px 16px;background:var(--paper);border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .sidebar-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);}
  .btn-new{background:var(--green-dark);color:#fff;border:none;border-radius:7px;padding:5px 11px;font:700 9px Cairo,sans-serif;cursor:pointer;}
  .btn-new:hover{background:var(--green);}
  /* Category filter */
  .cat-filter{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;}
  .cat-chip{border:1px solid var(--line);border-radius:14px;padding:4px 10px;font:700 8px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .cat-chip.active{border-color:var(--green);background:var(--green);color:#fff;}
  /* Template list */
  .tpl-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;}
  .tpl-item:last-child{border-bottom:none;}
  .tpl-item:hover,.tpl-item.active{background:#f0f7f4;}
  .tpl-name{font:700 11px Cairo,sans-serif;color:var(--green-dark);margin-bottom:2px;}
  .tpl-meta{display:flex;gap:6px;align-items:center;}
  .tpl-event{font:500 9px Tajawal,sans-serif;color:var(--muted);}
  .badge{display:inline-block;border-radius:4px;padding:1px 6px;font:700 7px Cairo,sans-serif;}
  .badge-active{background:#e8f5e9;color:#2e7d32;}
  .badge-draft{background:#f5f5f5;color:#666;}
  /* Editor */
  .editor{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;}
  .editor-empty{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:60px 0;}
  .field{margin-bottom:14px;}
  label{font:700 10px Cairo,sans-serif;color:var(--muted);display:block;margin-bottom:5px;}
  input[type=text],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font:500 13px Tajawal,sans-serif;color:var(--ink);outline:none;background:#fff;}
  input:focus,select:focus,textarea:focus{border-color:var(--green);}
  textarea{resize:vertical;}
  .body-editor{min-height:200px;font-family:'Tajawal',monospace;line-height:1.9;}
  /* Preview panel */
  .preview-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .prev-btn{border:1.5px solid var(--line);border-radius:7px;padding:5px 12px;font:700 9px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--muted);}
  .prev-btn.active{border-color:var(--green);background:var(--green);color:#fff;}
  .preview-frame{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fafafa;font:500 12px Tajawal,sans-serif;color:var(--ink);line-height:1.9;min-height:100px;white-space:pre-wrap;}
  /* Variables */
  .vars-box{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .vars-title{font:700 9px Cairo,sans-serif;color:var(--muted);margin-bottom:6px;}
  .var-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 7px;font:700 8px Cairo,sans-serif;color:var(--green-dark);margin:2px;cursor:pointer;}
  .var-chip:hover{border-color:var(--green);}
  /* Actions */
  .editor-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .btn-save{background:var(--green-dark);color:#fff;border:none;border-radius:9px;padding:10px 22px;font:900 11px Cairo,sans-serif;cursor:pointer;}
  .btn-save:hover{background:var(--green);}
  .btn-test{border:1.5px solid var(--line);background:#fff;color:var(--green-dark);border-radius:9px;padding:10px 16px;font:700 10px Cairo,sans-serif;cursor:pointer;}
  .btn-del{border:1.5px solid #e57373;background:#fff;color:#c54a3a;border-radius:9px;padding:10px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;border-radius:10px;padding:12px 24px;font:700 12px Cairo,sans-serif;z-index:999;display:none;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<div class="toast" id="toast"></div>
<main>
  <div class="page-title" data-en="Email Templates">قوالب البريد الإلكتروني</div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" data-en="Templates">القوالب</span>
        <button class="btn-new" id="btnNew" data-en="+ New">+ جديد</button>
      </div>
      <div class="cat-filter">
        <div class="cat-chip active" data-cat="">الكل</div>
        <div class="cat-chip" data-cat="transactional">معاملات</div>
        <div class="cat-chip" data-cat="kyc">KYC</div>
        <div class="cat-chip" data-cat="marketing">تسويق</div>
      </div>
      <div id="tplList"></div>
    </div>
    <div class="editor" id="editor">
      <div class="editor-empty" id="edEmpty" data-en="Select a template or create a new one.">اختر قالباً أو أنشئ قالباً جديداً.</div>
      <div id="edForm" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="field">
            <label data-en="Template Name">اسم القالب</label>
            <input type="text" id="edName" maxlength="120" />
          </div>
          <div class="field">
            <label data-en="Category">الفئة</label>
            <select id="edCat">
              <option value="transactional">معاملات</option>
              <option value="kyc">KYC</option>
              <option value="marketing">تسويق</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label data-en="Trigger Event">الحدث المُشغِّل</label>
          <select id="edEvent">
            <option value="welcome">ترحيب بالمستخدم الجديد</option>
            <option value="kyc_approved">اعتماد KYC</option>
            <option value="kyc_rejected">رفض KYC</option>
            <option value="investment_confirmed">تأكيد الاستثمار</option>
            <option value="return_paid">صرف عائد</option>
            <option value="deal_closed">إغلاق صفقة</option>
            <option value="password_reset">إعادة كلمة المرور</option>
            <option value="withdrawal_processed">معالجة سحب</option>
            <option value="custom">مخصص</option>
          </select>
        </div>
        <div class="field">
          <label data-en="Subject Line">سطر الموضوع</label>
          <input type="text" id="edSubject" maxlength="200" />
        </div>
        <div class="field">
          <label data-en="Email Body">نص الرسالة</label>
          <div class="preview-toggle">
            <button class="prev-btn active" data-mode="edit" data-en="Edit">تعديل</button>
            <button class="prev-btn" data-mode="preview" data-en="Preview">معاينة</button>
          </div>
          <textarea class="body-editor" id="edBody" rows="10"></textarea>
          <div class="preview-frame" id="previewFrame" style="display:none;"></div>
          <div class="vars-box">
            <div class="vars-title" data-en="Click to insert variable:">انقر لإدراج متغير:</div>
            <span class="var-chip" data-var="{{name}}">{{name}}</span>
            <span class="var-chip" data-var="{{email}}">{{email}}</span>
            <span class="var-chip" data-var="{{amount}}">{{amount}}</span>
            <span class="var-chip" data-var="{{deal_name}}">{{deal_name}}</span>
            <span class="var-chip" data-var="{{date}}">{{date}}</span>
            <span class="var-chip" data-var="{{return_rate}}">{{return_rate}}</span>
            <span class="var-chip" data-var="{{platform_name}}">{{platform_name}}</span>
            <span class="var-chip" data-var="{{support_email}}">{{support_email}}</span>
          </div>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:10px;">
          <label style="margin:0;" data-en="Status:">الحالة:</label>
          <select id="edStatus" style="width:auto;">
            <option value="active">نشط</option>
            <option value="draft">مسوّدة</option>
          </select>
        </div>
        <div class="editor-actions">
          <button class="btn-del" id="btnDel" data-en="Delete">حذف</button>
          <button class="btn-test" id="btnTest" data-en="Send Test">إرسال تجريبي</button>
          <button class="btn-save" id="btnSave" data-en="Save">حفظ</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(function(){
  function csrf(){return(document.cookie.match(/csrf=([^;]+)/)||[])[1]||'';}
  function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#c54a3a':'#2e7d32';t.style.display='block';setTimeout(()=>{t.style.display='none';},3200);}

  const defaultTpls=[
    {id:'tpl_welcome',name:'ترحيب بالمستخدم',category:'transactional',event:'welcome',status:'active',subject:'مرحباً بك في مُرابحة! 🎉',body:'مرحباً {{name}}،\n\nنرحب بك في منصة مُرابحة لاستثمار شرعي حقيقي.\nحسابك جاهز الآن. ابدأ باستكشاف الصفقات المتاحة.\n\nفريق مُرابحة'},
    {id:'tpl_kyc_ok',name:'اعتماد KYC',category:'kyc',event:'kyc_approved',status:'active',subject:'✅ تم اعتماد هويتك — مُرابحة',body:'مرحباً {{name}}،\n\nتم التحقق من هويتك بنجاح.\nيمكنك الآن الاستثمار بحرية.\n\nفريق مُرابحة'},
    {id:'tpl_invest',name:'تأكيد الاستثمار',category:'transactional',event:'investment_confirmed',status:'active',subject:'✅ تأكيد استثمارك في {{deal_name}}',body:'مرحباً {{name}}،\n\nتم تأكيد استثمارك:\nالصفقة: {{deal_name}}\nالمبلغ: {{amount}}\nالعائد المتوقع: {{return_rate}}\nالتاريخ: {{date}}\n\nفريق مُرابحة'},
    {id:'tpl_return',name:'صرف عائد',category:'transactional',event:'return_paid',status:'active',subject:'💰 تم صرف عائدك من {{deal_name}}',body:'مرحباً {{name}}،\n\nتم إضافة العائد {{amount}} من صفقة {{deal_name}} لمحفظتك.\n\nفريق مُرابحة'},
  ];

  let templates=[...defaultTpls];
  let activeId=null;
  let activeCat='';

  function filtered(){return activeCat?templates.filter(t=>t.category===activeCat):templates;}

  function renderList(){
    const el=document.getElementById('tplList');el.textContent='';
    filtered().forEach(t=>{
      const item=document.createElement('div');item.className='tpl-item'+(t.id===activeId?' active':'');
      const name=document.createElement('div');name.className='tpl-name';name.textContent=t.name;
      const meta=document.createElement('div');meta.className='tpl-meta';
      const ev=document.createElement('span');ev.className='tpl-event';ev.textContent=t.event||'';
      const badge=document.createElement('span');badge.className='badge badge-'+(t.status||'draft');badge.textContent=t.status==='active'?'نشط':'مسوّدة';
      meta.appendChild(ev);meta.appendChild(badge);
      item.appendChild(name);item.appendChild(meta);
      item.addEventListener('click',()=>selectTpl(t.id));
      el.appendChild(item);
    });
  }

  function selectTpl(id){
    activeId=id;renderList();
    const t=templates.find(x=>x.id===id);if(!t)return;
    document.getElementById('edEmpty').style.display='none';
    document.getElementById('edForm').style.display='block';
    document.getElementById('edName').value=t.name||'';
    document.getElementById('edCat').value=t.category||'transactional';
    document.getElementById('edEvent').value=t.event||'custom';
    document.getElementById('edSubject').value=t.subject||'';
    document.getElementById('edBody').value=t.body||'';
    document.getElementById('edStatus').value=t.status||'draft';
    document.getElementById('edBody').style.display='block';
    document.getElementById('previewFrame').style.display='none';
    document.querySelectorAll('.prev-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='edit'));
  }

  document.querySelectorAll('.cat-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');activeCat=chip.dataset.cat;renderList();
    });
  });

  document.querySelectorAll('.prev-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.prev-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(btn.dataset.mode==='preview'){
        const body=document.getElementById('edBody').value;
        document.getElementById('previewFrame').textContent=body;
        document.getElementById('edBody').style.display='none';
        document.getElementById('previewFrame').style.display='block';
      } else {
        document.getElementById('edBody').style.display='block';
        document.getElementById('previewFrame').style.display='none';
      }
    });
  });

  document.querySelectorAll('.var-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const ta=document.getElementById('edBody');
      const start=ta.selectionStart;const end=ta.selectionEnd;
      const txt=ta.value;
      ta.value=txt.slice(0,start)+chip.dataset.var+txt.slice(end);
      ta.focus();ta.selectionStart=ta.selectionEnd=start+chip.dataset.var.length;
    });
  });

  document.getElementById('btnNew').addEventListener('click',()=>{
    const newId='new_'+Date.now();
    templates.unshift({id:newId,name:'قالب جديد',category:'transactional',event:'custom',status:'draft',subject:'',body:''});
    renderList();selectTpl(newId);
  });

  document.getElementById('btnSave').addEventListener('click',async()=>{
    if(!activeId)return;
    const t=templates.find(x=>x.id===activeId);if(!t)return;
    t.name=document.getElementById('edName').value.trim()||t.name;
    t.category=document.getElementById('edCat').value;
    t.event=document.getElementById('edEvent').value;
    t.subject=document.getElementById('edSubject').value.trim();
    t.body=document.getElementById('edBody').value;
    t.status=document.getElementById('edStatus').value;
    const btn=document.getElementById('btnSave');btn.disabled=true;
    try{
      const isNew=activeId.startsWith('new_');
      const r=await fetch(isNew?'/app/admin/email-templates':'/app/admin/email-templates/'+encodeURIComponent(activeId),{method:isNew?'POST':'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify(t)});
      btn.disabled=false;
      if(!r.ok){toast('فشل الحفظ.',true);return;}
      if(isNew){const d=await r.json();if(d.id){t.id=d.id;activeId=d.id;}}
      toast('تم الحفظ!');renderList();
    }catch{btn.disabled=false;}
  });

  document.getElementById('btnDel').addEventListener('click',async()=>{
    if(!activeId||!confirm('حذف هذا القالب؟'))return;
    try{await fetch('/app/admin/email-templates/'+encodeURIComponent(activeId),{method:'DELETE',headers:{'X-CSRF-Token':csrf()}});}catch{}
    templates=templates.filter(x=>x.id!==activeId);activeId=null;
    document.getElementById('edEmpty').style.display='block';document.getElementById('edForm').style.display='none';
    renderList();toast('تم الحذف.');
  });

  document.getElementById('btnTest').addEventListener('click',async()=>{
    const to=prompt('البريد الإلكتروني للإرسال التجريبي:');if(!to)return;
    try{
      await fetch('/app/admin/email-templates/test',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({templateId:activeId,to})});
      toast('تم إرسال الرسالة التجريبية!');
    }catch{toast('فشل الإرسال.',true);}
  });

  async function load(){
    try{
      const r=await fetch('/app/admin/email-templates');
      if(r.ok){const d=await r.json();if(d.templates&&d.templates.length)templates=d.templates;}
    }catch{}
    renderList();
  }

  load();
}());
</script>
</body>
</html>
