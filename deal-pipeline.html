<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>خط أنابيب الصفقات — مُرابحة</title>
<meta name="description" content="لوحة إدارة الصفقات للمديرين. تتبّع مراحل كل صفقة من التقديم حتى الإغلاق." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:1120px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:36px 22px;margin-bottom:18px;text-align:center;}
  .hero h1{font:900 26px Cairo,sans-serif;margin-bottom:6px;}
  .hero p{font:500 13px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.8;}
  .admin-badge{background:rgba(176,136,64,.25);color:var(--gold-light);border-radius:99px;padding:4px 14px;font:700 11px Cairo,sans-serif;display:inline-block;margin-bottom:10px;}
  .pipeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .lane{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .lane-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--line);}
  .lane-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .lane-count{background:var(--paper);border-radius:99px;padding:2px 10px;font:900 12px Cairo,sans-serif;color:var(--muted);}
  .lane-count.active{background:var(--green);color:#fbf6ea;}
  .deal-card{background:var(--paper);border-radius:10px;padding:12px;border:1px solid var(--line);}
  .deal-card:hover{box-shadow:0 2px 8px rgba(10,77,54,.08);}
  .deal-name{font:700 12px Cairo,sans-serif;color:var(--green-dark);margin-bottom:4px;}
  .deal-sponsor{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-bottom:6px;}
  .deal-amount{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .deal-amount-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .deal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .deal-tag{border-radius:4px;padding:2px 6px;font:700 9px Cairo,sans-serif;}
  .tag-real_estate{background:#e8f5e9;color:var(--green);}
  .tag-logistics{background:#e3f2fd;color:#1565c0;}
  .tag-tech{background:#f3e5f5;color:#7b1fa2;}
  .tag-agri{background:#f1f8e9;color:#558b2f;}
  .tag-other{background:var(--paper);color:var(--muted);}
  .deal-yield{font:700 11px Cairo,sans-serif;color:var(--gold);}
  .deal-days{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .deal-actions{display:flex;gap:5px;margin-top:8px;}
  .btn-advance{background:var(--green);color:#fbf6ea;border:none;border-radius:5px;padding:5px 10px;font:700 9px Cairo,sans-serif;cursor:pointer;}
  .btn-reject-deal{background:#fdecea;color:#c54a3a;border:1px solid #f5c6c0;border-radius:5px;padding:5px 10px;font:700 9px Cairo,sans-serif;cursor:pointer;}
  .lane-empty{font:500 11px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:20px 0;}
  .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .sum-chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
  .sum-num{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .sum-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:28px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="admin-badge">🔒 مشرفون فقط</div>
    <h1>🔄 خط أنابيب الصفقات</h1>
    <p>تتبّع كل صفقة من تقديمها حتى إغلاقها. أقرّ أو ارفض وانقل الصفقة إلى المرحلة التالية.</p>
  </div>

  <div class="summary-row" id="summaryRow">
    <p class="placeholder-msg">جارٍ التحميل…</p>
  </div>

  <div class="pipeline-grid" id="pipelineGrid">
    <p class="placeholder-msg">جارٍ التحميل…</p>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  const STAGES = [
    { key:'submitted',  label:'مقدَّمة',      next:'under_review' },
    { key:'under_review', label:'قيد المراجعة', next:'approved' },
    { key:'approved',   label:'معتمدة',       next:'active' },
    { key:'active',     label:'نشطة',         next:'closing' },
    { key:'closing',    label:'على وشك الإغلاق', next:'closed' },
    { key:'closed',     label:'مغلقة',        next:null },
  ];

  let allDeals = [];

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2400);
  }

  function daysSince(s){
    if(!s) return 0;
    return Math.floor((Date.now()-new Date(s).getTime())/86400000);
  }

  function renderSummary(){
    const row = document.getElementById('summaryRow');
    row.textContent = '';
    const active = allDeals.filter(d=>d.stage==='active').length;
    const pending = allDeals.filter(d=>['submitted','under_review'].includes(d.stage)).length;
    const totalAmount = allDeals.filter(d=>d.stage==='active').reduce((s,d)=>s+(d.targetAmount||0),0);
    [
      {num:allDeals.length,lbl:'إجمالي الصفقات'},
      {num:pending,lbl:'تنتظر المراجعة'},
      {num:active,lbl:'صفقات نشطة'},
      {num:'SAR '+fmt(totalAmount),lbl:'حجم الصفقات النشطة'},
    ].forEach(it=>{
      const chip=document.createElement('div'); chip.className='sum-chip';
      const num=document.createElement('div'); num.className='sum-num'; num.textContent=it.num;
      const lbl=document.createElement('div'); lbl.className='sum-lbl'; lbl.textContent=it.lbl;
      chip.appendChild(num); chip.appendChild(lbl); row.appendChild(chip);
    });
  }

  function renderPipeline(){
    const grid = document.getElementById('pipelineGrid');
    grid.textContent = '';
    STAGES.forEach(stage => {
      const deals = allDeals.filter(d => d.stage === stage.key);
      const lane = document.createElement('div');
      lane.className = 'lane';

      const hdr = document.createElement('div');
      hdr.className = 'lane-header';
      const titleEl = document.createElement('div');
      titleEl.className = 'lane-title';
      titleEl.textContent = stage.label;
      const countEl = document.createElement('div');
      countEl.className = 'lane-count' + (stage.key==='active'?' active':'');
      countEl.textContent = deals.length;
      hdr.appendChild(titleEl);
      hdr.appendChild(countEl);
      lane.appendChild(hdr);

      if(!deals.length){
        const empty = document.createElement('div');
        empty.className = 'lane-empty';
        empty.textContent = 'لا توجد صفقات';
        lane.appendChild(empty);
      }

      deals.forEach(deal => {
        const card = document.createElement('div');
        card.className = 'deal-card';

        const name = document.createElement('div');
        name.className = 'deal-name';
        name.textContent = deal.name || deal.title || 'صفقة';

        const sponsor = document.createElement('div');
        sponsor.className = 'deal-sponsor';
        sponsor.textContent = deal.sponsorName || '—';

        const amount = document.createElement('div');
        amount.className = 'deal-amount';
        amount.textContent = 'SAR '+fmt(deal.targetAmount||0);
        const amountLbl = document.createElement('div');
        amountLbl.className = 'deal-amount-lbl';
        amountLbl.textContent = 'المبلغ المستهدف';

        const meta = document.createElement('div');
        meta.className = 'deal-meta';
        const catTag = document.createElement('span');
        catTag.className = 'deal-tag tag-'+(deal.category||'other');
        catTag.textContent = deal.categoryLabel || deal.category || '—';
        const yieldTag = document.createElement('span');
        yieldTag.className = 'deal-yield';
        yieldTag.textContent = (deal.expectedYield||0)+'٪ عائد';
        meta.appendChild(catTag);
        meta.appendChild(yieldTag);

        const days = document.createElement('div');
        days.className = 'deal-days';
        days.textContent = 'منذ ' + daysSince(deal.submittedAt) + ' يوم';

        card.appendChild(name);
        card.appendChild(sponsor);
        card.appendChild(amount);
        card.appendChild(amountLbl);
        card.appendChild(meta);
        card.appendChild(days);

        if(stage.next){
          const actRow = document.createElement('div');
          actRow.className = 'deal-actions';
          const advBtn = document.createElement('button');
          advBtn.className = 'btn-advance';
          advBtn.textContent = '← تقدّم';
          advBtn.addEventListener('click', () => advanceDeal(deal.id, stage.next));
          const rejBtn = document.createElement('button');
          rejBtn.className = 'btn-reject-deal';
          rejBtn.textContent = '✗ رفض';
          rejBtn.addEventListener('click', () => advanceDeal(deal.id, 'rejected'));
          actRow.appendChild(advBtn);
          actRow.appendChild(rejBtn);
          card.appendChild(actRow);
        }

        lane.appendChild(card);
      });
      grid.appendChild(lane);
    });
  }

  async function advanceDeal(dealId, newStage){
    try{
      const r = await fetch('/app/admin/deals/'+encodeURIComponent(dealId)+'/stage', {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},
        body:JSON.stringify({stage:newStage})
      });
      if(!r.ok){ showToast('تعذّر تحديث المرحلة.'); return; }
      const deal = allDeals.find(d=>d.id===dealId);
      if(deal) deal.stage = newStage;
      const labels = {approved:'تم الاعتماد ✓',active:'أُطلقت الصفقة 🚀',closed:'أُغلقت الصفقة',rejected:'تم الرفض'};
      showToast(labels[newStage]||'تم التحديث');
      renderSummary();
      renderPipeline();
    }catch{ showToast('خطأ في الاتصال.'); }
  }

  (async function load(){
    try{
      const r = await fetch('/app/admin/deal-pipeline');
      if(!r.ok){
        document.getElementById('pipelineGrid').textContent='';
        const m=document.createElement('p'); m.className='placeholder-msg';
        m.textContent=r.status===401?'يجب تسجيل الدخول كمشرف.':'تعذّر التحميل.';
        document.getElementById('pipelineGrid').appendChild(m);
        return;
      }
      const d = await r.json();
      allDeals = d.deals || [];
      renderSummary();
      renderPipeline();
    }catch{
      document.getElementById('pipelineGrid').textContent='';
      const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='تعذّر التحميل. حاول لاحقاً.';
      document.getElementById('pipelineGrid').appendChild(m);
    }
  }());
}());
</script>
</body>
</html>
