<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>إنجازاتي — مُرابحة</title>
<meta name="description" content="تتبّع إنجازاتك الاستثمارية. شارات، مراحل، ومكافآت خاصة بمسيرتك مع مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:600px;margin:0 auto;line-height:1.85;}
  .summary-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .summary-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;flex:1;min-width:130px;text-align:center;}
  .summary-chip-num{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .summary-chip-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px;}
  section h2{font:900 18px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .badge-card{border-radius:14px;padding:18px 12px;text-align:center;border:2px solid transparent;transition:transform .15s;}
  .badge-card:hover{transform:translateY(-2px);}
  .badge-card.earned{border-color:var(--gold);background:linear-gradient(160deg,#fffdf5,#fdf5e4);}
  .badge-card.locked{background:var(--paper);opacity:.55;filter:grayscale(.6);}
  .badge-icon{font-size:34px;margin-bottom:8px;}
  .badge-name{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-bottom:4px;}
  .badge-desc{font:500 10px Tajawal,sans-serif;color:var(--muted);line-height:1.5;}
  .badge-earned-date{font:700 10px Cairo,sans-serif;color:var(--gold);margin-top:6px;}
  .milestone-list{display:grid;gap:10px;}
  .milestone-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--paper);}
  .milestone-row.done{background:#e8f5e9;}
  .milestone-icon{font-size:24px;flex-shrink:0;}
  .milestone-info{flex:1;}
  .milestone-title{font:700 13px Cairo,sans-serif;color:var(--green-dark);}
  .milestone-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .milestone-progress{margin-top:6px;}
  .prog-bar{background:var(--line);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s;}
  .prog-label{font:700 10px Cairo,sans-serif;color:var(--muted);margin-top:4px;}
  .milestone-reward{font:700 11px Cairo,sans-serif;color:var(--gold);flex-shrink:0;}
  .timeline-list{display:grid;gap:10px;}
  .tl-item{display:flex;gap:12px;align-items:flex-start;}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:4px;flex-shrink:0;}
  .tl-content{flex:1;}
  .tl-title{font:700 12px Cairo,sans-serif;color:var(--green-dark);}
  .tl-date{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:28px 0;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🏆 إنجازاتي</h1>
    <p>مسيرتك الاستثمارية في أرقام. شارات تُكسبها بالاستثمار الذكي ومراحل تُحفّزك للمضي قُدُماً.</p>
  </div>

  <div class="summary-strip" id="summaryStrip">
    <p class="placeholder-msg" style="grid-column:1/-1">جارٍ التحميل…</p>
  </div>

  <section>
    <h2>🎖️ شاراتي</h2>
    <div class="badge-grid" id="badgeGrid">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>

  <section>
    <h2>🗺️ المراحل والأهداف</h2>
    <div class="milestone-list" id="milestoneList">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>

  <section>
    <h2>📅 سجل الإنجازات</h2>
    <div class="timeline-list" id="timelineList">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>
</main>
<script>
(function(){
  function fmtDate(s){ return s ? new Date(s).toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'}) : '—'; }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  function renderSummary(d){
    const strip = document.getElementById('summaryStrip');
    strip.textContent = '';
    const items = [
      {num:d.totalBadges||0,lbl:'شارة مكتسبة'},
      {num:d.completedMilestones||0,lbl:'مرحلة مكتملة'},
      {num:d.memberSince?Math.floor((Date.now()-new Date(d.memberSince))/(86400000*30)):0,lbl:'شهر معنا'},
      {num:fmt(d.totalInvested||0)+' ر.س',lbl:'إجمالي الاستثمار'},
    ];
    items.forEach(it=>{
      const chip = document.createElement('div');
      chip.className = 'summary-chip';
      const num = document.createElement('div'); num.className='summary-chip-num'; num.textContent=it.num;
      const lbl = document.createElement('div'); lbl.className='summary-chip-lbl'; lbl.textContent=it.lbl;
      chip.appendChild(num); chip.appendChild(lbl);
      strip.appendChild(chip);
    });
  }

  function renderBadges(badges){
    const grid = document.getElementById('badgeGrid');
    grid.textContent = '';
    if(!badges.length){ const m=document.createElement('p');m.className='placeholder-msg';m.textContent='لا توجد شارات بعد.';grid.appendChild(m);return; }
    badges.forEach(b=>{
      const card = document.createElement('div');
      card.className = 'badge-card ' + (b.earned ? 'earned' : 'locked');
      const ico = document.createElement('div'); ico.className='badge-icon'; ico.textContent=b.icon;
      const nm = document.createElement('div'); nm.className='badge-name'; nm.textContent=b.name;
      const desc = document.createElement('div'); desc.className='badge-desc'; desc.textContent=b.description;
      card.appendChild(ico); card.appendChild(nm); card.appendChild(desc);
      if(b.earned && b.earnedAt){
        const dateEl = document.createElement('div'); dateEl.className='badge-earned-date';
        dateEl.textContent = fmtDate(b.earnedAt);
        card.appendChild(dateEl);
      }
      grid.appendChild(card);
    });
  }

  function renderMilestones(milestones){
    const list = document.getElementById('milestoneList');
    list.textContent = '';
    if(!milestones.length){ const m=document.createElement('p');m.className='placeholder-msg';m.textContent='لا توجد مراحل.';list.appendChild(m);return; }
    milestones.forEach(ms=>{
      const row = document.createElement('div');
      row.className = 'milestone-row' + (ms.completed ? ' done' : '');
      const ico = document.createElement('div'); ico.className='milestone-icon'; ico.textContent=ms.icon;
      const info = document.createElement('div'); info.className='milestone-info';
      const title = document.createElement('div'); title.className='milestone-title'; title.textContent=ms.title;
      const desc = document.createElement('div'); desc.className='milestone-desc'; desc.textContent=ms.description;
      info.appendChild(title); info.appendChild(desc);
      if(!ms.completed && ms.progress !== undefined){
        const prog = document.createElement('div'); prog.className='milestone-progress';
        const bar = document.createElement('div'); bar.className='prog-bar';
        const fill = document.createElement('div'); fill.className='prog-fill';
        const pct = Math.min(100, Math.round((ms.progress/(ms.target||1))*100));
        fill.style.width = pct+'%';
        bar.appendChild(fill); prog.appendChild(bar);
        const lbl = document.createElement('div'); lbl.className='prog-label';
        lbl.textContent = fmt(ms.progress) + ' / ' + fmt(ms.target) + ' ' + (ms.unit||'');
        prog.appendChild(lbl); info.appendChild(prog);
      }
      const reward = document.createElement('div'); reward.className='milestone-reward';
      reward.textContent = ms.reward || '';
      row.appendChild(ico); row.appendChild(info); row.appendChild(reward);
      list.appendChild(row);
    });
  }

  function renderTimeline(events){
    const tl = document.getElementById('timelineList');
    tl.textContent = '';
    if(!events.length){ const m=document.createElement('p');m.className='placeholder-msg';m.textContent='لا توجد أحداث مسجّلة بعد.';tl.appendChild(m);return; }
    events.forEach(ev=>{
      const item = document.createElement('div'); item.className='tl-item';
      const dot = document.createElement('div'); dot.className='tl-dot';
      const content = document.createElement('div'); content.className='tl-content';
      const title = document.createElement('div'); title.className='tl-title'; title.textContent=ev.title;
      const date = document.createElement('div'); date.className='tl-date'; date.textContent=fmtDate(ev.date);
      content.appendChild(title); content.appendChild(date);
      item.appendChild(dot); item.appendChild(content);
      tl.appendChild(item);
    });
  }

  (async function load(){
    try{
      const r = await fetch('/app/me/milestones');
      if(!r.ok){
        ['summaryStrip','badgeGrid','milestoneList','timelineList'].forEach(id=>{
          const el=document.getElementById(id); el.textContent='';
          const m=document.createElement('p'); m.className='placeholder-msg';
          m.textContent=r.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.'; el.appendChild(m);
        });
        return;
      }
      const d = await r.json();
      renderSummary(d);
      renderBadges(d.badges||[]);
      renderMilestones(d.milestones||[]);
      renderTimeline(d.timeline||[]);
    }catch{
      ['summaryStrip','badgeGrid','milestoneList','timelineList'].forEach(id=>{
        const el=document.getElementById(id); el.textContent='';
        const m=document.createElement('p'); m.className='placeholder-msg'; m.textContent='تعذّر التحميل. حاول لاحقاً.'; el.appendChild(m);
      });
    }
  }());
}());
</script>
</body>
</html>
