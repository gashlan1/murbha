<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#062b1e" />
<title>طرق الدفع — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/assets/site.css" />
<script src="app.js"></script>
<style>
:root {
  --ink: #0d1612; --ink-soft: #1f2a23;
  --paper: #fbf6ea; --paper-2: #efe8d6;
  --green: #0a4d36; --green-dark: #062b1e; --green-soft: #14694e;
  --gold: #b08840; --gold-light: #d4ac6e; --gold-soft: #e8d3a8;
  --muted: #6b7268; --line: rgba(13,22,18,0.10); --line-strong: rgba(13,22,18,0.20);
  --red: #c54a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body { font-family: 'Tajawal','Geeza Pro',system-ui,sans-serif; color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; padding-bottom: 80px; }
header {
  position: sticky; top: 0; z-index: 50; background: rgba(251,246,234,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--line); padding: 14px 18px; display: flex; align-items: center; gap: 12px;
}
.back-btn {
  width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%;
  background: #fff; display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--green-dark); text-decoration: none; font: 800 18px 'Cairo',sans-serif;
}
.title { flex: 1; font: 800 16px 'Cairo',sans-serif; color: var(--green-dark); }
main { max-width: 680px; margin: 0 auto; padding: 18px; }
.section { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
.section-h { font: 800 14px 'Cairo',sans-serif; color: var(--green-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.method-row {
  display: flex; align-items: center; gap: 12px; padding: 14px 0;
  border-bottom: 1px dashed var(--line);
}
.method-row:last-child { border-bottom: none; }
.method-icon {
  width: 44px; height: 44px; border-radius: 10px; background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font: 800 12px 'Cairo',sans-serif; color: var(--green-dark); border: 1px solid var(--line); flex-shrink: 0;
}
.method-icon.visa { background: #1a1f71; color: #fff; }
.method-icon.mastercard { background: linear-gradient(135deg, #eb001b, #f79e1b); color: #fff; }
.method-icon.mada { background: var(--green); color: #fff; }
.method-icon.iban { background: var(--gold-soft); color: var(--green-dark); }
.method-info { flex: 1; min-width: 0; }
.method-name { font: 800 14px 'Cairo',sans-serif; color: var(--ink); margin-bottom: 2px; }
.method-sub { font: 500 12px 'Tajawal',sans-serif; color: var(--muted); direction: ltr; text-align: start; }
.method-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.chip {
  background: rgba(15,110,58,0.10); color: #0f6e3a; padding: 4px 10px;
  border-radius: 999px; font: 800 10px 'Cairo',sans-serif;
}
.icon-btn {
  min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted); font: 700 12px 'Tajawal',sans-serif;
}
.icon-btn:hover { color: var(--green-dark); border-color: var(--green-soft); }
.icon-btn.danger { color: var(--red); }
.icon-btn.danger:hover { background: var(--red); color: #fff; border-color: var(--red); }
.empty {
  text-align: center; color: var(--muted); padding: 32px 16px;
  border: 2px dashed var(--line); border-radius: 14px;
}
.tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--paper); padding: 4px; border-radius: 12px; }
.tab {
  flex: 1; padding: 10px; border: 0; background: transparent; border-radius: 10px;
  font: 800 13px 'Cairo',sans-serif; color: var(--muted); cursor: pointer;
}
.tab.active { background: #fff; color: var(--green-dark); box-shadow: 0 2px 6px rgba(13,22,18,0.06); }
label { display: block; font: 700 12px 'Cairo',sans-serif; color: var(--ink); margin-bottom: 6px; margin-top: 12px; }
input[type=text], input[type=tel], input[type=number] {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--line-strong);
  border-radius: 12px; font: 500 15px 'Tajawal',sans-serif; background: var(--paper);
  direction: ltr; text-align: start;
}
input:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(10,77,54,0.1); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-primary {
  width: 100%; padding: 14px; margin-top: 16px; background: var(--green);
  color: var(--paper); border: 0; border-radius: 12px;
  font: 800 14px 'Cairo',sans-serif; cursor: pointer; min-height: 48px;
  box-shadow: 0 4px 14px rgba(10,77,54,0.25);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: var(--red); font: 700 12px 'Tajawal',sans-serif; margin-top: 8px; text-align: center; }
.hint { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.6; }

.txn-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.txn-row:last-child { border-bottom: none; }
.txn-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font: 800 14px 'Cairo',sans-serif;
}
.txn-icon.deposit { background: rgba(15,110,58,0.12); color: #0f6e3a; }
.txn-icon.withdraw { background: rgba(176,136,64,0.12); color: var(--gold); }
.txn-icon.failed { background: rgba(197,74,58,0.12); color: var(--red); }
.txn-meta { flex: 1; min-width: 0; }
.txn-title { font: 800 13px 'Cairo',sans-serif; color: var(--ink); margin-bottom: 2px; }
.txn-sub { font: 500 11px 'Tajawal',sans-serif; color: var(--muted); }
.txn-amount { font: 800 14px 'Cairo',sans-serif; direction: ltr; text-align: end; }
.txn-amount.in { color: #0f6e3a; }
.txn-amount.out { color: var(--gold); }
.txn-amount.fail { color: var(--red); text-decoration: line-through; }
</style>
</head>
<body>
<header>
  <a href="profile.html" class="back-btn" aria-label="رجوع">←</a>
  <div class="title">طرق الدفع</div>
</header>

<main id="main">
  <div class="section">
    <div class="section-h">💳 الطرق المحفوظة</div>
    <div id="methodsList"><div class="empty">جاري التحميل…</div></div>
  </div>

  <div class="section">
    <div class="section-h">➕ إضافة طريقة دفع جديدة</div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="card">بطاقة ائتمان/مدى</button>
      <button type="button" class="tab" data-tab="iban">حساب بنكي (IBAN)</button>
    </div>

    <form id="cardForm">
      <label>اسم صاحب البطاقة</label>
      <input type="text" id="cardHolder" placeholder="الاسم كما يظهر على البطاقة" required />
      <label>رقم البطاقة</label>
      <input type="tel" id="cardPan" inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" autocomplete="cc-number" required />
      <div class="row-2">
        <div>
          <label>الانتهاء (MM/YYYY)</label>
          <input type="tel" id="cardExp" inputmode="numeric" maxlength="7" placeholder="12/2029" autocomplete="cc-exp" required />
        </div>
        <div>
          <label>CVV</label>
          <input type="tel" id="cardCvv" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="cc-csc" required />
        </div>
      </div>
      <div class="hint">لا نحتفظ برقم بطاقتك الكامل أو رمز CVV — يُرسلان مشفّرين إلى مزوّد الدفع للحصول على رمز آمن (token).</div>
      <div class="error" id="cardError" style="display:none;"></div>
      <button type="submit" class="btn-primary" id="cardSubmit">حفظ البطاقة</button>
    </form>

    <form id="ibanForm" style="display:none;">
      <label>اسم صاحب الحساب</label>
      <input type="text" id="ibanHolder" placeholder="الاسم في البنك" required />
      <label>رقم IBAN السعودي</label>
      <input type="text" id="ibanInput" maxlength="29" placeholder="SA0000000000000000000000" required style="letter-spacing:1px;text-transform:uppercase;" />
      <div class="hint">IBAN السعودي يبدأ بـ SA ويتكوّن من ٢٤ خانة. سنستخدمه فقط لتحويل عمليات السحب من حسابك على المنصّة.</div>
      <div class="error" id="ibanError" style="display:none;"></div>
      <button type="submit" class="btn-primary" id="ibanSubmit">حفظ الحساب البنكي</button>
    </form>
  </div>

  <div class="section">
    <div class="section-h">📜 آخر العمليات</div>
    <div id="txnList"><div class="empty">جاري التحميل…</div></div>
  </div>
</main>

<script>
(async function () {
  const user = await App.requireAuth('login.html');
  if (!user) return;

  // ── Tabs
  document.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('cardForm').style.display = b.dataset.tab === 'card' ? '' : 'none';
      document.getElementById('ibanForm').style.display = b.dataset.tab === 'iban' ? '' : 'none';
    };
  });

  // ── Card input formatting
  const cardPan = document.getElementById('cardPan');
  cardPan.addEventListener('input', () => {
    const v = cardPan.value.replace(/\D/g, '').slice(0, 19);
    cardPan.value = v.replace(/(\d{4})(?=\d)/g, '$1 ');
  });
  const cardExp = document.getElementById('cardExp');
  cardExp.addEventListener('input', () => {
    let v = cardExp.value.replace(/\D/g, '').slice(0, 6);
    if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
    cardExp.value = v;
  });

  // ── Render methods
  function methodIcon(m) {
    const el = document.createElement('div');
    el.className = 'method-icon ' + (m.type === 'iban' ? 'iban' : (m.brand || ''));
    if (m.type === 'iban') el.textContent = 'IBAN';
    else if (m.brand === 'visa') el.textContent = 'VISA';
    else if (m.brand === 'mastercard') el.textContent = 'MC';
    else if (m.brand === 'mada') el.textContent = 'مدى';
    else el.textContent = '💳';
    return el;
  }
  async function renderMethods() {
    const wrap = document.getElementById('methodsList');
    wrap.replaceChildren();
    try {
      const r = await App.api('GET', '/app/payment-methods');
      if (!r.methods.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'لم تُضف أي طريقة دفع بعد. أضف بطاقتك أو حسابك البنكي للبدء.';
        wrap.appendChild(e);
        return;
      }
      r.methods.forEach(m => {
        const row = document.createElement('div'); row.className = 'method-row';
        row.appendChild(methodIcon(m));
        const info = document.createElement('div'); info.className = 'method-info';
        const name = document.createElement('div'); name.className = 'method-name';
        name.textContent = m.type === 'iban' ? 'حساب بنكي' : ((m.brand || 'CARD').toUpperCase() + ' ****' + m.last4);
        info.appendChild(name);
        const sub = document.createElement('div'); sub.className = 'method-sub';
        sub.textContent = m.type === 'iban' ? (m.ibanMasked + ' · ' + m.holder) : ('انتهاء: ' + String(m.expMonth).padStart(2,'0') + '/' + m.expYear + ' · ' + m.holder);
        info.appendChild(sub);
        row.appendChild(info);
        const acts = document.createElement('div'); acts.className = 'method-actions';
        if (m.isDefault) {
          const c = document.createElement('span'); c.className = 'chip'; c.textContent = '★ الافتراضية';
          acts.appendChild(c);
        } else {
          const sd = document.createElement('button'); sd.type = 'button'; sd.className = 'icon-btn';
          sd.setAttribute('aria-label', 'تعيين كافتراضية');
          sd.textContent = 'افتراضية';
          sd.onclick = async () => {
            sd.disabled = true;
            try { await App.api('PATCH', '/app/payment-methods/' + m.id, { isDefault: true }); renderMethods(); }
            catch (e) { alert(e.message || 'فشل التحديث'); sd.disabled = false; }
          };
          acts.appendChild(sd);
        }
        const del = document.createElement('button'); del.type = 'button'; del.className = 'icon-btn danger';
        del.setAttribute('aria-label', 'حذف');
        del.textContent = 'حذف';
        del.onclick = async () => {
          if (!confirm('حذف هذه الطريقة؟')) return;
          del.disabled = true;
          try { await App.api('DELETE', '/app/payment-methods/' + m.id); renderMethods(); }
          catch (e) { alert(e.message || 'فشل الحذف'); del.disabled = false; }
        };
        acts.appendChild(del);
        row.appendChild(acts);
        wrap.appendChild(row);
      });
    } catch (e) {
      const x = document.createElement('div'); x.className = 'empty'; x.textContent = 'تعذّر التحميل';
      wrap.appendChild(x);
    }
  }
  async function renderTxns() {
    const wrap = document.getElementById('txnList');
    wrap.replaceChildren();
    try {
      const r = await App.api('GET', '/app/payment-history');
      if (!r.transactions.length) {
        const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'لا توجد عمليات بعد.';
        wrap.appendChild(e); return;
      }
      r.transactions.slice(0, 20).forEach(t => {
        const row = document.createElement('div'); row.className = 'txn-row';
        const ic = document.createElement('div');
        ic.className = 'txn-icon ' + (t.status === 'failed' ? 'failed' : (t.amount > 0 ? 'deposit' : 'withdraw'));
        ic.textContent = t.status === 'failed' ? '✕' : (t.amount > 0 ? '↓' : '↑');
        row.appendChild(ic);
        const meta = document.createElement('div'); meta.className = 'txn-meta';
        const ti = document.createElement('div'); ti.className = 'txn-title';
        ti.textContent = t.description || (t.kind === 'deposit' ? 'إيداع' : t.kind === 'withdraw' ? 'سحب' : t.kind);
        meta.appendChild(ti);
        const sub = document.createElement('div'); sub.className = 'txn-sub';
        sub.textContent = new Date(t.createdAt).toLocaleString('ar-SA') + (t.failureReason ? ' · ' + t.failureReason : '');
        meta.appendChild(sub);
        row.appendChild(meta);
        const amt = document.createElement('div');
        amt.className = 'txn-amount ' + (t.status === 'failed' ? 'fail' : (t.amount > 0 ? 'in' : 'out'));
        const v = Math.abs(t.amount || 0).toLocaleString('ar-SA');
        amt.textContent = (t.amount > 0 ? '+' : (t.amount < 0 ? '-' : '')) + v + ' ر.س';
        row.appendChild(amt);
        wrap.appendChild(row);
      });
    } catch (e) {
      const x = document.createElement('div'); x.className = 'empty'; x.textContent = 'تعذّر التحميل';
      wrap.appendChild(x);
    }
  }

  // ── Submit handlers
  document.getElementById('cardForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('cardSubmit');
    const err = document.getElementById('cardError');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    const exp = (cardExp.value || '').split('/');
    const payload = {
      type: 'card',
      pan: cardPan.value.replace(/\s/g, ''),
      expMonth: Number(exp[0]),
      expYear: Number(exp[1]),
      cvv: document.getElementById('cardCvv').value.trim(),
      holder: document.getElementById('cardHolder').value.trim(),
    };
    try {
      await App.api('POST', '/app/payment-methods', payload);
      document.getElementById('cardForm').reset();
      renderMethods();
    } catch (e2) {
      err.textContent = e2.message || 'فشل الحفظ';
      err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'حفظ البطاقة';
    }
  });
  document.getElementById('ibanForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('ibanSubmit');
    const err = document.getElementById('ibanError');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    const payload = {
      type: 'iban',
      iban: document.getElementById('ibanInput').value.replace(/\s/g, '').toUpperCase(),
      holder: document.getElementById('ibanHolder').value.trim(),
    };
    try {
      await App.api('POST', '/app/payment-methods', payload);
      document.getElementById('ibanForm').reset();
      renderMethods();
    } catch (e2) {
      err.textContent = e2.message || 'فشل الحفظ';
      err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'حفظ الحساب البنكي';
    }
  });

  await Promise.all([renderMethods(), renderTxns()]);
})();
</script>
</body>
</html>
