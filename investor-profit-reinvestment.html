<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعادة استثمار الأرباح - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.compound-viz{padding:1.5rem;text-align:center;}
.cv-label{font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;}
.cv-bars{display:flex;align-items:flex-end;justify-content:center;gap:0.5rem;height:120px;margin-bottom:0.75rem;}
.cv-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:0.3rem;}
.cv-bar{width:36px;border-radius:4px 4px 0 0;background:var(--green);}
.cv-bar.gold{background:var(--gold);}
.cv-year{font-size:0.68rem;color:var(--muted);}
.cv-val{font-size:0.72rem;font-weight:700;color:var(--green);}
.cv-legend{display:flex;gap:1.2rem;justify-content:center;margin-top:0.5rem;}
.cl-item{display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;}
.cl-dot{width:10px;height:10px;border-radius:50%;}
.pending-list{padding:1.25rem;}
.pending-item{border:1px solid var(--line);border-radius:10px;padding:0.9rem;margin-bottom:0.75rem;}
.pending-item:last-child{margin-bottom:0;}
.pi-head{display:flex;justify-content:space-between;margin-bottom:0.35rem;}
.pi-deal{font-size:0.86rem;font-weight:700;}
.pi-amount{font-size:0.9rem;font-weight:700;color:var(--green);}
.pi-meta{font-size:0.72rem;color:var(--muted);}
.pi-actions{display:flex;gap:0.5rem;margin-top:0.6rem;}
.settings-wrap{padding:1.25rem;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid var(--line);}
.setting-row:last-child{border-bottom:none;}
.setting-info{}
.setting-name{font-size:0.86rem;font-weight:600;}
.setting-sub{font-size:0.72rem;color:var(--muted);}
.toggle{width:38px;height:20px;border-radius:10px;cursor:pointer;border:none;transition:background 0.2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle.off{background:#d0cbc0;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.layout-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — إعادة استثمار الأرباح</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>إعادة استثمار الأرباح التلقائي</h2>
      <p>وجّه أرباحك للعمل من جديد وحقق مفعول الفائدة المركبة في استثماراتك الشرعية</p>
    </div>
    <button class="btn btn-primary" onclick="reinvestNow()">إعادة استثمار فورية</button>
  </div>

  <div class="stats" id="prStats"></div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>نمو الاستثمار المركّب</h3></div>
      <div class="compound-viz" id="compoundViz"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>أرباح في انتظار الاستثمار</h3></div>
      <div class="pending-list" id="pendingList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>إعدادات إعادة الاستثمار</h3></div>
    <div class="settings-wrap" id="settingsWrap"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="reinvestNow()">إعادة استثمار الأرباح المعلقة</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٤٢,٦٠٠ ر.س', lbl: 'إجمالي أرباح مُعاد استثمارها' },
  { val: '٨٠٪', lbl: 'نسبة إعادة الاستثمار' },
  { val: '١١.٨٪', lbl: 'العائد المركّب الفعلي' },
  { val: '٩,٤٠٠ ر.س', lbl: 'معلقة للاستثمار' }
];

const BARS = [
  { year: '٢٠٢٣', h: 35, val: '١٥٠ك', gold: false },
  { year: '٢٠٢٤', h: 55, val: '١٨٢ك', gold: false },
  { year: '٢٠٢٥', h: 75, val: '٢١٠ك', gold: false },
  { year: '٢٠٢٦ (م)', h: 95, val: '٢٥٦ك', gold: true }
];

const PENDING = [
  { deal: 'مرابحة عقارية #4920', amount: '٦,٤٠٠ ر.س', date: '٢٠٢٦/٠٦/١٥', meta: 'توزيع ختامي' },
  { deal: 'مرابحة تجارية #4921', amount: '٣,٠٠٠ ر.س', date: '٢٠٢٦/٠٧/١٥', meta: 'دفعة ربع سنوية' }
];

const SETTINGS = [
  { name: 'إعادة الاستثمار التلقائي', sub: 'توجيه ٨٠٪ من كل ربح تلقائياً', on: true },
  { name: 'الأولوية للصفقات المنخفضة المخاطر', sub: 'اختيار الصفقات العقارية أولاً', on: true },
  { name: 'الاحتفاظ بحد أدنى من السيولة', sub: 'الإبقاء على ٥,٠٠٠ ر.س كاحتياطي', on: false },
  { name: 'تنبيه قبل إعادة الاستثمار', sub: 'إشعار ٤٨ ساعة قبل التنفيذ', on: true }
];

function buildStats() {
  const wrap = document.getElementById('prStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildCompound() {
  const wrap = document.getElementById('compoundViz');
  const lbl = document.createElement('div'); lbl.className = 'cv-label'; lbl.textContent = 'قيمة المحفظة بمرور الوقت (ألف ر.س)';
  const bars = document.createElement('div'); bars.className = 'cv-bars';
  BARS.forEach(b => {
    const bw = document.createElement('div'); bw.className = 'cv-bar-wrap';
    const val = document.createElement('div'); val.className = 'cv-val'; val.textContent = b.val;
    const bar = document.createElement('div'); bar.className = 'cv-bar' + (b.gold ? ' gold' : ''); bar.style.height = b.h + 'px';
    const year = document.createElement('div'); year.className = 'cv-year'; year.textContent = b.year;
    bw.appendChild(val); bw.appendChild(bar); bw.appendChild(year);
    bars.appendChild(bw);
  });
  const legend = document.createElement('div'); legend.className = 'cv-legend';
  [['#0a4d36', 'قيمة فعلية'], ['#b08840', 'متوقع']].forEach(([color, lbl2]) => {
    const item = document.createElement('div'); item.className = 'cl-item';
    const dot = document.createElement('div'); dot.className = 'cl-dot'; dot.style.background = color;
    const t = document.createElement('span'); t.textContent = lbl2;
    item.appendChild(dot); item.appendChild(t);
    legend.appendChild(item);
  });
  wrap.appendChild(lbl); wrap.appendChild(bars); wrap.appendChild(legend);
}

function buildPending() {
  const wrap = document.getElementById('pendingList');
  PENDING.forEach((p, i) => {
    const item = document.createElement('div'); item.className = 'pending-item';
    const head = document.createElement('div'); head.className = 'pi-head';
    const deal = document.createElement('div'); deal.className = 'pi-deal'; deal.textContent = p.deal;
    const amount = document.createElement('div'); amount.className = 'pi-amount'; amount.textContent = p.amount;
    head.appendChild(deal); head.appendChild(amount);
    const meta = document.createElement('div'); meta.className = 'pi-meta'; meta.textContent = p.meta + ' · ' + p.date;
    const actions = document.createElement('div'); actions.className = 'pi-actions';
    const reinvest = document.createElement('button'); reinvest.className = 'btn btn-sm btn-primary'; reinvest.textContent = 'أعِد استثماره';
    reinvest.onclick = () => reinvestItem(i);
    const withdraw = document.createElement('button'); withdraw.className = 'btn btn-sm'; withdraw.style.cssText = 'background:#f5f0e8;color:var(--muted);'; withdraw.textContent = 'سحب';
    actions.appendChild(reinvest); actions.appendChild(withdraw);
    item.appendChild(head); item.appendChild(meta); item.appendChild(actions);
    wrap.appendChild(item);
  });
}

function buildSettings() {
  const wrap = document.getElementById('settingsWrap');
  SETTINGS.forEach(s => {
    const row = document.createElement('div'); row.className = 'setting-row';
    const info = document.createElement('div'); info.className = 'setting-info';
    const name = document.createElement('div'); name.className = 'setting-name'; name.textContent = s.name;
    const sub = document.createElement('div'); sub.className = 'setting-sub'; sub.textContent = s.sub;
    info.appendChild(name); info.appendChild(sub);
    const toggle = document.createElement('button'); toggle.className = 'toggle ' + (s.on ? 'on' : 'off');
    toggle.onclick = () => { s.on = !s.on; toggle.className = 'toggle ' + (s.on ? 'on' : 'off'); };
    row.appendChild(info); row.appendChild(toggle);
    wrap.appendChild(row);
  });
}

function reinvestItem(idx) {
  fetch('/app/me/profit-reinvestment', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ pendingIdx: idx }) }).catch(() => {});
  alert('تم بدء إعادة استثمار الأرباح من ' + PENDING[idx].deal);
}

function reinvestNow() {
  fetch('/app/me/profit-reinvestment', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ all: true }) }).catch(() => {});
  alert('جاري إعادة استثمار جميع الأرباح المعلقة...');
}

function saveSettings() {
  fetch('/app/me/profit-reinvestment/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ settings: SETTINGS }) }).catch(() => {});
  alert('تم حفظ إعدادات إعادة الاستثمار.');
}

buildStats(); buildCompound(); buildPending(); buildSettings();
</script>
</body>
</html>
