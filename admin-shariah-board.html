<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هيئة الرقابة الشرعية - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.layout-2{display:grid;grid-template-columns:1fr 1.5fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.member-list{padding:1rem;}
.member-item{display:flex;align-items:center;gap:1rem;padding:0.75rem 0.5rem;border-bottom:1px solid var(--line);}
.member-item:last-child{border-bottom:none;}
.member-avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;flex-shrink:0;}
.member-name{font-size:0.88rem;font-weight:700;}
.member-role{font-size:0.72rem;color:var(--muted);}
.fatwa-list{padding:1.25rem;}
.fatwa-item{border:1px solid var(--line);border-radius:10px;padding:0.9rem;margin-bottom:0.65rem;}
.fatwa-item:last-child{margin-bottom:0;}
.fi-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.4rem;}
.fi-id{font-size:0.7rem;color:var(--muted);}
.fi-pill{display:inline-block;padding:0.1rem 0.5rem;border-radius:8px;font-size:0.68rem;font-weight:700;}
.pill-approved{background:#e8f5ed;color:#1e8449;}
.pill-pending{background:#fef3cd;color:#92400e;}
.pill-review{background:#e8f0fe;color:#1a56c4;}
.fi-title{font-size:0.84rem;font-weight:700;margin-bottom:0.2rem;}
.fi-meta{font-size:0.7rem;color:var(--muted);}
.approval-table{padding:1.25rem;overflow-x:auto;}
.at-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0.5rem;padding:0.6rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;align-items:center;}
.at-row:last-child{border-bottom:none;}
.at-header{font-weight:700;font-size:0.75rem;color:var(--muted);}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.layout-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — هيئة الرقابة الشرعية</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>هيئة الرقابة الشرعية</h2>
      <p>إدارة أعضاء الهيئة والفتاوى وموافقات الصفقات الشرعية</p>
    </div>
    <button class="btn btn-primary" onclick="addFatwa()">إضافة فتوى جديدة</button>
  </div>

  <div class="stats" id="sbStats"></div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>أعضاء الهيئة</h3></div>
      <div class="member-list" id="memberList"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>الفتاوى والقرارات</h3></div>
      <div class="fatwa-list" id="fatwaList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>موافقات الصفقات الشرعية</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportApprovals()">تصدير</button>
    </div>
    <div class="approval-table" id="approvalTable"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="addFatwa()">فتوى جديدة</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="exportApprovals()">تصدير السجل</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٥', lbl: 'أعضاء الهيئة' },
  { val: '١٢٨', lbl: 'فتوى صادرة' },
  { val: '٣', lbl: 'قيد المراجعة' },
  { val: '١٠٠٪', lbl: 'نسبة الالتزام' }
];

const MEMBERS = [
  { initials: 'ع.ع', name: 'د. عبد الله العثمان', role: 'رئيس الهيئة' },
  { initials: 'م.ح', name: 'أ. محمد الحربي', role: 'عضو' },
  { initials: 'س.ر', name: 'د. سلمى الرشيد', role: 'عضو' },
  { initials: 'ف.أ', name: 'أ. فهد الأحمدي', role: 'عضو' },
  { initials: 'ن.م', name: 'د. نورة المطيري', role: 'عضو ومقرر' }
];

const FATWAS = [
  { id: 'F-٢٠٢٦-٠٤٢', title: 'جواز تمويل الشركات اللوجستية بالمرابحة', pill: 'pill-approved', label: 'معتمدة', meta: '١٢ مارس ٢٠٢٦' },
  { id: 'F-٢٠٢٦-٠٤١', title: 'ضوابط المرابحة في قطاع التكنولوجيا', pill: 'pill-approved', label: 'معتمدة', meta: '٥ مارس ٢٠٢٦' },
  { id: 'F-٢٠٢٦-٠٤٣', title: 'مراجعة شروط صفقات التجزئة', pill: 'pill-pending', label: 'قيد المراجعة', meta: '١٨ مارس ٢٠٢٦' },
  { id: 'F-٢٠٢٦-٠٤٤', title: 'الرأي في الضمانات البنكية المصاحبة', pill: 'pill-review', label: 'تحت الدراسة', meta: '٢٢ مارس ٢٠٢٦' }
];

const APPROVALS = [
  { deal: 'صفقة تجهيزات طبية #4920', type: 'تجارية', status: 'معتمدة', date: '١٠ مارس ٢٠٢٦' },
  { deal: 'صفقة نقل بضائع #4918', type: 'لوجستية', status: 'معتمدة', date: '٨ مارس ٢٠٢٦' },
  { deal: 'صفقة تطوير برمجيات #4921', type: 'تقنية', status: 'قيد المراجعة', date: '١٥ مارس ٢٠٢٦' },
  { deal: 'صفقة أثاث مكتبي #4915', type: 'تجارية', status: 'معتمدة', date: '٢ مارس ٢٠٢٦' }
];

function buildStats() {
  const wrap = document.getElementById('sbStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildMembers() {
  const wrap = document.getElementById('memberList');
  MEMBERS.forEach(m => {
    const item = document.createElement('div'); item.className = 'member-item';
    const avatar = document.createElement('div'); avatar.className = 'member-avatar'; avatar.textContent = m.initials;
    const info = document.createElement('div');
    const name = document.createElement('div'); name.className = 'member-name'; name.textContent = m.name;
    const role = document.createElement('div'); role.className = 'member-role'; role.textContent = m.role;
    info.appendChild(name); info.appendChild(role);
    item.appendChild(avatar); item.appendChild(info);
    wrap.appendChild(item);
  });
}

function buildFatwas() {
  const wrap = document.getElementById('fatwaList');
  FATWAS.forEach(f => {
    const item = document.createElement('div'); item.className = 'fatwa-item';
    const head = document.createElement('div'); head.className = 'fi-head';
    const id = document.createElement('span'); id.className = 'fi-id'; id.textContent = f.id;
    const pill = document.createElement('span'); pill.className = 'fi-pill ' + f.pill; pill.textContent = f.label;
    head.appendChild(id); head.appendChild(pill);
    const title = document.createElement('div'); title.className = 'fi-title'; title.textContent = f.title;
    const meta = document.createElement('div'); meta.className = 'fi-meta'; meta.textContent = f.meta;
    item.appendChild(head); item.appendChild(title); item.appendChild(meta);
    wrap.appendChild(item);
  });
}

function buildApprovals() {
  const wrap = document.getElementById('approvalTable');
  const header = document.createElement('div'); header.className = 'at-row at-header';
  ['الصفقة', 'النوع', 'الحالة', 'التاريخ'].forEach(h => {
    const cell = document.createElement('div'); cell.textContent = h; header.appendChild(cell);
  });
  wrap.appendChild(header);
  APPROVALS.forEach(a => {
    const row = document.createElement('div'); row.className = 'at-row';
    const deal = document.createElement('div'); deal.style.fontWeight = '700'; deal.textContent = a.deal;
    const type = document.createElement('div'); type.textContent = a.type;
    const status = document.createElement('div'); status.textContent = a.status;
    const date = document.createElement('div'); date.style.color = 'var(--muted)'; date.textContent = a.date;
    row.appendChild(deal); row.appendChild(type); row.appendChild(status); row.appendChild(date);
    wrap.appendChild(row);
  });
}

function addFatwa() {
  fetch('/app/admin/shariah-board/fatwas', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'add' }) }).catch(() => {});
  alert('جاري إضافة فتوى جديدة...');
}

function exportApprovals() {
  fetch('/app/admin/shariah-board/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير سجل الموافقات...');
}

buildStats(); buildMembers(); buildFatwas(); buildApprovals();
</script>
</body>
</html>
