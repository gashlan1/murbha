<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>جدولة المدفوعات — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;
  --paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);
  --red:#c0392b;--orange:#e67e22;
}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
header h1{font-size:1.25rem;font-weight:700}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:.9rem}
.page{max-width:1200px;margin:0 auto;padding:1.5rem 2rem}
/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.kpi{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1rem 1.25rem}
.kpi .val{font-size:1.4rem;font-weight:700;color:var(--green)}
.kpi .lbl{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.kpi.gold .val{color:var(--gold)}
.kpi.orange .val{color:var(--orange)}
/* Calendar header */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.cal-header h2{font-size:1.05rem;font-weight:700}
.cal-nav{display:flex;align-items:center;gap:.5rem}
.cal-nav button{padding:.3rem .75rem;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.88rem;transition:.15s}
.cal-nav button:hover{border-color:var(--green);color:var(--green)}
.cal-nav .month-lbl{font-size:.95rem;font-weight:700;min-width:120px;text-align:center}
/* Calendar grid */
.calendar{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow-cell{padding:.5rem;text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:80px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.4rem;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other-month .day-num{color:#ccc}
.cal-cell.today{background:#f0faf5}
.day-num{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.2rem}
.payout-chip{border-radius:4px;padding:.15rem .4rem;font-size:.68rem;font-weight:600;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip-scheduled{background:#d4edda;color:#155724}
.chip-processing{background:#fff3cd;color:#856404}
.chip-paid{background:#d1ecf1;color:#0c5460}
.chip-failed{background:#f8d7da;color:#721c24}
/* Upcoming table */
.card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.25rem}
.card-head{padding:.9rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-size:.95rem;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.83rem;cursor:pointer;border:none;font-weight:600;transition:.15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:right;padding:.6rem 1.25rem;background:#f5f7f5;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:.65rem 1.25rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcfa}
.badge{display:inline-block;padding:.18rem .55rem;border-radius:12px;font-size:.74rem;font-weight:700}
.badge-scheduled{background:#d4edda;color:#155724}
.badge-processing{background:#fff3cd;color:#856404}
.badge-paid{background:#d1ecf1;color:#0c5460}
.badge-failed{background:#f8d7da;color:#721c24}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px}
.modal-head{padding:1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff}
.modal-head h3{font-size:1rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted)}
.modal-body{padding:1.25rem}
.form-group{margin-bottom:.9rem}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.35rem}
.form-group input,.form-group select{width:100%;padding:.5rem .75rem;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:.9rem;color:var(--green-dark);outline:none;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:var(--green)}
.modal-footer{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:.75rem;justify-content:flex-end}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:.7rem 1.5rem;border-radius:10px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a href="hessa.html">→ لوحة التحكم</a>
  <h1>جدولة المدفوعات والتوزيعات</h1>
</header>

<div class="page">
  <div class="kpi-row">
    <div class="kpi"><div class="val" id="kpiThisMonth">—</div><div class="lbl">مدفوعات هذا الشهر (ر.س)</div></div>
    <div class="kpi gold"><div class="val" id="kpiPending">—</div><div class="lbl">في انتظار التنفيذ</div></div>
    <div class="kpi orange"><div class="val" id="kpiOverdue">—</div><div class="lbl">متأخرة</div></div>
    <div class="kpi"><div class="val" id="kpiNextWeek">—</div><div class="lbl">مقررة الأسبوع القادم (ر.س)</div></div>
  </div>

  <div class="cal-header">
    <h2>التقويم الشهري</h2>
    <div class="cal-nav">
      <button onclick="shiftMonth(-1)">‹ السابق</button>
      <div class="month-lbl" id="monthLbl"></div>
      <button onclick="shiftMonth(1)">التالي ›</button>
      <button class="btn btn-primary" style="margin-right:.5rem" onclick="openScheduleModal()">+ جدولة جديدة</button>
    </div>
  </div>

  <div class="calendar">
    <div class="cal-dow">
      <div class="cal-dow-cell">أحد</div>
      <div class="cal-dow-cell">إثنين</div>
      <div class="cal-dow-cell">ثلاثاء</div>
      <div class="cal-dow-cell">أربعاء</div>
      <div class="cal-dow-cell">خميس</div>
      <div class="cal-dow-cell">جمعة</div>
      <div class="cal-dow-cell">سبت</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>المدفوعات القادمة</h3>
      <button class="btn btn-ghost" onclick="exportPayouts()">تصدير</button>
    </div>
    <table>
      <thead>
        <tr><th>تاريخ الاستحقاق</th><th>الصفقة</th><th>المستفيدون</th><th>إجمالي (ر.س)</th><th>الحالة</th><th>إجراء</th></tr>
      </thead>
      <tbody id="payoutTbody"></tbody>
    </table>
  </div>
</div>

<!-- Schedule modal -->
<div class="modal-overlay" id="scheduleModal">
  <div class="modal">
    <div class="modal-head"><h3>جدولة دفعة جديدة</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>الصفقة</label>
        <select id="fDeal">
          <option value="d1">برج الخليج التجاري</option>
          <option value="d2">مصنع الأغذية العضوية</option>
          <option value="d3">مشروع الطاقة الشمسية</option>
        </select>
      </div>
      <div class="form-group"><label>تاريخ الدفع</label><input type="date" id="fDate"/></div>
      <div class="form-group"><label>نوع التوزيع</label>
        <select id="fType">
          <option value="profit">توزيع أرباح</option>
          <option value="principal">رأس المال</option>
          <option value="both">أرباح + رأس مال</option>
        </select>
      </div>
      <div class="form-group"><label>إجمالي المبلغ (ر.س)</label><input type="number" id="fAmount" placeholder="0"/></div>
      <div class="form-group"><label>ملاحظات</label><input type="text" id="fNote" placeholder="ملاحظات اختيارية..."/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="savePayout()">جدولة</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/assets/lang.js" defer></script>
<script>
const CSRF = document.cookie.match(/csrf=([^;]+)/)?.[1] || 'x';
let viewYear = 2026, viewMonth = 5; // June 2026

const PAYOUTS = [
  {id:'p1',date:'2026-06-20',deal:'برج الخليج التجاري',beneficiaries:42,amount:185000,status:'scheduled'},
  {id:'p2',date:'2026-06-22',deal:'مصنع الأغذية العضوية',beneficiaries:18,amount:72000,status:'processing'},
  {id:'p3',date:'2026-06-28',deal:'مشروع الطاقة الشمسية',beneficiaries:31,amount:124000,status:'scheduled'},
  {id:'p4',date:'2026-07-01',deal:'برج الخليج التجاري',beneficiaries:42,amount:185000,status:'scheduled'},
  {id:'p5',date:'2026-07-15',deal:'مصنع الأغذية العضوية',beneficiaries:18,amount:72000,status:'scheduled'},
  {id:'p6',date:'2026-06-10',deal:'مشروع التقنية',beneficiaries:8,amount:32000,status:'paid'},
  {id:'p7',date:'2026-06-05',deal:'مجمع جدة',beneficiaries:25,amount:95000,status:'failed'},
];

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function shiftMonth(d) { viewMonth += d; if (viewMonth > 11){viewMonth=0;viewYear++;} if (viewMonth<0){viewMonth=11;viewYear--;} renderCal(); }

function renderCal() {
  document.getElementById('monthLbl').textContent = MONTHS_AR[viewMonth] + ' ' + viewYear;
  const grid = document.getElementById('calGrid'); grid.textContent = '';
  const first = new Date(viewYear, viewMonth, 1).getDay();
  const days = new Date(viewYear, viewMonth+1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < first; i++) {
    const cell = document.createElement('div'); cell.className = 'cal-cell other-month';
    const prevDays = new Date(viewYear, viewMonth, 0).getDate();
    const n = document.createElement('div'); n.className = 'day-num'; n.textContent = prevDays - first + 1 + i;
    cell.appendChild(n); grid.appendChild(cell);
  }
  for (let d = 1; d <= days; d++) {
    const cell = document.createElement('div'); cell.className = 'cal-cell';
    const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
    if (isToday) cell.classList.add('today');
    const n = document.createElement('div'); n.className = 'day-num'; n.textContent = d;
    cell.appendChild(n);
    const dateStr = viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    PAYOUTS.filter(p => p.date===dateStr).forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'payout-chip chip-' + p.status;
      chip.textContent = p.deal.slice(0,10) + '…';
      chip.title = p.deal + ' — ' + p.amount.toLocaleString('ar-SA') + ' ر.س';
      cell.appendChild(chip);
    });
    grid.appendChild(cell);
  }
}

function renderKPIs() {
  const monthPayouts = PAYOUTS.filter(p => p.date.startsWith(viewYear+'-'+String(viewMonth+1).padStart(2,'0')));
  const thisMonthTotal = monthPayouts.reduce((s,p) => s+p.amount, 0);
  const pending = PAYOUTS.filter(p => p.status==='scheduled'||p.status==='processing').length;
  const overdue = PAYOUTS.filter(p => p.status==='failed').length;
  const nextWeekTotal = PAYOUTS.filter(p => p.status==='scheduled').reduce((s,p) => s+p.amount, 0);
  const f = n => n.toLocaleString('ar-SA',{maximumFractionDigits:0});
  document.getElementById('kpiThisMonth').textContent = f(thisMonthTotal);
  document.getElementById('kpiPending').textContent = pending;
  document.getElementById('kpiOverdue').textContent = overdue;
  document.getElementById('kpiNextWeek').textContent = f(nextWeekTotal);
}

function renderTable() {
  const tbody = document.getElementById('payoutTbody'); tbody.textContent = '';
  const statusLbl = {scheduled:'مجدولة',processing:'قيد التنفيذ',paid:'مدفوعة',failed:'فاشلة'};
  [...PAYOUTS].sort((a,b) => a.date.localeCompare(b.date)).forEach(p => {
    const tr = document.createElement('tr');
    [p.date, p.deal, p.beneficiaries+' مستثمر', p.amount.toLocaleString('ar-SA')].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    });
    const stTd = document.createElement('td');
    const b = document.createElement('span'); b.className='badge badge-'+p.status; b.textContent=statusLbl[p.status]; stTd.appendChild(b); tr.appendChild(stTd);
    const actTd = document.createElement('td');
    if (p.status === 'scheduled') {
      const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='تنفيذ';
      btn.style.fontSize='.75rem'; btn.style.padding='.25rem .6rem';
      btn.onclick = () => processPayout(p.id);
      actTd.appendChild(btn);
    } else if (p.status==='failed') {
      const btn = document.createElement('button'); btn.className='btn btn-ghost'; btn.textContent='إعادة';
      btn.style.fontSize='.75rem'; btn.style.padding='.25rem .6rem';
      btn.onclick = () => { toast('جارٍ إعادة المحاولة...'); };
      actTd.appendChild(btn);
    } else { actTd.textContent = '—'; }
    tr.appendChild(actTd);
    tbody.appendChild(tr);
  });
}

async function processPayout(id) {
  try {
    const r = await fetch('/app/admin/payouts/'+id+'/process', {method:'POST',headers:{'x-csrf-token':CSRF}});
    if (!r.ok) throw new Error();
  } catch {}
  toast('تم إرسال أمر التنفيذ');
}

function openScheduleModal() {
  const d = new Date(); d.setDate(d.getDate()+1);
  document.getElementById('fDate').value = d.toISOString().slice(0,10);
  document.getElementById('scheduleModal').classList.add('open');
}
function closeModal() { document.getElementById('scheduleModal').classList.remove('open'); }

async function savePayout() {
  const payload = {
    dealId: document.getElementById('fDeal').value,
    date: document.getElementById('fDate').value,
    type: document.getElementById('fType').value,
    amount: parseFloat(document.getElementById('fAmount').value)||0,
    note: document.getElementById('fNote').value.trim(),
  };
  if (!payload.date || !payload.amount) { toast('أدخل التاريخ والمبلغ'); return; }
  try {
    const r = await fetch('/app/admin/payouts/schedule', {method:'POST',headers:{'Content-Type':'application/json','x-csrf-token':CSRF},body:JSON.stringify(payload)});
    if (!r.ok) throw new Error();
  } catch {}
  toast('تمت الجدولة'); closeModal(); renderCal();
}

function exportPayouts() { toast('جارٍ تصدير ملف CSV...'); }

function toast(msg) {
  const el = document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

renderKPIs(); renderCal(); renderTable();
</script>
</body>
</html>
