<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Deal Pipeline — Murbha Admin">خط صفقات — إدارة مُرابحة</title>
<meta name="description" content="إدارة خط صفقات الاستثمار من المراجعة إلى الإطلاق." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:1060px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  /* Kanban board */
  .kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px;}
  .kanban-col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kanban-col-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .col-count{font:900 11px Cairo,sans-serif;background:#f0ece0;border-radius:20px;padding:2px 8px;color:var(--muted);}
  .deal-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;}
  .deal-card:hover{box-shadow:0 2px 8px rgba(13,22,18,0.10);}
  .deal-card:last-child{margin-bottom:0;}
  .dc-name{font:900 11px Cairo,sans-serif;color:var(--green-dark);margin-bottom:4px;}
  .dc-sector{font:500 9px Tajawal,sans-serif;color:var(--muted);}
  .dc-meta{display:flex;justify-content:space-between;margin-top:8px;font:700 9px Cairo,sans-serif;color:var(--muted);}
  .dc-yield{color:var(--gold);}
  .stage-badge{display:inline-block;border-radius:4px;padding:1px 7px;font:700 8px Cairo,sans-serif;margin-top:6px;}
  .stage-review{background:#fff8e1;color:#a07020;}
  .stage-shariah{background:#e3f2fd;color:#1565c0;}
  .stage-legal{background:#f3e5f5;color:#7b1fa2;}
  .stage-ready{background:#e8f5e9;color:#2e7d32;}
  .stage-live{background:#062b1e;color:#fbf6ea;}
  /* Deal table */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;overflow-x:auto;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .pipe-table{width:100%;border-collapse:collapse;min-width:660px;}
  .pipe-table th{font:700 10px Cairo,sans-serif;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:#f9f7f2;white-space:nowrap;}
  .pipe-table td{font:500 11px Tajawal,sans-serif;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .pipe-table tr:last-child td{border-bottom:none;}
  .pipe-table tr:hover td{background:#fafaf7;}
  .btn-advance{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:7px;padding:5px 12px;font:700 9px Cairo,sans-serif;cursor:pointer;}
  .btn-advance:hover{background:var(--green);}
  .btn-advance:disabled{background:#ccc;cursor:default;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Deal Pipeline">خط الصفقات</h1>
    <p data-en="Manage the deal pipeline from review to launch.">أدر مراحل الصفقات من المراجعة الأولية حتى الإطلاق للمستثمرين.</p>
    <div class="admin-badge">لوحة الإدارة</div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>
  <div class="kanban" id="kanban"></div>

  <div class="card">
    <div class="card-title" data-en="All Pipeline Deals">جميع الصفقات في المسار</div>
    <table class="pipe-table">
      <thead><tr>
        <th data-en="Deal">الصفقة</th>
        <th data-en="Sector">القطاع</th>
        <th data-en="Stage">المرحلة</th>
        <th data-en="Target">التمويل</th>
        <th data-en="Yield">العائد</th>
        <th data-en="Submitted">تاريخ التقديم</th>
        <th data-en="Action">إجراء</th>
      </tr></thead>
      <tbody id="pipeBody"></tbody>
    </table>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  const stages=['review','shariah','legal','ready','live'];
  const stageLabel={review:'مراجعة أولية',shariah:'اعتماد شرعي',legal:'توثيق قانوني',ready:'جاهز للطرح',live:'مطروح'};
  const stageBadge={review:'stage-review',shariah:'stage-shariah',legal:'stage-legal',ready:'stage-ready',live:'stage-live'};
  const stageNext={review:'shariah',shariah:'legal',legal:'ready',ready:'live'};

  (async function load(){
    try{
      const r=await fetch('/app/admin/deal-pipeline');
      if(!r.ok){ placeholder(document.getElementById('pipeBody'),r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      // KPIs
      const kpiRow=document.getElementById('kpiRow'); kpiRow.textContent='';
      const kpis=d.kpis||{};
      [{lbl:'في المسار',val:String(kpis.total||0)},{lbl:'جاهز للطرح',val:String(kpis.ready||0)},{lbl:'مراجعة شرعية',val:String(kpis.shariah||0)},{lbl:'مطروحة الآن',val:String(kpis.live||0)}].forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });
      // Kanban
      const kb=document.getElementById('kanban'); kb.textContent='';
      const deals=d.deals||[];
      stages.forEach(stage=>{
        const stageDeals=deals.filter(dl=>dl.stage===stage);
        const col=document.createElement('div'); col.className='kanban-col';
        const colTitle=document.createElement('div'); colTitle.className='kanban-col-title';
        const lbl=document.createElement('span'); lbl.textContent=stageLabel[stage]||stage;
        const cnt=document.createElement('span'); cnt.className='col-count'; cnt.textContent=String(stageDeals.length);
        colTitle.appendChild(lbl); colTitle.appendChild(cnt);
        col.appendChild(colTitle);
        if(!stageDeals.length){ const empty=document.createElement('div'); empty.style.cssText='font:500 10px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:12px 0;'; empty.textContent='لا توجد صفقات'; col.appendChild(empty); }
        stageDeals.forEach(dl=>{
          const card=document.createElement('div'); card.className='deal-card';
          const name=document.createElement('div'); name.className='dc-name'; name.textContent=dl.name||'—';
          const sector=document.createElement('div'); sector.className='dc-sector'; sector.textContent=dl.sector||'—';
          const meta=document.createElement('div'); meta.className='dc-meta';
          const tgt=document.createElement('span'); tgt.textContent=fmt(dl.targetAmount||0)+' ر.س';
          const yld=document.createElement('span'); yld.className='dc-yield'; yld.textContent=(dl.expectedYield||0).toFixed(1)+'٪';
          meta.appendChild(tgt); meta.appendChild(yld);
          const sb=document.createElement('div'); sb.className='stage-badge '+(stageBadge[dl.stage]||'stage-review'); sb.textContent=stageLabel[dl.stage]||dl.stage;
          card.appendChild(name); card.appendChild(sector); card.appendChild(meta); card.appendChild(sb);
          col.appendChild(card);
        });
        kb.appendChild(col);
      });
      // Table
      const body=document.getElementById('pipeBody'); body.textContent='';
      if(!deals.length){ placeholder(body,'لا توجد صفقات.'); return; }
      deals.forEach(dl=>{
        const tr=document.createElement('tr');
        const tdName=document.createElement('td'); tdName.style.fontWeight='900'; tdName.style.fontSize='11px'; tdName.textContent=dl.name||'—';
        const tdSector=document.createElement('td'); tdSector.style.color='var(--muted)'; tdSector.textContent=dl.sector||'—';
        const tdStage=document.createElement('td');
        const sb=document.createElement('span'); sb.className='stage-badge '+(stageBadge[dl.stage]||'stage-review'); sb.textContent=stageLabel[dl.stage]||dl.stage||'—';
        tdStage.appendChild(sb);
        const tdTarget=document.createElement('td'); tdTarget.textContent=fmt(dl.targetAmount||0)+' ر.س';
        const tdYield=document.createElement('td'); tdYield.style.color='var(--gold)'; tdYield.style.fontWeight='900'; tdYield.textContent=(dl.expectedYield||0).toFixed(1)+'٪';
        const tdDate=document.createElement('td'); tdDate.style.color='var(--muted)'; tdDate.textContent=(dl.submittedAt||dl.createdAt||'—').slice(0,10);
        const tdAct=document.createElement('td');
        if(dl.stage!=='live'){
          const btn=document.createElement('button'); btn.className='btn-advance'; btn.textContent='تقدّم →';
          const dId=dl.id; const nextStage=stageNext[dl.stage];
          btn.addEventListener('click',async()=>{
            btn.disabled=true;
            try{
              const rp=await fetch('/app/admin/deal-pipeline/'+encodeURIComponent(dId)+'/advance',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({stage:nextStage})});
              if(!rp.ok){ btn.disabled=false; showToast('تعذّرت العملية.'); return; }
              showToast('تم تقديم الصفقة إلى المرحلة التالية.'); load();
            }catch{ btn.disabled=false; showToast('خطأ.'); }
          });
          tdAct.appendChild(btn);
        } else { tdAct.textContent='مطروحة'; }
        tr.appendChild(tdName); tr.appendChild(tdSector); tr.appendChild(tdStage); tr.appendChild(tdTarget); tr.appendChild(tdYield); tr.appendChild(tdDate); tr.appendChild(tdAct);
        body.appendChild(tr);
      });
    }catch{ placeholder(document.getElementById('pipeBody'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
