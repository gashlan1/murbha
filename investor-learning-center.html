<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز التعلم - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-secondary:hover{background:var(--green);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.progress-hero{background:linear-gradient(135deg,#062b1e,#0a4d36);border-radius:14px;padding:1.75rem 2rem;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1.5rem;}
.prog-left{flex:1;}
.prog-title{font-size:1rem;font-weight:700;margin-bottom:0.25rem;}
.prog-sub{font-size:0.8rem;color:rgba(255,255,255,0.7);}
.prog-bar-wrap{margin-top:0.75rem;}
.prog-bar-track{background:rgba(255,255,255,0.2);border-radius:4px;height:8px;overflow:hidden;}
.prog-bar-fill{height:100%;background:#6de0a8;border-radius:4px;transition:width 0.4s;}
.prog-pct{font-size:0.78rem;color:rgba(255,255,255,0.75);margin-top:0.3rem;}
.prog-stats{display:flex;gap:2rem;}
.prog-stat{display:flex;flex-direction:column;align-items:center;gap:0.2rem;}
.prog-stat-val{font-size:1.3rem;font-weight:700;}
.prog-stat-lbl{font-size:0.7rem;color:rgba(255,255,255,0.65);}
.cat-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.cat-tab{padding:0.4rem 1rem;border-radius:20px;font-size:0.84rem;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:all 0.2s;}
.cat-tab.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-bottom:2rem;}
.course-card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;}
.course-thumb{height:90px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
.course-body{padding:1rem;flex:1;display:flex;flex-direction:column;gap:0.5rem;}
.course-tag{display:inline-block;padding:0.15rem 0.5rem;border-radius:6px;font-size:0.68rem;font-weight:700;}
.tag-beginner{background:#e6f4ef;color:var(--green);}
.tag-intermediate{background:#fff8e8;color:var(--gold);}
.tag-advanced{background:#fde9e9;color:#c0392b);}
.course-title{font-size:0.9rem;font-weight:700;color:var(--green-dark);}
.course-meta{font-size:0.74rem;color:var(--muted);}
.course-progress{margin-top:auto;}
.mini-bar-track{background:#e8e3da;border-radius:3px;height:5px;overflow:hidden;margin-top:0.3rem;}
.mini-bar-fill{height:100%;background:var(--green);border-radius:3px;}
.course-footer{padding:0.75rem 1rem;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.course-pts{font-size:0.74rem;color:var(--gold);font-weight:700;}
.featured-card{background:#fff;border-radius:12px;border:1.5px solid var(--gold);overflow:hidden;margin-bottom:2rem;}
.featured-head{background:linear-gradient(135deg,#fff8e8,#fff);padding:1rem 1.5rem;display:flex;align-items:center;gap:0.75rem;}
.featured-icon{font-size:1.5rem;}
.featured-title{font-size:1rem;font-weight:700;}
.featured-sub{font-size:0.78rem;color:var(--muted);}
.featured-body{padding:1rem 1.5rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;}
.feat-item{display:flex;align-items:center;gap:0.6rem;font-size:0.84rem;}
.feat-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
@media(max-width:768px){.course-grid{grid-template-columns:1fr 1fr;}.featured-body{grid-template-columns:1fr;}}
@media(max-width:500px){.course-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — مركز التعلم</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>مركز التعلم والمعرفة</h2>
  </div>

  <div class="progress-hero">
    <div class="prog-left">
      <div class="prog-title">تقدمك التعليمي</div>
      <div class="prog-sub">أكملت ٧ من ١٨ درساً · مستوى: متوسط</div>
      <div class="prog-bar-wrap">
        <div class="prog-bar-track"><div class="prog-bar-fill" style="width:39%"></div></div>
        <div class="prog-pct">٣٩٪ مكتمل</div>
      </div>
    </div>
    <div class="prog-stats">
      <div class="prog-stat"><span class="prog-stat-val">٧</span><span class="prog-stat-lbl">درس مكتمل</span></div>
      <div class="prog-stat"><span class="prog-stat-val">٤٢٠</span><span class="prog-stat-lbl">نقطة مكتسبة</span></div>
      <div class="prog-stat"><span class="prog-stat-val">٣</span><span class="prog-stat-lbl">شهادات</span></div>
    </div>
  </div>

  <div class="featured-card">
    <div class="featured-head">
      <div class="featured-icon">🌟</div>
      <div>
        <div class="featured-title">مسار الاستثمار الإسلامي المتكامل</div>
        <div class="featured-sub">دورة مُوصى بها لمستواك · ٨ وحدات · شهادة معتمدة</div>
      </div>
    </div>
    <div class="featured-body" id="featuredTopics"></div>
  </div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="course-grid" id="courseGrid"></div>
</div>

<script>
const categories = ['الكل','أساسيات','مرابحة','المحفظة','الشريعة','تحليل'];

const featuredTopics = [
  'مفهوم المرابحة وأحكامها',
  'تقييم المخاطر الاستثمارية',
  'بناء محفظة متوازنة',
  'ضوابط التمويل الإسلامي',
  'قراءة التقارير المالية',
  'استراتيجيات الخروج',
];

const courses = [
  {icon:'📖',bg:'#e6f4ef',tag:'beginner',title:'ما هي المرابحة؟',meta:'٢٠ دقيقة · ٤ أجزاء',progress:100,pts:'٦٠ نقطة'},
  {icon:'⚖️',bg:'#fff8e8',tag:'beginner',title:'الضوابط الشرعية للاستثمار',meta:'٣٥ دقيقة · ٦ أجزاء',progress:100,pts:'٩٠ نقطة'},
  {icon:'📊',bg:'#f0f4ff',tag:'intermediate',title:'قراءة القوائم المالية',meta:'٥٠ دقيقة · ٨ أجزاء',progress:65,pts:'١٢٠ نقطة'},
  {icon:'🏗️',bg:'#fde9e9',tag:'intermediate',title:'تحليل الاستثمار العقاري',meta:'٤٠ دقيقة · ٧ أجزاء',progress:30,pts:'١٠٠ نقطة'},
  {icon:'⚡',bg:'#f8f0e0',tag:'advanced',title:'تمويل مشاريع الطاقة',meta:'٦٠ دقيقة · ١٠ أجزاء',progress:0,pts:'١٥٠ نقطة'},
  {icon:'🌐',bg:'#e6f4ef',tag:'advanced',title:'التنويع والتوزيع الأمثل',meta:'٤٥ دقيقة · ٧ أجزاء',progress:0,pts:'١٣٠ نقطة'},
];

const tagLabels = {beginner:'مبتدئ',intermediate:'متوسط',advanced:'متقدم'};
const tagCls = {beginner:'tag-beginner',intermediate:'tag-intermediate',advanced:'tag-advanced'};

let activecat = 'الكل';

function renderCatTabs(){
  const cont = document.getElementById('catTabs');
  cont.textContent = '';
  categories.forEach(c => {
    const tab = document.createElement('button');
    tab.className = 'cat-tab' + (c === activecat ? ' active' : '');
    tab.textContent = c;
    tab.onclick = () => { activecat = c; renderCatTabs(); loadCourses(c); };
    cont.appendChild(tab);
  });
}

function renderFeatured(){
  const cont = document.getElementById('featuredTopics');
  cont.textContent = '';
  featuredTopics.forEach(t => {
    const item = document.createElement('div');
    item.className = 'feat-item';
    const dot = document.createElement('div');
    dot.className = 'feat-dot';
    const txt = document.createElement('span');
    txt.textContent = t;
    item.appendChild(dot);
    item.appendChild(txt);
    cont.appendChild(item);
  });
}

function renderCourses(data){
  const grid = document.getElementById('courseGrid');
  grid.textContent = '';
  (data || courses).forEach(c => {
    const card = document.createElement('div');
    card.className = 'course-card';
    const thumb = document.createElement('div');
    thumb.className = 'course-thumb';
    thumb.style.background = c.bg;
    thumb.textContent = c.icon;
    const body = document.createElement('div');
    body.className = 'course-body';
    const tag = document.createElement('span');
    tag.className = 'course-tag ' + (tagCls[c.tag] || '');
    tag.textContent = tagLabels[c.tag] || c.tag;
    const title = document.createElement('div');
    title.className = 'course-title';
    title.textContent = c.title;
    const meta = document.createElement('div');
    meta.className = 'course-meta';
    meta.textContent = c.meta;
    const progWrap = document.createElement('div');
    progWrap.className = 'course-progress';
    const progLbl = document.createElement('div');
    progLbl.style.cssText = 'font-size:0.72rem;color:var(--muted);margin-bottom:0.2rem;';
    progLbl.textContent = c.progress + '٪ مكتمل';
    const track = document.createElement('div');
    track.className = 'mini-bar-track';
    const fill = document.createElement('div');
    fill.className = 'mini-bar-fill';
    fill.style.width = c.progress + '%';
    if(c.progress === 100) fill.style.background = '#27ae60';
    track.appendChild(fill);
    progWrap.appendChild(progLbl);
    progWrap.appendChild(track);
    body.appendChild(tag);
    body.appendChild(title);
    body.appendChild(meta);
    body.appendChild(progWrap);
    const footer = document.createElement('div');
    footer.className = 'course-footer';
    const pts = document.createElement('span');
    pts.className = 'course-pts';
    pts.textContent = c.pts;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm ' + (c.progress > 0 && c.progress < 100 ? 'btn-primary' : c.progress === 100 ? 'btn-secondary' : 'btn-primary');
    btn.textContent = c.progress === 100 ? 'مراجعة' : c.progress > 0 ? 'متابعة' : 'ابدأ';
    btn.onclick = () => openCourse(c.title);
    footer.appendChild(pts);
    footer.appendChild(btn);
    card.appendChild(thumb);
    card.appendChild(body);
    card.appendChild(footer);
    grid.appendChild(card);
  });
}

function loadCourses(cat){
  fetch('/app/me/learning/courses?category=' + encodeURIComponent(cat))
    .then(r => r.json())
    .catch(() => {});
  renderCourses(courses);
}

async function openCourse(title){
  try {
    await fetch('/app/me/learning/progress', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({course: title, action: 'open'})
    });
  } catch(e){}
}

renderCatTabs();
renderFeatured();
renderCourses();
</script>
</body>
</html>
