<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>أكواد الترويج — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;
  --paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);
  --red:#c0392b;--blue:#2471a3;
}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
header h1{font-size:1.25rem;font-weight:700}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:.9rem}
header a:hover{color:#fff}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid var(--line);background:#fff}
.top-bar h2{font-size:1.1rem;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1.1rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.9rem;cursor:pointer;border:none;font-weight:600;transition:.15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn-ghost:hover{background:var(--green);color:#fff}
.layout{display:grid;grid-template-columns:1fr 380px;gap:1.5rem;padding:1.5rem 2rem;max-width:1300px;margin:0 auto}
/* ── Promo List ── */
.card{background:#fff;border-radius:12px;border:1px solid var(--line)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.card-head h3{font-size:1rem;font-weight:700}
/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1rem 2rem}
.stat-card{background:#fff;border-radius:10px;border:1px solid var(--line);padding:1rem 1.25rem}
.stat-card .val{font-size:1.5rem;font-weight:700;color:var(--green)}
.stat-card .lbl{font-size:.8rem;color:var(--muted);margin-top:.2rem}
/* Filter */
.filter-row{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{padding:.3rem .85rem;border-radius:20px;font-size:.82rem;cursor:pointer;border:1.5px solid var(--line);background:#fff;font-family:'Cairo',sans-serif;font-weight:600;color:var(--muted);transition:.15s}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;gap:.5rem;border:1.5px solid var(--line);border-radius:8px;padding:.35rem .75rem;background:#fff}
.search-box input{border:none;outline:none;font-family:'Cairo',sans-serif;font-size:.88rem;width:100%;background:transparent;direction:rtl}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{padding:.65rem 1rem;text-align:right;background:#f5f7f5;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:.7rem 1rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcfa}
.badge{display:inline-block;padding:.2rem .65rem;border-radius:20px;font-size:.76rem;font-weight:700}
.badge-active{background:#d4edda;color:#155724}
.badge-expired{background:#f8d7da;color:#721c24}
.badge-draft{background:#e2e3e5;color:#383d41}
.badge-pct{background:#d1ecf1;color:#0c5460}
.badge-fixed{background:#ffeeba;color:#856404}
.code-pill{font-family:monospace;background:#f0f0f0;padding:.2rem .5rem;border-radius:6px;font-size:.85rem;letter-spacing:.05em}
.action-btn{padding:.3rem .65rem;border-radius:6px;font-size:.78rem;cursor:pointer;border:1.5px solid var(--line);background:#fff;font-family:'Cairo',sans-serif;font-weight:600;transition:.15s}
.action-btn:hover{background:var(--green);color:#fff;border-color:var(--green)}
.action-btn.del:hover{background:var(--red);border-color:var(--red)}
/* Editor panel */
.editor .card-head{background:var(--green-dark);color:#fff;border-radius:12px 12px 0 0}
.form-group{padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:.5rem .75rem;border:1.5px solid var(--line);border-radius:8px;
  font-family:'Cairo',sans-serif;font-size:.9rem;background:#fff;color:var(--green-dark);outline:none;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.type-toggle button{padding:.45rem;border-radius:8px;font-family:'Cairo',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:.15s}
.type-toggle button.active{background:var(--green);color:#fff;border-color:var(--green)}
.editor-footer{padding:1rem 1.25rem;display:flex;gap:.75rem;background:#f9f9f9;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.progress-bar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--green);border-radius:3px;transition:.3s}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:.7rem 1.5rem;border-radius:10px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
.empty-msg{text-align:center;padding:2.5rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header>
  <a href="hessa.html">→ لوحة التحكم</a>
  <h1>أكواد الترويج</h1>
</header>

<!-- Stats -->
<div class="stats-row" id="statsRow">
  <div class="stat-card"><div class="val" id="statTotal">—</div><div class="lbl">إجمالي الأكواد</div></div>
  <div class="stat-card"><div class="val" id="statActive">—</div><div class="lbl">أكواد نشطة</div></div>
  <div class="stat-card"><div class="val" id="statUsed">—</div><div class="lbl">إجمالي الاستخدام</div></div>
  <div class="stat-card"><div class="val" id="statSavings">—</div><div class="lbl">إجمالي الخصومات (ر.س)</div></div>
</div>

<div class="top-bar">
  <h2>قائمة الأكواد</h2>
  <button class="btn btn-primary" onclick="openNew()">+ كود جديد</button>
</div>

<div class="layout">
  <!-- List -->
  <div>
    <div class="card">
      <div class="filter-row">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="ابحث عن كود..." oninput="applyFilter()"/>
        </div>
        <button class="chip active" data-status="all" onclick="setStatus(this,'all')">الكل</button>
        <button class="chip" data-status="active" onclick="setStatus(this,'active')">نشط</button>
        <button class="chip" data-status="draft" onclick="setStatus(this,'draft')">مسودة</button>
        <button class="chip" data-status="expired" onclick="setStatus(this,'expired')">منتهي</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>الكود</th>
              <th>النوع</th>
              <th>القيمة</th>
              <th>الاستخدام</th>
              <th>الحد الأقصى</th>
              <th>انتهاء الصلاحية</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="promoTbody">
            <tr><td colspan="8" class="empty-msg">جارٍ التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Editor -->
  <div class="editor">
    <div class="card" id="editorCard" style="display:none">
      <div class="card-head">
        <h3 id="editorTitle">كود جديد</h3>
        <button class="btn btn-ghost" style="border-color:rgba(255,255,255,.4);color:#fff" onclick="closeEditor()">✕</button>
      </div>

      <div class="form-group">
        <label>كود الخصم</label>
        <div style="display:flex;gap:.5rem">
          <input type="text" id="fCode" placeholder="مثال: RAMADAN25" style="text-transform:uppercase;font-family:monospace;letter-spacing:.05em"/>
          <button class="btn btn-ghost" style="white-space:nowrap;flex-shrink:0" onclick="generateCode()">توليد</button>
        </div>
      </div>

      <div class="form-group">
        <label>نوع الخصم</label>
        <div class="type-toggle">
          <button id="typePct" class="active" onclick="setType('percentage')">نسبة مئوية %</button>
          <button id="typeFixed" onclick="setType('fixed')">مبلغ ثابت ر.س</button>
        </div>
      </div>

      <div class="form-group">
        <div class="form-row">
          <div>
            <label id="valueLabel">قيمة الخصم (%)</label>
            <input type="number" id="fValue" placeholder="10" min="0" max="100"/>
          </div>
          <div>
            <label>الحد الأدنى للاستثمار (ر.س)</label>
            <input type="number" id="fMinInvest" placeholder="1000" min="0"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="form-row">
          <div>
            <label>الحد الأقصى للاستخدامات</label>
            <input type="number" id="fMaxUses" placeholder="100" min="1"/>
          </div>
          <div>
            <label>الحد الأقصى للمستخدم</label>
            <input type="number" id="fUserLimit" placeholder="1" min="1"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="form-row">
          <div>
            <label>تاريخ البداية</label>
            <input type="date" id="fStartDate"/>
          </div>
          <div>
            <label>تاريخ الانتهاء</label>
            <input type="date" id="fEndDate"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>قابل للتطبيق على</label>
        <select id="fApplyTo">
          <option value="all">جميع الصفقات</option>
          <option value="first_investment">الاستثمار الأول فقط</option>
          <option value="specific_deal">صفقة محددة</option>
          <option value="category">فئة محددة</option>
        </select>
      </div>

      <div class="form-group">
        <label>الوصف الداخلي</label>
        <textarea id="fDesc" rows="2" placeholder="ملاحظات داخلية حول الكود..."></textarea>
      </div>

      <div class="form-group">
        <label>الحالة</label>
        <select id="fStatus">
          <option value="active">نشط</option>
          <option value="draft">مسودة</option>
          <option value="expired">منتهي</option>
        </select>
      </div>

      <div class="editor-footer">
        <button class="btn btn-primary" style="flex:1" onclick="savePromo()">حفظ الكود</button>
        <button class="btn btn-danger" id="deleteBtn" style="display:none" onclick="deletePromo()">حذف</button>
      </div>
    </div>

    <div id="editorPlaceholder" class="card" style="padding:3rem 1.5rem;text-align:center;color:var(--muted)">
      <div style="font-size:2rem;margin-bottom:.75rem">🎟️</div>
      <div style="font-weight:600;margin-bottom:.5rem">اختر كوداً للتعديل</div>
      <div style="font-size:.85rem">أو أنشئ كوداً جديداً</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/assets/lang.js" defer></script>
<script>
const API = '/app/admin/promo-codes';
const CSRF = document.cookie.match(/csrf=([^;]+)/)?.[1] || 'x';
let promos = [];
let editId = null;
let discountType = 'percentage';
let statusFilter = 'all';

async function loadPromos() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('error');
    const d = await r.json();
    promos = d.promoCodes || samplePromos();
  } catch {
    promos = samplePromos();
  }
  renderStats();
  renderTable();
}

function samplePromos() {
  return [
    {id:'p1',code:'WELCOME10',type:'percentage',value:10,minInvest:500,maxUses:500,userLimit:1,usedCount:123,startDate:'2026-01-01',endDate:'2026-12-31',applyTo:'first_investment',status:'active',desc:'عرض الترحيب للمستخدمين الجدد'},
    {id:'p2',code:'RAMADAN25',type:'percentage',value:25,minInvest:1000,maxUses:200,userLimit:1,usedCount:198,startDate:'2026-03-01',endDate:'2026-04-10',applyTo:'all',status:'expired',desc:'عرض رمضان المبارك'},
    {id:'p3',code:'FLAT500',type:'fixed',value:500,minInvest:5000,maxUses:50,userLimit:1,usedCount:12,startDate:'2026-06-01',endDate:'2026-09-30',applyTo:'all',status:'active',desc:'خصم ثابت للاستثمارات الكبيرة'},
    {id:'p4',code:'VIP2026',type:'percentage',value:15,minInvest:10000,maxUses:100,userLimit:3,usedCount:0,startDate:'2026-07-01',endDate:'2026-12-31',applyTo:'all',status:'draft',desc:'برنامج العملاء المميزين'},
  ];
}

function renderStats() {
  const active = promos.filter(p => p.status === 'active').length;
  const used = promos.reduce((s,p) => s + (p.usedCount||0), 0);
  const savings = promos.reduce((s,p) => {
    if (p.type === 'fixed') return s + (p.usedCount||0) * p.value;
    return s + (p.usedCount||0) * ((p.minInvest||1000) * p.value / 100);
  }, 0);
  const t = document.getElementById.bind(document);
  t('statTotal').textContent = promos.length;
  t('statActive').textContent = active;
  t('statUsed').textContent = used.toLocaleString('ar');
  t('statSavings').textContent = savings.toLocaleString('ar-SA', {maximumFractionDigits:0});
}

function setStatus(el, val) {
  document.querySelectorAll('.chip[data-status]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  statusFilter = val;
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = promos.filter(p => {
    const matchStatus = statusFilter === 'all' || p.status === statusFilter;
    const matchQ = !q || p.code.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q);
    return matchStatus && matchQ;
  });
  renderTable(filtered);
}

function renderTable(list) {
  list = list || promos;
  const tbody = document.getElementById('promoTbody');
  tbody.textContent = '';
  if (!list.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8;
    td.className = 'empty-msg';
    td.textContent = 'لا توجد أكواد مطابقة';
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  list.forEach(p => {
    const tr = document.createElement('tr');
    const pct = p.maxUses > 0 ? Math.round((p.usedCount||0) / p.maxUses * 100) : 0;
    const cells = [
      () => {
        const td = document.createElement('td');
        const span = document.createElement('span');
        span.className = 'code-pill';
        span.textContent = p.code;
        td.appendChild(span);
        return td;
      },
      () => {
        const td = document.createElement('td');
        const b = document.createElement('span');
        b.className = p.type === 'percentage' ? 'badge badge-pct' : 'badge badge-fixed';
        b.textContent = p.type === 'percentage' ? 'نسبة %' : 'ثابت';
        td.appendChild(b);
        return td;
      },
      () => { const td = document.createElement('td'); td.textContent = p.type === 'percentage' ? p.value + '%' : p.value.toLocaleString('ar') + ' ر.س'; return td; },
      () => {
        const td = document.createElement('td');
        const wrap = document.createElement('div');
        const lbl = document.createElement('div');
        lbl.style.fontSize = '.78rem';
        lbl.textContent = (p.usedCount||0) + ' / ' + p.maxUses;
        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        bar.style.marginTop = '.3rem';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        wrap.appendChild(lbl);
        wrap.appendChild(bar);
        td.appendChild(wrap);
        return td;
      },
      () => { const td = document.createElement('td'); td.textContent = p.maxUses; return td; },
      () => { const td = document.createElement('td'); td.textContent = p.endDate || '—'; td.style.fontSize = '.82rem'; return td; },
      () => {
        const td = document.createElement('td');
        const b = document.createElement('span');
        b.className = 'badge badge-' + p.status;
        b.textContent = {active:'نشط',expired:'منتهي',draft:'مسودة'}[p.status] || p.status;
        td.appendChild(b);
        return td;
      },
      () => {
        const td = document.createElement('td');
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.textContent = 'تعديل';
        btn.onclick = () => openEdit(p);
        td.appendChild(btn);
        return td;
      },
    ];
    cells.forEach(fn => tr.appendChild(fn()));
    tbody.appendChild(tr);
  });
}

function openNew() {
  editId = null;
  clearForm();
  document.getElementById('editorTitle').textContent = 'كود جديد';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('editorPlaceholder').style.display = 'none';
  document.getElementById('editorCard').style.display = 'block';
}

function openEdit(p) {
  editId = p.id;
  document.getElementById('fCode').value = p.code;
  setType(p.type);
  document.getElementById('fValue').value = p.value;
  document.getElementById('fMinInvest').value = p.minInvest || '';
  document.getElementById('fMaxUses').value = p.maxUses;
  document.getElementById('fUserLimit').value = p.userLimit || 1;
  document.getElementById('fStartDate').value = p.startDate || '';
  document.getElementById('fEndDate').value = p.endDate || '';
  document.getElementById('fApplyTo').value = p.applyTo || 'all';
  document.getElementById('fDesc').value = p.desc || '';
  document.getElementById('fStatus').value = p.status;
  document.getElementById('editorTitle').textContent = 'تعديل: ' + p.code;
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('editorPlaceholder').style.display = 'none';
  document.getElementById('editorCard').style.display = 'block';
}

function closeEditor() {
  document.getElementById('editorCard').style.display = 'none';
  document.getElementById('editorPlaceholder').style.display = 'block';
  editId = null;
}

function clearForm() {
  ['fCode','fValue','fMinInvest','fMaxUses','fUserLimit','fStartDate','fEndDate','fDesc'].forEach(id => {
    document.getElementById(id).value = '';
  });
  setType('percentage');
  document.getElementById('fApplyTo').value = 'all';
  document.getElementById('fStatus').value = 'active';
}

function setType(t) {
  discountType = t;
  document.getElementById('typePct').classList.toggle('active', t === 'percentage');
  document.getElementById('typeFixed').classList.toggle('active', t === 'fixed');
  document.getElementById('valueLabel').textContent = t === 'percentage' ? 'قيمة الخصم (%)' : 'قيمة الخصم (ر.س)';
  const inp = document.getElementById('fValue');
  inp.max = t === 'percentage' ? '100' : '99999';
}

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('fCode').value = code;
}

async function savePromo() {
  const payload = {
    code: document.getElementById('fCode').value.trim().toUpperCase(),
    type: discountType,
    value: parseFloat(document.getElementById('fValue').value) || 0,
    minInvest: parseFloat(document.getElementById('fMinInvest').value) || 0,
    maxUses: parseInt(document.getElementById('fMaxUses').value) || 100,
    userLimit: parseInt(document.getElementById('fUserLimit').value) || 1,
    startDate: document.getElementById('fStartDate').value,
    endDate: document.getElementById('fEndDate').value,
    applyTo: document.getElementById('fApplyTo').value,
    desc: document.getElementById('fDesc').value.trim(),
    status: document.getElementById('fStatus').value,
  };
  if (!payload.code) { toast('أدخل كود الخصم'); return; }
  if (!payload.value) { toast('أدخل قيمة الخصم'); return; }

  const method = editId ? 'PUT' : 'POST';
  const url = editId ? API + '/' + editId : API;
  try {
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json','x-csrf-token':CSRF}, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('error');
    toast(editId ? 'تم تحديث الكود' : 'تم إنشاء الكود');
    closeEditor();
    loadPromos();
  } catch {
    toast('تعذّر الحفظ');
  }
}

async function deletePromo() {
  if (!editId || !confirm('هل أنت متأكد من حذف هذا الكود؟')) return;
  try {
    const r = await fetch(API + '/' + editId, { method:'DELETE', headers:{'x-csrf-token':CSRF} });
    if (!r.ok) throw new Error('error');
    toast('تم حذف الكود');
    closeEditor();
    loadPromos();
  } catch {
    toast('تعذّر الحذف');
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

loadPromos();
</script>
</body>
</html>
