name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: murbha
          POSTGRES_PASSWORD: murbha
          POSTGRES_DB: murbha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U murbha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://murbha:murbha@localhost:5432/murbha
      SESSION_SECRET: test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run migrate

      - name: Run tests
        run: npm test
