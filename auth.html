<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#062b1e" />
<meta name="color-scheme" content="light only" />
<title>تسجيل الدخول — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#0d1612;--paper:#fbf6ea;--paper-2:#efe8d6;--green:#0a4d36;--green-dark:#062b1e;--gold:#b08840;--gold-light:#d4ac6e;--gold-soft:#e8d3a8;--muted:#6b7268;--line:rgba(13,22,18,0.10);--line-strong:rgba(13,22,18,0.20);--red:#b54935;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#fbf6ea;-webkit-text-size-adjust:100%}
body{font-family:'Tajawal','Geeza Pro',system-ui,sans-serif;background:linear-gradient(180deg,#fbf6ea 0%,#efe8d6 100%)!important;color:#0d1612;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
button,a{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
*:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;padding:14px 18px 24px;max-width:480px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.back-btn{width:40px;height:40px;border-radius:50%;background:rgba(13,22,18,0.05);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;text-decoration:none}
.back-btn:active{transform:scale(0.92)}
.help-btn{background:transparent;border:none;color:var(--gold);font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;padding:8px}
.auth-logo{text-align:center;margin-bottom:8px}
.auth-logo-mark{width:64px;height:64px;margin:0 auto 12px;background:var(--green);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-family:'Cairo',sans-serif;font-weight:900;font-size:32px;box-shadow:0 8px 24px rgba(10,77,54,0.25);position:relative}
.auth-logo-mark::after{content:'';position:absolute;inset:6px;border:1.5px solid var(--gold-light);border-radius:9px;opacity:0.4}
.auth-logo h1{font-family:'Cairo',sans-serif;font-size:24px;font-weight:900;color:var(--green-dark);letter-spacing:-0.02em}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:4px}
.mode-tabs{background:rgba(13,22,18,0.06);padding:5px;border-radius:12px;display:flex;gap:4px;margin:24px 0 22px}
.mode-tab{flex:1;background:transparent;border:none;padding:10px;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .2s}
.mode-tab:active{transform:scale(0.97)}
.mode-tab.active{background:#fff;color:var(--green-dark);box-shadow:0 1px 3px rgba(13,22,18,0.08)}
.auth-headline{text-align:center;margin-bottom:24px}
.auth-headline h2{font-family:'Cairo',sans-serif;font-size:22px;font-weight:800;color:var(--green-dark);margin-bottom:6px}
.auth-headline p{font-size:13px;color:var(--muted);line-height:1.6}
.auth-trust{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line-strong);text-align:center}
.trust-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.trust-pill{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:600}
.trust-pill::before{content:'✓';color:var(--green);font-weight:900}
.auth-terms{font-size:11px;color:var(--muted);line-height:1.6}
.auth-terms a{color:var(--gold);font-weight:700;text-decoration:none}
.auth-footer{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
.auth-footer a{color:var(--green-dark);font-weight:800;text-decoration:none}

/* Username/password forms */
.auth-form{display:flex;flex-direction:column}
.auth-form label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
.auth-form input{width:100%;padding:14px 16px;border:1.5px solid var(--line-strong);border-radius:12px;font-family:inherit;font-size:17px;background:var(--paper);transition:border-color .2s;-webkit-appearance:none;margin-bottom:14px}
.auth-form input:focus{outline:none;border-color:var(--green);background:#fff}
.auth-form .form-error{margin-bottom:8px}
.btn-block{width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;font-size:15px;font-weight:700;border-radius:12px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:48px;width:100%;transition:transform .1s,background .2s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--green);color:var(--paper);box-shadow:0 4px 14px rgba(10,77,54,0.25)}

@media(min-width:768px){body{font-size:16px}.auth-wrap{padding:40px 28px}}
.lang-toggle{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:rgba(13,22,18,0.04);color:var(--green-dark);font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:background .15s;flex-shrink:0}
.lang-toggle:hover{background:rgba(13,22,18,0.08)}
.lang-toggle:active{transform:scale(0.96)}
.lang-toggle .lang-sep{opacity:.4}
html[lang="ar"] .lang-toggle .lang-ar{color:var(--gold)}
html[lang="ar"] .lang-toggle .lang-en{opacity:.45}
html[lang="en"] .lang-toggle .lang-en{color:var(--gold)}
html[lang="en"] .lang-toggle .lang-ar{opacity:.45}
html[lang="en"] body{font-family:'Inter','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif}
</style>
<script src="i18n.js" defer></script>
</head>
<body>
<div class="auth-wrap">

<div class="top-bar">
  <a href="hessa.html" class="back-btn" data-i18n-attr="aria-label:auth_back" aria-label="رجوع"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6" transform="scale(-1,1) translate(-24,0)"/></svg></a>
  <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch language">
    <span class="lang-en">EN</span><span class="lang-sep">/</span><span class="lang-ar">ع</span>
  </button>
  <a href="help.html" class="help-btn" data-i18n="auth_help">المساعدة ؟</a>
</div>

<div class="auth-logo">
  <div class="auth-logo-mark">م</div>
  <h1 data-i18n="auth_logo_h">منصة مُرابحة</h1>
  <p data-i18n="auth_logo_p">منصة الشراكة الاستثمارية الشرعية</p>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" data-mode="login" data-i18n="auth_tab_login">تسجيل الدخول</button>
  <button class="mode-tab" data-mode="register" data-i18n="auth_tab_register">إنشاء حساب</button>
</div>

<style>
  /* Identity-type sub-tabs (Username / Mobile) inside each top mode */
  .id-tabs{display:flex;gap:6px;margin-bottom:14px}
  .id-tab{flex:1;background:transparent;border:1px solid var(--line-strong);padding:8px;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .15s}
  .id-tab.active{background:var(--green);color:var(--paper);border-color:var(--green)}
  .otp-link{display:block;text-align:center;background:transparent;border:0;color:var(--gold);font-family:inherit;font-size:13px;font-weight:700;margin-top:4px;cursor:pointer;text-decoration:underline}
  .hide{display:none}
  .input-hint{font-size:11px;color:var(--muted);margin:-8px 0 12px}
</style>

<!-- ── LOGIN ── -->
<div id="loginMode">
  <div class="auth-headline">
    <h2 data-i18n="auth_welcome">أهلاً بعودتك 👋</h2>
    <p data-i18n="auth_welcome_sub">سجّل الدخول لمتابعة استثماراتك</p>
  </div>

  <div class="id-tabs" data-scope="login">
    <button type="button" class="id-tab active" data-id-type="username" data-i18n="auth_id_username">اسم المستخدم</button>
    <button type="button" class="id-tab" data-id-type="mobile" data-i18n="auth_id_mobile">رقم الجوال</button>
  </div>

  <!-- Username + password login (legacy) -->
  <form id="loginForm" class="auth-form" autocomplete="on" data-flow="login-username">
    <label for="loginUsername" data-i18n="auth_label_user">اسم المستخدم</label>
    <input id="loginUsername" name="username" type="text" autocomplete="username"
           inputmode="latin" style="direction:ltr" required />
    <label for="loginPassword" data-i18n="auth_label_pass">كلمة المرور</label>
    <input id="loginPassword" name="password" type="password"
           autocomplete="current-password" style="direction:ltr" required />
    <p class="form-error" id="loginError" style="color:var(--red);font-size:12px;min-height:16px"></p>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_btn_login">تسجيل الدخول</button>
  </form>

  <!-- Mobile + password login (default for new users) -->
  <form id="loginMobileForm" class="auth-form hide" autocomplete="on" data-flow="login-mobile">
    <label for="loginMobile" data-i18n="auth_label_mobile">رقم الجوال</label>
    <input id="loginMobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel"
           style="direction:ltr" placeholder="05XXXXXXXX" data-i18n-attr="placeholder:auth_mobile_ph" required />
    <label for="loginMobilePassword" data-i18n="auth_label_pass">كلمة المرور</label>
    <input id="loginMobilePassword" name="password" type="password"
           autocomplete="current-password" style="direction:ltr" required />
    <p class="form-error" id="loginMobileError" style="color:var(--red);font-size:12px;min-height:16px"></p>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_btn_login">تسجيل الدخول</button>
    <button type="button" class="otp-link" data-otp="login" data-i18n="auth_otp_instead">الدخول برمز OTP بدلاً من ذلك</button>
  </form>

  <!-- Mobile OTP login (no password) -->
  <form id="loginOtpForm" class="auth-form hide" autocomplete="off" data-flow="login-otp">
    <label for="loginOtpMobile" data-i18n="auth_label_mobile">رقم الجوال</label>
    <input id="loginOtpMobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel"
           style="direction:ltr" placeholder="05XXXXXXXX" data-i18n-attr="placeholder:auth_mobile_ph" required />
    <button type="button" class="btn btn-ghost btn-block" id="loginOtpRequestBtn" data-i18n="auth_otp_send">إرسال رمز التحقق</button>
    <div id="loginOtpCodeBlock" class="hide" style="margin-top:14px">
      <label for="loginOtpCode" data-i18n="auth_otp_label">رمز التحقق</label>
      <input id="loginOtpCode" name="code" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" required
             style="direction:ltr;letter-spacing:8px;text-align:center" />
      <p class="form-error" id="loginOtpError" style="color:var(--red);font-size:12px;min-height:16px"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_otp_verify">تحقّق وادخل</button>
    </div>
    <button type="button" class="otp-link" data-otp="login-back" data-i18n="auth_use_password">العودة لتسجيل الدخول بكلمة المرور</button>
  </form>

  <div class="auth-footer" style="margin-top:14px">
    <a href="reset-password.html" data-i18n="auth_forgot_link">نسيت كلمة المرور؟</a>
  </div>
</div>

<!-- ── REGISTER ── -->
<div id="registerMode" style="display:none">
  <div class="auth-headline">
    <h2 data-i18n="auth_register_h">ابدأ رحلتك الاستثمارية 🚀</h2>
    <p data-i18n="auth_register_sub">أنشئ حسابك في دقيقتين</p>
  </div>

  <div class="id-tabs" data-scope="register">
    <button type="button" class="id-tab active" data-id-type="mobile" data-i18n="auth_id_mobile">رقم الجوال</button>
    <button type="button" class="id-tab" data-id-type="username" data-i18n="auth_id_username">اسم المستخدم</button>
  </div>

  <!-- Mobile + password signup (recommended default) -->
  <form id="registerMobileForm" class="auth-form" autocomplete="on" data-flow="register-mobile">
    <label for="regMobileName" data-i18n="auth_label_fullname">الاسم الكامل</label>
    <input id="regMobileName" name="full_name" type="text" autocomplete="name" />
    <label for="regMobile" data-i18n="auth_label_mobile">رقم الجوال</label>
    <input id="regMobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel"
           style="direction:ltr" placeholder="05XXXXXXXX" data-i18n-attr="placeholder:auth_mobile_ph" required />
    <label for="regMobilePassword" data-i18n="auth_label_strong_pass">كلمة مرور قوية</label>
    <input id="regMobilePassword" name="password" type="password"
           autocomplete="new-password" placeholder="٨ أحرف على الأقل"
           data-i18n-attr="placeholder:auth_pass_ph"
           style="direction:ltr" required />
    <p class="form-error" id="regMobileError" style="color:var(--red);font-size:12px;min-height:16px"></p>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_btn_register">إنشاء حساب</button>
    <button type="button" class="otp-link" data-otp="register" data-i18n="auth_otp_signup_instead">التسجيل برمز OTP بدلاً من كلمة المرور</button>
  </form>

  <!-- Mobile OTP signup -->
  <form id="registerOtpForm" class="auth-form hide" autocomplete="off" data-flow="register-otp">
    <label for="regOtpName" data-i18n="auth_label_fullname">الاسم الكامل</label>
    <input id="regOtpName" name="full_name" type="text" autocomplete="name" />
    <label for="regOtpMobile" data-i18n="auth_label_mobile">رقم الجوال</label>
    <input id="regOtpMobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel"
           style="direction:ltr" placeholder="05XXXXXXXX" data-i18n-attr="placeholder:auth_mobile_ph" required />
    <button type="button" class="btn btn-ghost btn-block" id="regOtpRequestBtn" data-i18n="auth_otp_send">إرسال رمز التحقق</button>
    <div id="regOtpCodeBlock" class="hide" style="margin-top:14px">
      <label for="regOtpCode" data-i18n="auth_otp_label">رمز التحقق</label>
      <input id="regOtpCode" name="code" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" required
             style="direction:ltr;letter-spacing:8px;text-align:center" />
      <p class="form-error" id="regOtpError" style="color:var(--red);font-size:12px;min-height:16px"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_otp_verify">تحقّق وأنشئ الحساب</button>
    </div>
    <button type="button" class="otp-link" data-otp="register-back" data-i18n="auth_use_password">العودة للتسجيل بكلمة المرور</button>
  </form>

  <!-- Username + password signup (legacy) -->
  <form id="registerForm" class="auth-form hide" autocomplete="on" data-flow="register-username">
    <label for="regFullName" data-i18n="auth_label_fullname">الاسم الكامل</label>
    <input id="regFullName" name="full_name" type="text" autocomplete="name" />
    <label for="regUsername" data-i18n="auth_label_user">اسم المستخدم</label>
    <input id="regUsername" name="username" type="text" autocomplete="username"
           inputmode="latin" style="direction:ltr" required />
    <label for="regPassword" data-i18n="auth_label_strong_pass">كلمة مرور قوية</label>
    <input id="regPassword" name="password" type="password"
           autocomplete="new-password" placeholder="٨ أحرف على الأقل"
           data-i18n-attr="placeholder:auth_pass_ph"
           style="direction:ltr" required />
    <p class="form-error" id="regError" style="color:var(--red);font-size:12px;min-height:16px"></p>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_btn_register">إنشاء حساب</button>
  </form>
</div>

<div class="auth-trust">
  <div class="trust-row">
    <span class="trust-pill" data-i18n="auth_trust_sharia">هيئة شرعية مستقلة</span>
    <span class="trust-pill" data-i18n="auth_trust_pdpl">حماية البيانات PDPL</span>
    <span class="trust-pill" data-i18n="auth_trust_login">تسجيل دخول آمن</span>
  </div>
  <p class="auth-terms" data-i18n-html="auth_terms">بمواصلتك تقرّ بقراءة <a href="terms.html">الشروط</a> و<a href="privacy.html">الخصوصية</a></p>
</div>
</div>

<script>
// Top-level mode toggle (Sign in / Create account)
document.querySelectorAll('.mode-tabs > .mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tabs > .mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const mode = tab.dataset.mode;
    document.getElementById('loginMode').style.display    = mode === 'login'    ? 'block' : 'none';
    document.getElementById('registerMode').style.display = mode === 'register' ? 'block' : 'none';
  });
});
if (new URLSearchParams(location.search).get('mode') === 'register')
  document.querySelector('.mode-tabs > [data-mode="register"]').click();

// Identity-type sub-tabs (Username / Mobile) inside each top mode.
function showFlow(scope, flow) {
  const map = {
    login: { username: 'loginForm', mobile: 'loginMobileForm', 'login-otp': 'loginOtpForm' },
    register: { username: 'registerForm', mobile: 'registerMobileForm', 'register-otp': 'registerOtpForm' },
  };
  Object.values(map[scope]).forEach(id => document.getElementById(id).classList.add('hide'));
  document.getElementById(map[scope][flow]).classList.remove('hide');
}

document.querySelectorAll('.id-tabs').forEach(group => {
  const scope = group.dataset.scope;
  group.querySelectorAll('.id-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      group.querySelectorAll('.id-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showFlow(scope, tab.dataset.idType);
    });
  });
});

// OTP toggle links
document.querySelectorAll('[data-otp]').forEach(btn => {
  btn.addEventListener('click', () => {
    const what = btn.dataset.otp;
    if (what === 'login')         showFlow('login', 'login-otp');
    if (what === 'login-back')    showFlow('login', 'mobile');
    if (what === 'register')      showFlow('register', 'register-otp');
    if (what === 'register-back') showFlow('register', 'mobile');
  });
});

async function postJSON(url, data) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(data),
  });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

const _en = () => document.documentElement.lang === 'en';
const _tt = (en, ar) => _en() ? en : ar;

// ── Login: username + password ─────────────────────────
document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const err = document.getElementById('loginError');
  err.textContent = '';
  const { ok, body } = await postJSON('/api/auth/login', {
    username: f.username.value.trim(),
    password: f.password.value,
  });
  if (ok) { window.location.href = '/portfolio'; }
  else { err.textContent = body.error || _tt('Sign-in failed', 'تعذّر تسجيل الدخول'); }
});

// ── Login: mobile + password ───────────────────────────
document.getElementById('loginMobileForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const err = document.getElementById('loginMobileError');
  err.textContent = '';
  const { ok, body } = await postJSON('/api/auth/login-mobile', {
    mobile: f.mobile.value.trim(),
    password: f.password.value,
  });
  if (ok) { window.location.href = '/portfolio'; }
  else { err.textContent = body.error || _tt('Sign-in failed', 'تعذّر تسجيل الدخول'); }
});

// ── Login: mobile + OTP ────────────────────────────────
document.getElementById('loginOtpRequestBtn')?.addEventListener('click', async () => {
  const mobile = document.getElementById('loginOtpMobile').value.trim();
  const err = document.getElementById('loginOtpError');
  err.textContent = '';
  const { ok, body } = await postJSON('/api/auth/otp/request', { mobile, purpose: 'login' });
  if (ok) {
    document.getElementById('loginOtpCodeBlock').classList.remove('hide');
  } else {
    err.textContent = body.error || _tt('Failed to send code', 'تعذّر إرسال الرمز');
  }
});
document.getElementById('loginOtpForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginOtpError');
  err.textContent = '';
  const { ok, body } = await postJSON('/api/auth/otp/verify', {
    mobile: document.getElementById('loginOtpMobile').value.trim(),
    code: document.getElementById('loginOtpCode').value.trim(),
    purpose: 'login',
  });
  if (ok) { window.location.href = '/portfolio'; }
  else { err.textContent = body.error || _tt('Verification failed', 'تعذّر التحقق'); }
});

document.getElementById('regOtpRequestBtn')?.addEventListener('click', async () => {
