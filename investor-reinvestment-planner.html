<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مخطط إعادة الاستثمار - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.planner-layout{display:grid;grid-template-columns:320px 1fr;gap:1.5rem;margin-bottom:2rem;}
.input-card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.5rem;}
.card-head h3{font-size:1rem;font-weight:700;}
.card-body{padding:1.5rem;}
.field{margin-bottom:1.2rem;}
.field label{display:block;font-size:0.83rem;font-weight:600;color:var(--green-dark);margin-bottom:0.35rem;}
.field input,.field select{width:100%;padding:0.6rem 0.9rem;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.9rem;background:#fff;color:var(--green-dark);}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);}
.slider-group{margin-bottom:1.2rem;}
.slider-group label{display:flex;justify-content:space-between;font-size:0.84rem;font-weight:600;margin-bottom:0.4rem;}
.slider-group label span{color:var(--gold);}
.slider-group input[type=range]{width:100%;accent-color:var(--green);}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.result-panel{background:linear-gradient(145deg,#062b1e 0%,#0a4d36 100%);border-radius:14px;padding:1.75rem;color:#fff;}
.result-headline{text-align:center;padding-bottom:1.25rem;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:1.25rem;}
.result-headline-label{font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:0.3rem;}
.result-headline-value{font-size:2.4rem;font-weight:700;color:#6de0a8;}
.result-headline-sub{font-size:0.78rem;color:rgba(255,255,255,0.6);margin-top:0.3rem;}
.result-rows{display:flex;flex-direction:column;gap:0;}
.res-row{display:flex;justify-content:space-between;padding:0.55rem 0;border-bottom:1px solid rgba(255,255,255,0.1);}
.res-row:last-child{border-bottom:none;}
.res-lbl{font-size:0.8rem;color:rgba(255,255,255,0.7);}
.res-val{font-size:0.86rem;font-weight:700;}
.growth-chart{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.chart-body{padding:1.25rem;}
.chart-bars-h{display:flex;align-items:flex-end;gap:0.4rem;height:120px;margin-bottom:0.5rem;}
.gc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.3rem;}
.gc-bar{width:100%;border-radius:4px 4px 0 0;}
.bar-principal{background:#3498db;}
.bar-profit{background:#6de0a8;}
.gc-lbl{font-size:0.68rem;color:var(--muted);}
.legend-row{display:flex;gap:1rem;font-size:0.76rem;color:var(--muted);padding-top:0.5rem;}
.ld{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:0.3rem;}
.deals-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
.deal-option{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:1rem;cursor:pointer;transition:border-color 0.2s;}
.deal-option:hover{border-color:var(--green);}
.deal-option.selected{border-color:var(--green);background:#f0faf4;}
.do-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
.do-title{font-size:0.88rem;font-weight:700;}
.do-badge{font-size:0.7rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:4px;background:#e8f5ed;color:#1e8449;}
.do-meta{font-size:0.76rem;color:var(--muted);}
.do-return{font-size:0.9rem;font-weight:700;color:var(--green);margin-top:0.4rem;}
@media(max-width:768px){.planner-layout{grid-template-columns:1fr;}.deals-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — مخطط إعادة الاستثمار</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>مخطط إعادة الاستثمار</h2>
    <p>خطّط لإعادة استثمار أرباحك ورأس مالك لتعظيم العوائد المركّبة</p>
  </div>

  <div class="planner-layout">
    <div class="input-card">
      <div class="card-head"><h3>إعدادات الخطة</h3></div>
      <div class="card-body">
        <div class="field">
          <label>رأس المال المتاح للاستثمار (ر.س)</label>
          <input type="number" id="capital" value="50000" step="5000" oninput="calc()">
        </div>
        <div class="field">
          <label>الأرباح الشهرية المتوقعة (ر.س)</label>
          <input type="number" id="monthlyProfit" value="500" step="100" oninput="calc()">
        </div>
        <div class="slider-group">
          <label>نسبة إعادة استثمار الأرباح <span id="reinvestLbl">٨٠</span>٪</label>
          <input type="range" id="reinvestPct" min="0" max="100" value="80" step="10" oninput="document.getElementById('reinvestLbl').textContent=this.value;calc()">
        </div>
        <div class="slider-group">
          <label>عدد السنوات <span id="yearsLbl">٥</span></label>
          <input type="range" id="years" min="1" max="10" value="5" oninput="document.getElementById('yearsLbl').textContent=this.value;calc()">
        </div>
        <div class="field">
          <label>متوسط العائد السنوي (٪)</label>
          <input type="number" id="avgReturn" value="12" step="0.5" min="5" max="25" oninput="calc()">
        </div>
        <div class="field">
          <label>استراتيجية الاستثمار</label>
          <select id="strategy" onchange="calc()">
            <option value="aggressive">نمو مكثّف</option>
            <option value="balanced" selected>متوازن</option>
            <option value="conservative">محافظ</option>
          </select>
        </div>
        <button class="btn btn-gold" style="width:100%;" onclick="saveplan()">حفظ الخطة</button>
      </div>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-headline">
        <div class="result-headline-label">إجمالي الثروة المتوقعة بعد</div>
        <div class="result-headline-value" id="totalWealth">—</div>
        <div class="result-headline-sub" id="wealthSub">خلال مدة الخطة</div>
      </div>
      <div class="result-rows" id="resultRows"></div>
    </div>
  </div>

  <div class="growth-chart">
    <div class="card-head"><h3>منحنى النمو المتوقع</h3></div>
    <div class="chart-body">
      <div class="chart-bars-h" id="growthBars"></div>
      <div class="legend-row">
        <span><span class="ld" style="background:#3498db;"></span>رأس المال</span>
        <span><span class="ld" style="background:#6de0a8;"></span>الأرباح المتراكمة</span>
      </div>
    </div>
  </div>

  <div class="card-head" style="border-radius:14px 14px 0 0;"><h3>صفقات مقترحة لإعادة الاستثمار</h3></div>
  <div style="background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:1.25rem;margin-bottom:2rem;">
    <div class="deals-grid" id="dealsGrid"></div>
  </div>
</div>

<script>
const DEAL_OPTIONS = [
  { title: 'مرابحة عقارية الرياض', badge: 'عقارات', meta: 'مدة سنتان · حد أدنى ٥٬٠٠٠ ر.س', ret: '+١٤٪ سنوياً' },
  { title: 'مرابحة تجارية جدة', badge: 'تجارة', meta: 'مدة سنة · حد أدنى ١٠٬٠٠٠ ر.س', ret: '+١٢٪ سنوياً' },
  { title: 'مرابحة صناعية الدمام', badge: 'صناعة', meta: 'مدة ١٨ شهراً · حد أدنى ٧٬٥٠٠ ر.س', ret: '+١١٪ سنوياً' },
  { title: 'مرابحة خدمات القصيم', badge: 'خدمات', meta: 'مدة سنة · حد أدنى ٥٬٠٠٠ ر.س', ret: '+١٠٪ سنوياً' }
];

function fmt(n) { return Math.round(n).toLocaleString('en'); }

function calc() {
  const capital = parseFloat(document.getElementById('capital').value) || 0;
  const monthlyProfit = parseFloat(document.getElementById('monthlyProfit').value) || 0;
  const reinvestPct = parseFloat(document.getElementById('reinvestPct').value) / 100;
  const years = parseInt(document.getElementById('years').value);
  const avgReturn = parseFloat(document.getElementById('avgReturn').value) / 100;

  let total = capital;
  let totalProfit = 0;
  const yearlyData = [];

  for (let y = 1; y <= years; y++) {
    const yearReturn = total * avgReturn;
    const reinvested = (yearReturn + monthlyProfit * 12) * reinvestPct;
    total += reinvested;
    totalProfit += yearReturn + monthlyProfit * 12;
    yearlyData.push({ capital: capital + reinvested * (y - 1), profit: totalProfit });
  }

  const totalWealth = capital + totalProfit * reinvestPct + totalProfit * (1 - reinvestPct);
  const effectiveReturn = ((totalWealth / capital - 1) / years) * 100;

  document.getElementById('totalWealth').textContent = fmt(totalWealth) + ' ر.س';
  document.getElementById('wealthSub').textContent = 'خلال ' + years + ' سنوات · عائد فعلي ' + effectiveReturn.toFixed(1) + '٪';

  const rows = document.getElementById('resultRows');
  rows.textContent = '';
  [
    { l: 'رأس المال الأصلي', v: fmt(capital) + ' ر.س' },
    { l: 'إجمالي الأرباح المتولّدة', v: fmt(totalProfit) + ' ر.س' },
    { l: 'مُعاد استثماره', v: fmt(totalProfit * reinvestPct) + ' ر.س' },
    { l: 'أرباح نقدية مسحوبة', v: fmt(totalProfit * (1 - reinvestPct)) + ' ر.س' },
    { l: 'مضاعفة رأس المال', v: (totalWealth / capital).toFixed(2) + 'x' }
  ].forEach(r => {
    const row = document.createElement('div');
    row.className = 'res-row';
    const lbl = document.createElement('span');
    lbl.className = 'res-lbl';
    lbl.textContent = r.l;
    const val = document.createElement('span');
    val.className = 'res-val';
    val.textContent = r.v;
    row.appendChild(lbl); row.appendChild(val);
    rows.appendChild(row);
  });

  buildGrowthChart(capital, totalProfit, years, reinvestPct);
}

function buildGrowthChart(capital, totalProfit, years, reinvestPct) {
  const bars = document.getElementById('growthBars');
  bars.textContent = '';
  const maxVal = capital + totalProfit;
  for (let y = 1; y <= years; y++) {
    const profitSoFar = (totalProfit / years) * y * reinvestPct;
    const capitalH = Math.round((capital / maxVal) * 100);
    const profitH = Math.round((profitSoFar / maxVal) * 100);
    const col = document.createElement('div');
    col.className = 'gc-col';
    const pBar = document.createElement('div');
    pBar.className = 'gc-bar bar-profit';
    pBar.style.height = profitH + 'px';
    const cBar = document.createElement('div');
    cBar.className = 'gc-bar bar-principal';
    cBar.style.height = capitalH + 'px';
    const lbl = document.createElement('div');
    lbl.className = 'gc-lbl';
    lbl.textContent = 'س' + y;
    col.appendChild(pBar); col.appendChild(cBar); col.appendChild(lbl);
    bars.appendChild(col);
  }
}

function buildDeals() {
  const grid = document.getElementById('dealsGrid');
  DEAL_OPTIONS.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'deal-option' + (i === 0 ? ' selected' : '');
    card.onclick = () => {
      document.querySelectorAll('.deal-option').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
    const header = document.createElement('div');
    header.className = 'do-header';
    const title = document.createElement('div');
    title.className = 'do-title';
    title.textContent = d.title;
    const badge = document.createElement('span');
    badge.className = 'do-badge';
    badge.textContent = d.badge;
    header.appendChild(title); header.appendChild(badge);
    const meta = document.createElement('div');
    meta.className = 'do-meta';
    meta.textContent = d.meta;
    const ret = document.createElement('div');
    ret.className = 'do-return';
    ret.textContent = d.ret;
    card.appendChild(header); card.appendChild(meta); card.appendChild(ret);
    grid.appendChild(card);
  });
}

function saveplan() {
  const plan = {
    capital: parseFloat(document.getElementById('capital').value),
    monthlyProfit: parseFloat(document.getElementById('monthlyProfit').value),
    reinvestPct: parseFloat(document.getElementById('reinvestPct').value),
    years: parseInt(document.getElementById('years').value),
    avgReturn: parseFloat(document.getElementById('avgReturn').value),
    strategy: document.getElementById('strategy').value
  };
  fetch('/app/me/reinvestment-planner/plans', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' },
    body: JSON.stringify(plan)
  }).catch(() => {});
  alert('تم حفظ خطة إعادة الاستثمار!');
}

buildDeals();
calc();
</script>
</body>
</html>
