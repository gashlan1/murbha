<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>جولة الترحيب — مُرابحة</title>
<meta name="description" content="دليلك الشخصي لبدء رحلتك الاستثمارية مع مُرابحة. خطوات واضحة لأوّل استثمار ناجح." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:48px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 30px Cairo,sans-serif;margin-bottom:10px;}
  .hero p{font:500 15px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .progress-bar{background:rgba(255,255,255,.15);border-radius:99px;height:6px;margin-top:20px;overflow:hidden;}
  .progress-fill{background:var(--gold);border-radius:99px;height:100%;transition:width .4s ease;}
  .step-nav{display:flex;gap:10px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;}
  .step-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font:900 13px Cairo,sans-serif;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;}
  .step-dot.done{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .step-dot.active{background:var(--gold);color:#fbf6ea;border-color:var(--gold);}
  .step-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 28px;margin-bottom:14px;}
  .step-icon{font-size:40px;margin-bottom:14px;text-align:center;}
  .step-card h2{font:900 20px Cairo,sans-serif;color:var(--green-dark);margin-bottom:10px;text-align:center;}
  .step-card > p{font:500 14px Tajawal,sans-serif;color:var(--ink);line-height:1.9;margin-bottom:12px;text-align:center;}
  .tip-box{background:var(--paper);border-radius:12px;padding:14px;border-right:3px solid var(--gold);margin:14px 0;}
  .tip-label{font:900 11px Cairo,sans-serif;color:var(--gold-light);margin-bottom:4px;}
  .tip-body{font:500 12px Tajawal,sans-serif;color:var(--muted);}
  .action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .btn-primary{background:var(--green);color:#fbf6ea;border:none;border-radius:10px;padding:12px 28px;font:700 14px Cairo,sans-serif;cursor:pointer;}
  .btn-secondary{background:var(--paper);color:var(--green);border:1px solid var(--green);border-radius:10px;padding:12px 22px;font:700 14px Cairo,sans-serif;cursor:pointer;}
  .btn-skip{background:transparent;color:var(--muted);border:none;padding:10px;font:500 12px Tajawal,sans-serif;cursor:pointer;}
  .link-card{background:var(--paper);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-top:8px;transition:background .15s;}
  .link-card:hover{background:#e8f5e9;}
  .link-card-icon{font-size:20px;}
  .link-card-text{font:700 13px Cairo,sans-serif;color:var(--green-dark);}
  .link-card-sub{font:500 11px Tajawal,sans-serif;color:var(--muted);}
  .confetti-zone{text-align:center;padding:20px 0;}
  .confetti-zone .big{font-size:48px;}
  .confetti-zone p{font:900 18px Cairo,sans-serif;color:var(--green-dark);margin:10px 0 6px;}
  .confetti-zone small{font:500 12px Tajawal,sans-serif;color:var(--muted);}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🌿 جولة الترحيب</h1>
    <p>أهلاً بك في مُرابحة. سنأخذك خلال ٦ خطوات بسيطة لتنطلق باستثمارك الأوّل بثقة.</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="step-nav" id="stepNav"></div>
  <div id="stepContainer"></div>
</main>
<script>
(function(){
  const STEPS = [
    {
      icon:'🔐',title:'التحقّق من هويّتك (KYC)',
      body:'لحماية أموالك ومطابقة متطلّبات هيئة رأس المال، نحتاج إلى التحقّق من هويّتك مرّة واحدة. العملية تستغرق ٥ دقائق.',
      tipLabel:'لماذا نطلب ذلك؟',
      tipBody:'هيئة رأس المال تشترط التحقّق من هوية كل مستثمر قبل السماح بأي معاملة مالية.',
      links:[{href:'/kyc.html',icon:'🪪',label:'ابدأ التحقّق الآن',sub:'هوية وطنية أو إقامة + صورة سيلفي'}]
    },
    {
      icon:'💰',title:'إيداع رصيدك الأوّل',
      body:'أضف رصيداً إلى محفظتك لتكون مستعدًّا للاستثمار. الحدّ الأدنى ١٠٠٠ ريال. التحويلات الآنية متاحة عبر SARIE.',
      tipLabel:'نصيحة',
      tipBody:'ابدأ بمبلغ تجريبي صغير. الاستثمار في مُرابحة لا يُلزمك باستخدام كامل الرصيد دفعةً واحدة.',
      links:[{href:'/payment.html',icon:'🏦',label:'إيداع عبر SARIE',sub:'آني بدون رسوم'}]
    },
    {
      icon:'📋',title:'اكتشف الصفقات المتاحة',
      body:'تصفّح الصفقات الحاليّة وافهم كيف يعمل كلّ مشروع. كل صفقة تشمل وثائق شريعة، عائد متوقّع، وتاريخ استحقاق.',
      tipLabel:'ماذا أبحث عنه؟',
      tipBody:'ابحث عن صفقات بنسبة اكتمال عالية والتزام جيد من الكفيل.',
      links:[
        {href:'/projects.html',icon:'🗂️',label:'تصفّح الصفقات',sub:'صفقات مرابحة مموّلة جزئيًّا'},
        {href:'/due-diligence-checklist.html',icon:'✅',label:'قائمة التحقّق قبل الاستثمار',sub:'٢٥ سؤالاً يجب أن تطرحها'}
      ]
    },
    {
      icon:'🌍',title:'وزّع محفظتك بذكاء',
      body:'لا تضع كل بيضك في سلة واحدة. مُرابحة يقترح توزيع الاستثمار على قطاعات مختلفة لتخفيض المخاطر.',
      tipLabel:'القاعدة الذهبية',
      tipBody:'لا تستثمر أكثر من ٢٠٪ من محفظتك في صفقة واحدة في البداية.',
      links:[
        {href:'/diversification.html',icon:'📊',label:'مبادئ التنويع',sub:'دليل عملي للمستثمر الجديد'},
        {href:'/risk-profile.html',icon:'⚖️',label:'تحديد ملف المخاطرة',sub:'٣ دقائق لمعرفة مستوى تحمّلك للمخاطر'}
      ]
    },
    {
      icon:'📅',title:'تعرّف على دورة التوزيع',
      body:'التوزيعات تصل شهريًّا أو في نهاية الصفقة، حسب هيكل كل مشروع. يمكنك إعادة استثمارها تلقائيًّا.',
      tipLabel:'إعادة الاستثمار',
      tipBody:'يمكنك تفعيل الاستثمار التلقائي لإعادة توظيف التوزيعات فور وصولها.',
      links:[
        {href:'/earnings-calendar.html',icon:'📆',label:'تقويم التوزيعات',sub:'اطّلع على مواعيد وتواريخ الدفع'},
        {href:'/auto-invest.html',icon:'🤖',label:'الاستثمار التلقائي',sub:'أعِد استثمار أرباحك بدون تدخّل'}
      ]
    },
    {
      icon:'🎉',title:'أنت جاهز للانطلاق!',
      body:'لقد أتممت الجولة. محفظتك في انتظارك. ابدأ بأوّل استثمار واستمتع بالعائد الشرعي.',
      tipLabel:'دعم مستمر',
      tipBody:'فريق دعم مُرابحة متاح ٧ أيام في الأسبوع عبر المحادثة الفورية.',
      links:[
        {href:'/projects.html',icon:'🚀',label:'استثمر الآن',sub:'اختر أوّل صفقة بثقة'},
        {href:'/help.html',icon:'💬',label:'تحدّث مع الدعم',sub:'نحن هنا لمساعدتك'}
      ]
    }
  ];

  let current = 0;
  let done = [];

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }

  async function loadProgress(){
    try{
      const r = await fetch('/app/me/onboarding-progress');
      if(r.ok){
        const d = await r.json();
        done = d.completedSteps || [];
        current = done.length < STEPS.length ? done.length : STEPS.length - 1;
      }
    }catch{}
  }

  async function saveProgress(step){
    try{
      await fetch('/app/me/onboarding-progress', {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},
        body:JSON.stringify({step})
      });
    }catch{}
  }

  function pct(){ return Math.round((done.length / STEPS.length) * 100); }

  function renderNav(){
    const nav = document.getElementById('stepNav');
    nav.textContent = '';
    STEPS.forEach((_,i)=>{
      const dot = document.createElement('button');
      dot.className = 'step-dot' + (done.includes(i)?' done':'') + (i===current?' active':'');
      dot.textContent = done.includes(i) ? '✓' : String(i+1);
      dot.addEventListener('click', ()=>{ current=i; render(); });
      nav.appendChild(dot);
    });
  }

  function render(){
    document.getElementById('progressFill').style.width = pct()+'%';
    renderNav();
    const container = document.getElementById('stepContainer');
    container.textContent = '';
    const s = STEPS[current];

    const card = document.createElement('div');
    card.className = 'step-card';

    const iconEl = document.createElement('div');
    iconEl.className = 'step-icon';
    iconEl.textContent = s.icon;

    const h2 = document.createElement('h2');
    h2.textContent = s.title;

    const bodyP = document.createElement('p');
    bodyP.textContent = s.body;

    const tip = document.createElement('div');
    tip.className = 'tip-box';
    const tipLabel = document.createElement('div');
    tipLabel.className = 'tip-label';
    tipLabel.textContent = s.tipLabel;
    const tipBody = document.createElement('div');
    tipBody.className = 'tip-body';
    tipBody.textContent = s.tipBody;
    tip.appendChild(tipLabel);
    tip.appendChild(tipBody);

    card.appendChild(iconEl);
    card.appendChild(h2);
    card.appendChild(bodyP);
    card.appendChild(tip);

    (s.links||[]).forEach(lk=>{
      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = lk.href;
      const ico = document.createElement('div');
      ico.className = 'link-card-icon';
      ico.textContent = lk.icon;
      const txt = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'link-card-text';
      lbl.textContent = lk.label;
      const sub = document.createElement('div');
      sub.className = 'link-card-sub';
      sub.textContent = lk.sub;
      txt.appendChild(lbl);
      txt.appendChild(sub);
      a.appendChild(ico);
      a.appendChild(txt);
      card.appendChild(a);
    });

    const actionRow = document.createElement('div');
    actionRow.className = 'action-row';

    if(current > 0){
      const prevBtn = document.createElement('button');
      prevBtn.className = 'btn-secondary';
      prevBtn.textContent = '← السابق';
      prevBtn.addEventListener('click', ()=>{ current--; render(); });
      actionRow.appendChild(prevBtn);
    }

    if(current < STEPS.length - 1){
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn-primary';
      nextBtn.textContent = 'التالي →';
      nextBtn.addEventListener('click', ()=>{
        if(!done.includes(current)) done.push(current);
        saveProgress(current);
        current++;
        render();
      });
      actionRow.appendChild(nextBtn);
      const skipBtn = document.createElement('button');
      skipBtn.className = 'btn-skip';
      skipBtn.textContent = 'تخطّي الجولة';
      skipBtn.addEventListener('click', ()=>{ window.location.href='/hessa.html'; });
      actionRow.appendChild(skipBtn);
    } else {
      const finBtn = document.createElement('button');
      finBtn.className = 'btn-primary';
      finBtn.textContent = '🎉 إنهاء الجولة';
      finBtn.addEventListener('click', ()=>{
        if(!done.includes(current)) done.push(current);
        saveProgress(current);
        render();
      });
      actionRow.appendChild(finBtn);
    }
    card.appendChild(actionRow);

    if(current === STEPS.length - 1 && done.length === STEPS.length){
      const cf = document.createElement('div');
      cf.className = 'confetti-zone';
      const big = document.createElement('div');
      big.className = 'big';
      big.textContent = '🥳';
      const cfP = document.createElement('p');
      cfP.textContent = 'أتممت الجولة بنجاح!';
      const cfSmall = document.createElement('small');
      cfSmall.textContent = 'محفظتك الاستثمارية في انتظارك. وفّقك الله.';
      cf.appendChild(big);
      cf.appendChild(cfP);
      cf.appendChild(cfSmall);
      card.appendChild(cf);
    }

    container.appendChild(card);
  }

  (async function init(){
    await loadProgress();
    render();
  }());
}());
</script>
</body>
</html>
