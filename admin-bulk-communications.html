<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرسائل الجماعية - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-secondary:hover{background:var(--green);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.kpi-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;}
.kpi-label{font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem;}
.kpi-value{font-size:1.5rem;font-weight:700;color:var(--green-dark);}
.kpi-sub{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
.compose-card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:2rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.card-body{padding:1.5rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:0.83rem;font-weight:600;color:var(--green-dark);margin-bottom:0.3rem;}
.field input,.field select,.field textarea{width:100%;padding:0.55rem 0.85rem;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.88rem;background:#fff;color:var(--green-dark);}
.field textarea{min-height:100px;resize:vertical;}
.channel-pills{display:flex;gap:0.5rem;flex-wrap:wrap;}
.channel-pill{display:flex;align-items:center;gap:0.4rem;padding:0.35rem 0.75rem;border-radius:20px;border:1.5px solid var(--line);cursor:pointer;font-size:0.82rem;font-weight:600;user-select:none;transition:all 0.2s;}
.channel-pill.selected{border-color:var(--green);background:#e6f4ef;color:var(--green);}
.audience-chip{display:inline-flex;align-items:center;gap:0.4rem;background:#e6f4ef;color:var(--green);border-radius:20px;padding:0.2rem 0.65rem;font-size:0.78rem;font-weight:600;margin:0.2rem;}
.preview-box{background:#f5f0e8;border-radius:8px;padding:1rem;font-size:0.85rem;color:var(--green-dark);line-height:1.6;min-height:60px;}
.send-footer{padding:0 1.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;}
.send-meta{font-size:0.8rem;color:var(--muted);}
.send-actions{display:flex;gap:0.75rem;}
.history-card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;}
.hist-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;}
.hist-head h3{font-size:1rem;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{text-align:right;padding:0.6rem 1rem;background:#f5f0e8;font-size:0.82rem;color:var(--muted);font-weight:600;}
td{padding:0.7rem 1rem;border-bottom:1px solid var(--line);font-size:0.86rem;}
tr:last-child td{border-bottom:none;}
.ch-badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:6px;font-size:0.7rem;font-weight:700;}
.ch-email{background:#e8f0fe;color:#1a73e8;}
.ch-sms{background:#e6f4ef;color:var(--green);}
.ch-push{background:#fff8e8;color:var(--gold);}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr;}.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — الرسائل الجماعية</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>إدارة الرسائل الجماعية</h2>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="compose-card">
    <div class="card-head"><h3>إنشاء رسالة جديدة</h3></div>
    <div class="card-body">
      <div class="two-col">
        <div>
          <div class="field">
            <label>الجمهور المستهدف</label>
            <select id="audience" onchange="updateAudienceChip()">
              <option value="all">جميع المستثمرين (٣١٢)</option>
              <option value="active">المستثمرون النشطون (١٤٢)</option>
              <option value="new">المستثمرون الجدد (٣٨)</option>
              <option value="gold">الشريحة الذهبية (٥٤)</option>
              <option value="inactive">الخاملون (٦١)</option>
            </select>
          </div>
          <div class="field">
            <label>قناة الإرسال</label>
            <div class="channel-pills" id="channelPills"></div>
          </div>
          <div class="field">
            <label>موضوع الرسالة</label>
            <input type="text" id="msgSubject" placeholder="مثال: توزيعات الربع الثاني ٢٠٢٥" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>نص الرسالة</label>
            <textarea id="msgBody" placeholder="اكتب نص الرسالة هنا..." oninput="updatePreview()"></textarea>
          </div>
          <div class="field">
            <label>جدولة الإرسال</label>
            <select id="scheduleTime">
              <option>الآن فوراً</option>
              <option>بعد ساعة</option>
              <option>غداً صباحاً ٩:٠٠</option>
              <option>تاريخ مخصص</option>
            </select>
          </div>
        </div>
        <div>
          <div class="field">
            <label>معاينة الرسالة</label>
            <div class="preview-box" id="msgPreview">ستظهر معاينة الرسالة هنا...</div>
          </div>
          <div class="field" style="margin-top:0.5rem;">
            <label>الجمهور المحدد</label>
            <div id="audienceChip"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="send-footer">
      <span class="send-meta" id="sendMeta">٣١٢ مستلم عبر البريد الإلكتروني</span>
      <div class="send-actions">
        <button class="btn btn-secondary btn-sm" onclick="saveDraft()">حفظ مسودة</button>
        <button class="btn btn-primary" onclick="sendMessage()">إرسال الرسالة</button>
      </div>
    </div>
  </div>

  <div class="history-card">
    <div class="hist-head"><h3>سجل الرسائل السابقة</h3></div>
    <table>
      <thead>
        <tr><th>الموضوع</th><th>القناة</th><th>الجمهور</th><th>تاريخ الإرسال</th><th>معدل الفتح</th><th>الحالة</th></tr>
      </thead>
      <tbody id="histTable"></tbody>
    </table>
  </div>
</div>

<script>
const kpis = [
  {label:'رسائل هذا الشهر',value:'١٢',sub:'إجمالي'},
  {label:'متوسط معدل الفتح',value:'٦٤٪',sub:''},
  {label:'إجمالي المستلمين',value:'٤,٨٢٠',sub:'هذا الشهر'},
  {label:'رسائل مجدولة',value:'٣',sub:'في الانتظار'},
];

const channels = [
  {id:'email',label:'بريد إلكتروني',icon:'✉️'},
  {id:'sms',label:'رسالة SMS',icon:'📱'},
  {id:'push',label:'إشعار تطبيق',icon:'🔔'},
];

const history = [
  {subject:'توزيعات الربع الأول ٢٠٢٥',channel:'email',audience:'جميع المستثمرين',date:'٢٠٢٥/٠٤/٠١',openRate:'٧١٪',status:'مُرسلة'},
  {subject:'تذكير: إكمال بيانات KYC',channel:'sms',audience:'غير المكتملين',date:'٢٠٢٥/٠٤/١٥',openRate:'٨٨٪',status:'مُرسلة'},
  {subject:'إطلاق صفقة محطة الطاقة',channel:'email',audience:'الشريحة الذهبية',date:'٢٠٢٥/٠٥/٠١',openRate:'٦٨٪',status:'مُرسلة'},
  {subject:'تقرير الأداء الشهري',channel:'push',audience:'جميع المستثمرين',date:'٢٠٢٥/٠٦/٠١',openRate:'٥٩٪',status:'مُرسلة'},
  {subject:'ترحيب بالمستثمرين الجدد',channel:'email',audience:'المستثمرون الجدد',date:'٢٠٢٥/٠٦/١٠',openRate:'—',status:'مجدولة'},
];

const chBadgeCls = {email:'ch-email',sms:'ch-sms',push:'ch-push'};
const chBadgeLabel = {email:'بريد',sms:'SMS',push:'إشعار'};
const audienceLabels = {all:'جميع المستثمرين (٣١٢)',active:'المستثمرون النشطون (١٤٢)',new:'المستثمرون الجدد (٣٨)',gold:'الشريحة الذهبية (٥٤)',inactive:'الخاملون (٦١)'};

let selectedChannels = new Set(['email']);

function renderKpis(){
  const row = document.getElementById('kpiRow');
  row.textContent = '';
  kpis.forEach(k => {
    const card = document.createElement('div');
    card.className = 'kpi-card';
    const lbl = document.createElement('div');
    lbl.className = 'kpi-label';
    lbl.textContent = k.label;
    const val = document.createElement('div');
    val.className = 'kpi-value';
    val.textContent = k.value;
    const sub = document.createElement('div');
    sub.className = 'kpi-sub';
    sub.textContent = k.sub;
    card.appendChild(lbl);
    card.appendChild(val);
    card.appendChild(sub);
    row.appendChild(card);
  });
}

function renderChannelPills(){
  const cont = document.getElementById('channelPills');
  cont.textContent = '';
  channels.forEach(c => {
    const pill = document.createElement('div');
    pill.className = 'channel-pill' + (selectedChannels.has(c.id) ? ' selected' : '');
    pill.textContent = c.icon + ' ' + c.label;
    pill.onclick = () => {
      if(selectedChannels.has(c.id)) selectedChannels.delete(c.id);
      else selectedChannels.add(c.id);
      renderChannelPills();
      updatePreview();
    };
    cont.appendChild(pill);
  });
}

function updateAudienceChip(){
  const val = document.getElementById('audience').value;
  const cont = document.getElementById('audienceChip');
  cont.textContent = '';
  const chip = document.createElement('span');
  chip.className = 'audience-chip';
  chip.textContent = audienceLabels[val] || val;
  cont.appendChild(chip);
  updatePreview();
}

function updatePreview(){
  const subject = document.getElementById('msgSubject').value;
  const body = document.getElementById('msgBody').value;
  const prev = document.getElementById('msgPreview');
  const audience = document.getElementById('audience').value;
  if(!subject && !body){ prev.textContent = 'ستظهر معاينة الرسالة هنا...'; return; }
  prev.textContent = (subject ? '📨 ' + subject + '\n\n' : '') + (body || '');
  document.getElementById('sendMeta').textContent =
    (audienceLabels[audience] || '') + ' · عبر ' + [...selectedChannels].map(c => chBadgeLabel[c]).join(' + ');
}

function renderHistory(){
  const tbody = document.getElementById('histTable');
  tbody.textContent = '';
  history.forEach(h => {
    const tr = document.createElement('tr');
    const subTd = document.createElement('td');
    subTd.textContent = h.subject;
    tr.appendChild(subTd);
    const chTd = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'ch-badge ' + (chBadgeCls[h.channel] || '');
    badge.textContent = chBadgeLabel[h.channel] || h.channel;
    chTd.appendChild(badge);
    tr.appendChild(chTd);
    [h.audience, h.date, h.openRate, h.status].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

async function sendMessage(){
  const subject = document.getElementById('msgSubject').value;
  const body = document.getElementById('msgBody').value;
  const audience = document.getElementById('audience').value;
  if(!subject || !body) return;
  try {
    await fetch('/app/admin/communications/send', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({subject, body, audience, channels: [...selectedChannels], schedule: document.getElementById('scheduleTime').value})
    });
  } catch(e){}
}

async function saveDraft(){
  const subject = document.getElementById('msgSubject').value;
  const body = document.getElementById('msgBody').value;
  try {
    await fetch('/app/admin/communications/drafts', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({subject, body, audience: document.getElementById('audience').value, channels: [...selectedChannels]})
    });
  } catch(e){}
}

renderKpis();
renderChannelPills();
updateAudienceChip();
renderHistory();
</script>
</body>
</html>
