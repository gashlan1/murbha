<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>لوحة الإيرادات — مُرابحة</title>
<meta name="description" content="لوحة تحكّم الإيرادات للمديرين. رسوم الإدارة، العمولات، والمقاييس المالية الشهرية." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:1080px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:620px;margin:0 auto;line-height:1.85;}
  .admin-badge{background:rgba(176,136,64,.25);color:var(--gold-light);border-radius:99px;padding:4px 14px;font:700 11px Cairo,sans-serif;display:inline-block;margin-bottom:12px;}
  .period-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .period-btn{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font:700 11px Cairo,sans-serif;color:var(--muted);cursor:pointer;}
  .period-btn.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;}
  .kpi-val{font:900 26px Cairo,sans-serif;color:var(--green-dark);margin-bottom:4px;}
  .kpi-lbl{font:500 11px Tajawal,sans-serif;color:var(--muted);}
  .kpi-delta{font:700 11px Cairo,sans-serif;margin-top:4px;}
  .kpi-delta.up{color:#2e7d32;} .kpi-delta.down{color:#c54a3a;} .kpi-delta.flat{color:var(--muted);}
  section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px;}
  section h2{font:900 18px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .rev-table{width:100%;border-collapse:collapse;font:500 12px Tajawal,sans-serif;}
  .rev-table th,.rev-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;}
  .rev-table th{background:var(--paper);font:900 11px Cairo,sans-serif;color:var(--green-dark);}
  .rev-table tfoot td{font:900 12px Cairo,sans-serif;border-top:2px solid var(--gold);}
  .bar-row{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
  .bar-label{font:700 11px Cairo,sans-serif;color:var(--green-dark);width:120px;flex-shrink:0;}
  .bar-track{flex:1;background:var(--paper);border-radius:99px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--green);}
  .bar-val{font:900 11px Cairo,sans-serif;color:var(--green-dark);width:80px;text-align:start;}
  .stream-tag{display:inline-block;border-radius:6px;padding:2px 8px;font:700 10px Cairo,sans-serif;margin-left:6px;}
  .stream-mgmt{background:#e8f5e9;color:var(--green);}
  .stream-perf{background:#fdf5e4;color:var(--gold);}
  .stream-other{background:var(--paper);color:var(--muted);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:28px 0;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="admin-badge">🔒 مشرفون فقط</div>
    <h1>📈 لوحة الإيرادات</h1>
    <p>نظرة شاملة على مصادر دخل المنصّة: رسوم الإدارة، عمولات الكفيل، والعوائد الأخرى.</p>
  </div>

  <div class="period-row" id="periodRow">
    <button class="period-btn active" data-period="this_month">هذا الشهر</button>
    <button class="period-btn" data-period="last_month">الشهر السابق</button>
    <button class="period-btn" data-period="q1">الربع الأوّل</button>
    <button class="period-btn" data-period="ytd">منذ بداية العام</button>
  </div>

  <div class="kpi-grid" id="kpiGrid">
    <p class="placeholder-msg">جارٍ التحميل…</p>
  </div>

  <section>
    <h2>📊 توزيع مصادر الإيراد</h2>
    <div id="streamsArea"><p class="placeholder-msg">جارٍ التحميل…</p></div>
  </section>

  <section>
    <h2>📋 تفاصيل الإيرادات</h2>
    <div id="tableArea"><p class="placeholder-msg">جارٍ التحميل…</p></div>
  </section>
</main>
<script>
(function(){
  let activePeriod = 'this_month';
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtK(n){ const v=Number(n||0); return v>=1000?(v/1000).toFixed(1)+'K':String(v); }

  function deltaEl(pct){
    const el = document.createElement('div');
    el.className = 'kpi-delta' + (pct>0?' up':pct<0?' down':' flat');
    el.textContent = (pct>0?'▲ ':'▼ ')+Math.abs(pct)+'٪ مقارنةً بالفترة السابقة';
    return el;
  }

  function renderKPIs(d){
    const grid = document.getElementById('kpiGrid');
    grid.textContent = '';
    const items = [
      {val:'SAR '+fmt(d.totalRevenue),lbl:'إجمالي الإيرادات',delta:d.revenueGrowth||0},
      {val:fmtK(d.mgmtFees||0)+' ر.س',lbl:'رسوم الإدارة',delta:d.mgmtGrowth||0},
      {val:fmtK(d.perfFees||0)+' ر.س',lbl:'عمولات الأداء',delta:d.perfGrowth||0},
      {val:String(d.activeDeals||0),lbl:'صفقات نشطة ومولّدة للإيراد',delta:0},
      {val:String(d.newInvestors||0),lbl:'مستثمرون جدد هذه الفترة',delta:d.investorGrowth||0},
      {val:(d.takeRate||0)+'٪',lbl:'معدّل العمولة الفعلي',delta:0},
    ];
    items.forEach(it=>{
      const card = document.createElement('div');
      card.className = 'kpi';
      const val = document.createElement('div');
      val.className = 'kpi-val';
      val.textContent = it.val;
      const lbl = document.createElement('div');
      lbl.className = 'kpi-lbl';
      lbl.textContent = it.lbl;
      card.appendChild(val);
      card.appendChild(lbl);
      if(it.delta !== 0) card.appendChild(deltaEl(it.delta));
      grid.appendChild(card);
    });
  }

  function renderStreams(d){
    const area = document.getElementById('streamsArea');
    area.textContent = '';
    const streams = d.streams || [];
    const max = Math.max(...streams.map(s=>s.amount||0), 1);
    streams.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'bar-row';
      const lbl = document.createElement('div');
      lbl.className = 'bar-label';
      lbl.textContent = s.name;
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = Math.round((s.amount/max)*100)+'%';
      fill.style.background = s.type==='perf'?'var(--gold)':s.type==='mgmt'?'var(--green)':'var(--muted)';
      track.appendChild(fill);
      const val = document.createElement('div');
      val.className = 'bar-val';
      val.textContent = fmt(s.amount)+' ر.س';
      row.appendChild(lbl);
      row.appendChild(track);
      row.appendChild(val);
      area.appendChild(row);
    });
    if(!streams.length){
      const m=document.createElement('p');m.className='placeholder-msg';m.textContent='لا توجد بيانات.';area.appendChild(m);
    }
  }

  function renderTable(d){
    const area = document.getElementById('tableArea');
    area.textContent = '';
    const rows = d.rows || [];
    if(!rows.length){
      const m=document.createElement('p');m.className='placeholder-msg';m.textContent='لا توجد تفاصيل.';area.appendChild(m);return;
    }
    const table = document.createElement('table');
    table.className = 'rev-table';
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['الصفقة','نوع الإيراد','المبلغ (ر.س)','النسبة','تاريخ الاستحقاق'].forEach(h=>{
      const th=document.createElement('th');th.textContent=h;hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody=document.createElement('tbody');
    let total=0;
    rows.forEach(row=>{
      const tr=document.createElement('tr');
      const typeLabel = row.type==='mgmt'?'رسوم إدارة':row.type==='perf'?'عمولة أداء':'أخرى';
      const typeClass = row.type==='mgmt'?'stream-mgmt':row.type==='perf'?'stream-perf':'stream-other';
      const cells=[
        row.dealName,
        null,
        fmt(row.amount),
        (row.rate||0)+'٪',
        row.dueDate?new Date(row.dueDate).toLocaleDateString('ar-SA'):'—'
      ];
      cells.forEach((v,i)=>{
        const td=document.createElement('td');
        if(i===1){
          const span=document.createElement('span');
          span.className='stream-tag '+typeClass;
          span.textContent=typeLabel;
          td.appendChild(span);
        } else {
          td.textContent=v;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
      total+=row.amount||0;
    });
    table.appendChild(tbody);
    const tfoot=document.createElement('tfoot');
    const fr=document.createElement('tr');
    ['الإجمالي','','SAR '+fmt(total),'',''].forEach(v=>{
      const td=document.createElement('td');td.textContent=v;fr.appendChild(td);
    });
    tfoot.appendChild(fr);
    table.appendChild(tfoot);
    area.appendChild(table);
  }

  async function load(){
    try{
      const r = await fetch('/app/admin/revenue-dashboard?period='+encodeURIComponent(activePeriod));
      if(!r.ok){
        ['kpiGrid','streamsArea','tableArea'].forEach(id=>{
          const el=document.getElementById(id);
          el.textContent='';
          const m=document.createElement('p');m.className='placeholder-msg';
          m.textContent=r.status===401?'يجب تسجيل الدخول كمشرف.':'تعذّر التحميل.';
          el.appendChild(m);
        });
        return;
      }
      const d = await r.json();
      renderKPIs(d);
      renderStreams(d);
      renderTable(d);
    }catch{
      ['kpiGrid','streamsArea','tableArea'].forEach(id=>{
        const el=document.getElementById(id);
        el.textContent='';
        const m=document.createElement('p');m.className='placeholder-msg';m.textContent='تعذّر التحميل. حاول لاحقاً.';
        el.appendChild(m);
      });
    }
  }

  document.querySelectorAll('.period-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activePeriod=btn.dataset.period;
      load();
    });
  });

  load();
}());
</script>
</body>
</html>
