<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل المحفظة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.balance-card{background:linear-gradient(135deg,#062b1e 0%,#0a4d36 100%);border-radius:16px;padding:2rem;color:#fff;margin-bottom:2rem;}
.balance-label{font-size:0.82rem;color:rgba(255,255,255,0.7);margin-bottom:0.35rem;}
.balance-amount{font-size:2.8rem;font-weight:700;color:#6de0a8;}
.balance-sub{font-size:0.82rem;color:rgba(255,255,255,0.65);margin-top:0.25rem;margin-bottom:1.5rem;}
.balance-row{display:flex;gap:2rem;flex-wrap:wrap;}
.balance-item{border-right:1px solid rgba(255,255,255,0.15);padding-right:2rem;}
.balance-item:first-child{border-right:none;padding-right:0;}
.bi-label{font-size:0.75rem;color:rgba(255,255,255,0.65);}
.bi-val{font-size:1.1rem;font-weight:700;margin-top:0.2rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.btn-white{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);}
.balance-btns{margin-top:1.25rem;display:flex;gap:0.75rem;}
.filters-bar{background:#fff;border-radius:12px;border:1px solid var(--line);padding:0.9rem 1.25rem;display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;}
.filters-bar select{padding:0.45rem 0.75rem;border:1.5px solid var(--line);border-radius:7px;font-family:'Cairo',sans-serif;font-size:0.85rem;background:#fff;color:var(--green-dark);}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.tx-list{padding:0.5rem 0;}
.tx-item{display:flex;align-items:center;gap:1rem;padding:0.85rem 1.25rem;border-bottom:1px solid var(--line);}
.tx-item:last-child{border-bottom:none;}
.tx-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.icon-in{background:#e8f5ed;}
.icon-out{background:#fde8e8;}
.icon-profit{background:#fef3cd;}
.icon-fee{background:#f0ebe0;}
.tx-info{flex:1;}
.tx-desc{font-size:0.88rem;font-weight:600;}
.tx-date{font-size:0.76rem;color:var(--muted);margin-top:0.15rem;}
.tx-ref{font-size:0.72rem;color:var(--muted);}
.tx-amount{font-size:0.95rem;font-weight:700;text-align:left;flex-shrink:0;}
.amt-in{color:#27ae60;}
.amt-out{color:#e74c3c;}
.amt-profit{color:var(--gold);}
.amt-fee{color:var(--muted);}
.tx-balance{font-size:0.74rem;color:var(--muted);margin-top:0.15rem;text-align:left;}
.load-more{display:flex;justify-content:center;padding:1rem;}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — سجل المحفظة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>سجل المحفظة والمعاملات</h2>
    <p>جميع عمليات الإيداع والسحب وتوزيعات الأرباح</p>
  </div>

  <div class="balance-card">
    <div class="balance-label">الرصيد المتاح</div>
    <div class="balance-amount">٨٬٦٢٠ ر.س</div>
    <div class="balance-sub">محفظتك الإلكترونية في مُرابحة</div>
    <div class="balance-row">
      <div class="balance-item">
        <div class="bi-label">إجمالي المستثمر</div>
        <div class="bi-val">١٢٥٬٠٠٠ ر.س</div>
      </div>
      <div class="balance-item">
        <div class="bi-label">أرباح محقّقة</div>
        <div class="bi-val" style="color:#6de0a8;">١٤٬٢٠٠ ر.س</div>
      </div>
      <div class="balance-item">
        <div class="bi-label">قيد الاعتراض</div>
        <div class="bi-val">—</div>
      </div>
    </div>
    <div class="balance-btns">
      <button class="btn btn-primary btn-sm" onclick="topUp()">إيداع</button>
      <button class="btn btn-white btn-sm" onclick="withdraw()">سحب</button>
    </div>
  </div>

  <div class="filters-bar">
    <select id="filterType" onchange="applyFilter()">
      <option value="">جميع العمليات</option>
      <option value="in">إيداع</option>
      <option value="out">سحب</option>
      <option value="profit">أرباح</option>
      <option value="fee">رسوم</option>
    </select>
    <select id="filterMonth" onchange="applyFilter()">
      <option value="">كل الأشهر</option>
      <option value="6">يونيو ٢٠٢٦</option>
      <option value="5">مايو ٢٠٢٦</option>
      <option value="4">أبريل ٢٠٢٦</option>
      <option value="3">مارس ٢٠٢٦</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="exportHistory()">تصدير PDF</button>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>سجل المعاملات</h3>
      <span id="txCount" style="font-size:0.82rem;color:rgba(255,255,255,0.7);"></span>
    </div>
    <div class="tx-list" id="txList"></div>
    <div class="load-more">
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green);font-weight:600;" onclick="loadMore()">تحميل المزيد</button>
    </div>
  </div>
</div>

<script>
const TRANSACTIONS = [
  { type: 'profit', icon: '💰', desc: 'توزيع ربح — صفقة المرابحة #4801', date: '١٠ يونيو ٢٠٢٦', ref: 'PRF-8821', amount: '+١٬٢٥٠ ر.س', balance: 'الرصيد: ٨٬٦٢٠ ر.س', month: 6 },
  { type: 'in', icon: '⬇️', desc: 'إيداع من البنك الأهلي', date: '٥ يونيو ٢٠٢٦', ref: 'DEP-7741', amount: '+٥٬٠٠٠ ر.س', balance: 'الرصيد: ٧٬٣٧٠ ر.س', month: 6 },
  { type: 'out', icon: '⬆️', desc: 'استثمار في صفقة #4892', date: '٣ يونيو ٢٠٢٦', ref: 'INV-9912', amount: '-١٥٬٠٠٠ ر.س', balance: 'الرصيد: ٢٬٣٧٠ ر.س', month: 6 },
  { type: 'fee', icon: '📋', desc: 'رسوم إدارية ربع سنوية', date: '١ يونيو ٢٠٢٦', ref: 'FEE-٣٣١', amount: '-١٢٠ ر.س', balance: 'الرصيد: ١٧٬٣٧٠ ر.س', month: 6 },
  { type: 'profit', icon: '💰', desc: 'توزيع ربح — صفقة المرابحة #4755', date: '١٥ مايو ٢٠٢٦', ref: 'PRF-8710', amount: '+٩٨٠ ر.س', balance: 'الرصيد: ١٧٬٤٩٠ ر.س', month: 5 },
  { type: 'in', icon: '⬇️', desc: 'إيداع من بنك الراجحي', date: '٢ مايو ٢٠٢٦', ref: 'DEP-7600', amount: '+١٠٬٠٠٠ ر.س', balance: 'الرصيد: ١٦٬٥١٠ ر.س', month: 5 },
  { type: 'out', icon: '⬆️', desc: 'سحب إلى الحساب البنكي', date: '٢٨ أبريل ٢٠٢٦', ref: 'WTH-٤٤١١', amount: '-٨٬٠٠٠ ر.س', balance: 'الرصيد: ٦٬٥١٠ ر.س', month: 4 },
  { type: 'profit', icon: '💰', desc: 'توزيع ربح — صفقة المرابحة #4690', date: '١٢ أبريل ٢٠٢٦', ref: 'PRF-٨٦٠٠', amount: '+٧٥٠ ر.س', balance: 'الرصيد: ١٤٬٥١٠ ر.س', month: 4 }
];

const TYPE_ICON_CLASS = { in: 'icon-in', out: 'icon-out', profit: 'icon-profit', fee: 'icon-fee' };
const AMT_CLASS = { in: 'amt-in', out: 'amt-out', profit: 'amt-profit', fee: 'amt-fee' };

let filtered = [...TRANSACTIONS];

function applyFilter() {
  const type = document.getElementById('filterType').value;
  const month = parseInt(document.getElementById('filterMonth').value) || 0;
  filtered = TRANSACTIONS.filter(t =>
    (!type || t.type === type) &&
    (!month || t.month === month)
  );
  renderList();
}

function renderList() {
  const list = document.getElementById('txList');
  list.textContent = '';
  document.getElementById('txCount').textContent = filtered.length + ' معاملة';
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.textAlign = 'center';
    empty.style.padding = '2rem';
    empty.style.color = 'var(--muted)';
    empty.style.fontSize = '0.88rem';
    empty.textContent = 'لا توجد معاملات بهذه الفلاتر';
    list.appendChild(empty);
    return;
  }
  filtered.forEach(t => {
    const item = document.createElement('div');
    item.className = 'tx-item';

    const icon = document.createElement('div');
    icon.className = 'tx-icon ' + (TYPE_ICON_CLASS[t.type] || '');
    icon.textContent = t.icon;

    const info = document.createElement('div');
    info.className = 'tx-info';
    const desc = document.createElement('div');
    desc.className = 'tx-desc';
    desc.textContent = t.desc;
    const date = document.createElement('div');
    date.className = 'tx-date';
    date.textContent = t.date;
    const ref = document.createElement('div');
    ref.className = 'tx-ref';
    ref.textContent = 'مرجع: ' + t.ref;
    info.appendChild(desc);
    info.appendChild(date);
    info.appendChild(ref);

    const amtWrap = document.createElement('div');
    const amt = document.createElement('div');
    amt.className = 'tx-amount ' + (AMT_CLASS[t.type] || '');
    amt.textContent = t.amount;
    const bal = document.createElement('div');
    bal.className = 'tx-balance';
    bal.textContent = t.balance;
    amtWrap.appendChild(amt);
    amtWrap.appendChild(bal);

    item.appendChild(icon);
    item.appendChild(info);
    item.appendChild(amtWrap);
    list.appendChild(item);
  });
}

function topUp() {
  window.location.href = 'wallet-topup.html';
}

function withdraw() {
  window.location.href = 'withdrawal-request.html';
}

function loadMore() {
  fetch('/app/me/wallet/history?page=2')
    .then(r => r.json())
    .catch(() => {});
  alert('تم تحميل المزيد من المعاملات (وضع عرض)');
}

function exportHistory() {
  fetch('/app/me/wallet/history/export')
    .then(r => r.json())
    .catch(() => {});
  alert('جاري تنزيل PDF...');
}

applyFilter();
</script>
</body>
</html>
