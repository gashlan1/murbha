[build]
  publish = "."
  command = "npm install"

[build.environment]
  NODE_ENV = "production"

[[redirects]]
  from = "/"
  to = "/hessa.html"
  status = 200

[[redirects]]
  from = "/home"
  to = "/hessa.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/project"
  to = "/project.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/auth.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/auth.html?mode=register"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/auth.html?mode=register"
  status = 200

[[redirects]]
  from = "/notifications"
  to = "/notifications.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/help.html"
  status = 200

[[redirects]]
  from = "/contract"
  to = "/contract.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/risk"
  to = "/risk.html"
  status = 200

[[redirects]]
  from = "/sharia"
  to = "/sharia.html"
  status = 200

[[redirects]]
  from = "/aml"
  to = "/aml.html"
  status = 200

[[redirects]]
  from = "/kyc"
  to = "/kyc.html"
  status = 200

[[redirects]]
  from = "/complaints"
  to = "/complaints.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/shared.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/shared.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
