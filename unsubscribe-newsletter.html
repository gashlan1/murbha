<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>إلغاء الاشتراك من النشرة — مُرابحة</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { font-family:Tajawal,system-ui,sans-serif; background:#fbf6ea; color:#0d1612; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; margin:0; }
  .card { max-width:460px; width:100%; background:#fff; border:1px solid rgba(13,22,18,0.08); border-radius:18px; padding:28px; text-align:center; box-shadow:0 4px 24px rgba(13,22,18,0.05); }
  h1 { font:900 22px Cairo,sans-serif; color:#062b1e; margin-bottom:8px; }
  p { color:#6b7268; line-height:1.8; margin-bottom:18px; font-size:14px; }
  input { width:100%; padding:13px 16px; border:1.5px solid rgba(13,22,18,0.15); border-radius:12px; font:600 14px Tajawal,sans-serif; color:#0d1612; direction:ltr; text-align:start; margin-bottom:12px; }
  input:focus { outline:0; border-color:#b08840; }
  button { width:100%; padding:13px; background:#062b1e; color:#fbf6ea; border:0; border-radius:999px; font:800 14px Cairo,sans-serif; cursor:pointer; }
  button:hover { background:#0a4d36; }
  button[disabled] { opacity:0.6; cursor:default; }
  #msg { margin-top:12px; font-size:13px; min-height:18px; }
  #msg.ok { color:#0f6e3a; }
  #msg.err { color:#c54a3a; }
  .links { margin-top:18px; font-size:13px; }
  .links a { color:#062b1e; font-weight:700; text-decoration:none; }
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<div class="card">
  <h1>إلغاء الاشتراك من النشرة</h1>
  <p>سيتم إيقاف إرسال أي نشرات جديدة إلى بريدك. لن يؤثّر ذلك على إشعارات الحساب أو الإيصالات.</p>
  <form id="unsubForm">
    <input id="email" type="email" required placeholder="your@email.com" autocomplete="email" />
    <button type="submit" id="submitBtn">إلغاء الاشتراك</button>
  </form>
  <div id="msg"></div>
  <div class="links">
    <a href="/">العودة إلى الرئيسية</a>
  </div>
</div>
<script>
const form = document.getElementById('unsubForm');
const emailIn = document.getElementById('email');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

const qs = new URLSearchParams(location.search);
if (qs.get('email')) emailIn.value = qs.get('email');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailIn.value.trim();
  if (!email) return;
  msg.textContent = ''; msg.className = '';
  submitBtn.disabled = true; submitBtn.textContent = 'جارٍ المعالجة…';
  try {
    const r = await fetch('/app/newsletter/unsubscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      msg.className = 'ok';
      msg.textContent = d.removed ? '✓ تم إلغاء اشتراكك بنجاح.' : 'لا يوجد اشتراك مسجّل لهذا البريد.';
      form.style.display = 'none';
    } else {
      msg.className = 'err';
      msg.textContent = d.error === 'invalid_email' ? 'البريد غير صحيح' : 'تعذّر إلغاء الاشتراك';
      submitBtn.disabled = false; submitBtn.textContent = 'إلغاء الاشتراك';
    }
  } catch (err) {
    msg.className = 'err'; msg.textContent = 'تعذّر الاتصال — حاول لاحقاً.';
    submitBtn.disabled = false; submitBtn.textContent = 'إلغاء الاشتراك';
  }
});
</script>
</body>
</html>
