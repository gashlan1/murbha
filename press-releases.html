<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>البيانات الصحفية — مُرابحة</title>
<meta name="description" content="أرشيف البيانات الصحفية لمنصة مُرابحة منذ الإطلاق." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root {
    --ink: #0d1612; --paper: #fbf6ea; --green-dark: #062b1e; --green: #0a4d36;
    --gold: #b08840; --muted: #6b7268; --line: rgba(13,22,18,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal',system-ui,sans-serif; background: var(--paper); color: var(--ink); }
  main { max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; }
  .hero { background: linear-gradient(135deg,#062b1e,#0a4d36); color: #fbf6ea; border-radius: 22px; padding: 36px 26px; margin-bottom: 22px; text-align: center; }
  .hero h1 { font: 900 28px Cairo,sans-serif; margin-bottom: 8px; }
  .hero p { font: 500 14px Tajawal,sans-serif; opacity: 0.92; max-width: 540px; margin: 0 auto; line-height: 1.85; }
  .filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; justify-content: center; }
  .chip { padding: 6px 14px; border: 1px solid var(--line); background: #fff; color: var(--green-dark); font: 800 11px Cairo,sans-serif; border-radius: 999px; cursor: pointer; }
  .chip.active { background: var(--green-dark); color: #d4ac6e; border-color: var(--green-dark); }
  .release { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; transition: transform 0.15s; text-decoration: none; color: inherit; display: block; }
  .release:hover { transform: translateX(-3px); border-color: var(--gold); }
  .release .date { font: 800 11px Cairo,sans-serif; color: var(--gold); letter-spacing: 1px; margin-bottom: 6px; }
  .release h2 { font: 900 15px Cairo,sans-serif; color: var(--green-dark); margin-bottom: 6px; }
  .release p { font: 500 13px Tajawal,sans-serif; color: var(--muted); line-height: 1.85; }
  .release .meta { font: 600 11px Tajawal,sans-serif; color: var(--muted); margin-top: 8px; display: flex; gap: 12px; }
  .contact { background: linear-gradient(135deg,#0a4d36,#062b1e); color: #d4ac6e; padding: 24px; border-radius: 16px; text-align: center; margin-top: 18px; }
  .contact h2 { color: #fbf6ea; font: 900 18px Cairo,sans-serif; margin-bottom: 6px; }
  .contact a { color: #d4ac6e; font-weight: 900; text-decoration: none; }
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <a href="/press.html" style="display:inline-block;font:800 12px Cairo,sans-serif;color:var(--green-dark);text-decoration:none;margin-bottom:14px;">← العودة لحزمة الإعلام</a>
  <div class="hero">
    <h1>البيانات الصحفية</h1>
    <p>أرشيف رسمي لكل البيانات الصحفية والإعلانات الكبرى لمنصة مُرابحة منذ الإطلاق.</p>
  </div>

  <div class="filter" id="filters">
    <button class="chip active" data-y="all">الكل</button>
    <button class="chip" data-y="2026">٢٠٢٦</button>
    <button class="chip" data-y="2025">٢٠٢٥</button>
    <button class="chip" data-y="2024">٢٠٢٤</button>
    <button class="chip" data-y="2023">٢٠٢٣</button>
  </div>

  <div id="list"></div>

  <div class="contact">
    <h2>📞 للاستفسارات الإعلامية</h2>
    <p style="color:#fbf6ea;opacity:0.9;font:500 13px Tajawal,sans-serif;margin-bottom:14px;line-height:1.85;">تواصل مع فريق العلاقات العامة مباشرة:</p>
    <a href="mailto:press@murabaha.example.sa">press@murabaha.example.sa</a>
  </div>
</main>
<script src="/app.js" defer></script>
<script>
(() => {
  const PR = [
    { year: 2026, date: '٢٠٢٦-٠٦-٠١', title: 'مُرابحة تتجاوز ١٥٬٠٠٠ مستثمر سعودي', body: 'بعد ٣٦ شهراً من الإطلاق الرسمي، تجاوزت قاعدة المستخدمين النشطين ١٥ ألف مستثمر، باستثمارات تراكمية تخطّت ١٥٠ مليون ر.س.', tags: ['مرحلة', 'نمو'] },
    { year: 2026, date: '٢٠٢٦-٠٣-١٢', title: 'إطلاق ميزة الاستثمار التلقائي', body: 'وفرت المنصة ميزة جديدة تتيح للمستثمرين وضع معايير استثمار مسبقة تُنفّذ تلقائياً عند توفّر صفقات مطابقة.', tags: ['منتج'] },
    { year: 2025, date: '٢٠٢٥-١٢-١٨', title: 'إغلاق صفقة الـ٤٢: روشن المرحلة الثالثة', body: 'أُغلقت الصفقة الـ٤٢ على المنصة بتمويل كامل ٨ مليون ر.س من ٨٤٧ مستثمراً خلال ١٢ يوماً فقط.', tags: ['صفقة'] },
    { year: 2025, date: '٢٠٢٥-١٠-٠٥', title: 'تجديد عضوية البيئة التجريبية لساما', body: 'حصلت المنصة على تجديد عضويتها للسنة الثالثة على التوالي ضمن البيئة التجريبية التشريعية للبنك المركزي السعودي.', tags: ['تنظيمي'] },
    { year: 2025, date: '٢٠٢٥-٠٧-٢٠', title: 'شراكة مع PwC السعودية للمراجعة المالية', body: 'وقّعت المنصة شراكة استراتيجية مع PwC لإجراء مراجعة مالية مستقلة سنوية شاملة، تعزيزاً للحوكمة.', tags: ['شراكة'] },
    { year: 2024, date: '٢٠٢٤-١١-١٤', title: 'تجاوز ١٠٠ مليون ر.س استثمار تراكمي', body: 'بلغ مجموع الاستثمارات على المنصة ١٠٠ مليون ر.س عبر ٢٨ صفقة مكتملة، بمتوسط عائد سنوي ٩٫٤٪.', tags: ['مرحلة'] },
    { year: 2024, date: '٢٠٢٤-٠٦-٠٢', title: 'إطلاق تطبيق الجوال (PWA)', body: 'أتاحت المنصة تجربة جوال كاملة مع إشعارات فورية، مصادقة بيومترية، ودعم العمل دون إنترنت.', tags: ['منتج'] },
    { year: 2024, date: '٢٠٢٤-٠٢-١٠', title: 'انضمام د. منيرة آل سعد للهيئة الشرعية', body: 'انضمّت د. منيرة آل سعد، الباحثة في فقه التمويل الإسلامي، كعضو ثالث في الهيئة الشرعية المستقلّة.', tags: ['تعيين'] },
    { year: 2023, date: '٢٠٢٣-١٢-٠٥', title: 'إغلاق الجولة التأسيسية بقيمة ٢٠ مليون ر.س', body: 'أغلقت مُرابحة جولة استثمار تأسيسية بقيمة ٢٠ مليون ر.س لتوسيع الفريق والتقنية.', tags: ['تمويل'] },
    { year: 2023, date: '٢٠٢٣-٠٦-٢٥', title: 'الإطلاق العام للمنصة', body: 'بعد ٦ أشهر من الإطلاق التجريبي، فُتح التسجيل لجميع السعوديين والمقيمين البالغين.', tags: ['إطلاق'] },
    { year: 2023, date: '٢٠٢٣-٠١-١٥', title: 'الإطلاق التجريبي مع ١٠٠ مستثمر مدعوّ', body: 'انطلقت أول مرحلة تجريبية مع مجموعة منتقاة من ١٠٠ مستثمر، مع إغلاق أول صفقة عقارية في ٤٨ ساعة.', tags: ['إطلاق'] },
  ];
  const list = document.getElementById('list');
  let cur = 'all';
  const render = () => {
    list.replaceChildren();
    const items = PR.filter(p => cur === 'all' || String(p.year) === cur);
    items.forEach(p => {
      const a = document.createElement('a'); a.className = 'release'; a.href = '#';
      const d = document.createElement('div'); d.className = 'date'; d.textContent = p.date;
      const h = document.createElement('h2'); h.textContent = p.title;
      const b = document.createElement('p'); b.textContent = p.body;
      const m = document.createElement('div'); m.className = 'meta';
      p.tags.forEach(t => { const s = document.createElement('span'); s.textContent = '#' + t; m.appendChild(s); });
      a.append(d, h, b, m);
      list.appendChild(a);
    });
    if (!items.length) {
      const e = document.createElement('div');
      e.style.cssText = 'text-align:center;padding:30px;color:var(--muted);';
      e.textContent = 'لا توجد بيانات في هذه السنة.';
      list.appendChild(e);
    }
  };
  document.querySelectorAll('#filters .chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#filters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active'); cur = c.dataset.y; render();
    });
  });
  render();
})();
</script>
</body>
</html>
