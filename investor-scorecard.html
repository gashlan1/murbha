<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>بطاقة المستثمر — مُرابحة</title>
<meta name="description" content="ملفّك الاستثماري الكامل — درجاتك، ومستواك، وإنجازاتك على منصّة مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root { --ink:#0d1612; --paper:#fbf6ea; --green-dark:#062b1e; --green:#0a4d36; --gold:#b08840; --gold-light:#d4ac6e; --muted:#6b7268; --line:rgba(13,22,18,0.10); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Tajawal',system-ui,sans-serif; background:var(--paper); color:var(--ink); }
  main { max-width:880px; margin:0 auto; padding:28px 18px 60px; }
  .card-hero { background:linear-gradient(135deg,#062b1e,#0a4d36); color:#fbf6ea; border-radius:22px; padding:36px 22px; margin-bottom:22px; text-align:center; position:relative; overflow:hidden; }
  .card-hero::before { content:''; position:absolute; inset:0; background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='20' cy='20' r='10'/%3E%3C/g%3E%3C/svg%3E"); }
  .avatar { width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 12px; border:3px solid rgba(212,172,110,0.6); }
  .card-name { font:900 22px Cairo,sans-serif; margin-bottom:4px; }
  .card-level { display:inline-block; background:var(--gold); color:#062b1e; border-radius:20px; padding:4px 16px; font:900 12px Cairo,sans-serif; margin-bottom:12px; }
  .card-since { font:500 11px Tajawal,sans-serif; opacity:0.75; }
  section { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:14px; }
  section h2 { font:900 18px Cairo,sans-serif; color:var(--green-dark); margin-bottom:12px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .score-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .score-card { background:var(--paper); border-radius:12px; padding:14px; text-align:center; border:1px solid var(--line); }
  .score-num { font:900 24px Cairo,sans-serif; color:var(--green-dark); }
  .score-max { font:500 11px Tajawal,sans-serif; color:var(--muted); }
  .score-lbl { font:500 10px Tajawal,sans-serif; color:var(--muted); margin-top:3px; }
  .score-bar-wrap { height:6px; background:var(--line); border-radius:999px; margin-top:8px; overflow:hidden; }
  .score-bar { height:100%; border-radius:999px; background:var(--green); transition:width .7s ease; }
  .badge-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .badge-item { text-align:center; padding:12px 8px; background:var(--paper); border-radius:12px; border:1px solid var(--line); }
  .badge-item.earned { border-color:var(--gold); background:#fdf5e4; }
  .badge-item.earned .badge-icon { filter:none; }
  .badge-icon { font-size:28px; filter:grayscale(1) opacity(0.35); }
  .badge-item.earned .badge-icon { filter:none; }
  .badge-name { font:700 10px Cairo,sans-serif; color:var(--muted); margin-top:5px; }
  .badge-item.earned .badge-name { color:var(--gold); }
  .milestones { display:grid; gap:7px; }
  .milestone { display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:10px; padding:10px 12px; }
  .ms-check { font-size:16px; flex-shrink:0; }
  .ms-body { flex:1; }
  .ms-name { font:900 12px Cairo,sans-serif; color:var(--green-dark); }
  .ms-desc { font:500 10px Tajawal,sans-serif; color:var(--muted); margin-top:1px; }
  .ms-pts { font:900 11px Cairo,sans-serif; color:var(--gold); white-space:nowrap; }
  .placeholder-msg { font:500 13px Tajawal,sans-serif; color:var(--muted); text-align:center; padding:28px 0; }
  @media(max-width:540px){ .score-grid{grid-template-columns:1fr 1fr;} .badge-grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>
<main>
  <div class="card-hero">
    <div class="avatar" id="cardAvatar">👤</div>
    <div class="card-name" id="cardName">جارٍ التحميل…</div>
    <div class="card-level" id="cardLevel">—</div>
    <div class="card-since" id="cardSince"></div>
  </div>

  <section>
    <h2>🎯 درجات الأداء</h2>
    <div class="score-grid" id="scoreGrid">
      <div class="score-card">
        <div class="score-num" id="scActivity">—</div>
        <div class="score-max">/١٠٠</div>
        <div class="score-lbl">النشاط الاستثماري</div>
        <div class="score-bar-wrap"><div class="score-bar" id="barActivity" style="width:0"></div></div>
      </div>
      <div class="score-card">
        <div class="score-num" id="scDiversity">—</div>
        <div class="score-max">/١٠٠</div>
        <div class="score-lbl">التنويع القطاعي</div>
        <div class="score-bar-wrap"><div class="score-bar" id="barDiversity" style="width:0"></div></div>
      </div>
      <div class="score-card">
        <div class="score-num" id="scLoyalty">—</div>
        <div class="score-max">/١٠٠</div>
        <div class="score-lbl">الولاء والالتزام</div>
        <div class="score-bar-wrap"><div class="score-bar" id="barLoyalty" style="width:0"></div></div>
      </div>
    </div>
  </section>

  <section>
    <h2>🏆 الشارات المكتسبة</h2>
    <div class="badge-grid" id="badgeGrid">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>

  <section>
    <h2>📌 معالم الرحلة</h2>
    <div class="milestones" id="milestoneList">
      <p class="placeholder-msg">جارٍ التحميل…</p>
    </div>
  </section>
</main>
<script>
(function () {
  function fmtDate(s) { return s ? new Date(s).toLocaleDateString('ar-SA', { year:'numeric', month:'long' }) : '—'; }

  const BADGES_DEF = [
    { id:'first_investment', icon:'🌱', name:'أوّل خطوة' },
    { id:'five_deals', icon:'⭐', name:'خمس صفقات' },
    { id:'diversified', icon:'🌐', name:'محفظة متنوّعة' },
    { id:'year_one', icon:'🎂', name:'سنة كاملة' },
    { id:'referrer', icon:'🤝', name:'سفير الإحالة' },
    { id:'early_bird', icon:'🐦', name:'المبادر الأوّل' },
    { id:'big_ticket', icon:'💎', name:'مستثمر كبير' },
    { id:'full_kyc', icon:'✅', name:'هويّة مكتملة' },
  ];

  const MILESTONES_DEF = [
    { id:'reg', icon:'✅', name:'تسجيل الحساب', desc:'انضمّ إلى مُرابحة', pts:50 },
    { id:'kyc', icon:'🪪', name:'إتمام KYC', desc:'تحقّق من الهويّة', pts:100 },
    { id:'inv1', icon:'💰', name:'أوّل استثمار', desc:'صفقة واحدة مكتملة', pts:200 },
    { id:'inv5', icon:'🌟', name:'٥ استثمارات', desc:'خمس صفقات أو أكثر', pts:400 },
    { id:'div3', icon:'🗂️', name:'٣ قطاعات', desc:'تنويع في ٣ قطاعات مختلفة', pts:300 },
    { id:'ref1', icon:'🎁', name:'أوّل إحالة', desc:'أحال مستثمراً جديداً', pts:150 },
  ];

  (async function load() {
    try {
      const r = await fetch('/app/me/investor-scorecard');
      if (!r.ok) {
        document.getElementById('cardName').textContent = 'يجب تسجيل الدخول.';
        return;
      }
      const d = await r.json();

      document.getElementById('cardName').textContent = d.fullName || d.name || 'مستثمر مُرابحة';
      document.getElementById('cardLevel').textContent = d.level || 'مستثمر ناشئ';
      document.getElementById('cardSince').textContent = 'عضو منذ ' + fmtDate(d.memberSince);

      const setScore = (id, barId, val) => {
        document.getElementById(id).textContent = val;
        setTimeout(() => { document.getElementById(barId).style.width = Math.min(val, 100) + '%'; }, 100);
      };
      setScore('scActivity', 'barActivity', d.scores?.activity || 0);
      setScore('scDiversity', 'barDiversity', d.scores?.diversity || 0);
      setScore('scLoyalty', 'barLoyalty', d.scores?.loyalty || 0);

      const badgeGrid = document.getElementById('badgeGrid');
      badgeGrid.textContent = '';
      const earned = new Set(d.badges || []);
      BADGES_DEF.forEach(b => {
        const div = document.createElement('div');
        div.className = 'badge-item' + (earned.has(b.id) ? ' earned' : '');
        const icon = document.createElement('div');
        icon.className = 'badge-icon';
        icon.textContent = b.icon;
        const name = document.createElement('div');
        name.className = 'badge-name';
        name.textContent = b.name;
        div.appendChild(icon);
        div.appendChild(name);
        badgeGrid.appendChild(div);
      });

      const mslist = document.getElementById('milestoneList');
      mslist.textContent = '';
      const done = new Set(d.milestones || []);
      MILESTONES_DEF.forEach(ms => {
        const isDone = done.has(ms.id);
        const row = document.createElement('div');
        row.className = 'milestone';
        const check = document.createElement('div');
        check.className = 'ms-check';
        check.textContent = isDone ? '✅' : '⬜';
        const body = document.createElement('div');
        body.className = 'ms-body';
        const nm = document.createElement('div');
        nm.className = 'ms-name';
        nm.textContent = ms.name;
        nm.style.opacity = isDone ? '1' : '0.5';
        const desc = document.createElement('div');
        desc.className = 'ms-desc';
        desc.textContent = ms.desc;
        body.appendChild(nm);
        body.appendChild(desc);
        const pts = document.createElement('div');
        pts.className = 'ms-pts';
        pts.textContent = '+' + ms.pts + ' نقطة';
        pts.style.opacity = isDone ? '1' : '0.4';
        row.appendChild(check);
        row.appendChild(body);
        row.appendChild(pts);
        mslist.appendChild(row);
      });
    } catch {
      document.getElementById('cardName').textContent = 'تعذّر التحميل.';
    }
  }());
}());
</script>
</body>
</html>
