<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#062b1e" />
<meta name="color-scheme" content="light only" />
<title>إنشاء حساب جديد — مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="app.js"></script>
<style>
:root {
  color-scheme: light only;
  --ink: #0d1612;
  --paper: #fbf6ea;
  --paper-2: #efe8d6;
  --green: #0a4d36;
  --green-dark: #062b1e;
  --gold: #b08840;
  --gold-light: #d4ac6e;
  --gold-soft: #e8d3a8;
  --muted: #6b7268;
  --line: rgba(13,22,18,0.10);
  --line-strong: rgba(13,22,18,0.20);
  --red: #b54935;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #fbf6ea; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Tajawal', 'Geeza Pro', system-ui, sans-serif;
  background: linear-gradient(180deg, #fbf6ea 0%, #efe8d6 100%) !important;
  color: #0d1612;
  line-height: 1.55;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bot);
}
button, a { font-family: inherit; touch-action: manipulation; }
.auth-wrap { min-height: 100vh; display: flex; flex-direction: column; padding: 14px 18px 24px; max-width: 480px; margin: 0 auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.back-btn {
  width: 40px; height: 40px; border-radius: 50%; background: rgba(13,22,18,0.05); border: none;
  display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; text-decoration: none;
}
.back-btn:active { transform: scale(0.92); }
.help-btn { background: transparent; border: none; color: var(--gold); font-size: 14px; font-weight: 700; text-decoration: none; padding: 8px; }
.auth-logo { text-align: center; margin-bottom: 8px; }
.auth-logo-mark {
  width: 64px; height: 64px; margin: 0 auto 12px; background: var(--green); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; color: var(--gold-light); font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 32px;
  box-shadow: 0 8px 24px rgba(10,77,54,0.25); position: relative;
}
.auth-logo-mark::after { content: ''; position: absolute; inset: 6px; border: 1.5px solid var(--gold-light); border-radius: 9px; opacity: 0.4; }
.auth-logo h1 { font-family: 'Cairo', sans-serif; font-size: 24px; font-weight: 900; color: var(--green-dark); letter-spacing: -0.02em; }
.auth-logo p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.auth-headline { text-align: center; margin-bottom: 24px; margin-top: 14px; }
.auth-headline h2 { font-family: 'Cairo', sans-serif; font-size: 22px; font-weight: 800; color: var(--green-dark); margin-bottom: 6px; }
.auth-headline p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.auth-form {
  display: flex; flex-direction: column; gap: 16px; background: #fff; border-radius: 16px; padding: 24px;
  border: 1.5px solid var(--line); box-shadow: 0 4px 12px rgba(13,22,18,0.03); text-align: start;
}
.auth-form-group { display: flex; flex-direction: column; }
.auth-form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.auth-form-group input {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line-strong); border-radius: 12px;
  font-family: inherit; font-size: 16px; background: var(--paper); transition: border-color .2s, background .2s; -webkit-appearance: none;
}
.auth-form-group input:focus { outline: none; border-color: var(--green); background: #fff; }
.auth-form-group input:disabled { opacity: .5; cursor: not-allowed; }
.input-prefix {
  position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-weight: 700; direction: ltr; font-size: 15px;
}
.password-toggle {
  position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
}
.auth-form-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 4px; font-weight: 700; line-height: 1.5; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 22px;
  font-size: 15px; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; text-decoration: none;
  white-space: nowrap; min-height: 48px; width: 100%; transition: transform .1s, background .2s; font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--green); color: var(--paper); box-shadow: 0 4px 14px rgba(10,77,54,0.25); }
.auth-footer { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
.auth-footer a { color: var(--green-dark); font-weight: 800; text-decoration: none; }
.auth-trust { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line-strong); text-align: center; }
.trust-row { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.trust-pill { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; font-weight: 600; }
.trust-pill::before { content: '✓'; color: var(--green); font-weight: 900; }
.auth-terms { font-size: 11px; color: var(--muted); line-height: 1.6; }
.auth-terms a { color: var(--gold); font-weight: 700; text-decoration: none; }
@media(min-width:768px) { body { font-size: 16px; } .auth-wrap { padding: 40px 28px; } }
</style>
<link rel="stylesheet" href="/assets/site.css" />
<meta name="description" content="أنشئ حسابك الجديد في منصة مُرابحة لبدء استثماراتك الموثقة والمتوافقة مع أحكام الشريعة." />
<link rel="canonical" href="https://murabaha.example.sa/signup.html" />
</head>
<body>
<main id="main">
<div class="auth-wrap">
  <div class="top-bar">
    <a href="hessa.html" class="back-btn" id="backToHomeBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <path d="M15 18l-6-6 6-6" transform="scale(-1,1) translate(-24,0)"/>
      </svg>
    </a>
    <a href="help.html" class="help-btn" id="helpDeskBtn">المساعدة ؟</a>
  </div>

  <div class="auth-logo">
    <div class="auth-logo-mark">م</div>
    <h1>منصة مُرابحة</h1>
    <p>منصة الشراكة الاستثمارية الشرعية</p>
  </div>

  <div class="auth-headline">
    <h2>ابدأ رحلتك الاستثمارية 🚀</h2>
    <p>أنشئ حساباً جديداً للانضمام إلى منصة مرابحة</p>
  </div>

  <form id="registerForm" class="auth-form">
    <div class="auth-form-group">
      <label for="registerName">الاسم الكامل (كما هو في الهوية الوطنية)</label>
      <input type="text" id="registerName" placeholder="عبدالعزيز محمد الراشد" required />
    </div>
    
    <div class="auth-form-group">
      <label for="registerEmail">البريد الإلكتروني</label>
      <input type="email" id="registerEmail" placeholder="example@gmail.com" required style="direction: ltr; text-align: start;" />
    </div>
    
    <div class="auth-form-group">
      <label for="registerPhone">رقم الجوال</label>
      <div style="position: relative;">
        <span class="input-prefix">+966</span>
        <input type="tel" id="registerPhone" placeholder="5XXXXXXXX" required style="direction: ltr; text-align: start; padding-inline-start: 60px;" />
      </div>
    </div>
    
    <div class="auth-form-group">
      <label for="registerId">رقم الهوية الوطنية / الإقامة</label>
      <input type="tel" id="registerId" placeholder="١٠٠٠٠٠٠٠٠٠" maxlength="10" required style="direction: ltr; text-align: start;" />
    </div>
    
    <div class="auth-form-group">
      <label for="registerPassword">كلمة المرور (٨ خانات على الأقل)</label>
      <div style="position: relative;">
        <input type="password" id="registerPassword" placeholder="••••••••" required style="direction: ltr; text-align: start;" />
        <button type="button" class="password-toggle" id="togglePassBtn" onclick="togglePwd('registerPassword')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="auth-form-error" id="registerError" style="display: none;"></div>
    <button type="submit" class="btn btn-primary" id="registerSubmitBtn">إنشاء حساب جديد</button>
  </form>

  <div class="auth-footer">
    لديك حساب بالفعل؟ <a href="login.html" id="loginLink">تسجيل الدخول</a>
  </div>

  <div class="auth-trust">
    <div class="trust-row">
      <span class="trust-pill">هيئة شرعية مستقلة</span>
      <span class="trust-pill">حماية البيانات PDPL</span>
      <span class="trust-pill">تشفير آمن للبيانات</span>
    </div>
    <p class="auth-terms">بمواصلتك تقرّ بقراءة <a href="terms.html">الشروط</a> و<a href="privacy.html">الخصوصية</a></p>
  </div>
</div>

<script>
function togglePwd(id) {
  const el = document.getElementById(id);
  if (el) {
    el.type = el.type === 'password' ? 'text' : 'password';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const registerForm = document.getElementById('registerForm');
  const registerError = document.getElementById('registerError');
  const registerSubmitBtn = document.getElementById('registerSubmitBtn');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    registerError.style.display = 'none';
    registerError.textContent = '';
    registerSubmitBtn.disabled = true;
    registerSubmitBtn.textContent = 'جاري إنشاء الحساب...';

    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const phoneInput = document.getElementById('registerPhone').value.trim();
    const phone = phoneInput ? '+966' + phoneInput : '';
    const nationalId = document.getElementById('registerId').value.trim();
    const password = document.getElementById('registerPassword').value;

    try {
      const res = await App.api('POST', '/app/auth/register', {
        name,
        email,
        phone,
        nationalId,
        password
      });

      App.toast('تم تسجيل الحساب بنجاح! جاري بدء التحقق من البريد...', 'success');
      setTimeout(() => {
        location.href = 'verify-email.html';
      }, 1000);
    } catch (err) {
      registerSubmitBtn.disabled = false;
      registerSubmitBtn.textContent = 'إنشاء حساب جديد';
      registerError.textContent = err.message || 'حدث خطأ أثناء إنشاء الحساب';
      registerError.style.display = 'block';
    }
  });
});
</script>
</main>
</body>
</html>
