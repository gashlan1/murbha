<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة السحوبات - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.stat-val.warn{color:#92400e;}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.filters{padding:0.75rem 1.25rem;border-bottom:1px solid var(--line);display:flex;gap:0.5rem;flex-wrap:wrap;}
.filter-btn{padding:0.3rem 0.75rem;border-radius:20px;border:1px solid var(--line);background:#f5f0e8;color:var(--green-dark);font-family:'Cairo',sans-serif;font-size:0.78rem;cursor:pointer;}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.wd-table{padding:0 1.25rem 1.25rem;}
.wd-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.2fr;gap:0.5rem;align-items:center;padding:0.7rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.wd-row:last-child{border-bottom:none;}
.wd-header{font-weight:700;font-size:0.75rem;color:var(--muted);padding-top:1rem;}
.wd-pill{display:inline-block;padding:0.15rem 0.55rem;border-radius:10px;font-size:0.7rem;font-weight:600;}
.pill-pending{background:#fef3cd;color:#92400e;}
.pill-approved{background:#e8f5ed;color:#1e8449;}
.pill-rejected{background:#fde8e8;color:#c0392b;}
.wd-amount{font-weight:700;color:var(--green);}
.wd-actions{display:flex;gap:0.4rem;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.wd-row{grid-template-columns:2fr 1fr 1fr;}.wd-row>:nth-child(4),.wd-row>:nth-child(5){display:none;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — إدارة السحوبات</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>إدارة طلبات السحب</h2>
      <p>مراجعة وموافقة طلبات سحب الأرباح والاستثمارات المُستردة</p>
    </div>
    <button class="btn btn-primary" onclick="exportWithdrawals()">تصدير التقرير</button>
  </div>

  <div class="stats" id="wdStats"></div>

  <div class="card">
    <div class="card-head">
      <h3>طلبات السحب</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportWithdrawals()">تصدير</button>
    </div>
    <div class="filters" id="wdFilters"></div>
    <div id="wdTable"></div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="approveAll()">الموافقة على الكل المعلق</button>
      <button class="btn btn-sm" style="background:#fde8e8;color:#c0392b;" onclick="rejectSelected()">رفض المحدد</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٧', lbl: 'طلبات معلقة', warn: true },
  { val: '٢٣٨,٠٠٠ ر.س', lbl: 'إجمالي طلبات المعلقة', warn: false },
  { val: '٤٢', lbl: 'طلب مكتمل هذا الشهر', warn: false },
  { val: '٣٦ ساعة', lbl: 'متوسط وقت المعالجة', warn: false }
];

const FILTERS = ['الكل', 'معلقة', 'مقبولة', 'مرفوضة'];

const WITHDRAWALS = [
  { name: 'أحمد العمري', type: 'سحب أرباح', amount: '٢٨,٠٠٠ ر.س', date: '٢٠٢٦/٠٦/١٣', pill: 'pill-pending', label: 'معلق' },
  { name: 'سارة الغامدي', type: 'استرداد جزئي', amount: '٥٠,٠٠٠ ر.س', date: '٢٠٢٦/٠٦/١٢', pill: 'pill-pending', label: 'معلق' },
  { name: 'خالد المطيري', type: 'سحب أرباح', amount: '٨,٤٠٠ ر.س', date: '٢٠٢٦/٠٦/١٠', pill: 'pill-approved', label: 'مقبول' },
  { name: 'نورة القحطاني', type: 'سحب أرباح', amount: '١٢,٠٠٠ ر.س', date: '٢٠٢٦/٠٦/٠٨', pill: 'pill-approved', label: 'مقبول' },
  { name: 'فهد الشهري', type: 'استرداد كامل', amount: '١٢٠,٠٠٠ ر.س', date: '٢٠٢٦/٠٦/٠٥', pill: 'pill-rejected', label: 'مرفوض' }
];

let activeFilter = 'الكل';

function buildStats() {
  const wrap = document.getElementById('wdStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val' + (s.warn ? ' warn' : ''); val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildFilters() {
  const wrap = document.getElementById('wdFilters');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
  FILTERS.forEach(f => {
    const btn = document.createElement('button'); btn.className = 'filter-btn' + (f === activeFilter ? ' active' : '');
    btn.textContent = f;
    btn.onclick = () => { activeFilter = f; buildFilters(); buildTable(); };
    wrap.appendChild(btn);
  });
}

function buildTable() {
  const wrap = document.getElementById('wdTable');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
  const table = document.createElement('div'); table.className = 'wd-table';
  const header = document.createElement('div'); header.className = 'wd-row wd-header';
  ['المستثمر', 'النوع', 'المبلغ', 'التاريخ', 'الحالة / إجراء'].forEach(h => {
    const cell = document.createElement('div'); cell.textContent = h; header.appendChild(cell);
  });
  table.appendChild(header);
  const filtered = activeFilter === 'الكل' ? WITHDRAWALS : WITHDRAWALS.filter(w => w.label === activeFilter);
  filtered.forEach((w, idx) => {
    const row = document.createElement('div'); row.className = 'wd-row';
    const name = document.createElement('div'); name.style.fontWeight = '700'; name.textContent = w.name;
    const type = document.createElement('div'); type.style.color = 'var(--muted)'; type.textContent = w.type;
    const amount = document.createElement('div'); amount.className = 'wd-amount'; amount.textContent = w.amount;
    const date = document.createElement('div'); date.style.color = 'var(--muted)'; date.textContent = w.date;
    const actions = document.createElement('div'); actions.className = 'wd-actions';
    if (w.pill === 'pill-pending') {
      const approve = document.createElement('button'); approve.className = 'btn btn-sm'; approve.style.cssText = 'background:var(--green);color:#fff;'; approve.textContent = 'قبول';
      approve.onclick = () => processWithdrawal(idx, 'approve');
      const reject = document.createElement('button'); reject.className = 'btn btn-sm'; reject.style.cssText = 'background:#fde8e8;color:#c0392b;'; reject.textContent = 'رفض';
      reject.onclick = () => processWithdrawal(idx, 'reject');
      actions.appendChild(approve); actions.appendChild(reject);
    } else {
      const pill = document.createElement('span'); pill.className = 'wd-pill ' + w.pill; pill.textContent = w.label;
      actions.appendChild(pill);
    }
    row.appendChild(name); row.appendChild(type); row.appendChild(amount); row.appendChild(date); row.appendChild(actions);
    table.appendChild(row);
  });
  wrap.appendChild(table);
}

function processWithdrawal(idx, action) {
  fetch('/app/admin/withdrawal-management/' + idx, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action }) }).catch(() => {});
  alert((action === 'approve' ? 'تمت الموافقة' : 'تم رفض') + ' طلب السحب.');
}

function approveAll() {
  fetch('/app/admin/withdrawal-management/bulk-approve', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'approve-all' }) }).catch(() => {});
  alert('تمت الموافقة على جميع الطلبات المعلقة.');
}

function rejectSelected() {
  fetch('/app/admin/withdrawal-management/bulk-reject', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'reject-selected' }) }).catch(() => {});
  alert('تم رفض الطلبات المحددة.');
}

function exportWithdrawals() {
  fetch('/app/admin/withdrawal-management/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير سجل السحوبات...');
}

buildStats(); buildFilters(); buildTable();
</script>
</body>
</html>
