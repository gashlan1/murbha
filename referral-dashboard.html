<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Referral Dashboard — Murbha">لوحة الإحالات — مُرابحة</title>
<meta name="description" content="تتبّع إحالاتك واكسب مكافآت عند انضمام أصدقائك وأسرتك إلى مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-sub{font:700 10px Cairo,sans-serif;color:var(--gold);margin-top:1px;}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
  .card-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  /* Referral code box */
  .code-box{background:#f9f7f2;border:2px dashed var(--gold);border-radius:14px;padding:22px;text-align:center;margin-bottom:14px;}
  .code-val{font:900 28px Cairo,sans-serif;letter-spacing:4px;color:var(--green-dark);margin-bottom:8px;}
  .code-hint{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-bottom:14px;}
  .btn-copy{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:10px 22px;font:900 12px Cairo,sans-serif;cursor:pointer;}
  .btn-copy:hover{background:var(--green);}
  .share-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .btn-share{border:1.5px solid var(--line);border-radius:9px;padding:8px 16px;font:700 11px Cairo,sans-serif;cursor:pointer;background:#fff;color:var(--green-dark);}
  .btn-share:hover{background:#f9f7f2;}
  /* Referral list */
  .ref-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .ref-item:last-child{border-bottom:none;}
  .ref-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-dark);color:#fbf6ea;display:flex;align-items:center;justify-content:center;font:900 14px Cairo,sans-serif;flex-shrink:0;}
  .ref-info{flex:1;}
  .ref-name{font:900 11px Cairo,sans-serif;color:var(--green-dark);}
  .ref-date{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .ref-status{font:700 10px Cairo,sans-serif;border-radius:5px;padding:2px 8px;white-space:nowrap;flex-shrink:0;}
  .st-registered{background:#e3f2fd;color:#1565c0;}
  .st-invested{background:#e8f5e9;color:#2e7d32;}
  .st-pending{background:#fff8e1;color:#a07020;}
  .ref-reward{font:900 11px Cairo,sans-serif;color:var(--gold);flex-shrink:0;}
  /* Progress bar */
  .tier-progress{margin-top:14px;}
  .tier-label{font:700 11px Cairo,sans-serif;color:var(--green-dark);margin-bottom:6px;display:flex;justify-content:space-between;}
  .tier-bar-bg{height:10px;background:#f0ece0;border-radius:5px;overflow:hidden;}
  .tier-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--gold-light));}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Referral Dashboard">لوحة الإحالات</h1>
    <p data-en="Invite friends and family to Murbha and earn rewards when they invest.">ادعُ أصدقاءك وأسرتك وتحصّل على مكافآت عند استثمارهم في مُرابحة.</p>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="card">
    <div class="card-title" data-en="Your Referral Code">رمز الإحالة الخاص بك</div>
    <div class="code-box">
      <div class="code-val" id="refCode">—</div>
      <div class="code-hint">شارك هذا الرمز مع أصدقائك وتحصّل على مكافأة عند استثمارهم</div>
      <button class="btn-copy" id="btnCopy">نسخ الرمز</button>
      <div class="share-row">
        <button class="btn-share" id="btnShareWA">واتساب</button>
        <button class="btn-share" id="btnShareLink">نسخ الرابط</button>
      </div>
    </div>
    <div class="tier-progress" id="tierProgress"></div>
  </div>

  <div class="card">
    <div class="card-title" data-en="Your Referrals">إحالاتي</div>
    <div id="refList"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  (async function load(){
    try{
      const r=await fetch('/app/me/referrals');
      if(!r.ok){ placeholder(document.getElementById('refList'),r.status===401?'يرجى تسجيل الدخول.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      // Code
      const code=d.code||'MURBHA';
      document.getElementById('refCode').textContent=code;
      const link='https://murabaha.example.sa/?ref='+code;
      document.getElementById('btnCopy').addEventListener('click',()=>{ navigator.clipboard&&navigator.clipboard.writeText(code); showToast('تم نسخ الرمز!'); });
      document.getElementById('btnShareLink').addEventListener('click',()=>{ navigator.clipboard&&navigator.clipboard.writeText(link); showToast('تم نسخ الرابط!'); });
      document.getElementById('btnShareWA').addEventListener('click',()=>{ window.open('https://wa.me/?text='+encodeURIComponent('استثمر معي في مُرابحة باستخدام رمز الإحالة '+code+' '+link)); });
      // KPIs
      const kpis=d.kpis||{};
      const kpiRow=document.getElementById('kpiRow');
      [{lbl:'إجمالي الإحالات',val:String(kpis.total||0),sub:''},{lbl:'استثمروا',val:String(kpis.invested||0),sub:''},{lbl:'المكافآت المكتسبة',val:fmt(kpis.rewardsEarned||0)+' ر.س',sub:''},{lbl:'قيد الانتظار',val:fmt(kpis.pendingReward||0)+' ر.س',sub:''}].forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });
      // Tier progress
      const tp=document.getElementById('tierProgress');
      if(d.nextTier){
        const lbl=document.createElement('div'); lbl.className='tier-label';
        const s=document.createElement('span'); s.textContent='التقدم نحو '+d.nextTier.name;
        const s2=document.createElement('span'); s2.textContent=(kpis.invested||0)+' / '+d.nextTier.required+' إحالة';
        lbl.appendChild(s); lbl.appendChild(s2);
        const bg=document.createElement('div'); bg.className='tier-bar-bg';
        const bar=document.createElement('div'); bar.className='tier-bar'; bar.style.width=Math.min(100,Math.round(((kpis.invested||0)/d.nextTier.required)*100))+'%';
        bg.appendChild(bar); tp.appendChild(lbl); tp.appendChild(bg);
      }
      // List
      const list=document.getElementById('refList');
      const refs=d.referrals||[];
      if(!refs.length){ placeholder(list,'لم تقم بأي إحالات بعد.'); return; }
      refs.forEach(ref=>{
        const item=document.createElement('div'); item.className='ref-item';
        const av=document.createElement('div'); av.className='ref-avatar'; av.textContent=(ref.name||'م').charAt(0);
        const info=document.createElement('div'); info.className='ref-info';
        const name=document.createElement('div'); name.className='ref-name'; name.textContent=ref.name||'مستخدم';
        const date=document.createElement('div'); date.className='ref-date'; date.textContent=(ref.joinedAt||'').slice(0,10)||'—';
        info.appendChild(name); info.appendChild(date);
        const st=document.createElement('div'); st.className='ref-status st-'+(ref.status||'pending');
        st.textContent=ref.status==='invested'?'استثمر':ref.status==='registered'?'مسجّل':'قيد الانتظار';
        const rew=document.createElement('div'); rew.className='ref-reward'; rew.textContent=ref.reward?fmt(ref.reward)+' ر.س':'—';
        item.appendChild(av); item.appendChild(info); item.appendChild(st); item.appendChild(rew);
        list.appendChild(item);
      });
    }catch{ placeholder(document.getElementById('refList'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
