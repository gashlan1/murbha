<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Deal Approval — Murbha Admin">اعتماد الصفقات — إدارة مُرابحة</title>
<meta name="description" content="مراجعة واعتماد الصفقات الجديدة قبل طرحها للمستثمرين." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:900px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .kpi-val{font:900 24px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  /* Deal review card */
  .deal-review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .dr-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
  .dr-icon{width:46px;height:46px;border-radius:12px;background:var(--green-dark);color:#fbf6ea;display:flex;align-items:center;justify-content:center;font:900 18px Cairo,sans-serif;flex-shrink:0;}
  .dr-info{flex:1;}
  .dr-name{font:900 15px Cairo,sans-serif;color:var(--green-dark);}
  .dr-meta{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .dr-stage{font:700 10px Cairo,sans-serif;border-radius:5px;padding:2px 8px;white-space:nowrap;flex-shrink:0;}
  .stage-review{background:#fff8e1;color:#a07020;}
  .stage-shariah{background:#e3f2fd;color:#1565c0;}
  .stage-legal{background:#f3e5f5;color:#7b1fa2;}
  .dr-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
  .dr-field{background:#f9f7f2;border-radius:8px;padding:10px;}
  .dr-field-val{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .dr-field-lbl{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .dr-desc{font:500 11px Tajawal,sans-serif;color:var(--ink);line-height:1.8;margin-bottom:14px;background:#f9f7f2;border-radius:8px;padding:12px;}
  .dr-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .dr-note{flex:1;min-width:160px;}
  .dr-note-inp{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font:500 11px Tajawal,sans-serif;color:var(--ink);}
  .dr-note-inp:focus{outline:none;border-color:var(--green);}
  .btn-approve{background:#2e7d32;color:#fff;border:none;border-radius:9px;padding:10px 20px;font:900 11px Cairo,sans-serif;cursor:pointer;white-space:nowrap;}
  .btn-approve:hover{background:#388e3c;}
  .btn-approve:disabled{background:#ccc;cursor:default;}
  .btn-reject{background:#c54a3a;color:#fff;border:none;border-radius:9px;padding:10px 20px;font:900 11px Cairo,sans-serif;cursor:pointer;white-space:nowrap;}
  .btn-reject:hover{background:#d32f2f;}
  .btn-reject:disabled{background:#ccc;cursor:default;}
  .btn-request{background:#f9a825;color:#fff;border:none;border-radius:9px;padding:10px 20px;font:900 11px Cairo,sans-serif;cursor:pointer;white-space:nowrap;}
  .btn-request:hover{background:#f57f17;}
  .btn-request:disabled{background:#ccc;cursor:default;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .empty-state{background:#fff;border:1px solid var(--line);border-radius:16px;padding:48px 22px;text-align:center;}
  .empty-icon{font-size:48px;margin-bottom:12px;}
  .empty-title{font:900 15px Cairo,sans-serif;color:var(--green-dark);margin-bottom:6px;}
  .empty-sub{font:500 12px Tajawal,sans-serif;color:var(--muted);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1 data-en="Deal Approval">اعتماد الصفقات</h1>
    <p data-en="Review and approve new deals before they are offered to investors.">راجع الصفقات الجديدة واعتمدها أو ارفضها قبل طرحها للمستثمرين.</p>
    <div class="admin-badge">لوحة الإدارة</div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>
  <div id="dealsContainer"></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  const stageLabel={review:'مراجعة أولية',shariah:'اعتماد شرعي',legal:'توثيق قانوني'};
  const stageCls={review:'stage-review',shariah:'stage-shariah',legal:'stage-legal'};

  async function load(){
    const container=document.getElementById('dealsContainer'); container.textContent='';
    try{
      const r=await fetch('/app/admin/deal-approvals');
      if(!r.ok){ const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=r.status===403?'غير مصرح.':'تعذّر التحميل.'; container.appendChild(p); return; }
      const d=await r.json();
      // KPIs
      const kpiRow=document.getElementById('kpiRow'); kpiRow.textContent='';
      const kpis=d.kpis||{};
      [{lbl:'قيد المراجعة',val:String(kpis.pending||0)},{lbl:'تمت الموافقة اليوم',val:String(kpis.approvedToday||0)},{lbl:'مرفوضة اليوم',val:String(kpis.rejectedToday||0)},{lbl:'متوسط وقت المراجعة',val:(kpis.avgReviewHours||0)+' ساعة'}].forEach(k=>{
        const kpi=document.createElement('div'); kpi.className='kpi';
        const v=document.createElement('div'); v.className='kpi-val'; v.textContent=k.val;
        const l=document.createElement('div'); l.className='kpi-lbl'; l.textContent=k.lbl;
        kpi.appendChild(v); kpi.appendChild(l); kpiRow.appendChild(kpi);
      });
      const deals=d.deals||[];
      if(!deals.length){
        const empty=document.createElement('div'); empty.className='empty-state';
        const icon=document.createElement('div'); icon.className='empty-icon'; icon.textContent='✅';
        const title=document.createElement('div'); title.className='empty-title'; title.textContent='لا توجد صفقات تنتظر المراجعة';
        const sub=document.createElement('div'); sub.className='empty-sub'; sub.textContent='ستظهر الصفقات الجديدة هنا عند تقديمها.';
        empty.appendChild(icon); empty.appendChild(title); empty.appendChild(sub);
        container.appendChild(empty); return;
      }
      deals.forEach(deal=>{
        const card=document.createElement('div'); card.className='deal-review';
        const header=document.createElement('div'); header.className='dr-header';
        const icon=document.createElement('div'); icon.className='dr-icon'; icon.textContent=(deal.sector||'ص').charAt(0);
        const info=document.createElement('div'); info.className='dr-info';
        const name=document.createElement('div'); name.className='dr-name'; name.textContent=deal.name||'—';
        const meta=document.createElement('div'); meta.className='dr-meta'; meta.textContent=(deal.submittedAt||'').slice(0,10)+' · '+deal.sector;
        info.appendChild(name); info.appendChild(meta);
        const stage=document.createElement('div'); stage.className='dr-stage '+(stageCls[deal.stage]||'stage-review'); stage.textContent=stageLabel[deal.stage]||deal.stage||'—';
        header.appendChild(icon); header.appendChild(info); header.appendChild(stage);
        const fields=document.createElement('div'); fields.className='dr-fields';
        [{lbl:'التمويل المطلوب',val:fmt(deal.targetAmount||0)+' ر.س'},{lbl:'العائد المتوقع',val:(deal.expectedYield||0).toFixed(1)+'٪'},{lbl:'المدة',val:(deal.duration||0)+' شهر'},{lbl:'الحد الأدنى',val:fmt(deal.minInvestment||0)+' ر.س'}].forEach(f=>{
          const field=document.createElement('div'); field.className='dr-field';
          const v=document.createElement('div'); v.className='dr-field-val'; v.textContent=f.val;
          const l=document.createElement('div'); l.className='dr-field-lbl'; l.textContent=f.lbl;
          field.appendChild(v); field.appendChild(l); fields.appendChild(field);
        });
        const desc=document.createElement('div'); desc.className='dr-desc'; desc.textContent=deal.description||'لا يوجد وصف.';
        const actionsRow=document.createElement('div'); actionsRow.className='dr-actions';
        const noteWrap=document.createElement('div'); noteWrap.className='dr-note';
        const noteInp=document.createElement('input'); noteInp.className='dr-note-inp'; noteInp.type='text'; noteInp.placeholder='ملاحظة (اختياري)…';
        noteWrap.appendChild(noteInp);
        const btnA=document.createElement('button'); btnA.className='btn-approve'; btnA.textContent='اعتماد ✓';
        const btnRq=document.createElement('button'); btnRq.className='btn-request'; btnRq.textContent='طلب تعديل';
        const btnRj=document.createElement('button'); btnRj.className='btn-reject'; btnRj.textContent='رفض ✗';
        const dId=deal.id;
        async function submitDecision(action){
          [btnA,btnRq,btnRj].forEach(b=>{ b.disabled=true; });
          try{
            const rp=await fetch('/app/admin/deal-approvals/'+encodeURIComponent(dId),{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({action,note:noteInp.value.trim()})});
            if(!rp.ok){ [btnA,btnRq,btnRj].forEach(b=>{ b.disabled=false; }); showToast('تعذّرت العملية.'); return; }
            showToast(action==='approve'?'تم اعتماد الصفقة.':action==='reject'?'تم رفض الصفقة.':'تم طلب التعديل.'); card.style.opacity='0.5'; card.style.pointerEvents='none'; setTimeout(()=>load(),1000);
          }catch{ [btnA,btnRq,btnRj].forEach(b=>{ b.disabled=false; }); showToast('خطأ.'); }
        }
        btnA.addEventListener('click',()=>submitDecision('approve'));
        btnRq.addEventListener('click',()=>submitDecision('request_changes'));
        btnRj.addEventListener('click',()=>submitDecision('reject'));
        actionsRow.appendChild(noteWrap); actionsRow.appendChild(btnA); actionsRow.appendChild(btnRq); actionsRow.appendChild(btnRj);
        card.appendChild(header); card.appendChild(fields); card.appendChild(desc); card.appendChild(actionsRow);
        container.appendChild(card);
      });
    }catch{ const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent='خطأ في الاتصال.'; container.appendChild(p); }
  }

  load();
}());
</script>
</body>
</html>
