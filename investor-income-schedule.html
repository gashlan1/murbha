<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جدول الدخل - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.income-hero{background:linear-gradient(135deg,#062b1e 0%,#0a4d36 100%);border-radius:14px;padding:1.75rem 2rem;color:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-bottom:2rem;}
.ihi-val{font-size:1.8rem;font-weight:700;color:#6de0a8;}
.ihi-lbl{font-size:0.78rem;color:rgba(255,255,255,0.7);margin-top:0.2rem;}
.ihi-sub{font-size:0.7rem;color:rgba(255,255,255,0.5);margin-top:0.1rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.schedule-table-wrap{padding:1.25rem;overflow-x:auto;}
.schedule-table{width:100%;border-collapse:collapse;}
.schedule-table th{background:#f5f0e8;color:var(--green-dark);font-size:0.78rem;padding:0.6rem 0.9rem;text-align:right;border-bottom:2px solid var(--line);}
.schedule-table td{font-size:0.8rem;padding:0.55rem 0.9rem;border-bottom:1px solid var(--line);}
.schedule-table tr:last-child td{border-bottom:none;}
.schedule-table tr:hover td{background:#fdfaf4;}
.amount-col{font-weight:700;color:var(--green);}
.status-pill{display:inline-block;padding:0.15rem 0.55rem;border-radius:10px;font-size:0.7rem;font-weight:600;}
.pill-paid{background:#e8f5ed;color:#1e8449;}
.pill-pending{background:#fef3cd;color:#92400e;}
.pill-upcoming{background:#e8f0fd;color:#1a56a0;}
.monthly-bars{padding:1.25rem;}
.month-row{display:flex;align-items:center;gap:1rem;margin-bottom:0.65rem;}
.month-row:last-child{margin-bottom:0;}
.month-name{width:60px;font-size:0.78rem;color:var(--muted);flex-shrink:0;}
.bar-track{flex:1;background:#f0ebe0;border-radius:6px;height:10px;overflow:hidden;}
.bar-fill{height:100%;background:var(--green);border-radius:6px;}
.month-val{width:80px;font-size:0.78rem;font-weight:700;color:var(--green);text-align:left;}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:700px){.income-hero{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — جدول الدخل</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>جدول الدخل المتوقع</h2>
      <p>تتبع مدفوعات الأرباح والدخل القادمة من جميع استثماراتك</p>
    </div>
    <button class="btn btn-primary btn-sm" onclick="exportSchedule()">تصدير الجدول</button>
  </div>

  <div class="income-hero">
    <div>
      <div class="ihi-val">١٨,٤٠٠ ر.س</div>
      <div class="ihi-lbl">الدخل المتوقع ٢٠٢٦</div>
      <div class="ihi-sub">من ٧ صفقات نشطة</div>
    </div>
    <div>
      <div class="ihi-val">١,٥٣٣ ر.س</div>
      <div class="ihi-lbl">متوسط الدخل الشهري</div>
      <div class="ihi-sub">بعد خصم الرسوم</div>
    </div>
    <div>
      <div class="ihi-val">٦,٢٠٠ ر.س</div>
      <div class="ihi-lbl">مستلم حتى الآن</div>
      <div class="ihi-sub">٣٤٪ من الهدف السنوي</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>مدفوعات الأرباح التفصيلية</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportSchedule()">تصدير</button>
    </div>
    <div class="schedule-table-wrap">
      <table class="schedule-table" id="scheduleTable"></table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>الدخل الشهري (٢٠٢٦)</h3></div>
    <div class="monthly-bars" id="monthlyBars"></div>
    <div class="action-bar">
      <button class="btn btn-primary btn-sm" onclick="exportSchedule()">تصدير</button>
    </div>
  </div>
</div>

<script>
const TABLE_ROWS = [
  { deal: 'مرابحة عقارية #4920', date: '٢٠٢٦/٠٣/٣١', amount: '٢,٨٠٠ ر.س', type: 'ربح ربعي', status: 'pill-paid', statusText: 'مستلم' },
  { deal: 'مرابحة تجارية #4921', date: '٢٠٢٦/٠٤/١٥', amount: '١,٤٠٠ ر.س', type: 'ربح ربعي', status: 'pill-paid', statusText: 'مستلم' },
  { deal: 'مرابحة صناعية #4922', date: '٢٠٢٦/٠٦/٣٠', amount: '٢,٠٠٠ ر.س', type: 'ربح نصف سنوي', status: 'pill-pending', statusText: 'معلق' },
  { deal: 'مرابحة عقارية #4920', date: '٢٠٢٦/٠٦/٣٠', amount: '٢,٨٠٠ ر.س', type: 'ربح ربعي', status: 'pill-upcoming', statusText: 'قادم' },
  { deal: 'مرابحة لوجستية #4918', date: '٢٠٢٦/٠٧/٣١', amount: '١,٢٠٠ ر.س', type: 'ربح شهري', status: 'pill-upcoming', statusText: 'قادم' },
  { deal: 'مرابحة تقنية #4915', date: '٢٠٢٦/٠٩/٣٠', amount: '٣,٦٠٠ ر.س', type: 'ربح ربعي', status: 'pill-upcoming', statusText: 'قادم' },
  { deal: 'مرابحة تجارية #4921', date: '٢٠٢٦/١٢/٣١', amount: '١,٤٠٠ ر.س', type: 'ربح ربعي', status: 'pill-upcoming', statusText: 'قادم' }
];

const MONTHS = [
  { name: 'يناير', pct: 0, val: '٠ ر.س' },
  { name: 'فبراير', pct: 0, val: '٠ ر.س' },
  { name: 'مارس', pct: 72, val: '٢,٨٠٠ ر.س' },
  { name: 'أبريل', pct: 36, val: '١,٤٠٠ ر.س' },
  { name: 'مايو', pct: 0, val: '٠ ر.س' },
  { name: 'يونيو', pct: 100, val: '٤,٨٠٠ ر.س' },
  { name: 'يوليو', pct: 31, val: '١,٢٠٠ ر.س' },
  { name: 'أغسطس', pct: 0, val: '٠ ر.س' },
  { name: 'سبتمبر', pct: 92, val: '٣,٦٠٠ ر.س' },
  { name: 'أكتوبر', pct: 0, val: '٠ ر.س' },
  { name: 'نوفمبر', pct: 0, val: '٠ ر.س' },
  { name: 'ديسمبر', pct: 36, val: '١,٤٠٠ ر.س' }
];

function buildTable() {
  const table = document.getElementById('scheduleTable');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['الصفقة','تاريخ الاستحقاق','المبلغ','النوع','الحالة'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  TABLE_ROWS.forEach(r => {
    const tr = document.createElement('tr');
    const tdDeal = document.createElement('td'); tdDeal.textContent = r.deal;
    const tdDate = document.createElement('td'); tdDate.textContent = r.date;
    const tdAmt = document.createElement('td'); tdAmt.className = 'amount-col'; tdAmt.textContent = r.amount;
    const tdType = document.createElement('td'); tdType.textContent = r.type;
    const tdStatus = document.createElement('td');
    const pill = document.createElement('span'); pill.className = 'status-pill ' + r.status; pill.textContent = r.statusText;
    tdStatus.appendChild(pill);
    tr.appendChild(tdDeal); tr.appendChild(tdDate); tr.appendChild(tdAmt); tr.appendChild(tdType); tr.appendChild(tdStatus);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function buildBars() {
  const wrap = document.getElementById('monthlyBars');
  MONTHS.forEach(m => {
    const row = document.createElement('div'); row.className = 'month-row';
    const name = document.createElement('div'); name.className = 'month-name'; name.textContent = m.name;
    const track = document.createElement('div'); track.className = 'bar-track';
    const fill = document.createElement('div'); fill.className = 'bar-fill'; fill.style.width = m.pct + '%';
    track.appendChild(fill);
    const val = document.createElement('div'); val.className = 'month-val'; val.textContent = m.val;
    row.appendChild(name); row.appendChild(track); row.appendChild(val);
    wrap.appendChild(row);
  });
}

function exportSchedule() {
  fetch('/app/me/income-schedule/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير جدول الدخل...');
}

buildTable(); buildBars();
</script>
</body>
</html>
