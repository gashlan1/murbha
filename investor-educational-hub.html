<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المركز التعليمي - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.progress-banner{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:14px;padding:1.5rem 2rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.pb-info h3{font-size:1rem;font-weight:700;margin-bottom:0.3rem;}
.pb-info p{font-size:0.8rem;color:rgba(255,255,255,0.75);}
.pb-right{text-align:center;}
.pb-pct{font-size:2rem;font-weight:700;color:#b8e6cf;}
.pb-lbl{font-size:0.72rem;color:rgba(255,255,255,0.7);}
.pb-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.2);margin-top:0.5rem;width:200px;}
.pb-fill{height:100%;border-radius:3px;background:var(--gold);}
.cat-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.cat-tab{padding:0.4rem 1rem;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--green-dark);font-family:'Cairo',sans-serif;font-size:0.82rem;cursor:pointer;}
.cat-tab.active{background:var(--green);color:#fff;border-color:var(--green);}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-bottom:2rem;}
.course-card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;}
.cc-thumb{height:80px;background:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:2rem;}
.cc-body{padding:1rem;}
.cc-cat{font-size:0.68rem;font-weight:700;color:var(--gold);margin-bottom:0.3rem;}
.cc-title{font-size:0.88rem;font-weight:700;margin-bottom:0.5rem;}
.cc-meta{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);}
.cc-progress{height:4px;border-radius:2px;background:#e8e2d6;margin-top:0.75rem;}
.cc-fill{height:100%;border-radius:2px;background:var(--green);}
.cc-action{padding:0.75rem 1rem;border-top:1px solid var(--line);}
.faq-list{padding:1.25rem;}
.faq-item{border:1px solid var(--line);border-radius:10px;margin-bottom:0.65rem;overflow:hidden;}
.faq-q{padding:0.8rem 1rem;font-size:0.86rem;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.faq-a{padding:0 1rem 0.8rem;font-size:0.8rem;color:var(--muted);line-height:1.6;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
@media(max-width:800px){.course-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.course-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — المركز التعليمي</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>المركز التعليمي للمستثمرين</h2>
      <p>تعلّم أساسيات المرابحة الإسلامية وطوّر مهاراتك الاستثمارية</p>
    </div>
  </div>

  <div class="progress-banner" id="progressBanner"></div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="course-grid" id="courseGrid"></div>

  <div class="card">
    <div class="card-head"><h3>الأسئلة الشائعة</h3></div>
    <div class="faq-list" id="faqList"></div>
  </div>
</div>

<script>
const CATS = ['الكل', 'أساسيات المرابحة', 'الشريعة الإسلامية', 'إدارة المخاطر', 'التحليل المالي'];

const COURSES = [
  { icon: '🏦', cat: 'أساسيات المرابحة', title: 'ما هي المرابحة؟ دليل المبتدئين', lessons: '٦ دروس', duration: '٤٥ دقيقة', pct: 100 },
  { icon: '⚖️', cat: 'الشريعة الإسلامية', title: 'الأحكام الشرعية للمرابحة', lessons: '٨ دروس', duration: '٦٠ دقيقة', pct: 75 },
  { icon: '📊', cat: 'التحليل المالي', title: 'كيف تقرأ نشرة الإصدار', lessons: '٥ دروس', duration: '٣٥ دقيقة', pct: 50 },
  { icon: '🛡️', cat: 'إدارة المخاطر', title: 'تنويع المحفظة وإدارة المخاطر', lessons: '٧ دروس', duration: '٥٥ دقيقة', pct: 20 },
  { icon: '💰', cat: 'أساسيات المرابحة', title: 'حساب العوائد والربحية', lessons: '٤ دروس', duration: '٣٠ دقيقة', pct: 0 },
  { icon: '🌟', cat: 'التحليل المالي', title: 'تقييم الصفقات المتقدمة', lessons: '١٠ دروس', duration: '٩٠ دقيقة', pct: 0 }
];

const FAQS = [
  { q: 'ما الفرق بين المرابحة والقرض الربوي؟', a: 'في المرابحة يشتري الممول الأصل أولاً ثم يبيعه للعميل بثمن معلوم يشمل هامش الربح، وهذا مختلف جوهرياً عن إقراض النقود بفائدة المحرّمة شرعاً.' },
  { q: 'كيف أتحقق من الشرعية؟', a: 'تُصدر كل صفقة على منصة مُرابحة شهادة موافقة من هيئة الرقابة الشرعية المستقلة، ويمكنك الاطلاع عليها في صفحة تفاصيل أي صفقة.' },
  { q: 'ما الحد الأدنى للاستثمار؟', a: 'يتفاوت الحد الأدنى بحسب نوع الصفقة: ١٠,٠٠٠ ر.س للصفقات التجارية، و٢٠,٠٠٠ ر.س للوجستية، و٥٠,٠٠٠ ر.س للعقارية.' },
  { q: 'هل يمكنني سحب استثماري مبكراً؟', a: 'الصفقات ملزمة حتى تاريخ الإغلاق، غير أن المنصة توفر سوقاً ثانوياً لبيع حصتك لمستثمرين آخرين وفق شروط محددة.' }
];

let activeCAT = 'الكل';

function buildBanner() {
  const wrap = document.getElementById('progressBanner');
  const info = document.createElement('div'); info.className = 'pb-info';
  const h3 = document.createElement('h3'); h3.textContent = 'تقدمك التعليمي';
  const p = document.createElement('p'); p.textContent = 'أكملت ٣ من ٦ دورات · احصل على شهادة "مستثمر مُتمكّن"';
  info.appendChild(h3); info.appendChild(p);
  const right = document.createElement('div'); right.className = 'pb-right';
  const pct = document.createElement('div'); pct.className = 'pb-pct'; pct.textContent = '٥٠٪';
  const lbl = document.createElement('div'); lbl.className = 'pb-lbl'; lbl.textContent = 'مكتمل';
  const barWrap = document.createElement('div'); barWrap.className = 'pb-bar';
  const fill = document.createElement('div'); fill.className = 'pb-fill'; fill.style.width = '50%';
  barWrap.appendChild(fill);
  right.appendChild(pct); right.appendChild(lbl); right.appendChild(barWrap);
  wrap.appendChild(info); wrap.appendChild(right);
}

function buildTabs() {
  const wrap = document.getElementById('catTabs');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
  CATS.forEach(c => {
    const tab = document.createElement('button'); tab.className = 'cat-tab' + (c === activeCAT ? ' active' : '');
    tab.textContent = c;
    tab.onclick = () => { activeCAT = c; buildTabs(); buildCourses(); };
    wrap.appendChild(tab);
  });
}

function buildCourses() {
  const wrap = document.getElementById('courseGrid');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
  const filtered = activeCAT === 'الكل' ? COURSES : COURSES.filter(c => c.cat === activeCAT);
  filtered.forEach((c, i) => {
    const card = document.createElement('div'); card.className = 'course-card';
    const thumb = document.createElement('div'); thumb.className = 'cc-thumb'; thumb.textContent = c.icon;
    const body = document.createElement('div'); body.className = 'cc-body';
    const cat = document.createElement('div'); cat.className = 'cc-cat'; cat.textContent = c.cat;
    const title = document.createElement('div'); title.className = 'cc-title'; title.textContent = c.title;
    const meta = document.createElement('div'); meta.className = 'cc-meta';
    const les = document.createElement('span'); les.textContent = c.lessons;
    const dur = document.createElement('span'); dur.textContent = c.duration;
    meta.appendChild(les); meta.appendChild(dur);
    const prog = document.createElement('div'); prog.className = 'cc-progress';
    const fill = document.createElement('div'); fill.className = 'cc-fill'; fill.style.width = c.pct + '%';
    prog.appendChild(fill);
    body.appendChild(cat); body.appendChild(title); body.appendChild(meta); body.appendChild(prog);
    const action = document.createElement('div'); action.className = 'cc-action';
    const btn = document.createElement('button'); btn.className = 'btn btn-sm btn-primary'; btn.style.width = '100%';
    btn.textContent = c.pct === 100 ? 'مراجعة' : c.pct > 0 ? 'استكمال' : 'ابدأ الآن';
    btn.onclick = () => startCourse(i);
    action.appendChild(btn);
    card.appendChild(thumb); card.appendChild(body); card.appendChild(action);
    wrap.appendChild(card);
  });
}

function buildFaqs() {
  const wrap = document.getElementById('faqList');
  FAQS.forEach(f => {
    const item = document.createElement('div'); item.className = 'faq-item';
    const q = document.createElement('div'); q.className = 'faq-q'; q.textContent = f.q;
    const toggle = document.createElement('span'); toggle.textContent = '▾';
    q.appendChild(toggle);
    const a = document.createElement('div'); a.className = 'faq-a'; a.textContent = f.a;
    q.onclick = () => { const vis = a.style.display === 'block'; a.style.display = vis ? 'none' : 'block'; toggle.textContent = vis ? '▾' : '▴'; };
    item.appendChild(q); item.appendChild(a);
    wrap.appendChild(item);
  });
}

function startCourse(idx) {
  fetch('/app/me/educational-hub/' + idx, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' }, body: JSON.stringify({ action: 'start' }) }).catch(() => {});
  alert('جاري فتح: ' + COURSES[idx].title);
}

buildBanner(); buildTabs(); buildCourses(); buildFaqs();
</script>
</body>
</html>
