<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محسّن المحفظة - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.stat-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.alloc-wrap{padding:1.25rem;}
.alloc-item{margin-bottom:1rem;}
.alloc-head{display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:0.35rem;}
.alloc-name{font-weight:600;}
.alloc-pct{color:var(--green);font-weight:700;}
.alloc-bar{height:8px;border-radius:4px;background:#e8e2d6;overflow:hidden;}
.alloc-fill{height:100%;border-radius:4px;background:var(--green);}
.alloc-fill.gold{background:var(--gold);}
.alloc-fill.light{background:#5aab7a;}
.rec-list{padding:1.25rem;}
.rec-item{border:1px solid var(--line);border-radius:10px;padding:0.9rem;margin-bottom:0.75rem;}
.rec-item:last-child{margin-bottom:0;}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.35rem;}
.rec-title{font-size:0.86rem;font-weight:700;}
.rec-badge{display:inline-block;padding:0.15rem 0.55rem;border-radius:10px;font-size:0.7rem;font-weight:600;}
.badge-buy{background:#e8f5ed;color:#1e8449;}
.badge-hold{background:#fef3cd;color:#92400e;}
.badge-reduce{background:#fde8e8;color:#c0392b;}
.rec-meta{font-size:0.72rem;color:var(--muted);}
.form-wrap{padding:1.25rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
.form-group label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:0.35rem;color:var(--muted);}
.form-group select,.form-group input{width:100%;padding:0.5rem 0.75rem;border:1px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.86rem;background:#fff;color:var(--green-dark);}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr;}.layout-2{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — محسّن المحفظة</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>محسّن المحفظة الاستثمارية</h2>
      <p>تحليل التوزيع الأمثل لمحفظتك وتوصيات لتحسين العوائد المتوافقة شرعياً</p>
    </div>
    <button class="btn btn-primary" onclick="exportPlan()">تصدير خطة التحسين</button>
  </div>

  <div class="stats" id="poStats"></div>

  <div class="layout-2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>التوزيع الحالي للمحفظة</h3></div>
      <div class="alloc-wrap" id="allocWrap"></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="card-head"><h3>توصيات التحسين</h3></div>
      <div class="rec-list" id="recList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>إعداد خطة التحسين</h3></div>
    <div class="form-wrap">
      <div class="form-row">
        <div class="form-group">
          <label>مستوى المخاطرة</label>
          <select id="riskLevel">
            <option>محافظ</option>
            <option selected>متوازن</option>
            <option>نشط</option>
          </select>
        </div>
        <div class="form-group">
          <label>أفق الاستثمار</label>
          <select id="horizon">
            <option>أقل من سنة</option>
            <option selected>١ – ٣ سنوات</option>
            <option>٣ – ٥ سنوات</option>
            <option>أكثر من ٥ سنوات</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>العائد المستهدف (%)</label>
          <input type="number" id="targetReturn" value="10" min="5" max="20">
        </div>
        <div class="form-group">
          <label>مبلغ إضافي متاح (ر.س)</label>
          <input type="number" id="extraAmount" value="50000" min="0">
        </div>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn btn-gold btn-sm" onclick="runOptimizer()">تشغيل المحسّن</button>
      <button class="btn btn-sm" style="background:#f5f0e8;color:var(--green-dark);" onclick="exportPlan()">تصدير الخطة</button>
    </div>
  </div>
</div>

<script>
const STATS = [
  { val: '٢١٠,٠٠٠ ر.س', lbl: 'قيمة المحفظة الحالية' },
  { val: '٩.٢٪', lbl: 'العائد الحالي' },
  { val: '١١.٥٪', lbl: 'العائد المستهدف' },
  { val: '٨٥٪', lbl: 'نسبة التوافق الشرعي' }
];

const ALLOCATIONS = [
  { name: 'مرابحة عقارية', pct: 55, cls: '' },
  { name: 'مرابحة تجارية', pct: 28, cls: 'gold' },
  { name: 'مرابحة لوجستية', pct: 10, cls: 'light' },
  { name: 'سيولة احتياطية', pct: 7, cls: 'light' }
];

const RECS = [
  { title: 'زيادة التعرض للمرابحة العقارية', badge: 'badge-buy', label: 'شراء', meta: 'إضافة ٢٠,٠٠٠ ر.س لرفع النسبة إلى ٦٠٪ وتحسين الاستقرار' },
  { title: 'الإبقاء على المرابحة التجارية', badge: 'badge-hold', label: 'إبقاء', meta: 'الأداء في النطاق المستهدف، لا توصية بالتغيير حالياً' },
  { title: 'تقليل السيولة الاحتياطية', badge: 'badge-reduce', label: 'تخفيض', meta: 'السيولة الزائدة تُقلص العائد الكلي — يُنصح بتوظيفها' }
];

function buildStats() {
  const wrap = document.getElementById('poStats');
  STATS.forEach(s => {
    const card = document.createElement('div'); card.className = 'stat-card';
    const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'stat-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl); wrap.appendChild(card);
  });
}

function buildAllocations() {
  const wrap = document.getElementById('allocWrap');
  ALLOCATIONS.forEach(a => {
    const item = document.createElement('div'); item.className = 'alloc-item';
    const head = document.createElement('div'); head.className = 'alloc-head';
    const name = document.createElement('span'); name.className = 'alloc-name'; name.textContent = a.name;
    const pct = document.createElement('span'); pct.className = 'alloc-pct'; pct.textContent = a.pct + '٪';
    head.appendChild(name); head.appendChild(pct);
    const bar = document.createElement('div'); bar.className = 'alloc-bar';
    const fill = document.createElement('div'); fill.className = 'alloc-fill ' + a.cls; fill.style.width = a.pct + '%';
    bar.appendChild(fill);
    item.appendChild(head); item.appendChild(bar);
    wrap.appendChild(item);
  });
}

function buildRecs() {
  const wrap = document.getElementById('recList');
  RECS.forEach(r => {
    const item = document.createElement('div'); item.className = 'rec-item';
    const head = document.createElement('div'); head.className = 'rec-head';
    const title = document.createElement('div'); title.className = 'rec-title'; title.textContent = r.title;
    const badge = document.createElement('span'); badge.className = 'rec-badge ' + r.badge; badge.textContent = r.label;
    head.appendChild(title); head.appendChild(badge);
    const meta = document.createElement('div'); meta.className = 'rec-meta'; meta.textContent = r.meta;
    item.appendChild(head); item.appendChild(meta);
    wrap.appendChild(item);
  });
}

function runOptimizer() {
  const riskLevel = document.getElementById('riskLevel').value;
  const horizon = document.getElementById('horizon').value;
  const targetReturn = document.getElementById('targetReturn').value;
  const extraAmount = document.getElementById('extraAmount').value;
  fetch('/app/me/portfolio-optimizer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-csrf-token': 'demo-token' },
    body: JSON.stringify({ riskLevel, horizon, targetReturn, extraAmount })
  }).catch(() => {});
  alert('جاري تحليل المحفظة وإعداد التوصيات...');
}

function exportPlan() {
  fetch('/app/me/portfolio-optimizer/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير خطة تحسين المحفظة...');
}

buildStats(); buildAllocations(); buildRecs();
</script>
</body>
</html>
