<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title data-en="Deal Prospectus — Murbha">نشرة الصفقة — مُرابحة</title>
<meta name="description" content="النشرة التفصيلية لصفقة الاستثمار: المشروع والعوائد والمخاطر والشروط القانونية." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .hero-name{font:900 24px Cairo,sans-serif;margin-bottom:6px;}
  .hero-sector{font:500 12px Tajawal,sans-serif;opacity:.85;}
  .hero-yield{text-align:left;}
  .yield-lbl{font:500 11px Tajawal,sans-serif;opacity:.8;}
  .yield-val{font:900 32px Cairo,sans-serif;color:var(--gold-light);}
  .yield-sub{font:500 10px Tajawal,sans-serif;opacity:.8;}
  /* Key metrics */
  .metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:20px;}
  .metric{background:rgba(255,255,255,0.12);border-radius:10px;padding:12px;}
  .metric-val{font:900 16px Cairo,sans-serif;color:#fbf6ea;}
  .metric-lbl{font:500 9px Tajawal,sans-serif;opacity:.8;margin-top:2px;}
  /* Status ribbon */
  .status-ribbon{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .ribbon-chip{background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 14px;font:700 10px Cairo,sans-serif;color:#fbf6ea;}
  .ribbon-chip.open{background:rgba(46,125,50,0.6);}
  .ribbon-chip.closing{background:rgba(160,112,32,0.6);}
  .ribbon-chip.closed{background:rgba(100,100,100,0.4);}
  /* Sections */
  .section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .prose{font:500 13px Tajawal,sans-serif;color:var(--ink);line-height:1.9;}
  /* Risk meter */
  .risk-meter{display:flex;gap:6px;margin-top:10px;}
  .risk-dot{width:28px;height:8px;border-radius:4px;background:#f0ece0;}
  .risk-dot.filled-low{background:#2e7d32;}
  .risk-dot.filled-med{background:#f9a825;}
  .risk-dot.filled-high{background:#c54a3a;}
  .risk-label{font:700 11px Cairo,sans-serif;margin-top:8px;}
  .risk-label.low{color:#2e7d32;}
  .risk-label.med{color:#f9a825;}
  .risk-label.high{color:#c54a3a;}
  /* Use of funds */
  .funds-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .funds-name{font:700 11px Cairo,sans-serif;color:var(--ink);width:120px;flex-shrink:0;}
  .funds-bar-bg{flex:1;height:10px;background:#f0ece0;border-radius:5px;overflow:hidden;}
  .funds-bar{height:100%;border-radius:5px;background:var(--green);}
  .funds-pct{font:900 10px Cairo,sans-serif;color:var(--green-dark);width:36px;text-align:left;flex-shrink:0;}
  /* Timeline */
  .timeline{position:relative;padding-right:24px;}
  .timeline::before{content:'';position:absolute;right:8px;top:0;bottom:0;width:2px;background:var(--line);}
  .tl-item{position:relative;margin-bottom:16px;}
  .tl-item:last-child{margin-bottom:0;}
  .tl-dot{position:absolute;right:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green);}
  .tl-dot.done{background:var(--green);}
  .tl-dot.current{background:var(--gold);}
  .tl-dot.future{background:#f0ece0;box-shadow:0 0 0 2px var(--line);}
  .tl-title{font:900 11px Cairo,sans-serif;color:var(--green-dark);}
  .tl-date{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  /* CTA */
  .cta-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;}
  .cta-info{flex:1;}
  .cta-raised{font:900 14px Cairo,sans-serif;color:var(--green-dark);}
  .cta-target{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .cta-bar-bg{height:4px;background:#f0ece0;border-radius:2px;margin-top:4px;}
  .cta-bar-fill{height:100%;border-radius:2px;background:var(--green);}
  .btn-invest-cta{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:12px 28px;font:900 13px Cairo,sans-serif;cursor:pointer;white-space:nowrap;}
  .btn-invest-cta:hover{background:var(--green);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero" id="heroSection">
    <div class="hero-top">
      <div>
        <div class="hero-name" id="dealName">جارٍ التحميل…</div>
        <div class="hero-sector" id="dealSector"></div>
      </div>
      <div class="hero-yield">
        <div class="yield-lbl" data-en="Expected Yield">العائد المتوقع</div>
        <div class="yield-val" id="dealYield">—</div>
        <div class="yield-sub" data-en="annually">سنوياً</div>
      </div>
    </div>
    <div class="metrics-row" id="metricsRow"></div>
    <div class="status-ribbon" id="statusRibbon"></div>
  </div>

  <div class="section">
    <div class="section-title" data-en="About the Project">عن المشروع</div>
    <div class="prose" id="aboutText"></div>
  </div>

  <div class="section">
    <div class="section-title" data-en="Use of Funds">توزيع استخدام التمويل</div>
    <div id="fundsChart"></div>
  </div>

  <div class="section">
    <div class="section-title" data-en="Risk Assessment">تقييم المخاطر</div>
    <div class="prose" id="riskDesc"></div>
    <div class="risk-meter" id="riskMeter"></div>
    <div class="risk-label" id="riskLabel"></div>
  </div>

  <div class="section">
    <div class="section-title" data-en="Investment Timeline">الجدول الزمني للاستثمار</div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="section">
    <div class="section-title" data-en="Legal Terms Summary">ملخص الشروط القانونية</div>
    <div class="prose" id="legalText"></div>
  </div>
</main>

<div class="cta-bar" id="ctaBar" style="display:none;">
  <div class="cta-info">
    <div class="cta-raised" id="ctaRaised">—</div>
    <div class="cta-target" id="ctaTarget"></div>
    <div class="cta-bar-bg"><div class="cta-bar-fill" id="ctaFill" style="width:0%"></div></div>
  </div>
  <button class="btn-invest-cta" id="btnInvest" data-en="Invest Now">استثمر الآن</button>
</div>

<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function placeholder(el,msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  const url=new URL(window.location.href);
  const dealId=url.searchParams.get('id')||url.searchParams.get('dealId')||'';

  const statusMap={open:'مفتوح للاستثمار',closing:'يقترب من الإغلاق',closed:'مغلق',active:'نشط'};
  const statusChip={open:'open',closing:'closing',closed:'closed',active:'open'};
  const riskLevels={low:{label:'منخفضة',cls:'low',dots:2},medium:{label:'متوسطة',cls:'med',dots:3},high:{label:'مرتفعة',cls:'high',dots:5}};

  (async function load(){
    if(!dealId){ placeholder(document.getElementById('aboutText'),'لم يُحدَّد معرّف الصفقة. أضف ?id=DEAL_ID إلى الرابط.'); return; }
    try{
      const r=await fetch('/app/deals/'+encodeURIComponent(dealId)+'/prospectus');
      if(!r.ok){ placeholder(document.getElementById('aboutText'),'تعذّر تحميل نشرة الصفقة.'); return; }
      const d=await r.json();

      document.getElementById('dealName').textContent=d.name||'صفقة';
      document.getElementById('dealSector').textContent=d.sector||'—';
      document.getElementById('dealYield').textContent=(d.expectedYield||0).toFixed(1)+'٪';

      const metricsRow=document.getElementById('metricsRow');
      [{lbl:'الحد الأدنى',val:fmt(d.minInvestment||0)+' ر.س'},{lbl:'المدة',val:String(d.duration||0)+' شهر'},{lbl:'التمويل المطلوب',val:fmt(d.targetAmount||0)+' ر.س'},{lbl:'تاريخ الإغلاق',val:(d.closingDate||'—').slice(0,10)}].forEach(m=>{
        const el=document.createElement('div'); el.className='metric';
        const v=document.createElement('div'); v.className='metric-val'; v.textContent=m.val;
        const l=document.createElement('div'); l.className='metric-lbl'; l.textContent=m.lbl;
        el.appendChild(v); el.appendChild(l); metricsRow.appendChild(el);
      });

      const ribbon=document.getElementById('statusRibbon');
      const chip=document.createElement('div'); chip.className='ribbon-chip '+(statusChip[d.status]||'open'); chip.textContent=statusMap[d.status]||d.status||'—';
      ribbon.appendChild(chip);
      if(d.shariahCertified){ const sc=document.createElement('div'); sc.className='ribbon-chip'; sc.textContent='✓ معتمد شرعياً'; ribbon.appendChild(sc); }

      document.getElementById('aboutText').textContent=d.description||'لا يوجد وصف متاح.';

      const fundsChart=document.getElementById('fundsChart');
      const funds=d.useOfFunds||[];
      if(!funds.length){ placeholder(fundsChart,'لا توجد بيانات.'); }
      else{
        funds.forEach(f=>{
          const row=document.createElement('div'); row.className='funds-row';
          const name=document.createElement('div'); name.className='funds-name'; name.textContent=f.label||'—';
          const bg=document.createElement('div'); bg.className='funds-bar-bg';
          const bar=document.createElement('div'); bar.className='funds-bar'; bar.style.width=(f.pct||0)+'%';
          bg.appendChild(bar);
          const pct=document.createElement('div'); pct.className='funds-pct'; pct.textContent=(f.pct||0)+'٪';
          row.appendChild(name); row.appendChild(bg); row.appendChild(pct);
          fundsChart.appendChild(row);
        });
      }

      document.getElementById('riskDesc').textContent=d.riskDescription||'لا يوجد وصف للمخاطر.';
      const riskLevel=riskLevels[d.riskLevel||'medium'];
      const meter=document.getElementById('riskMeter');
      for(let i=0;i<5;i++){
        const dot=document.createElement('div'); dot.className='risk-dot';
        if(i<riskLevel.dots) dot.classList.add('filled-'+riskLevel.cls);
        meter.appendChild(dot);
      }
      const rLabel=document.getElementById('riskLabel'); rLabel.className='risk-label '+riskLevel.cls; rLabel.textContent='مستوى المخاطرة: '+riskLevel.label;

      const tl=document.getElementById('timeline');
      const milestones=d.milestones||[];
      if(!milestones.length){ placeholder(tl,'لا توجد مراحل.'); }
      else{
        milestones.forEach(ms=>{
          const item=document.createElement('div'); item.className='tl-item';
          const dot=document.createElement('div'); dot.className='tl-dot '+(ms.status==='done'?'done':ms.status==='current'?'current':'future');
          const title=document.createElement('div'); title.className='tl-title'; title.textContent=ms.title||'—';
          const date=document.createElement('div'); date.className='tl-date'; date.textContent=ms.date||'—';
          item.appendChild(dot); item.appendChild(title); item.appendChild(date);
          tl.appendChild(item);
        });
      }

      document.getElementById('legalText').textContent=d.legalSummary||'يُرجى مراجعة الوثائق القانونية الكاملة قبل الاستثمار.';

      if(d.status==='open'||d.status==='closing'){
        const raised=d.amountRaised||0; const target=d.targetAmount||1;
        const pct=Math.min(100,Math.round((raised/target)*100));
        document.getElementById('ctaRaised').textContent='تم تمويل '+fmt(raised)+' ر.س ('+pct+'٪)';
        document.getElementById('ctaTarget').textContent='الهدف: '+fmt(target)+' ر.س';
        document.getElementById('ctaFill').style.width=pct+'%';
        document.getElementById('ctaBar').style.display='flex';
        document.getElementById('btnInvest').addEventListener('click',()=>{ window.location.href='/deal/'+encodeURIComponent(dealId); });
      }
    }catch{ placeholder(document.getElementById('aboutText'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
