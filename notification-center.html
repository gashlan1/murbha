<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>مركز الإشعارات — مُرابحة</title>
<meta name="description" content="جميع إشعاراتك في مكان واحد: توزيعات، تحديثات الصفقات، وتنبيهات الحساب." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:36px 22px;margin-bottom:18px;text-align:center;}
  .hero h1{font:900 26px Cairo,sans-serif;margin-bottom:6px;}
  .hero p{font:500 13px Tajawal,sans-serif;opacity:.92;max-width:560px;margin:0 auto;line-height:1.8;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:700 11px Cairo,sans-serif;color:var(--muted);cursor:pointer;}
  .tab-btn.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .top-actions{display:flex;gap:8px;}
  .btn-read-all{background:var(--paper);color:var(--green);border:1px solid var(--green);border-radius:8px;padding:7px 14px;font:700 11px Cairo,sans-serif;cursor:pointer;}
  .notif-list{display:grid;gap:8px;}
  .notif-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;transition:background .15s;cursor:pointer;}
  .notif-card.unread{background:#f0f9f4;border-color:rgba(10,77,54,.12);}
  .notif-card:hover{background:#e8f5e9;}
  .notif-card.unread:hover{background:#d9f0e4;}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:6px;}
  .notif-dot.read{background:transparent;}
  .notif-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ico-payout{background:#e8f5e9;} .ico-deal{background:#fdf5e4;} .ico-account{background:#e3f2fd;}
  .ico-alert{background:#fdecea;} .ico-system{background:var(--paper);}
  .notif-body{flex:1;}
  .notif-title{font:700 13px Cairo,sans-serif;color:var(--green-dark);margin-bottom:3px;}
  .notif-text{font:500 12px Tajawal,sans-serif;color:var(--muted);line-height:1.6;}
  .notif-time{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:4px;}
  .notif-action{font:700 11px Cairo,sans-serif;color:var(--green);margin-top:6px;text-decoration:none;display:inline-block;}
  .empty-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .unread-count{background:var(--green);color:#fbf6ea;border-radius:99px;padding:1px 7px;font:700 10px Cairo,sans-serif;margin-right:4px;}
  .pref-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px;}
  .pref-section h2{font:900 16px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;}
  .pref-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .pref-row:last-child{border-bottom:none;}
  .pref-label{font:500 12px Tajawal,sans-serif;color:var(--ink);}
  .toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer;}
  .toggle input:checked+.toggle-slider{background:var(--green);}
  .toggle-slider:before{content:'';position:absolute;height:16px;width:16px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle input:checked+.toggle-slider:before{transform:translateX(-18px);}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1>🔔 مركز الإشعارات</h1>
    <p>تتبّع توزيعاتك، تحديثات الصفقات، وكل ما يهمّك في مكان واحد.</p>
  </div>

  <div class="top-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="tab-btn active" data-type="">الكلّ</button>
      <button class="tab-btn" data-type="payout">توزيعات</button>
      <button class="tab-btn" data-type="deal">صفقات</button>
      <button class="tab-btn" data-type="account">الحساب</button>
      <button class="tab-btn" data-type="alert">تنبيهات</button>
    </div>
    <div class="top-actions">
      <button class="btn-read-all" id="readAllBtn">✓ قراءة الكلّ</button>
    </div>
  </div>

  <div class="notif-list" id="notifList">
    <p class="empty-msg">جارٍ التحميل…</p>
  </div>

  <div class="pref-section">
    <h2>⚙️ تفضيلات الإشعارات</h2>
    <div id="prefList">
      <p class="empty-msg">جارٍ التحميل…</p>
    </div>
  </div>
</main>
<script>
(function(){
  let allNotifs = [];
  let activeType = '';
  let prefs = {};

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }

  function timeAgo(s){
    if(!s) return '';
    const diff = Date.now() - new Date(s).getTime();
    const mins = Math.floor(diff/60000);
    const hours = Math.floor(diff/3600000);
    const days = Math.floor(diff/86400000);
    if(mins < 60) return mins + ' دقيقة';
    if(hours < 24) return hours + ' ساعة';
    return days + ' يوم';
  }

  const TYPE_ICO = { payout:'💰', deal:'📋', account:'🔒', alert:'⚠️', system:'🌿' };
  const TYPE_BG = { payout:'ico-payout', deal:'ico-deal', account:'ico-account', alert:'ico-alert', system:'ico-system' };

  function render(){
    const list = document.getElementById('notifList');
    list.textContent = '';
    const filtered = allNotifs.filter(n => !activeType || n.type === activeType);
    if(!filtered.length){
      const m = document.createElement('p');
      m.className = 'empty-msg';
      m.textContent = 'لا توجد إشعارات.';
      list.appendChild(m);
      return;
    }
    filtered.forEach(n => {
      const card = document.createElement('div');
      card.className = 'notif-card' + (n.read ? '' : ' unread');
      card.addEventListener('click', () => markRead(n.id, card));

      const dot = document.createElement('div');
      dot.className = 'notif-dot' + (n.read ? ' read' : '');

      const ico = document.createElement('div');
      ico.className = 'notif-ico ' + (TYPE_BG[n.type] || 'ico-system');
      ico.textContent = TYPE_ICO[n.type] || '🔔';

      const body = document.createElement('div');
      body.className = 'notif-body';

      const title = document.createElement('div');
      title.className = 'notif-title';
      title.textContent = n.title;

      const text = document.createElement('div');
      text.className = 'notif-text';
      text.textContent = n.body;

      const time = document.createElement('div');
      time.className = 'notif-time';
      time.textContent = 'منذ ' + timeAgo(n.createdAt);

      body.appendChild(title);
      body.appendChild(text);
      body.appendChild(time);

      if(n.actionUrl && n.actionLabel){
        const lnk = document.createElement('a');
        lnk.className = 'notif-action';
        lnk.href = n.actionUrl;
        lnk.textContent = n.actionLabel + ' ←';
        lnk.addEventListener('click', e => e.stopPropagation());
        body.appendChild(lnk);
      }

      card.appendChild(dot);
      card.appendChild(ico);
      card.appendChild(body);
      list.appendChild(card);
    });
  }

  async function markRead(id, card){
    if(card.classList.contains('unread')){
      try{
        await fetch('/app/me/notifications/'+encodeURIComponent(id)+'/read', {
          method: 'PUT',
          headers: { 'X-CSRF-Token': csrf() }
        });
      }catch{}
      card.classList.remove('unread');
      const dot = card.querySelector('.notif-dot');
      if(dot) dot.classList.add('read');
      const n = allNotifs.find(x => x.id === id);
      if(n) n.read = true;
    }
  }

  async function markAllRead(){
    try{
      await fetch('/app/me/notifications/read-all', {
        method: 'PUT',
        headers: { 'X-CSRF-Token': csrf() }
      });
    }catch{}
    allNotifs.forEach(n => { n.read = true; });
    render();
  }

  function renderPrefs(prefData){
    const prefList = document.getElementById('prefList');
    prefList.textContent = '';
    const PREF_LABELS = [
      {key:'payout',label:'إشعارات التوزيعات'},
      {key:'deal_update',label:'تحديثات الصفقات'},
      {key:'deal_closing',label:'تنبيه اقتراب إغلاق الصفقة'},
      {key:'account_activity',label:'نشاط الحساب (إيداع/سحب)'},
      {key:'marketing',label:'العروض والفرص الجديدة'},
    ];
    PREF_LABELS.forEach(pref => {
      const row = document.createElement('div');
      row.className = 'pref-row';
      const lbl = document.createElement('div');
      lbl.className = 'pref-label';
      lbl.textContent = pref.label;
      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = prefData[pref.key] !== false;
      input.addEventListener('change', () => savePref(pref.key, input.checked));
      const slider = document.createElement('span');
      slider.className = 'toggle-slider';
      toggle.appendChild(input);
      toggle.appendChild(slider);
      row.appendChild(lbl);
      row.appendChild(toggle);
      prefList.appendChild(row);
    });
  }

  async function savePref(key, val){
    try{
      prefs[key] = val;
      await fetch('/app/me/notification-prefs', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
        body: JSON.stringify({ [key]: val })
      });
    }catch{}
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      render();
    });
  });

  document.getElementById('readAllBtn').addEventListener('click', markAllRead);

  (async function load(){
    try{
      const [nr, pr] = await Promise.all([
        fetch('/app/me/notification-center'),
        fetch('/app/me/notification-prefs')
      ]);
      if(!nr.ok){
        const list = document.getElementById('notifList');
        list.textContent = '';
        const m = document.createElement('p'); m.className='empty-msg';
        m.textContent = nr.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.';
        list.appendChild(m);
        return;
      }
      const nd = await nr.json();
      allNotifs = nd.notifications || [];
      render();
      if(pr.ok){
        const pd = await pr.json();
        prefs = pd.prefs || {};
        renderPrefs(prefs);
      }
    }catch{
      const list = document.getElementById('notifList');
      list.textContent = '';
      const m = document.createElement('p'); m.className='empty-msg'; m.textContent='تعذّر التحميل. حاول لاحقاً.';
      list.appendChild(m);
    }
  }());
}());
</script>
</body>
</html>
