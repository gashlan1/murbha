<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>قائمة المتابعة — مُرابحة</title>
<meta name="description" content="احفظ الصفقات التي تهمّك وتابع توفّرها. احصل على تنبيه فور فتح الاشتراك." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .summary-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;flex:1;min-width:110px;}
  .chip-val{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .chip-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .watchlist{display:grid;gap:12px;}
  .deal-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  @media(max-width:540px){.deal-card{flex-direction:column;}}
  .deal-sector{font:700 9px Cairo,sans-serif;background:var(--paper);border-radius:5px;padding:2px 8px;color:var(--muted);display:inline-block;margin-bottom:5px;}
  .deal-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:5px;}
  .deal-meta{font:500 11px Tajawal,sans-serif;color:var(--muted);line-height:1.9;}
  .deal-actions{display:flex;flex-direction:column;gap:7px;flex-shrink:0;align-items:flex-end;}
  .badge-open{background:#e8f5e9;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;color:#2e7d32;}
  .badge-closed{background:var(--paper);border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;color:var(--muted);}
  .badge-soon{background:#fff8e1;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;color:#a07020;}
  .btn-invest{background:var(--green);color:#fbf6ea;border:none;border-radius:8px;padding:7px 16px;font:700 11px Cairo,sans-serif;cursor:pointer;}
  .btn-remove{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:700 10px Cairo,sans-serif;cursor:pointer;color:#c54a3a;}
  .btn-notify{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:700 10px Cairo,sans-serif;cursor:pointer;color:var(--green);}
  .btn-notify.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .empty-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>⭐ قائمة المتابعة</h1>
    <p>احفظ الصفقات التي تهمّك وتابع حالتها. سنُرسل لك تنبيهاً فور فتح الاشتراك.</p>
  </div>

  <div class="summary-row" id="summaryRow">
    <div class="chip"><div class="chip-val">—</div><div class="chip-lbl">صفقات محفوظة</div></div>
    <div class="chip"><div class="chip-val">—</div><div class="chip-lbl">مفتوحة الآن</div></div>
    <div class="chip"><div class="chip-val">—</div><div class="chip-lbl">قريباً</div></div>
  </div>

  <div class="watchlist" id="watchlistArea"><p class="empty-msg">جارٍ التحميل…</p></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  const CAT={real_estate:'عقارات',logistics:'لوجستيات',agri:'زراعة',tech:'تقنية',energy:'طاقة'};
  const STATUS_LABELS={open:'مفتوح',closed:'مغلق',soon:'قريباً'};

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){
    const t=document.getElementById('toast'); t.textContent=msg;
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400);
  }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  function renderSummary(items){
    const row=document.getElementById('summaryRow'); row.textContent='';
    const open=items.filter(i=>i.status==='open').length;
    const soon=items.filter(i=>i.status==='soon').length;
    [{val:items.length,lbl:'صفقات محفوظة'},{val:open,lbl:'مفتوحة الآن'},{val:soon,lbl:'قريباً'}].forEach(it=>{
      const chip=document.createElement('div'); chip.className='chip';
      const v=document.createElement('div'); v.className='chip-val'; v.textContent=it.val;
      const l=document.createElement('div'); l.className='chip-lbl'; l.textContent=it.lbl;
      chip.appendChild(v); chip.appendChild(l); row.appendChild(chip);
    });
  }

  function renderWatchlist(items){
    const area=document.getElementById('watchlistArea'); area.textContent='';
    if(!items.length){
      const m=document.createElement('p'); m.className='empty-msg';
      m.textContent='قائمة المتابعة فارغة. استعرض الصفقات وأضف ما يهمّك.'; area.appendChild(m); return;
    }
    items.forEach(item=>{
      const card=document.createElement('div'); card.className='deal-card';
      const info=document.createElement('div');
      const sec=document.createElement('div'); sec.className='deal-sector'; sec.textContent=CAT[item.sector]||item.sector||'—';
      const title=document.createElement('div'); title.className='deal-title'; title.textContent=item.title||'—';
      const meta=document.createElement('div'); meta.className='deal-meta';
      [
        'العائد السنوي: '+(item.yield||0)+'٪',
        'المبلغ المطلوب: '+fmt(item.targetAmount||0)+' ر.س',
        'المدة: '+(item.tenor||'—')+' شهر',
      ].forEach(line=>{ const span=document.createElement('span'); span.textContent=line; meta.appendChild(span); meta.appendChild(document.createElement('br')); });
      info.appendChild(sec); info.appendChild(title); info.appendChild(meta);

      const actions=document.createElement('div'); actions.className='deal-actions';
      const badge=document.createElement('div');
      badge.className='badge-'+(item.status||'closed');
      badge.textContent=STATUS_LABELS[item.status]||'—';
      actions.appendChild(badge);

      if(item.status==='open'){
        const investBtn=document.createElement('button'); investBtn.className='btn-invest';
        investBtn.textContent='استثمر الآن';
        investBtn.addEventListener('click',()=>{ window.location.href='project.html?id='+encodeURIComponent(item.dealId); });
        actions.appendChild(investBtn);
      } else {
        const notifyBtn=document.createElement('button');
        notifyBtn.className='btn-notify'+(item.notifyEnabled?' active':'');
        notifyBtn.textContent=item.notifyEnabled?'🔔 مفعَّل':'🔕 تنبيه';
        notifyBtn.addEventListener('click',()=>toggleNotify(item.id, notifyBtn));
        actions.appendChild(notifyBtn);
      }

      const removeBtn=document.createElement('button'); removeBtn.className='btn-remove';
      removeBtn.textContent='حذف';
      removeBtn.addEventListener('click',()=>removeItem(item.id, card));
      actions.appendChild(removeBtn);

      card.appendChild(info); card.appendChild(actions);
      area.appendChild(card);
    });
  }

  async function toggleNotify(id, btn){
    try{
      const r=await fetch('/app/me/watchlist/'+encodeURIComponent(id)+'/notify',{method:'PUT',headers:{'X-CSRF-Token':csrf()}});
      if(!r.ok){ showToast('تعذّر تحديث التنبيه.'); return; }
      const d=await r.json();
      btn.classList.toggle('active', !!d.notifyEnabled);
      btn.textContent=d.notifyEnabled?'🔔 مفعَّل':'🔕 تنبيه';
      showToast(d.notifyEnabled?'سيصلك تنبيه عند فتح الصفقة ✅':'تم إلغاء التنبيه');
    }catch{ showToast('خطأ في الاتصال.'); }
  }

  async function removeItem(id, card){
    try{
      const r=await fetch('/app/me/watchlist/'+encodeURIComponent(id),{method:'DELETE',headers:{'X-CSRF-Token':csrf()}});
      if(!r.ok){ showToast('تعذّر الحذف.'); return; }
      card.remove();
      showToast('تم الحذف من قائمة المتابعة.');
    }catch{ showToast('خطأ في الاتصال.'); }
  }

  (async function load(){
    try{
      const r=await fetch('/app/me/watchlist');
      if(!r.ok){
        const area=document.getElementById('watchlistArea'); area.textContent='';
        const m=document.createElement('p'); m.className='empty-msg';
        m.textContent=r.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.'; area.appendChild(m); return;
      }
      const d=await r.json();
      renderSummary(d.items||[]);
      renderWatchlist(d.items||[]);
    }catch{
      const area=document.getElementById('watchlistArea'); area.textContent='';
      const m=document.createElement('p'); m.className='empty-msg'; m.textContent='تعذّر التحميل.'; area.appendChild(m);
    }
  }());
}());
</script>
</body>
</html>
