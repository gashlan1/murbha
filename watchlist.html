<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>قائمة المتابعة — مُرابحة</title>
<meta name="description" content="تابع الصفقات التي تهمّك وتلقَّ إشعاراً فور فتحها للاستثمار." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .add-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .add-select{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);background:#fff;}
  .add-select:focus{outline:none;border-color:var(--green);}
  .btn-add{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:10px 20px;font:700 12px Cairo,sans-serif;cursor:pointer;flex-shrink:0;}
  .btn-add:hover{background:var(--green);}
  .watchlist-grid{display:grid;gap:14px;}
  .watch-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}
  .watch-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .watch-name{font:900 14px Cairo,sans-serif;color:var(--green-dark);}
  .watch-sector{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .btn-remove{background:transparent;border:none;cursor:pointer;color:#c54a3a;font:700 11px Cairo,sans-serif;flex-shrink:0;}
  .watch-stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;}
  .watch-stat{display:flex;flex-direction:column;gap:2px;}
  .stat-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .stat-val{font:900 13px Cairo,sans-serif;color:var(--ink);}
  .watch-status{display:flex;align-items:center;gap:8px;}
  .status-badge{border-radius:6px;padding:4px 10px;font:700 10px Cairo,sans-serif;}
  .s-open{background:#e8f5e9;color:#2e7d32;}
  .s-coming{background:#fff8e1;color:#a07020;}
  .s-closed{background:#f5f5f5;color:#888;}
  .btn-invest{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:8px;padding:8px 18px;font:700 11px Cairo,sans-serif;cursor:pointer;}
  .btn-invest:hover{background:var(--green);}
  .notify-toggle{display:flex;align-items:center;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .notify-lbl{font:500 11px Tajawal,sans-serif;color:var(--muted);flex:1;}
  .toggle{position:relative;width:40px;height:22px;}
  .toggle input{opacity:0;width:0;height:0;position:absolute;}
  .tgl-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--line);border-radius:22px;cursor:pointer;transition:.2s;}
  .toggle input:checked+.tgl-slider{background:var(--green);}
  .tgl-slider:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;bottom:3px;right:3px;transition:.2s;}
  .toggle input:checked+.tgl-slider:before{transform:translateX(-18px);}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>قائمة المتابعة</h1>
    <p>أضف الصفقات التي تهمّك وفعّل الإشعارات لتعلم فور فتحها للاستثمار.</p>
  </div>

  <div class="add-card">
    <select class="add-select" id="dealSelect"><option value="">اختر صفقة لإضافتها…</option></select>
    <button class="btn-add" id="addBtn">إضافة للمتابعة</button>
  </div>

  <div class="watchlist-grid" id="watchGrid"></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function placeholder(area, msg){ area.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; area.appendChild(p); }

  function statusLabel(s){ const m={open:'مفتوحة للاستثمار',coming:'قريباً',closed:'مغلقة'}; return m[s]||s||'—'; }
  function statusCls(s){ return 'status-badge s-'+(s==='open'?'open':s==='coming'?'coming':'closed'); }

  function renderCard(w, grid){
    const card=document.createElement('div'); card.className='watch-card'; card.id='wc-'+w.dealId;
    const hdr=document.createElement('div'); hdr.className='watch-header';
    const left=document.createElement('div');
    const name=document.createElement('div'); name.className='watch-name'; name.textContent=w.dealName||'صفقة';
    const sector=document.createElement('div'); sector.className='watch-sector'; sector.textContent=w.sector||'—';
    left.appendChild(name); left.appendChild(sector);
    const rmBtn=document.createElement('button'); rmBtn.className='btn-remove'; rmBtn.textContent='إزالة';
    const did=w.dealId;
    rmBtn.addEventListener('click', async()=>{
      try{
        const r=await fetch('/app/me/watchlist/'+encodeURIComponent(did),{method:'DELETE',headers:{'X-CSRF-Token':csrf()}});
        if(!r.ok){ showToast('تعذّر الإزالة.'); return; }
        document.getElementById('wc-'+did)?.remove();
        if(!document.querySelector('.watch-card')) placeholder(grid,'لا توجد صفقات في قائمة متابعتك.');
        showToast('تمت الإزالة.');
      }catch{ showToast('خطأ.'); }
    });
    hdr.appendChild(left); hdr.appendChild(rmBtn); card.appendChild(hdr);

    const stats=document.createElement('div'); stats.className='watch-stats';
    [[fmt(w.targetAmount||0)+' ر.س','حجم التمويل'],[String(w.expectedYield||0)+'٪','العائد المتوقع'],[String(w.durationMonths||0)+' شهر','المدة'],[fmt(w.minInvestment||0)+' ر.س','الحد الأدنى']].forEach(([v,l])=>{
      const s=document.createElement('div'); s.className='watch-stat';
      const sv=document.createElement('div'); sv.className='stat-val'; sv.textContent=v;
      const sl=document.createElement('div'); sl.className='stat-lbl'; sl.textContent=l;
      s.appendChild(sv); s.appendChild(sl); stats.appendChild(s);
    });
    card.appendChild(stats);

    const statusRow=document.createElement('div'); statusRow.className='watch-status';
    const badge=document.createElement('div'); badge.className=statusCls(w.status); badge.textContent=statusLabel(w.status);
    statusRow.appendChild(badge);
    if(w.status==='open'){
      const invBtn=document.createElement('button'); invBtn.className='btn-invest'; invBtn.textContent='استثمر الآن';
      invBtn.addEventListener('click',()=>{ window.location.href='project.html?id='+encodeURIComponent(did); });
      statusRow.appendChild(invBtn);
    }
    card.appendChild(statusRow);

    const notify=document.createElement('div'); notify.className='notify-toggle';
    const nlbl=document.createElement('div'); nlbl.className='notify-lbl'; nlbl.textContent='إشعار عند الفتح';
    const tgl=document.createElement('label'); tgl.className='toggle';
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=!!w.notify;
    const slider=document.createElement('span'); slider.className='tgl-slider';
    tgl.appendChild(inp); tgl.appendChild(slider);
    inp.addEventListener('change', async()=>{
      try{ await fetch('/app/me/watchlist/'+encodeURIComponent(did)+'/notify',{method:'PUT',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({notify:inp.checked})}); }catch{}
    });
    notify.appendChild(nlbl); notify.appendChild(tgl); card.appendChild(notify);
    grid.appendChild(card);
  }

  async function loadWatchlist(){
    const grid=document.getElementById('watchGrid'); placeholder(grid,'جارٍ التحميل…');
    try{
      const r=await fetch('/app/me/watchlist');
      if(!r.ok){ placeholder(grid, r.status===401?'يجب تسجيل الدخول.':'تعذّر التحميل.'); return; }
      const d=await r.json();
      grid.textContent='';
      const items=d.watchlist||[];
      if(!items.length){ placeholder(grid,'لا توجد صفقات في قائمة متابعتك.'); }
      else{ items.forEach(w=>renderCard(w,grid)); }
    }catch{ placeholder(document.getElementById('watchGrid'),'خطأ في الاتصال.'); }
  }

  async function loadDeals(){
    const sel=document.getElementById('dealSelect');
    try{
      const r=await fetch('/app/deals');
      if(!r.ok) return;
      const d=await r.json();
      (d.deals||[]).forEach(deal=>{
        const opt=document.createElement('option'); opt.value=deal.id; opt.textContent=(deal.name||deal.id)+' — '+(deal.sector||'—'); sel.appendChild(opt);
      });
    }catch{}
  }

  document.getElementById('addBtn').addEventListener('click', async()=>{
    const dealId=document.getElementById('dealSelect').value;
    if(!dealId){ showToast('الرجاء اختيار صفقة.'); return; }
    try{
      const r=await fetch('/app/me/watchlist',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({dealId})});
      if(!r.ok){ showToast(r.status===409?'الصفقة مضافة بالفعل.':'تعذّر الإضافة.'); return; }
      showToast('تمت الإضافة إلى قائمة المتابعة.');
      loadWatchlist();
    }catch{ showToast('خطأ في الاتصال.'); }
  });

  loadWatchlist();
  loadDeals();
}());
</script>
</body>
</html>
