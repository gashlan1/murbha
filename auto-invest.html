<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>الاستثمار التلقائي — مُرابحة</title>
<meta name="description" content="ضبط قواعد الاستثمار التلقائي. حدّد معاييرك واتركنا نستثمر نيابةً عنك فور توفّر صفقة مناسبة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .status-bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
  .status-label{font:700 13px Cairo,sans-serif;color:var(--green-dark);}
  .toggle-wrap{display:flex;align-items:center;gap:10px;}
  .toggle-lbl{font:700 11px Cairo,sans-serif;color:var(--muted);}
  .toggle{position:relative;width:46px;height:26px;cursor:pointer;}
  .toggle input{opacity:0;width:0;height:0;position:absolute;}
  .toggle-track{position:absolute;inset:0;background:#ccc;border-radius:99px;transition:.3s;}
  .toggle input:checked+.toggle-track{background:var(--green);}
  .toggle-thumb{position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s;pointer-events:none;}
  .toggle input:checked~.toggle-thumb{right:23px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .card h2{font:900 16px Cairo,sans-serif;color:var(--green-dark);margin-bottom:16px;}
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.fields-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font:700 11px Cairo,sans-serif;color:var(--muted);}
  .field select,.field input{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:500 12px Tajawal,sans-serif;background:var(--paper);}
  .field select:focus,.field input:focus{outline:none;border-color:var(--green);}
  .field .hint{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:4px;}
  .cat-btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:700 11px Cairo,sans-serif;color:var(--muted);cursor:pointer;text-align:center;}
  .cat-btn.selected{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .btn-save{background:var(--green);color:#fbf6ea;border:none;border-radius:10px;padding:11px 28px;font:700 13px Cairo,sans-serif;cursor:pointer;margin-top:14px;}
  .history-table{width:100%;border-collapse:collapse;font:500 12px Tajawal,sans-serif;}
  .history-table th{background:var(--paper);font:900 11px Cairo,sans-serif;color:var(--green-dark);padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;}
  .history-table td{padding:10px 12px;border-bottom:1px solid var(--line);}
  .history-table tr:last-child td{border-bottom:none;}
  .badge-success{background:#e8f5e9;border-radius:5px;padding:2px 8px;font:700 9px Cairo,sans-serif;color:#2e7d32;}
  .badge-skip{background:var(--paper);border-radius:5px;padding:2px 8px;font:700 9px Cairo,sans-serif;color:var(--muted);}
  .empty-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:32px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>⚡ الاستثمار التلقائي</h1>
    <p>حدّد قواعدك مرّة واحدة ونستثمر نيابةً عنك فور توفّر صفقة تطابق معاييرك.</p>
  </div>

  <div class="status-bar">
    <div class="status-label" id="statusLabel">الاستثمار التلقائي: جارٍ التحميل…</div>
    <div class="toggle-wrap">
      <span class="toggle-lbl" id="toggleLbl">تحميل…</span>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" disabled />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <div class="card">
    <h2>⚙️ قواعد الاستثمار التلقائي</h2>
    <div class="fields-grid">
      <div class="field">
        <label>المبلغ لكل صفقة (ر.س)</label>
        <input type="number" id="amountPerDeal" placeholder="مثلاً: 5000" min="500" step="500" />
        <span class="hint">الحد الأدنى 500 ر.س لكل صفقة</span>
      </div>
      <div class="field">
        <label>الحدّ الأقصى الشهري (ر.س)</label>
        <input type="number" id="monthlyMax" placeholder="مثلاً: 20000" min="500" step="1000" />
        <span class="hint">لن يتجاوز الاستثمار هذا المبلغ شهرياً</span>
      </div>
      <div class="field">
        <label>الحدّ الأدنى للعائد السنوي (٪)</label>
        <input type="number" id="minYield" placeholder="مثلاً: 8" min="0" max="30" step="0.5" />
      </div>
      <div class="field">
        <label>الحدّ الأقصى للمدة (أشهر)</label>
        <input type="number" id="maxTenor" placeholder="مثلاً: 18" min="1" max="60" />
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label>القطاعات المفضّلة</label>
      <div class="cats-grid" id="catsGrid">
        <button class="cat-btn" data-cat="real_estate">🏢 عقارات</button>
        <button class="cat-btn" data-cat="logistics">🚚 لوجستيات</button>
        <button class="cat-btn" data-cat="agri">🌾 زراعة</button>
        <button class="cat-btn" data-cat="tech">💻 تقنية</button>
        <button class="cat-btn" data-cat="energy">⚡ طاقة</button>
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label>الحدّ الأقصى للتركّز في صفقة واحدة</label>
      <select id="maxConcentration">
        <option value="10">١٠٪ من المحفظة</option>
        <option value="20" selected>٢٠٪ من المحفظة</option>
        <option value="30">٣٠٪ من المحفظة</option>
        <option value="50">٥٠٪ من المحفظة</option>
      </select>
    </div>
    <button class="btn-save" id="saveBtn">حفظ القواعد</button>
  </div>

  <div class="card">
    <h2>📋 سجل الاستثمارات التلقائية</h2>
    <div id="historyArea"><p class="empty-msg">جارٍ التحميل…</p></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  let selectedCats = new Set();

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){
    const t=document.getElementById('toast'); t.textContent=msg;
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400);
  }

  document.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const c=btn.dataset.cat;
      if(selectedCats.has(c)){ selectedCats.delete(c); btn.classList.remove('selected'); }
      else { selectedCats.add(c); btn.classList.add('selected'); }
    });
  });

  function applySettings(s){
    if(!s) return;
    if(s.amountPerDeal) document.getElementById('amountPerDeal').value=s.amountPerDeal;
    if(s.monthlyMax) document.getElementById('monthlyMax').value=s.monthlyMax;
    if(s.minYield) document.getElementById('minYield').value=s.minYield;
    if(s.maxTenor) document.getElementById('maxTenor').value=s.maxTenor;
    if(s.maxConcentration) document.getElementById('maxConcentration').value=s.maxConcentration;
    if(Array.isArray(s.categories)){
      selectedCats=new Set(s.categories);
      document.querySelectorAll('.cat-btn').forEach(btn=>{
        btn.classList.toggle('selected', selectedCats.has(btn.dataset.cat));
      });
    }
    const tog=document.getElementById('enabledToggle');
    tog.disabled=false; tog.checked=!!s.enabled;
    document.getElementById('toggleLbl').textContent=s.enabled?'مُفعَّل':'موقوف';
    document.getElementById('statusLabel').textContent='الاستثمار التلقائي: '+(s.enabled?'نشط ✅':'موقوف');
  }

  function renderHistory(items){
    const area=document.getElementById('historyArea'); area.textContent='';
    if(!items||!items.length){
      const m=document.createElement('p'); m.className='empty-msg'; m.textContent='لا توجد استثمارات تلقائية بعد.'; area.appendChild(m); return;
    }
    const table=document.createElement('table'); table.className='history-table';
    const thead=document.createElement('thead'); const hr=document.createElement('tr');
    ['الصفقة','التاريخ','المبلغ','العائد','الحالة'].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hr.appendChild(th); });
    thead.appendChild(hr); table.appendChild(thead);
    const tbody=document.createElement('tbody');
    items.forEach(item=>{
      const tr=document.createElement('tr');
      [
        item.dealName||'—',
        item.date||'—',
        Number(item.amount||0).toLocaleString('ar-SA')+' ر.س',
        (item.yield||0)+'٪',
      ].forEach(val=>{ const td=document.createElement('td'); td.textContent=val; tr.appendChild(td); });
      const tdS=document.createElement('td');
      const badge=document.createElement('span');
      badge.className=item.status==='invested'?'badge-success':'badge-skip';
      badge.textContent=item.status==='invested'?'تم الاستثمار':'تجاوز';
      tdS.appendChild(badge); tr.appendChild(tdS);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); area.appendChild(table);
  }

  document.getElementById('enabledToggle').addEventListener('change', async function(){
    const enabled=this.checked;
    try{
      const r=await fetch('/app/me/auto-invest/toggle',{method:'PUT',headers:{'X-CSRF-Token':csrf()}});
      if(!r.ok){ this.checked=!enabled; showToast('تعذّر التحديث.'); return; }
      document.getElementById('toggleLbl').textContent=enabled?'مُفعَّل':'موقوف';
      document.getElementById('statusLabel').textContent='الاستثمار التلقائي: '+(enabled?'نشط ✅':'موقوف');
      showToast(enabled?'تم تفعيل الاستثمار التلقائي ✅':'تم إيقاف الاستثمار التلقائي');
    }catch{ this.checked=!enabled; showToast('خطأ في الاتصال.'); }
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const body={
      amountPerDeal:parseFloat(document.getElementById('amountPerDeal').value)||null,
      monthlyMax:parseFloat(document.getElementById('monthlyMax').value)||null,
      minYield:parseFloat(document.getElementById('minYield').value)||null,
      maxTenor:parseInt(document.getElementById('maxTenor').value)||null,
      maxConcentration:parseInt(document.getElementById('maxConcentration').value)||20,
      categories:[...selectedCats],
    };
    if(!body.amountPerDeal){ showToast('يرجى إدخال المبلغ لكل صفقة.'); return; }
    try{
      const r=await fetch('/app/me/auto-invest',{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify(body)});
      if(!r.ok){ showToast(r.status===401?'يجب تسجيل الدخول.':'تعذّر الحفظ.'); return; }
      showToast('تم حفظ القواعد بنجاح ✅');
    }catch{ showToast('خطأ في الاتصال.'); }
  });

  (async function load(){
    try{
      const [rS,rH]=await Promise.all([fetch('/app/me/auto-invest'),fetch('/app/me/auto-invest/history')]);
      if(rS.ok){ const d=await rS.json(); applySettings(d.settings); }
      if(rH.ok){ const d=await rH.json(); renderHistory(d.items||[]); }
      else renderHistory([]);
    }catch{
      const area=document.getElementById('historyArea'); area.textContent='';
      const m=document.createElement('p'); m.className='empty-msg'; m.textContent='تعذّر التحميل.'; area.appendChild(m);
    }
  }());
}());
</script>
</body>
</html>
