services:
  - type: web
    name: murabaha-platform
    runtime: node
    region: frankfurt          # closest Render region to Saudi Arabia (lowest latency to ELM)
    plan: standard             # REQUIRED for static outbound IP (Nafath whitelist)
    buildCommand: ""           # zero deps, nothing to build
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: NAFATH_APP_ID
        sync: false            # set in Render dashboard, not in repo
      - key: NAFATH_APP_KEY
        sync: false
      - key: NAFATH_BASE_URL
        value: https://rabet-nafath.api.elm.sa
