# Render Blueprint — منصة مُرابحة / Murbha Investment Platform
# Deploy: Render Dashboard → New + → Blueprint → pick the gashlan1/murbha repo.
# Render reads this file and provisions the web service + Postgres automatically.
#
# NOTE: `npm run seed` is intentionally NOT run on deploy — it is destructive
# (TRUNCATEs investments/transactions/notifications and deletes projects).
# Run it ONCE manually after the first deploy via the service's Shell tab.

databases:
  - name: murbha-db
    databaseName: murbha
    user: murbha
    plan: free
    region: frankfurt

services:
  - type: web
    name: murbha
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/landing-polish-i18n
    buildCommand: npm install
    # migrate is idempotent (all CREATE ... IF NOT EXISTS) so it is safe per deploy
    startCommand: npm run migrate && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: murbha-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
