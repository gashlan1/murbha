<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>مقارنة الصفقات — مُرابحة</title>
<meta name="description" content="قارن بين صفقتين أو أكثر جنباً إلى جنب لاتخاذ أفضل قرار استثماري." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:900px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .selector-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px;}
  .sel-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);margin-bottom:12px;}
  .sel-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .deal-select{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);background:var(--paper);}
  .deal-select:focus{outline:none;border-color:var(--green);}
  .btn-compare{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:10px 20px;font:700 12px Cairo,sans-serif;cursor:pointer;flex-shrink:0;}
  .btn-compare:hover{background:var(--green);}
  /* Comparison table */
  .compare-wrap{overflow-x:auto;}
  .compare-table{width:100%;border-collapse:collapse;min-width:560px;}
  .compare-table th{background:var(--green-dark);color:#fbf6ea;font:700 11px Cairo,sans-serif;padding:14px 16px;text-align:center;}
  .compare-table th.row-lbl{background:#f9f7f2;color:var(--muted);text-align:right;width:160px;}
  .compare-table td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:center;font:500 12px Tajawal,sans-serif;color:var(--ink);}
  .compare-table td.row-lbl{font:700 11px Cairo,sans-serif;color:var(--muted);text-align:right;background:#faf8f3;}
  .compare-table tr:last-child td{border-bottom:none;}
  .compare-table tr:hover td{background:#f9f7f2;}
  .best{font:900 13px Cairo,sans-serif;color:#2e7d32;}
  .worst{font:900 13px Cairo,sans-serif;color:#c54a3a;}
  .normal-val{font:900 13px Cairo,sans-serif;color:var(--green-dark);}
  .invest-row td{background:#e8f5e9!important;}
  .invest-btn{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:7px;padding:7px 14px;font:700 10px Cairo,sans-serif;cursor:pointer;}
  .invest-btn:hover{background:var(--green);}
  /* Legend */
  .legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;font:500 11px Tajawal,sans-serif;color:var(--muted);}
  .legend-dot{width:10px;height:10px;border-radius:50%;}
  .dot-best{background:#2e7d32;}
  .dot-worst{background:#c54a3a;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>مقارنة الصفقات</h1>
    <p>اختر صفقتين أو أكثر وقارن بينهما بشكل مرئي لاتخاذ أفضل قرار استثماري.</p>
  </div>

  <div class="selector-card">
    <div class="sel-title">اختر الصفقات للمقارنة</div>
    <div class="sel-row">
      <select class="deal-select" id="selA"><option value="">الصفقة الأولى…</option></select>
      <select class="deal-select" id="selB"><option value="">الصفقة الثانية…</option></select>
      <select class="deal-select" id="selC"><option value="">صفقة ثالثة (اختياري)…</option></select>
      <button class="btn-compare" id="compareBtn">قارن الآن</button>
    </div>
  </div>

  <div class="legend" id="legend" style="display:none">
    <div class="legend-item"><div class="legend-dot dot-best"></div>الأفضل في هذا المعيار</div>
    <div class="legend-item"><div class="legend-dot dot-worst"></div>الأدنى في هذا المعيار</div>
  </div>

  <div class="compare-wrap">
    <div id="compareResult"></div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function placeholder(el, msg){ el.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; el.appendChild(p); }

  let allDeals=[];

  async function loadDeals(){
    try{
      const r=await fetch('/app/deals');
      if(!r.ok) return;
      const d=await r.json();
      allDeals=(d.deals||[]);
      ['selA','selB','selC'].forEach(id=>{
        const sel=document.getElementById(id);
        const keep=sel.children[0];
        sel.textContent=''; sel.appendChild(keep);
        allDeals.forEach(dl=>{
          const opt=document.createElement('option'); opt.value=dl.id;
          opt.textContent=(dl.name||'صفقة')+' — '+(dl.sector||'')+(dl.expectedYield?' ('+dl.expectedYield+'٪)':'');
          sel.appendChild(opt);
        });
      });
    }catch{}
  }

  function renderCompare(deals){
    const result=document.getElementById('compareResult'); result.textContent='';
    document.getElementById('legend').style.display='flex';

    const rows=[
      {lbl:'القطاع',key:'sector',type:'text'},
      {lbl:'العائد المتوقع ٪',key:'expectedYield',type:'pct',higher:true},
      {lbl:'مدة الصفقة (أشهر)',key:'durationMonths',type:'num',higher:false},
      {lbl:'الحد الأدنى للاستثمار',key:'minInvestment',type:'money',higher:false},
      {lbl:'الحد الأقصى',key:'maxInvestment',type:'money',higher:true},
      {lbl:'نسبة التمويل',key:'fundingPct',type:'pct',higher:true},
      {lbl:'تاريخ الاستحقاق',key:'maturityDate',type:'text'},
      {lbl:'مستوى المخاطرة',key:'riskLevel',type:'text'},
      {lbl:'عدد المستثمرين',key:'investorCount',type:'num',higher:true},
      {lbl:'نوع العقد',key:'contractType',type:'text'}
    ];

    const table=document.createElement('table'); table.className='compare-table';
    const thead=document.createElement('thead');
    const hrow=document.createElement('tr');
    const thLbl=document.createElement('th'); thLbl.className='row-lbl'; thLbl.textContent='المعيار';
    hrow.appendChild(thLbl);
    deals.forEach(d=>{
      const th=document.createElement('th'); th.textContent=d.name||'—'; hrow.appendChild(th);
    });
    thead.appendChild(hrow); table.appendChild(thead);

    const tbody=document.createElement('tbody');

    rows.forEach(row=>{
      const tr=document.createElement('tr');
      const tdLbl=document.createElement('td'); tdLbl.className='row-lbl'; tdLbl.textContent=row.lbl;
      tr.appendChild(tdLbl);

      const vals=deals.map(d=>d[row.key]);
      let bestIdx=-1, worstIdx=-1;
      if(row.type==='num'||row.type==='pct'||row.type==='money'){
        const nums=vals.map(v=>parseFloat(v)||0);
        const maxV=Math.max(...nums), minV=Math.min(...nums);
        if(maxV!==minV){
          bestIdx=row.higher!==false?nums.indexOf(maxV):nums.indexOf(minV);
          worstIdx=row.higher!==false?nums.indexOf(minV):nums.indexOf(maxV);
        }
      }

      deals.forEach((d,i)=>{
        const td=document.createElement('td');
        let txt='—';
        const v=d[row.key];
        if(v!=null){
          if(row.type==='money') txt=fmt(v)+' ر.س';
          else if(row.type==='pct') txt=v+'٪';
          else txt=String(v);
        }
        const span=document.createElement('span');
        span.className=i===bestIdx?'best':i===worstIdx?'worst':'normal-val';
        span.textContent=txt;
        td.appendChild(span);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    // Invest row
    const invTr=document.createElement('tr'); invTr.className='invest-row';
    const invLbl=document.createElement('td'); invLbl.className='row-lbl'; invLbl.textContent='استثمر الآن';
    invTr.appendChild(invLbl);
    deals.forEach(d=>{
      const td=document.createElement('td');
      const btn=document.createElement('button'); btn.className='invest-btn'; btn.textContent='استثمر';
      btn.addEventListener('click',()=>{ window.location.href='deals.html?id='+encodeURIComponent(d.id); });
      td.appendChild(btn); invTr.appendChild(td);
    });
    tbody.appendChild(invTr);

    table.appendChild(tbody);
    result.appendChild(table);
  }

  document.getElementById('compareBtn').addEventListener('click',()=>{
    const ids=[
      document.getElementById('selA').value,
      document.getElementById('selB').value,
      document.getElementById('selC').value
    ].filter(Boolean);
    if(ids.length<2){ alert('يرجى اختيار صفقتين على الأقل.'); return; }
    const deals=ids.map(id=>allDeals.find(d=>d.id===id)).filter(Boolean);
    if(deals.length<2){ alert('لم يتم العثور على الصفقات.'); return; }
    renderCompare(deals);
  });

  loadDeals();
  placeholder(document.getElementById('compareResult'),'اختر صفقتين على الأقل وانقر "قارن الآن".');
}());
</script>
</body>
</html>
