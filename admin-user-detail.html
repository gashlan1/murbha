<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>تفاصيل المستخدم — إدارة مُرابحة</title>
<meta name="description" content="لوحة إدارة: عرض الملف الكامل لأي مستخدم مع KYC والاستثمارات والمحفظة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .admin-badge{display:inline-block;background:#b08840;color:#fff;border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:8px;}
  .search-bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .search-input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);background:var(--paper);}
  .search-input:focus{outline:none;border-color:var(--green);}
  .btn-search{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:9px;padding:9px 18px;font:700 12px Cairo,sans-serif;cursor:pointer;}
  .btn-search:hover{background:var(--green);}
  .profile-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px;display:none;}
  .profile-card.visible{display:block;}
  .profile-header{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--green-dark);color:#fbf6ea;display:flex;align-items:center;justify-content:center;font:900 20px Cairo,sans-serif;flex-shrink:0;}
  .profile-meta{flex:1;}
  .profile-name{font:900 16px Cairo,sans-serif;color:var(--green-dark);}
  .profile-email{font:500 11px Tajawal,sans-serif;color:var(--muted);}
  .kyc-badge{border-radius:6px;padding:3px 10px;font:700 10px Cairo,sans-serif;margin-top:5px;display:inline-block;}
  .kyc-verified{background:#e8f5e9;color:#2e7d32;}
  .kyc-pending{background:#fff8e1;color:#a07020;}
  .kyc-rejected{background:#fdecea;color:#c54a3a;}
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .field-item{display:flex;flex-direction:column;gap:3px;}
  .field-key{font:700 10px Cairo,sans-serif;color:var(--muted);}
  .field-val{font:500 12px Tajawal,sans-serif;color:var(--ink);}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:var(--paper);border-radius:10px;padding:12px;text-align:center;}
  .kpi-val{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .sub-title{font:900 12px Cairo,sans-serif;color:var(--green-dark);margin-bottom:10px;margin-top:14px;}
  table{width:100%;border-collapse:collapse;}
  th{font:700 9px Cairo,sans-serif;color:var(--muted);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);}
  td{font:500 11px Tajawal,sans-serif;color:var(--ink);padding:9px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .td-amount{font:700 11px Cairo,sans-serif;color:var(--green-dark);}
  .status-badge{border-radius:5px;padding:2px 8px;font:700 8px Cairo,sans-serif;}
  .s-active{background:#e8f5e9;color:#2e7d32;}
  .s-closed{background:#f5f5f5;color:#888;}
  .s-pending{background:#fff8e1;color:#a07020;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:30px 0;}
  @media(max-width:540px){.fields-grid{grid-template-columns:1fr;}}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="hero">
    <h1>تفاصيل المستخدم</h1>
    <p>ابحث عن أي مستثمر بالبريد الإلكتروني أو المعرّف لعرض ملفه الكامل.</p>
    <div class="admin-badge">لوحة الإدارة</div>
  </div>

  <div class="search-bar">
    <input class="search-input" id="searchInput" type="text" placeholder="بريد إلكتروني أو معرّف المستخدم…" />
    <button class="btn-search" id="searchBtn">بحث</button>
  </div>

  <div class="profile-card" id="profileCard">
    <div class="profile-header">
      <div class="avatar" id="avatarEl">—</div>
      <div class="profile-meta">
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-email" id="profileEmail">—</div>
        <div id="kycBadge" class="kyc-badge kyc-pending">—</div>
      </div>
    </div>
    <div class="fields-grid" id="fieldsGrid"></div>
    <div class="kpi-row" id="kpiRow"></div>
    <div class="sub-title">الاستثمارات النشطة</div>
    <div id="investTable"></div>
    <div class="sub-title">آخر المعاملات</div>
    <div id="txTable"></div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function placeholder(area, msg){ area.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; area.appendChild(p); }

  async function loadUser(q){
    if(!q.trim()) return;
    const card=document.getElementById('profileCard'); card.classList.remove('visible');
    try{
      const r=await fetch('/app/admin/users/'+encodeURIComponent(q.trim()));
      if(!r.ok){ alert(r.status===404?'المستخدم غير موجود.':r.status===403?'غير مصرح.':'تعذّر التحميل.'); return; }
      const d=await r.json();

      const initials=((d.firstName||'م')[0]+(d.lastName||'م')[0]).toUpperCase();
      document.getElementById('avatarEl').textContent=initials;
      document.getElementById('profileName').textContent=(d.firstName||'')+' '+(d.lastName||'');
      document.getElementById('profileEmail').textContent=d.email||'—';
      const kb=document.getElementById('kycBadge');
      kb.className='kyc-badge '+(d.kycStatus==='verified'?'kyc-verified':d.kycStatus==='rejected'?'kyc-rejected':'kyc-pending');
      kb.textContent=d.kycStatus==='verified'?'هوية موثّقة':d.kycStatus==='rejected'?'مرفوض':'قيد المراجعة';

      const fieldsGrid=document.getElementById('fieldsGrid'); fieldsGrid.textContent='';
      const fields=[
        ['المعرّف',d.id||'—'],['تاريخ التسجيل',d.createdAt?d.createdAt.slice(0,10):'—'],
        ['رقم الجوال',d.phone||'—'],['الجنسية',d.nationality||'—'],
        ['المستوى',d.tier||'—'],['الإحالة من',d.referredBy||'—']
      ];
      fields.forEach(([k,v])=>{
        const item=document.createElement('div'); item.className='field-item';
        const key=document.createElement('div'); key.className='field-key'; key.textContent=k;
        const val=document.createElement('div'); val.className='field-val'; val.textContent=v;
        item.appendChild(key); item.appendChild(val); fieldsGrid.appendChild(item);
      });

      const kpiRow=document.getElementById('kpiRow'); kpiRow.textContent='';
      const kpis=[
        {lbl:'إجمالي الاستثمارات',val:fmt(d.totalInvested||0)+' ر.س'},
        {lbl:'الرصيد المتاح',val:fmt(d.walletBalance||0)+' ر.س'},
        {lbl:'عدد الصفقات',val:String(d.dealCount||0)},
        {lbl:'نقاط الولاء',val:fmt(d.loyaltyPoints||0)}
      ];
      kpis.forEach(k=>{
        const div=document.createElement('div'); div.className='kpi';
        const val=document.createElement('div'); val.className='kpi-val'; val.textContent=k.val;
        const lbl=document.createElement('div'); lbl.className='kpi-lbl'; lbl.textContent=k.lbl;
        div.appendChild(val); div.appendChild(lbl); kpiRow.appendChild(div);
      });

      const investTable=document.getElementById('investTable');
      const investments=d.investments||[];
      investTable.textContent='';
      if(!investments.length){ placeholder(investTable,'لا توجد استثمارات.'); }
      else{
        const tbl=document.createElement('table');
        const hdr=document.createElement('tr');
        ['الصفقة','المبلغ','العائد','الحالة'].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hdr.appendChild(th); });
        tbl.appendChild(hdr);
        investments.slice(0,6).forEach(inv=>{
          const tr=document.createElement('tr');
          [[inv.dealName||'—',false],[fmt(inv.amount||0)+' ر.س',true],[(inv.expectedYield||0)+'٪',false],[inv.status||'—',false]].forEach(([v,amt],i)=>{
            const td=document.createElement('td');
            if(i===3){ const b=document.createElement('span'); b.className='status-badge s-'+(inv.status||'pending'); b.textContent=v; td.appendChild(b); }
            else { if(amt) td.className='td-amount'; td.textContent=v; }
            tr.appendChild(td);
          });
          tbl.appendChild(tr);
        });
        investTable.appendChild(tbl);
      }

      const txTable=document.getElementById('txTable');
      const txs=d.recentTransactions||[];
      txTable.textContent='';
      if(!txs.length){ placeholder(txTable,'لا توجد معاملات.'); }
      else{
        const tbl2=document.createElement('table');
        const hdr2=document.createElement('tr');
        ['النوع','المبلغ','الحالة','التاريخ'].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hdr2.appendChild(th); });
        tbl2.appendChild(hdr2);
        txs.slice(0,8).forEach(tx=>{
          const tr=document.createElement('tr');
          [[tx.type||'—',false],[fmt(tx.amount||0)+' ر.س',true],[tx.status||'—',false],[tx.date||'—',false]].forEach(([v,amt])=>{
            const td=document.createElement('td'); if(amt) td.className='td-amount'; td.textContent=v; tr.appendChild(td);
          });
          tbl2.appendChild(tr);
        });
        txTable.appendChild(tbl2);
      }

      card.classList.add('visible');
    }catch{ alert('خطأ في الاتصال.'); }
  }

  document.getElementById('searchBtn').addEventListener('click',()=>loadUser(document.getElementById('searchInput').value));
  document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadUser(document.getElementById('searchInput').value); });

  const params=new URLSearchParams(window.location.search);
  if(params.get('id')){ document.getElementById('searchInput').value=params.get('id'); loadUser(params.get('id')); }
}());
</script>
</body>
</html>
