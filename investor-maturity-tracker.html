<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة الاستحقاقات - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1000px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.page-header p{font-size:0.84rem;color:var(--muted);margin-top:0.3rem;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.sum-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;text-align:center;}
.sum-val{font-size:1.5rem;font-weight:700;color:var(--green);}
.sum-lbl{font-size:0.75rem;color:var(--muted);margin-top:0.2rem;}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.timeline{padding:1.25rem;}
.tl-month{margin-bottom:1.5rem;}
.tl-month-title{font-size:0.8rem;font-weight:700;color:var(--muted);margin-bottom:0.75rem;padding-bottom:0.4rem;border-bottom:1px solid var(--line);}
.tl-item{display:flex;align-items:flex-start;gap:0.85rem;margin-bottom:0.75rem;}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:0.35rem;}
.td-soon{background:#e67e22;}
.td-normal{background:var(--green);}
.td-future{background:var(--muted);}
.tl-content{flex:1;}
.tl-deal{font-size:0.85rem;font-weight:700;}
.tl-meta{font-size:0.73rem;color:var(--muted);margin-top:0.15rem;}
.tl-amount{font-size:0.85rem;font-weight:700;color:var(--green);}
.tl-badge{display:inline-block;font-size:0.65rem;padding:0.15rem 0.45rem;border-radius:8px;margin-right:0.4rem;}
.tb-soon{background:#fef3cd;color:#92400e;}
.tb-normal{background:#e8f5ed;color:#1e8449;}
.tb-future{background:#f5f0e8;color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th{background:#f5f0e8;padding:0.65rem 1rem;font-size:0.78rem;font-weight:700;text-align:right;color:var(--muted);}
td{padding:0.65rem 1rem;font-size:0.82rem;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.days-left{font-weight:700;}
.days-urgent{color:#e74c3c;}
.days-soon{color:#e67e22;}
.days-ok{color:var(--green);}
.action-bar{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.75rem;}
@media(max-width:700px){.summary-cards{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — الاستحقاقات</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <div>
      <h2>متابعة استحقاقات الصفقات</h2>
      <p>تتبع مواعيد انتهاء صفقاتك وتخطيط إعادة الاستثمار</p>
    </div>
    <button class="btn btn-primary btn-sm" onclick="exportMaturities()">تصدير الجدول</button>
  </div>

  <div class="summary-cards" id="summaryCards"></div>

  <div class="card">
    <div class="card-head"><h3>الجدول الزمني للاستحقاقات</h3></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>جميع الصفقات — ترتيب بالاستحقاق</h3>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="exportMaturities()">تصدير</button>
    </div>
    <table>
      <thead>
        <tr><th>الصفقة</th><th>رأس المال</th><th>العائد</th><th>تاريخ الاستحقاق</th><th>الأيام المتبقية</th><th>إجراء</th></tr>
      </thead>
      <tbody id="maturityTable"></tbody>
    </table>
    <div class="action-bar">
      <button class="btn btn-primary btn-sm" onclick="planReinvest()">تخطيط إعادة الاستثمار</button>
    </div>
  </div>
</div>

<script>
const SUMMARY = [
  { val: '٦', lbl: 'صفقات نشطة' },
  { val: '٢', lbl: 'تستحق خلال ٣٠ يوم' },
  { val: '٢٨٠,٠٠٠ ر.س', lbl: 'إجمالي رأس المال' },
  { val: '٣٤,٤٠٠ ر.س', lbl: 'عوائد متوقعة' }
];

const TIMELINE = [
  {
    month: 'يوليو ٢٠٢٦',
    items: [
      { deal: 'مرابحة تجارية جدة', meta: 'مدة: سنتان · عائد: ١٢٪', amount: '٨٠,٠٠٠ ر.س + ٩,٦٠٠ ر.س ربح', dot: 'td-soon', badge: 'tb-soon', badgeLbl: 'خلال ١٥ يوم' },
      { deal: 'مرابحة لوجستية', meta: 'مدة: سنة · عائد: ١١٪', amount: '٥٠,٠٠٠ ر.س + ٥,٥٠٠ ر.س ربح', dot: 'td-soon', badge: 'tb-soon', badgeLbl: 'خلال ٢٨ يوم' }
    ]
  },
  {
    month: 'سبتمبر ٢٠٢٦',
    items: [
      { deal: 'مرابحة صناعية الدمام', meta: 'مدة: ١٨ شهراً · عائد: ١٥٪', amount: '٦٠,٠٠٠ ر.س + ١٣,٥٠٠ ر.س ربح', dot: 'td-normal', badge: 'tb-normal', badgeLbl: 'خلال ٩٠ يوم' }
    ]
  },
  {
    month: 'ديسمبر ٢٠٢٦',
    items: [
      { deal: 'مرابحة عقارية الرياض', meta: 'مدة: سنتان · عائد: ١٤٪', amount: '١٠٠,٠٠٠ ر.س + ٢٨,٠٠٠ ر.س ربح', dot: 'td-future', badge: 'tb-future', badgeLbl: 'خلال ١٨٠ يوم' }
    ]
  }
];

const MATURITY_ROWS = [
  { deal: 'مرابحة تجارية جدة', capital: '٨٠,٠٠٠', ret: '١٢٪', date: '٢٠٢٦/٠٧/٠١', days: 15, dcls: 'days-urgent' },
  { deal: 'مرابحة لوجستية', capital: '٥٠,٠٠٠', ret: '١١٪', date: '٢٠٢٦/٠٧/١٤', days: 28, dcls: 'days-soon' },
  { deal: 'مرابحة صناعية الدمام', capital: '٦٠,٠٠٠', ret: '١٥٪', date: '٢٠٢٦/٠٩/١٥', days: 90, dcls: 'days-ok' },
  { deal: 'مرابحة عقارية الرياض', capital: '١٠٠,٠٠٠', ret: '١٤٪', date: '٢٠٢٦/١٢/٠١', days: 168, dcls: 'days-ok' },
  { deal: 'مرابحة تقنية', capital: '٤٠,٠٠٠', ret: '١٣٪', date: '٢٠٢٧/٠٣/٠١', days: 258, dcls: 'days-ok' },
  { deal: 'مرابحة طاقة', capital: '٥٠,٠٠٠', ret: '١٤٪', date: '٢٠٢٧/٠٦/٠١', days: 350, dcls: 'days-ok' }
];

function buildSummary() {
  const wrap = document.getElementById('summaryCards');
  SUMMARY.forEach(s => {
    const card = document.createElement('div'); card.className = 'sum-card';
    const val = document.createElement('div'); val.className = 'sum-val'; val.textContent = s.val;
    const lbl = document.createElement('div'); lbl.className = 'sum-lbl'; lbl.textContent = s.lbl;
    card.appendChild(val); card.appendChild(lbl);
    wrap.appendChild(card);
  });
}

function buildTimeline() {
  const wrap = document.getElementById('timeline');
  TIMELINE.forEach(month => {
    const sec = document.createElement('div'); sec.className = 'tl-month';
    const title = document.createElement('div'); title.className = 'tl-month-title'; title.textContent = month.month;
    sec.appendChild(title);
    month.items.forEach(item => {
      const row = document.createElement('div'); row.className = 'tl-item';
      const dot = document.createElement('div'); dot.className = 'tl-dot ' + item.dot;
      const content = document.createElement('div'); content.className = 'tl-content';
      const dealRow = document.createElement('div');
      dealRow.style.display = 'flex'; dealRow.style.alignItems = 'center'; dealRow.style.justifyContent = 'space-between';
      const badge = document.createElement('span'); badge.className = 'tl-badge ' + item.badge; badge.textContent = item.badgeLbl;
      const dealTitle = document.createElement('span'); dealTitle.className = 'tl-deal'; dealTitle.textContent = item.deal;
      const amount = document.createElement('div'); amount.className = 'tl-amount'; amount.textContent = item.amount;
      const meta = document.createElement('div'); meta.className = 'tl-meta'; meta.textContent = item.meta;
      dealRow.appendChild(dealTitle); dealRow.appendChild(badge);
      content.appendChild(dealRow); content.appendChild(meta); content.appendChild(amount);
      row.appendChild(dot); row.appendChild(content);
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  });
}

function buildTable() {
  const tbody = document.getElementById('maturityTable');
  MATURITY_ROWS.forEach(r => {
    const tr = document.createElement('tr');
    [r.deal, r.capital + ' ر.س', r.ret, r.date].forEach(t => {
      const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
    });
    const daysTd = document.createElement('td');
    const daysSpan = document.createElement('span'); daysSpan.className = 'days-left ' + r.dcls;
    daysSpan.textContent = r.days + ' يوم';
    daysTd.appendChild(daysSpan); tr.appendChild(daysTd);
    const actTd = document.createElement('td');
    const btn = document.createElement('button'); btn.className = 'btn btn-primary btn-sm'; btn.textContent = 'إعادة استثمار';
    btn.onclick = () => reinvestDeal(r.deal);
    actTd.appendChild(btn); tr.appendChild(actTd);
    tbody.appendChild(tr);
  });
}

function reinvestDeal(name) { alert('تخطيط إعادة استثمار: ' + name); }
function planReinvest() { window.location.href = 'investor-reinvestment-planner.html'; }
function exportMaturities() {
  fetch('/app/me/maturities/export').then(r => r.json()).catch(() => {});
  alert('جاري تصدير جدول الاستحقاقات...');
}

buildSummary(); buildTimeline(); buildTable();
</script>
</body>
</html>
