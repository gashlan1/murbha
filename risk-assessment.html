<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>تقييم المخاطر — مُرابحة</title>
<meta name="description" content="اكتشف ملفك الاستثماري وتقبّلك للمخاطر من خلال استبيان قصير." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:720px;margin:0 auto;padding:28px 18px 80px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:540px;margin:0 auto;line-height:1.85;}
  .current-profile{background:#fff;border:2px solid var(--gold);border-radius:16px;padding:20px;margin-bottom:18px;display:none;}
  .current-profile.visible{display:block;}
  .cp-title{font:700 11px Cairo,sans-serif;color:var(--muted);margin-bottom:6px;}
  .cp-val{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .cp-desc{font:500 11px Tajawal,sans-serif;color:var(--muted);margin-top:4px;line-height:1.6;}
  .cp-retake{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font:700 11px Cairo,sans-serif;cursor:pointer;color:var(--ink);}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s;}
  .question-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:18px;}
  .q-num{font:700 11px Cairo,sans-serif;color:var(--muted);margin-bottom:8px;}
  .q-text{font:900 16px Cairo,sans-serif;color:var(--green-dark);line-height:1.5;margin-bottom:20px;}
  .options-grid{display:grid;gap:10px;}
  .option-btn{border:2px solid var(--line);border-radius:12px;padding:14px 16px;text-align:right;cursor:pointer;background:#fff;font:500 13px Tajawal,sans-serif;color:var(--ink);transition:border-color .15s,background .15s;}
  .option-btn:hover{border-color:var(--gold-light);}
  .option-btn.selected{border-color:var(--green);background:#f0f9f4;}
  .nav-row{display:flex;gap:12px;justify-content:space-between;margin-top:4px;}
  .btn-prev{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;cursor:pointer;color:var(--muted);}
  .btn-next{background:var(--green-dark);color:#fbf6ea;border:none;border-radius:10px;padding:12px 26px;font:900 13px Cairo,sans-serif;cursor:pointer;}
  .btn-next:hover{background:var(--green);}
  .btn-next:disabled{opacity:.4;cursor:default;}
  .result-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;display:none;}
  .result-card.visible{display:block;}
  .result-label{font:900 26px Cairo,sans-serif;margin-bottom:6px;}
  .result-conservative{color:#1565c0;}
  .result-moderate{color:var(--gold);}
  .result-aggressive{color:#c54a3a;}
  .result-desc{font:500 13px Tajawal,sans-serif;color:var(--muted);line-height:1.7;margin-bottom:18px;}
  .rec-title{font:900 13px Cairo,sans-serif;color:var(--green-dark);margin-bottom:10px;}
  .rec-list{display:grid;gap:8px;}
  .rec-item{background:var(--paper);border-radius:10px;padding:12px 14px;font:500 12px Tajawal,sans-serif;color:var(--ink);display:flex;gap:10px;align-items:center;}
  .rec-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .btn-save{width:100%;background:var(--green-dark);color:#fbf6ea;border:none;border-radius:11px;padding:13px;font:900 14px Cairo,sans-serif;cursor:pointer;margin-top:16px;}
  .btn-save:hover{background:var(--green);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>تقييم المخاطر</h1>
    <p>استبيان قصير من 6 أسئلة يحدّد ملفك الاستثماري ويوصي بالصفقات المناسبة لك.</p>
  </div>

  <div class="current-profile" id="currentProfile">
    <div class="cp-title">ملفك الاستثماري الحالي</div>
    <div class="cp-val" id="cpVal">—</div>
    <div class="cp-desc" id="cpDesc">—</div>
    <button class="cp-retake" id="retakeBtn">إعادة التقييم</button>
  </div>

  <div id="quizWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="question-card" id="questionCard"></div>
    <div class="nav-row">
      <button class="btn-prev" id="prevBtn">السابق</button>
      <button class="btn-next" id="nextBtn" disabled>التالي</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-label" id="resultLabel">—</div>
    <div class="result-desc" id="resultDesc">—</div>
    <div class="rec-title">الصفقات الموصى بها لملفك</div>
    <div class="rec-list" id="recList"></div>
    <button class="btn-save" id="saveBtn">حفظ الملف الاستثماري</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

  const QUESTIONS=[
    { q:'ما الهدف الرئيسي من استثمارك؟', opts:['الحفاظ على رأس المال مع عائد بسيط','تحقيق نمو معتدل وثابت','تعظيم العائد حتى مع المخاطر العالية'] },
    { q:'كيف تتصرف حين تنخفض قيمة استثمارك 20٪ فجأة؟', opts:['أسحب فوراً قبل أن تنخفض أكثر','أنتظر وأراقب المشهد','أستثمر أكثر للاستفادة من الانخفاض'] },
    { q:'ما أطول مدة تقبلها حتى يُدرّ استثمارك أرباحاً؟', opts:['أقل من 6 أشهر','من 6 أشهر إلى سنة','أكثر من سنة'] },
    { q:'ما نسبة مدخراتك التي تنوي استثمارها في المُرابحة؟', opts:['أقل من 20٪','من 20٪ إلى 50٪','أكثر من 50٪'] },
    { q:'ما خبرتك السابقة في الاستثمار؟', opts:['مبتدئ — هذا أول استثمار لي','متوسط — استثمرت في صناديق أو أسهم','متقدم — لديّ محفظة متنوعة وخبرة واسعة'] },
    { q:'ما مستوى الدخل الإضافي الذي تحتاجه من الاستثمار؟', opts:['أحتاجه كمصدر دخل رئيسي','مكمّل لدخلي فقط','لست بحاجة إليه — للتراكم المستقبلي'] }
  ];

  const PROFILES={
    conservative:{ label:'محافظ', cls:'result-conservative', desc:'تُفضّل الاستقرار والحفاظ على رأس المال. الصفقات القصيرة الأجل ذات المخاطرة المنخفضة هي الأنسب لك.', recs:['صفقات مُرابحة تجارية 3-6 أشهر','تمويل تجزئة بضمانات راسخة','صكوك ذات تقييم ائتماني مرتفع'] },
    moderate:{ label:'متوازن', cls:'result-moderate', desc:'تقبل بعض المخاطرة لتحقيق عائد معقول. يناسبك مزيج من الصفقات القصيرة والمتوسطة الأجل.', recs:['مزيج من مُرابحة تجارية ومُشاركة عقارية','صفقات 6-12 شهراً بعائد 10-15٪','تنويع بين قطاعين على الأقل'] },
    aggressive:{ label:'جريء', cls:'result-aggressive', desc:'تسعى لتعظيم العائد وتقبل المخاطر المرتفعة مقابل ذلك. الصفقات الأطول أجلاً في قطاعات النمو تناسبك.', recs:['مُشاركة في مشاريع التطوير العقاري','صفقات تقنية وشركات ناشئة','استثمارات 12-24 شهراً بعائد 16٪+'] }
  };

  let current=0;
  let answers=new Array(QUESTIONS.length).fill(-1);
  let resultProfile=null;

  function scoreToProfile(scores){
    const avg=scores.reduce((s,v)=>s+v,0)/scores.length;
    if(avg<1) return 'conservative';
    if(avg<2) return 'moderate';
    return 'aggressive';
  }

  function renderQuestion(){
    const q=QUESTIONS[current];
    const card=document.getElementById('questionCard'); card.textContent='';
    const num=document.createElement('div'); num.className='q-num'; num.textContent='السؤال '+(current+1)+' من '+QUESTIONS.length;
    const qText=document.createElement('div'); qText.className='q-text'; qText.textContent=q.q;
    card.appendChild(num); card.appendChild(qText);
    const grid=document.createElement('div'); grid.className='options-grid';
    q.opts.forEach((opt,i)=>{
      const btn=document.createElement('button'); btn.className='option-btn'+(answers[current]===i?' selected':'');
      btn.textContent=opt;
      btn.addEventListener('click',()=>{
        answers[current]=i;
        grid.querySelectorAll('.option-btn').forEach((b,j)=>b.classList.toggle('selected',j===i));
        document.getElementById('nextBtn').disabled=false;
      });
      grid.appendChild(btn);
    });
    card.appendChild(grid);
    document.getElementById('progressFill').style.width=((current/QUESTIONS.length)*100)+'%';
    document.getElementById('prevBtn').style.visibility=current===0?'hidden':'visible';
    document.getElementById('nextBtn').textContent=current===QUESTIONS.length-1?'إنهاء التقييم':'التالي';
    document.getElementById('nextBtn').disabled=answers[current]===-1;
  }

  document.getElementById('prevBtn').addEventListener('click',()=>{ if(current>0){current--; renderQuestion();} });
  document.getElementById('nextBtn').addEventListener('click',()=>{
    if(current<QUESTIONS.length-1){ current++; renderQuestion(); }
    else{
      resultProfile=scoreToProfile(answers.map((a,i)=>a));
      showResult(resultProfile);
    }
  });

  function showResult(profile){
    document.getElementById('quizWrap').style.display='none';
    const p=PROFILES[profile];
    const card=document.getElementById('resultCard'); card.classList.add('visible');
    const lbl=document.getElementById('resultLabel'); lbl.className='result-label '+p.cls; lbl.textContent='ملفك: '+p.label;
    document.getElementById('resultDesc').textContent=p.desc;
    const recList=document.getElementById('recList'); recList.textContent='';
    p.recs.forEach(r=>{
      const item=document.createElement('div'); item.className='rec-item';
      const dot=document.createElement('div'); dot.className='rec-dot';
      const txt=document.createElement('span'); txt.textContent=r;
      item.appendChild(dot); item.appendChild(txt); recList.appendChild(item);
    });
  }

  document.getElementById('saveBtn').addEventListener('click', async()=>{
    if(!resultProfile) return;
    const btn=document.getElementById('saveBtn'); btn.disabled=true;
    try{
      const r=await fetch('/app/me/risk-profile',{method:'POST',headers:{'X-CSRF-Token':csrf(),'Content-Type':'application/json'},body:JSON.stringify({profile:resultProfile,answers})});
      btn.disabled=false;
      if(!r.ok){ showToast('تعذّر الحفظ.'); return; }
      showToast('تم حفظ ملفك الاستثماري بنجاح.');
    }catch{ btn.disabled=false; showToast('خطأ في الاتصال.'); }
  });

  document.getElementById('retakeBtn').addEventListener('click',()=>{
    document.getElementById('currentProfile').classList.remove('visible');
    document.getElementById('resultCard').classList.remove('visible');
    document.getElementById('quizWrap').style.display='block';
    current=0; answers=new Array(QUESTIONS.length).fill(-1); renderQuestion();
  });

  (async function load(){
    try{
      const r=await fetch('/app/me/risk-profile');
      if(r.ok){
        const d=await r.json();
        if(d.profile){
          const p=PROFILES[d.profile]||PROFILES.moderate;
          document.getElementById('cpVal').textContent='ملف '+p.label;
          document.getElementById('cpDesc').textContent=p.desc;
          document.getElementById('currentProfile').classList.add('visible');
        }
      }
    }catch{}
    renderQuestion();
  }());
}());
</script>
</body>
</html>
