<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>تقييم مخاطرتك — مُرابحة</title>
<meta name="description" content="اختبار من ٧ أسئلة لتحديد مدى تحمّلك للمخاطر وبناء محفظة مناسبة لك." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root {
    --ink: #0d1612; --paper: #fbf6ea; --green-dark: #062b1e; --green: #0a4d36;
    --gold: #b08840; --gold-light: #d4ac6e; --muted: #6b7268; --line: rgba(13,22,18,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal',system-ui,sans-serif; background: var(--paper); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  .hero { background: linear-gradient(135deg,#062b1e,#0a4d36); color: #fbf6ea; border-radius: 22px; padding: 36px 26px; margin-bottom: 22px; text-align: center; }
  .hero h1 { font: 900 28px Cairo,sans-serif; margin-bottom: 8px; }
  .hero p { font: 500 14px Tajawal,sans-serif; opacity: 0.92; max-width: 540px; margin: 0 auto; line-height: 1.85; }
  .progress { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .progress .bar { flex: 1; height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; margin-inline: 14px; }
  .progress .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#0a4d36,#062b1e); border-radius: 4px; transition: width 0.4s; }
  .progress .label { font: 800 12px Cairo,sans-serif; color: var(--green-dark); }
  .question { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .question .q { font: 900 17px Cairo,sans-serif; color: var(--green-dark); margin-bottom: 16px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font: 600 13px Tajawal,sans-serif; color: var(--ink); transition: all 0.15s; text-align: start; width: 100%; }
  .opt:hover { background: var(--paper); border-color: var(--gold); }
  .opt.selected { background: var(--green-dark); color: #d4ac6e; border-color: var(--green-dark); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
  .nav button { background: var(--green-dark); color: #d4ac6e; border: 0; padding: 11px 24px; border-radius: 10px; font: 800 13px Cairo,sans-serif; cursor: pointer; }
  .nav button.back { background: #fff; color: var(--green-dark); border: 1px solid var(--line); }
  .nav button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { background: linear-gradient(135deg,#fbf6ea,#fff); border: 2px solid var(--gold); border-radius: 18px; padding: 30px; text-align: center; display: none; }
  .result h2 { font: 900 22px Cairo,sans-serif; color: var(--green-dark); margin-bottom: 8px; }
  .result .profile { font: 900 18px Cairo,sans-serif; color: var(--gold); margin-bottom: 14px; }
  .result .desc { font: 500 13px Tajawal,sans-serif; color: var(--ink); line-height: 1.95; margin-bottom: 18px; }
  .result .allocation { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .result .allocation h3 { font: 900 14px Cairo,sans-serif; color: var(--green-dark); margin-bottom: 10px; }
  .result .row { display: flex; justify-content: space-between; padding: 6px 0; font: 600 13px Tajawal,sans-serif; }
  .result .cta { display: inline-block; background: var(--green-dark); color: #d4ac6e; padding: 13px 28px; border-radius: 12px; font: 900 13px Cairo,sans-serif; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a href="/" style="display:inline-block;font:800 12px Cairo,sans-serif;color:var(--green-dark);text-decoration:none;margin-bottom:14px;">← العودة للرئيسية</a>
  <div class="hero">
    <h1>تقييم مدى تحمّلك للمخاطر</h1>
    <p>٧ أسئلة سريعة (٣ دقائق) لتحديد ملفّك الاستثماري المناسب وبناء محفظة تلائمك.</p>
  </div>

  <div class="progress" id="progressBar" style="display:none;">
    <span class="label" id="progressLabel">السؤال ١ من ٧</span>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
    <span class="label" id="progressPct">١٤٪</span>
  </div>

  <div class="question" id="questionCard">
    <div class="q" id="questionText">—</div>
    <div class="opts" id="optsList"></div>
    <div class="nav">
      <button type="button" class="back" id="backBtn">← السابق</button>
      <button type="button" id="nextBtn">التالي ←</button>
    </div>
  </div>

  <div class="result" id="resultCard"></div>
</main>
<script src="/app.js" defer></script>
<script>
(() => {
  const QUESTIONS = [
    { q: 'كم تخطّط لاستثمار جزءٍ من مدّخراتك على المنصة؟', opts: [
      { label: 'أقل من ١٠٪', score: 1 },
      { label: '١٠-٢٥٪', score: 2 },
      { label: '٢٥-٥٠٪', score: 3 },
      { label: 'أكثر من ٥٠٪', score: 4 },
    ]},
    { q: 'كم سنة تحتاج المال قبل سحبه؟', opts: [
      { label: 'أقل من سنة', score: 1 },
      { label: '١-٣ سنوات', score: 2 },
      { label: '٣-٥ سنوات', score: 3 },
      { label: 'أكثر من ٥ سنوات', score: 4 },
    ]},
    { q: 'لو خسرت ٢٠٪ من محفظتك في شهر، ماذا ستفعل؟', opts: [
      { label: 'أسحب كل شيء فوراً', score: 1 },
      { label: 'أسحب جزءاً لتقليل الخسارة', score: 2 },
      { label: 'أبقي كما هو وأنتظر', score: 3 },
      { label: 'أستثمر أكثر لاغتنام الفرصة', score: 4 },
    ]},
    { q: 'ما هو هدفك الأساسي من الاستثمار؟', opts: [
      { label: 'حماية رأس المال بأي ثمن', score: 1 },
      { label: 'دخل ثابت متواضع', score: 2 },
      { label: 'نمو معتدل + دخل', score: 3 },
      { label: 'تعظيم النمو على المدى الطويل', score: 4 },
    ]},
    { q: 'هل لديك خبرة سابقة في الاستثمار العقاري؟', opts: [
      { label: 'لا، هذه أوّل تجربة', score: 1 },
      { label: 'خبرة بسيطة (سنة أو أقل)', score: 2 },
      { label: 'خبرة متوسطة (٢-٥ سنوات)', score: 3 },
      { label: 'خبير (أكثر من ٥ سنوات)', score: 4 },
    ]},
    { q: 'ما نسبة استثماراتك الحالية في أصول متذبذبة (أسهم، عملات، إلخ)؟', opts: [
      { label: '٠٪ — لا شيء', score: 1 },
      { label: 'أقل من ٢٠٪', score: 2 },
      { label: '٢٠-٥٠٪', score: 3 },
      { label: 'أكثر من ٥٠٪', score: 4 },
    ]},
    { q: 'كم تستطيع أن تخصّص شهرياً للاستثمار؟', opts: [
      { label: 'أقل من ١٬٠٠٠ ر.س', score: 1 },
      { label: '١٬٠٠٠ - ٥٬٠٠٠ ر.س', score: 2 },
      { label: '٥٬٠٠٠ - ١٥٬٠٠٠ ر.س', score: 3 },
      { label: 'أكثر من ١٥٬٠٠٠ ر.س', score: 4 },
    ]},
  ];
  let idx = 0;
  let answers = new Array(QUESTIONS.length).fill(null);

  const $ = (id) => document.getElementById(id);
  const progress = $('progressBar');
  const card = $('questionCard');
  const resultCard = $('resultCard');

  const render = () => {
    progress.style.display = 'flex';
    const q = QUESTIONS[idx];
    $('progressLabel').textContent = 'السؤال ' + (idx + 1) + ' من ' + QUESTIONS.length;
    const pct = Math.round(((idx + 1) / QUESTIONS.length) * 100);
    $('progressFill').style.width = pct + '%';
    $('progressPct').textContent = pct + '٪';
    $('questionText').textContent = q.q;
    const opts = $('optsList');
    opts.replaceChildren();
    q.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      if (answers[idx] === i) b.classList.add('selected');
      b.textContent = o.label;
      b.onclick = () => {
        answers[idx] = i;
        opts.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
      };
      opts.appendChild(b);
    });
    $('backBtn').disabled = idx === 0;
    $('nextBtn').textContent = idx === QUESTIONS.length - 1 ? 'احصل على نتيجتي' : 'التالي ←';
  };

  $('backBtn').onclick = () => { if (idx > 0) { idx--; render(); } };
  $('nextBtn').onclick = () => {
    if (answers[idx] === null) { alert('اختر إجابة أوّلاً'); return; }
    if (idx < QUESTIONS.length - 1) { idx++; render(); }
    else showResult();
  };

  const showResult = () => {
    const score = answers.reduce((s, a, i) => s + QUESTIONS[i].opts[a].score, 0);
    const max = QUESTIONS.length * 4;
    const pct = Math.round((score / max) * 100);
    let profile, color, desc, allocation;
    if (score <= 12) {
      profile = '🛡 محافظ';
      color = '#0a4d36';
      desc = 'تركّز على حماية رأس المال وتفضّل الاستقرار. الصفقات السكنية القصيرة المدّة بعائد ٧-٨٪ تناسبك.';
      allocation = [{ k: 'سكني محافظ (٧-٨٪)', v: '٦٠٪' }, { k: 'تجاري آمن', v: '٢٥٪' }, { k: 'نقد للفرص', v: '١٥٪' }];
    } else if (score <= 19) {
      profile = '⚖ متوازن';
      color = '#b08840';
      desc = 'تقبل مخاطرة معتدلة لعائد أفضل. مزيج متنوّع من الفئات بعائد ٨-١٠٪ مناسب لك.';
      allocation = [{ k: 'سكني (٨-٩٪)', v: '٤٥٪' }, { k: 'تجاري (٩-١٠٪)', v: '٣٠٪' }, { k: 'صناعي', v: '١٥٪' }, { k: 'نقد', v: '١٠٪' }];
    } else {
      profile = '🚀 طموح';
      color = '#062b1e';
      desc = 'تتقبّل مخاطرة عالية لتعظيم العائد. صفقات تطويرية ومتعدّدة الفئات بعائد ١٠-١٢٪ تناسب طموحك.';
      allocation = [{ k: 'صفقات تطوير (١٠-١٢٪)', v: '٤٠٪' }, { k: 'تجاري ممتاز', v: '٣٠٪' }, { k: 'سكني نمو', v: '٢٠٪' }, { k: 'فرص خاصة', v: '١٠٪' }];
    }
    progress.style.display = 'none';
    card.style.display = 'none';
    resultCard.style.display = 'block';
    resultCard.replaceChildren();
    const h2 = document.createElement('h2'); h2.textContent = 'نتيجة تقييمك';
    const p = document.createElement('div'); p.className = 'profile'; p.style.color = color; p.textContent = profile + ' · ' + pct + '٪';
    const d = document.createElement('div'); d.className = 'desc'; d.textContent = desc;
    const alloc = document.createElement('div'); alloc.className = 'allocation';
    const ah = document.createElement('h3'); ah.textContent = 'التوزيع المقترح لمحفظتك';
    alloc.appendChild(ah);
    allocation.forEach(a => {
      const row = document.createElement('div'); row.className = 'row';
      const k = document.createElement('span'); k.textContent = a.k;
      const v = document.createElement('b'); v.style.color = color; v.textContent = a.v;
      row.append(k, v); alloc.appendChild(row);
    });
    const cta = document.createElement('a'); cta.className = 'cta'; cta.href = '/search.html';
    cta.textContent = 'ابحث عن صفقات مناسبة ←';
    const retry = document.createElement('button'); retry.type = 'button';
    retry.style.cssText = 'background:transparent;border:0;color:var(--muted);font:700 12px Cairo,sans-serif;cursor:pointer;text-decoration:underline;margin-top:14px;';
    retry.textContent = 'إعادة الاختبار';
    retry.onclick = () => { answers = new Array(QUESTIONS.length).fill(null); idx = 0; card.style.display = 'block'; resultCard.style.display = 'none'; render(); };
    resultCard.append(h2, p, d, alloc, cta, document.createElement('br'), retry);
  };

  render();
})();
</script>
</body>
</html>
