<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #fbf6ea; }
  body {
    font-family: 'Tajawal', system-ui, sans-serif;
    background: linear-gradient(180deg, #fbf6ea 0%, #efe8d6 100%);

  .logo-mark {

  .code {
    font-family: 'Cairo', sans-serif;
    font-size: 96px;
    font-weight: 900;
    color: #062b1e;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #062b1e, #0a4d36);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

    font-family: 'Cairo', sans-serif;
    font-size: 24px;
    font-weight: 900;
    color: #062b1e;
    margin-bottom: 10px;
  }

  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
  }

  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 22px;
    background: #062b1e;
    color: #fbf6ea;
    border-radius: 12px;
    text-decoration: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.1s;
  }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 22px;
    background: rgba(13,22,18,0.06);
    color: #0d1612;
    border-radius: 12px;
    text-decoration: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.1s;

    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 28px;
    max-width: 360px;
  }

  .quick-link {
    padding: 7px 14px;
    background: #fff;
    border: 1px solid rgba(13,22,18,0.10);
    border-radius: 100px;
    text-decoration: none;
    color: #6b7268;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
