<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>الملف الاستثماري — مُرابحة</title>
<meta name="description" content="ملفك الاستثماري العام: مستواك، وشاراتك، وإحصائياتك كمستثمر في مُرابحة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  .profile-hero{background:linear-gradient(135deg,#062b1e,#0a4d36);border-radius:22px;padding:36px 24px;margin-bottom:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .avatar{width:80px;height:80px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font:900 32px Cairo,sans-serif;color:#fff;flex-shrink:0;}
  .profile-info{flex:1;}
  .profile-name{font:900 22px Cairo,sans-serif;color:#fbf6ea;}
  .profile-since{font:500 12px Tajawal,sans-serif;color:rgba(251,246,234,.75);margin-top:3px;}
  .tier-badge{display:inline-block;border-radius:8px;padding:4px 12px;font:900 11px Cairo,sans-serif;margin-top:8px;}
  .tier-diamond{background:linear-gradient(90deg,#b9f2ff,#80d8ff);color:#01579b;}
  .tier-gold{background:linear-gradient(90deg,#ffe082,#ffd740);color:#5d4037;}
  .tier-silver{background:linear-gradient(90deg,#e0e0e0,#bdbdbd);color:#424242;}
  .tier-bronze{background:linear-gradient(90deg,#ffccbc,#ff8a65);color:#4e342e;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;}
  .kpi-val{font:900 22px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .section-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
  .section-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .badges-grid{display:flex;gap:10px;flex-wrap:wrap;}
  .badge-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center;min-width:90px;}
  .badge-icon{font-size:22px;margin-bottom:4px;}
  .badge-name{font:700 10px Cairo,sans-serif;color:var(--ink);}
  .badge-desc{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .badge-item.locked{opacity:.4;filter:grayscale(1);}
  .sector-bar{margin-bottom:10px;}
  .sector-label{display:flex;justify-content:space-between;margin-bottom:3px;}
  .sector-name{font:700 11px Cairo,sans-serif;color:var(--ink);}
  .sector-pct{font:500 11px Tajawal,sans-serif;color:var(--muted);}
  .bar-track{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--green);border-radius:4px;}
  .activity-list{display:grid;gap:10px;}
  .activity-item{display:flex;gap:12px;align-items:flex-start;}
  .act-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:4px;}
  .act-text{font:500 11px Tajawal,sans-serif;color:var(--ink);line-height:1.5;}
  .act-date{font:500 9px Tajawal,sans-serif;color:var(--muted);margin-top:2px;}
  .placeholder-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
</style>
<script src="/assets/lang.js"></script>
</head>
<body>
<main>
  <div class="profile-hero" id="profileHero">
    <div class="avatar" id="avatarEl">—</div>
    <div class="profile-info">
      <div class="profile-name" id="profileName">جارٍ التحميل…</div>
      <div class="profile-since" id="profileSince"></div>
      <div class="tier-badge tier-bronze" id="tierBadge">برونزي</div>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="section-card">
    <div class="section-title">الشارات المكتسبة</div>
    <div class="badges-grid" id="badgesGrid"></div>
  </div>

  <div class="section-card">
    <div class="section-title">توزيع القطاعات</div>
    <div id="sectorsArea"></div>
  </div>

  <div class="section-card">
    <div class="section-title">آخر النشاطات</div>
    <div id="activityArea"></div>
  </div>
</main>
<script>
(function(){
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }
  function placeholder(area, msg){ area.textContent=''; const p=document.createElement('p'); p.className='placeholder-msg'; p.textContent=msg; area.appendChild(p); }

  const params=new URLSearchParams(window.location.search);
  const userId=params.get('id');
  const url=userId?'/app/investor-profile/'+encodeURIComponent(userId):'/app/me/investor-profile';

  function tierClass(t){ const m={diamond:'tier-diamond',gold:'tier-gold',silver:'tier-silver',bronze:'tier-bronze'}; return 'tier-badge '+(m[t]||'tier-bronze'); }
  function tierLabel(t){ const m={diamond:'ماسي',gold:'ذهبي',silver:'فضي',bronze:'برونزي'}; return m[t]||'برونزي'; }

  (async function load(){
    try{
      const r=await fetch(url);
      if(!r.ok){ placeholder(document.getElementById('activityArea'), r.status===401?'يجب تسجيل الدخول.':r.status===404?'المستثمر غير موجود.':'تعذّر التحميل.'); return; }
      const d=await r.json();

      const initials=((d.firstName||'م')[0]+(d.lastName||'م')[0]).toUpperCase();
      document.getElementById('avatarEl').textContent=initials;
      document.getElementById('profileName').textContent=(d.firstName||'')+' '+(d.lastName||'');
      document.getElementById('profileSince').textContent='عضو منذ '+(d.memberSince||'—');
      const tb=document.getElementById('tierBadge'); tb.className=tierClass(d.tier); tb.textContent=tierLabel(d.tier);

      const kpiRow=document.getElementById('kpiRow');
      const kpis=[
        {lbl:'إجمالي الاستثمارات',val:fmt(d.totalInvested||0)+' ر.س'},
        {lbl:'عدد الصفقات',val:String(d.dealCount||0)},
        {lbl:'متوسط العائد',val:(d.avgYield||0)+'٪'},
        {lbl:'نقاط الولاء',val:fmt(d.loyaltyPoints||0)}
      ];
      kpis.forEach(k=>{
        const div=document.createElement('div'); div.className='kpi';
        const val=document.createElement('div'); val.className='kpi-val'; val.textContent=k.val;
        const lbl=document.createElement('div'); lbl.className='kpi-lbl'; lbl.textContent=k.lbl;
        div.appendChild(val); div.appendChild(lbl); kpiRow.appendChild(div);
      });

      const badgesGrid=document.getElementById('badgesGrid');
      const badges=d.badges||[];
      if(!badges.length){ placeholder(badgesGrid,'لم تُكتسب شارات بعد.'); }
      else{
        badges.forEach(b=>{
          const item=document.createElement('div'); item.className='badge-item'+(b.earned?'':' locked');
          const icon=document.createElement('div'); icon.className='badge-icon'; icon.textContent=b.icon||'🏅';
          const name=document.createElement('div'); name.className='badge-name'; name.textContent=b.name||'شارة';
          const desc=document.createElement('div'); desc.className='badge-desc'; desc.textContent=b.description||'';
          item.appendChild(icon); item.appendChild(name); item.appendChild(desc); badgesGrid.appendChild(item);
        });
      }

      const sectorsArea=document.getElementById('sectorsArea');
      const sectors=d.sectorAllocation||[];
      if(!sectors.length){ placeholder(sectorsArea,'لا توجد بيانات قطاعات.'); }
      else{
        sectors.forEach(s=>{
          const row=document.createElement('div'); row.className='sector-bar';
          const lbl=document.createElement('div'); lbl.className='sector-label';
          const name=document.createElement('div'); name.className='sector-name'; name.textContent=s.sector||'—';
          const pct=document.createElement('div'); pct.className='sector-pct'; pct.textContent=(s.pct||0)+'٪';
          lbl.appendChild(name); lbl.appendChild(pct);
          const track=document.createElement('div'); track.className='bar-track';
          const fill=document.createElement('div'); fill.className='bar-fill'; fill.style.width=(s.pct||0)+'%';
          track.appendChild(fill); row.appendChild(lbl); row.appendChild(track); sectorsArea.appendChild(row);
        });
      }

      const actArea=document.getElementById('activityArea');
      const activities=d.recentActivity||[];
      if(!activities.length){ placeholder(actArea,'لا توجد نشاطات حديثة.'); }
      else{
        const list=document.createElement('div'); list.className='activity-list';
        activities.forEach(a=>{
          const item=document.createElement('div'); item.className='activity-item';
          const dot=document.createElement('div'); dot.className='act-dot';
          const body=document.createElement('div');
          const txt=document.createElement('div'); txt.className='act-text'; txt.textContent=a.text||'—';
          const date=document.createElement('div'); date.className='act-date'; date.textContent=a.date||'—';
          body.appendChild(txt); body.appendChild(date); item.appendChild(dot); item.appendChild(body); list.appendChild(item);
        });
        actArea.appendChild(list);
      }
    }catch{ placeholder(document.getElementById('activityArea'),'خطأ في الاتصال.'); }
  }());
}());
</script>
</body>
</html>
