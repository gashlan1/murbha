<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#062b1e" />
<title>السوق الثانوي — مُرابحة</title>
<meta name="description" content="اشترِ حصصاً في صفقات قائمة أو بِع حصصك لمستثمرين آخرين قبل انتهاء مدة الصفقة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--ink:#0d1612;--paper:#fbf6ea;--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--gold-light:#d4ac6e;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  main{max-width:1000px;margin:0 auto;padding:28px 18px 60px;}
  .hero{background:linear-gradient(135deg,#062b1e,#0a4d36);color:#fbf6ea;border-radius:22px;padding:40px 22px;margin-bottom:22px;text-align:center;}
  .hero h1{font:900 28px Cairo,sans-serif;margin-bottom:8px;}
  .hero p{font:500 14px Tajawal,sans-serif;opacity:.92;max-width:580px;margin:0 auto;line-height:1.85;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 20px;font:700 12px Cairo,sans-serif;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--green);color:#fbf6ea;border-color:var(--green);}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:500 11px Tajawal,sans-serif;background:var(--paper);}
  .listings{display:grid;gap:12px;}
  .listing-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;}
  @media(max-width:560px){.listing-card{grid-template-columns:1fr;}}
  .listing-sector{font:700 9px Cairo,sans-serif;background:var(--paper);border-radius:5px;padding:2px 8px;color:var(--muted);display:inline-block;margin-bottom:6px;}
  .listing-title{font:900 14px Cairo,sans-serif;color:var(--green-dark);margin-bottom:6px;}
  .listing-meta{font:500 11px Tajawal,sans-serif;color:var(--muted);line-height:1.9;}
  .listing-price-block{text-align:center;min-width:130px;}
  .listing-price{font:900 20px Cairo,sans-serif;color:var(--green-dark);}
  .listing-price-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-bottom:6px;}
  .listing-yield{font:700 11px Cairo,sans-serif;color:var(--gold);margin-bottom:10px;}
  .btn-buy{background:var(--green);color:#fbf6ea;border:none;border-radius:8px;padding:8px 18px;font:700 11px Cairo,sans-serif;cursor:pointer;width:100%;}
  .sell-form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .sell-form h2{font:900 16px Cairo,sans-serif;color:var(--green-dark);margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font:700 11px Cairo,sans-serif;color:var(--muted);}
  .field select,.field input{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:500 12px Tajawal,sans-serif;background:var(--paper);}
  .field select:focus,.field input:focus{outline:none;border-color:var(--green);}
  .field .hint{font:500 10px Tajawal,sans-serif;color:var(--muted);}
  .btn-list{background:var(--green);color:#fbf6ea;border:none;border-radius:10px;padding:11px 28px;font:700 13px Cairo,sans-serif;cursor:pointer;}
  .kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .kpi-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex:1;min-width:120px;}
  .kpi-chip-val{font:900 18px Cairo,sans-serif;color:var(--green-dark);}
  .kpi-chip-lbl{font:500 10px Tajawal,sans-serif;color:var(--muted);margin-top:3px;}
  .empty-msg{font:500 13px Tajawal,sans-serif;color:var(--muted);text-align:center;padding:40px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fbf6ea;border-radius:10px;padding:12px 22px;font:700 13px Cairo,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🔄 السوق الثانوي</h1>
    <p>اشترِ حصصاً في صفقات قائمة من مستثمرين آخرين، أو بِع حصتك قبل انتهاء المدة.</p>
  </div>

  <div class="kpi-row" id="kpiRow">
    <div class="kpi-chip"><div class="kpi-chip-val">—</div><div class="kpi-chip-lbl">عروض متاحة</div></div>
    <div class="kpi-chip"><div class="kpi-chip-val">—</div><div class="kpi-chip-lbl">حجم التداول (ر.س)</div></div>
    <div class="kpi-chip"><div class="kpi-chip-val">—</div><div class="kpi-chip-lbl">متوسط العائد</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="buy">شراء حصص</button>
    <button class="tab" data-tab="sell">بيع حصة</button>
  </div>

  <div id="buyPanel">
    <div class="filters">
      <select class="filter-select" id="filterSector">
        <option value="">كل القطاعات</option>
        <option value="real_estate">عقارات</option>
        <option value="logistics">لوجستيات</option>
        <option value="agri">زراعة</option>
        <option value="tech">تقنية</option>
        <option value="energy">طاقة</option>
      </select>
      <select class="filter-select" id="filterSort">
        <option value="yield_desc">أعلى عائد</option>
        <option value="price_asc">أقل سعر</option>
        <option value="tenor_asc">أقصر مدة</option>
      </select>
    </div>
    <div class="listings" id="listingsArea"><p class="empty-msg">جارٍ التحميل…</p></div>
  </div>

  <div id="sellPanel" style="display:none">
    <div class="sell-form">
      <h2>➕ إدراج حصة للبيع</h2>
      <div class="field">
        <label>اختر الصفقة</label>
        <select id="sellDeal"><option value="">جارٍ التحميل…</option></select>
      </div>
      <div class="field">
        <label>المبلغ المعروض للبيع (ر.س)</label>
        <input type="number" id="sellAmount" placeholder="مثلاً: 5000" min="500" step="500" />
        <span class="hint">لا يمكن تجاوز حصتك الأصلية في الصفقة</span>
      </div>
      <div class="field">
        <label>سعر البيع (ر.س)</label>
        <input type="number" id="sellPrice" placeholder="مثلاً: 5100" min="0" step="100" />
        <span class="hint">يمكنك طلب سعر مختلف عن قيمة الاستثمار الأصلية</span>
      </div>
      <button class="btn-list" id="listBtn">إدراج للبيع</button>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  const CAT = {real_estate:'عقارات',logistics:'لوجستيات',agri:'زراعة',tech:'تقنية',energy:'طاقة'};

  function csrf(){ return (document.cookie.match(/csrf=([^;]+)/)||[])[1]||''; }
  function showToast(msg){
    const t=document.getElementById('toast'); t.textContent=msg;
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600);
  }
  function fmt(n){ return Number(n||0).toLocaleString('ar-SA'); }

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('buyPanel').style.display=btn.dataset.tab==='buy'?'':'none';
      document.getElementById('sellPanel').style.display=btn.dataset.tab==='sell'?'':'none';
    });
  });

  function renderKPIs(d){
    const row=document.getElementById('kpiRow'); row.textContent='';
    [
      {val:d.totalListings||0,lbl:'عروض متاحة'},
      {val:fmt(d.totalVolume||0)+' ر.س',lbl:'حجم التداول'},
      {val:(d.avgYield||0)+'٪',lbl:'متوسط العائد'},
    ].forEach(it=>{
      const chip=document.createElement('div'); chip.className='kpi-chip';
      const v=document.createElement('div'); v.className='kpi-chip-val'; v.textContent=it.val;
      const l=document.createElement('div'); l.className='kpi-chip-lbl'; l.textContent=it.lbl;
      chip.appendChild(v); chip.appendChild(l); row.appendChild(chip);
    });
  }

  function renderListings(listings){
    const area=document.getElementById('listingsArea'); area.textContent='';
    if(!listings.length){
      const m=document.createElement('p'); m.className='empty-msg'; m.textContent='لا توجد عروض متاحة حالياً.'; area.appendChild(m); return;
    }
    listings.forEach(li=>{
      const card=document.createElement('div'); card.className='listing-card';

      const info=document.createElement('div');
      const sec=document.createElement('div'); sec.className='listing-sector'; sec.textContent=CAT[li.sector]||li.sector||'—';
      const title=document.createElement('div'); title.className='listing-title'; title.textContent=li.dealName||'—';
      const meta=document.createElement('div'); meta.className='listing-meta';
      [
        'المبلغ المعروض: '+fmt(li.amount)+' ر.س',
        'المدة المتبقية: '+(li.remainingMonths||'—')+' شهر',
        'العائد السنوي: '+(li.yield||0)+'٪',
      ].forEach(line=>{ const span=document.createElement('span'); span.textContent=line; meta.appendChild(span); meta.appendChild(document.createElement('br')); });
      info.appendChild(sec); info.appendChild(title); info.appendChild(meta);

      const pb=document.createElement('div'); pb.className='listing-price-block';
      const price=document.createElement('div'); price.className='listing-price'; price.textContent=fmt(li.price)+' ر.س';
      const priceLbl=document.createElement('div'); priceLbl.className='listing-price-lbl'; priceLbl.textContent='سعر البيع';
      const yieldEl=document.createElement('div'); yieldEl.className='listing-yield'; yieldEl.textContent='عائد '+(li.yield||0)+'٪ سنوياً';
      const btn=document.createElement('button'); btn.className='btn-buy'; btn.textContent='شراء الحصة';
      btn.addEventListener('click',()=>buyListing(li.id, li.dealName));
      pb.appendChild(price); pb.appendChild(priceLbl); pb.appendChild(yieldEl); pb.appendChild(btn);

      card.appendChild(info); card.appendChild(pb);
      area.appendChild(card);
    });
  }

  async function buyListing(id, dealName){
    try{
      const r=await fetch('/app/secondary-market/'+encodeURIComponent(id)+'/buy',{method:'POST',headers:{'X-CSRF-Token':csrf()}});
      if(!r.ok){ showToast(r.status===401?'يجب تسجيل الدخول.':'تعذّر إتمام الشراء.'); return; }
      showToast('تم شراء الحصة في "'+dealName+'" بنجاح ✅');
      loadListings();
    }catch{ showToast('خطأ في الاتصال.'); }
  }

  async function loadListings(){
    const sector=document.getElementById('filterSector').value;
    const sort=document.getElementById('filterSort').value;
    const area=document.getElementById('listingsArea'); area.textContent='';
    const loading=document.createElement('p'); loading.className='empty-msg'; loading.textContent='جارٍ التحميل…'; area.appendChild(loading);
    try{
      const r=await fetch('/app/secondary-market?sector='+encodeURIComponent(sector)+'&sort='+encodeURIComponent(sort));
      if(!r.ok){ area.textContent=''; const m=document.createElement('p'); m.className='empty-msg'; m.textContent='تعذّر التحميل.'; area.appendChild(m); return; }
      const d=await r.json();
      renderKPIs(d); renderListings(d.listings||[]);
    }catch{ area.textContent=''; const m=document.createElement('p'); m.className='empty-msg'; m.textContent='تعذّر التحميل.'; area.appendChild(m); }
  }

  async function loadMyDeals(){
    try{
      const r=await fetch('/app/me/investments');
      if(!r.ok) return;
      const d=await r.json();
      const sel=document.getElementById('sellDeal'); sel.textContent='';
      const ph=document.createElement('option'); ph.value=''; ph.textContent='اختر صفقة…'; sel.appendChild(ph);
      (d.investments||[]).filter(i=>i.status==='active').forEach(inv=>{
        const opt=document.createElement('option'); opt.value=inv.id; opt.textContent=inv.dealTitle+' — '+fmt(inv.amount)+' ر.س'; sel.appendChild(opt);
      });
    }catch{}
  }

  document.getElementById('listBtn').addEventListener('click', async ()=>{
    const dealId=document.getElementById('sellDeal').value;
    const amount=parseFloat(document.getElementById('sellAmount').value);
    const price=parseFloat(document.getElementById('sellPrice').value);
    if(!dealId){ showToast('يرجى اختيار الصفقة.'); return; }
    if(!amount||amount<500){ showToast('المبلغ الأدنى ٥٠٠ ر.س.'); return; }
    if(!price||price<0){ showToast('يرجى إدخال سعر صالح.'); return; }
    try{
      const r=await fetch('/app/secondary-market/list',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({dealId,amount,price})});
      if(!r.ok){ showToast(r.status===401?'يجب تسجيل الدخول.':'تعذّر الإدراج.'); return; }
      showToast('تم إدراج حصتك للبيع ✅');
      document.getElementById('sellAmount').value='';
      document.getElementById('sellPrice').value='';
    }catch{ showToast('خطأ في الاتصال.'); }
  });

  document.getElementById('filterSector').addEventListener('change', loadListings);
  document.getElementById('filterSort').addEventListener('change', loadListings);

  loadListings();
  loadMyDeals();
}());
</script>
</body>
</html>
