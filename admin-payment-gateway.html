<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الدفع - مُرابحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#062b1e;--green:#0a4d36;--gold:#b08840;--paper:#fbf6ea;--muted:#6b7268;--line:rgba(13,22,18,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--green-dark);min-height:100vh;}
header{background:var(--green-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.3rem;font-weight:700;}
header a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem;}
header a:hover{color:#fff;}
.container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
.page-header h2{font-size:1.5rem;font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:600;transition:background 0.2s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-secondary:hover{background:var(--green);color:#fff;}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.82rem;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.kpi-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:1.25rem;}
.kpi-label{font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem;}
.kpi-value{font-size:1.5rem;font-weight:700;color:var(--green-dark);}
.kpi-sub{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
.card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;}
.card-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.card-head h3{font-size:1rem;font-weight:700;}
.card-body{padding:1.25rem;}
.gw-item{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 0;border-bottom:1px solid var(--line);}
.gw-item:last-child{border-bottom:none;}
.gw-left{display:flex;align-items:center;gap:0.75rem;}
.gw-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.gw-info{display:flex;flex-direction:column;gap:0.1rem;}
.gw-name{font-size:0.88rem;font-weight:600;color:var(--green-dark);}
.gw-meta{font-size:0.74rem;color:var(--muted);}
.status-badge{font-size:0.72rem;font-weight:700;padding:0.18rem 0.55rem;border-radius:8px;}
.badge-active{background:#e6f4ef;color:var(--green);}
.badge-inactive{background:#e8e3da;color:var(--muted);}
.badge-error{background:#fde9e9;color:#c0392b;}
.toggle{width:36px;height:20px;background:#ccc;border-radius:10px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;right:2px;transition:right 0.2s;}
.toggle.on::after{right:calc(100% - 18px);}
.gw-right{display:flex;align-items:center;gap:0.75rem;}
.config-row{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid var(--line);font-size:0.85rem;}
.config-row:last-child{border-bottom:none;}
.config-label{color:var(--muted);}
.config-value{font-weight:600;color:var(--green-dark);}
.table-card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;}
.table-head{background:var(--green-dark);color:#fff;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.table-head h3{font-size:1rem;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{text-align:right;padding:0.6rem 1rem;background:#f5f0e8;font-size:0.82rem;color:var(--muted);font-weight:600;}
td{padding:0.7rem 1rem;border-bottom:1px solid var(--line);font-size:0.86rem;}
tr:last-child td{border-bottom:none;}
.tx-success{color:#27ae60;font-weight:700;}
.tx-fail{color:#c0392b;font-weight:700;}
.tx-pending{color:var(--gold);font-weight:700;}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr;}.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>مُرابحة — بوابة الدفع</h1>
  <a href="hessa.html">→ العودة للرئيسية</a>
</header>
<div class="container">
  <div class="page-header">
    <h2>إدارة بوابة الدفع</h2>
    <button class="btn btn-secondary" onclick="testConnection()">اختبار الاتصال</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="two-col">
    <div class="card">
      <div class="card-head">
        <h3>بوابات الدفع المتاحة</h3>
      </div>
      <div class="card-body" id="gatewayList"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>إعدادات عامة</h3></div>
      <div class="card-body" id="configPanel"></div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-head">
      <h3>سجل المعاملات الأخيرة</h3>
      <button class="btn btn-sm btn-secondary" onclick="exportTransactions()">تصدير</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>رقم المعاملة</th>
          <th>المستخدم</th>
          <th>البوابة</th>
          <th>المبلغ (ر.س)</th>
          <th>التاريخ</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="txTable"></tbody>
    </table>
  </div>
</div>

<script>
const kpis = [
  {label:'إجمالي المعاملات اليوم',value:'٢٤٨',sub:'معاملة'},
  {label:'حجم المدفوعات',value:'٨٤٢,٠٠٠',sub:'ر.س اليوم'},
  {label:'معدل النجاح',value:'٩٨.٤٪',sub:'آخر ٢٤ ساعة'},
  {label:'متوسط وقت المعالجة',value:'١.٢ ث',sub:''},
];

const gateways = [
  {name:'STC Pay',meta:'بوابة الدفع الرئيسية',icon:'📱',color:'#6b0f8a',status:'active',enabled:true},
  {name:'مدى / VISA',meta:'بطاقات الدفع المباشر',icon:'💳',color:'#0a4d36',status:'active',enabled:true},
  {name:'Apple Pay',meta:'الدفع عبر الجوال',icon:'🍎',color:'#333',status:'active',enabled:true},
  {name:'SWIFT تحويل بنكي',meta:'التحويل البنكي الدولي',icon:'🏦',color:'#1a5dad',status:'inactive',enabled:false},
];

const configs = [
  {label:'عملة الحساب',value:'ر.س (SAR)'},
  {label:'رسوم المعالجة',value:'١.٥٪ + ١ ر.س'},
  {label:'الحد الأدنى للإيداع',value:'١,٠٠٠ ر.س'},
  {label:'الحد الأقصى للسحب اليومي',value:'٥٠٠,٠٠٠ ر.س'},
  {label:'مهلة انتهاء الجلسة',value:'١٥ دقيقة'},
  {label:'التشفير',value:'TLS 1.3 + AES-256'},
];

const transactions = [
  {id:'TXN-99821',user:'أحمد المنصور',gateway:'مدى / VISA',amount:'٥٠,٠٠٠',date:'٢٠٢٥/٠٦/١٥ ٠٩:٤١',status:'success'},
  {id:'TXN-99820',user:'سارة الزهراني',gateway:'STC Pay',amount:'٢٥,٠٠٠',date:'٢٠٢٥/٠٦/١٥ ٠٩:٣٢',status:'success'},
  {id:'TXN-99819',user:'خالد العتيبي',gateway:'Apple Pay',amount:'١٠٠,٠٠٠',date:'٢٠٢٥/٠٦/١٥ ٠٨:٥٤',status:'pending'},
  {id:'TXN-99818',user:'نورة السالم',gateway:'مدى / VISA',amount:'١٥,٠٠٠',date:'٢٠٢٥/٠٦/١٥ ٠٧:١٢',status:'success'},
  {id:'TXN-99817',user:'فهد الدوسري',gateway:'STC Pay',amount:'٥,٠٠٠',date:'٢٠٢٥/٠٦/١٤ ١٦:٤٨',status:'fail'},
];

const statusCls = {success:'tx-success',fail:'tx-fail',pending:'tx-pending'};
const statusLabels = {success:'ناجحة',fail:'فاشلة',pending:'قيد التنفيذ'};

function renderKpis(){
  const row = document.getElementById('kpiRow');
  row.textContent = '';
  kpis.forEach(k => {
    const card = document.createElement('div');
    card.className = 'kpi-card';
    const lbl = document.createElement('div');
    lbl.className = 'kpi-label';
    lbl.textContent = k.label;
    const val = document.createElement('div');
    val.className = 'kpi-value';
    val.textContent = k.value;
    const sub = document.createElement('div');
    sub.className = 'kpi-sub';
    sub.textContent = k.sub;
    card.appendChild(lbl);
    card.appendChild(val);
    card.appendChild(sub);
    row.appendChild(card);
  });
}

function renderGateways(){
  const list = document.getElementById('gatewayList');
  list.textContent = '';
  gateways.forEach(g => {
    const item = document.createElement('div');
    item.className = 'gw-item';
    const left = document.createElement('div');
    left.className = 'gw-left';
    const icon = document.createElement('div');
    icon.className = 'gw-icon';
    icon.style.background = g.color + '20';
    icon.textContent = g.icon;
    const info = document.createElement('div');
    info.className = 'gw-info';
    const name = document.createElement('span');
    name.className = 'gw-name';
    name.textContent = g.name;
    const meta = document.createElement('span');
    meta.className = 'gw-meta';
    meta.textContent = g.meta;
    info.appendChild(name);
    info.appendChild(meta);
    left.appendChild(icon);
    left.appendChild(info);
    const right = document.createElement('div');
    right.className = 'gw-right';
    const badge = document.createElement('span');
    badge.className = 'status-badge ' + (g.status === 'active' ? 'badge-active' : 'badge-inactive');
    badge.textContent = g.status === 'active' ? 'نشط' : 'معطّل';
    const toggle = document.createElement('div');
    toggle.className = 'toggle' + (g.enabled ? ' on' : '');
    toggle.onclick = () => {
      g.enabled = !g.enabled;
      toggle.className = 'toggle' + (g.enabled ? ' on' : '');
      toggleGateway(g.name, g.enabled);
    };
    right.appendChild(badge);
    right.appendChild(toggle);
    item.appendChild(left);
    item.appendChild(right);
    list.appendChild(item);
  });
}

function renderConfig(){
  const cont = document.getElementById('configPanel');
  cont.textContent = '';
  configs.forEach(c => {
    const row = document.createElement('div');
    row.className = 'config-row';
    const lbl = document.createElement('span');
    lbl.className = 'config-label';
    lbl.textContent = c.label;
    const val = document.createElement('span');
    val.className = 'config-value';
    val.textContent = c.value;
    row.appendChild(lbl);
    row.appendChild(val);
    cont.appendChild(row);
  });
}

function renderTransactions(){
  const tbody = document.getElementById('txTable');
  tbody.textContent = '';
  transactions.forEach(t => {
    const tr = document.createElement('tr');
    [t.id, t.user, t.gateway, t.amount + ' ر.س', t.date].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      if(v === t.id){ td.style.fontFamily = 'monospace'; td.style.fontSize = '0.78rem'; td.style.color = 'var(--muted)'; }
      tr.appendChild(td);
    });
    const statusTd = document.createElement('td');
    statusTd.className = statusCls[t.status] || '';
    statusTd.textContent = statusLabels[t.status] || t.status;
    tr.appendChild(statusTd);
    tbody.appendChild(tr);
  });
}

async function toggleGateway(name, enabled){
  try {
    await fetch('/app/admin/payment-gateway/toggle', {
      method:'PUT',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({name, enabled})
    });
  } catch(e){}
}

async function testConnection(){
  try {
    const res = await fetch('/app/admin/payment-gateway/test', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-csrf-token':'1'},
      body: JSON.stringify({})
    });
    await res.json();
  } catch(e){}
}

async function exportTransactions(){
  try {
    const res = await fetch('/app/admin/payment-gateway/transactions/export');
    await res.json();
  } catch(e){}
}

renderKpis();
renderGateways();
renderConfig();
renderTransactions();
</script>
</body>
</html>
